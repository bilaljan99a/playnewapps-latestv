<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title id="page-title">404 Not Found | PlayNewApps</title>
    <link rel="canonical" href="/404" id="canonical-url">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; text-align: center; }
        .card { max-width: 520px; padding: 2.5rem; background: #1e293b; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 3rem; margin: 0 0 0.5rem; font-weight: 800; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; margin-bottom: 1.25rem; }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.75rem; }
        a { display: inline-block; padding: 0.75rem 1.75rem; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s ease; }
        a:hover { background: #1d4ed8; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96x96.png">
    <link rel="shortcut icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <script>
        (function() {
            var path = window.location.pathname.toLowerCase();
            var isBlogger = /^\/(19|20)\d{2}(\/|$|\.|\?)/.test(path) || 
                            /^\/(search|feeds|label|b|p|archive)(\/|\?|\.|$)/.test(path) ||
                            (path.indexOf('-apk') !== -1 && path.indexOf('apk-files-coupons') === -1) ||
                            path.indexOf('mod-apk') !== -1 ||
                            path === '/410' || path === '/410.html';
            if (isBlogger) {
                document.title = '410 Gone - Page Removed | PlayNewApps';
            }
        })();
    </script>
</head>
<body>
    <div class="card" id="error-card">
        <div id="badge-wrapper"></div>
        <h1 id="error-title" style="color: #f59e0b;">404 Not Found</h1>
        <p id="error-desc">The page you are looking for does not exist on PlayNewApps.</p>
        <a href="/">Go to Homepage</a>
    </div>
    <script>
        (function() {
            var path = window.location.pathname.toLowerCase();
            var isBlogger = /^\/(19|20)\d{2}(\/|$|\.|\?)/.test(path) || 
                            /^\/(search|feeds|label|b|p|archive)(\/|\?|\.|$)/.test(path) ||
                            (path.indexOf('-apk') !== -1 && path.indexOf('apk-files-coupons') === -1) ||
                            path.indexOf('mod-apk') !== -1 ||
                            path === '/410' || path === '/410.html';
            if (isBlogger) {
                document.title = '410 Gone - Page Removed | PlayNewApps';
                var title = document.getElementById('error-title');
                var desc = document.getElementById('error-desc');
                var badge = document.getElementById('badge-wrapper');
                var canon = document.getElementById('canonical-url');
                if (title) { title.innerText = '410 Gone'; title.style.color = '#ef4444'; }
                if (desc) { desc.innerText = 'This legacy blog post has been permanently removed and is no longer available on PlayNewApps.'; }
                if (badge) { badge.innerHTML = '<span class="badge" style="background: rgba(239, 68, 68, 0.15); color: #fca5a5;">HTTP Status 410 Gone</span>'; }
                if (canon) { canon.setAttribute('href', '/410'); }
            } else {
                var badge = document.getElementById('badge-wrapper');
                if (badge) { badge.innerHTML = '<span class="badge" style="background: rgba(245, 158, 11, 0.15); color: #fcd34d;">Status 404 Not Found</span>'; }
            }
        })();
    </script>
</body>
</html>
