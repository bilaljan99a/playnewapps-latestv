<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 Not Found</title>
    <link rel="canonical" href="/404" id="canonical-url">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0f172a; color: #f8fafc; text-align: center; }
        .card { max-width: 500px; padding: 2.5rem; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        h1 { font-size: 3rem; margin: 0 0 0.5rem; color: #f59e0b; }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; }
        a { display: inline-block; padding: 0.75rem 1.5rem; background: #2563eb; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96x96.png">
    <link rel="shortcut icon" href="/assets/images/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
</head>
<body>
    <div class="card" id="error-card">
        <h1 id="error-title">404 Not Found</h1>
        <p id="error-desc">The page you are looking for does not exist on PlayNewApps.</p>
        <a href="/">Go to Homepage</a>
    </div>
    <script>
        (function() {
            var path = window.location.pathname.toLowerCase();
            var isBlogger = /^\/(19|20)\d{2}(\/|$|\.|\?)/.test(path) || 
                            /^\/(search|feeds|label|b|p|archive)(\/|\?|\.|$)/.test(path) ||
                            path.indexOf('-apk') !== -1;
            if (isBlogger) {
                document.title = '410 Gone - Page Removed';
                var title = document.getElementById('error-title');
                var desc = document.getElementById('error-desc');
                var canon = document.getElementById('canonical-url');
                if (title) { title.innerText = '410 Gone'; title.style.color = '#ef4444'; }
                if (desc) { desc.innerText = 'This legacy blog post has been permanently removed and is no longer available on PlayNewApps.'; }
                if (canon) { canon.setAttribute('href', '/410'); }
            }
        })();
    </script>
</body>
</html>
