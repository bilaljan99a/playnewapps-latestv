      <stop offset="0%" stop-color="#071726" />
      <stop offset="50%" stop-color="#0C253B" />
      <stop offset="100%" stop-color="#05131F" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
