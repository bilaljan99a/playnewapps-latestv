      <text x="12" y="172" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="11" fill="#C7D2FE">Incogni Data Broker Wipe</text>
      <text x="12" y="190" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="500" font-size="9" fill="#E0E7FF">Deletes Private Info from 180+ Brokers</text>
