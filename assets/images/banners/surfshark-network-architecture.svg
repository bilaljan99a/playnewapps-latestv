  <text x="400" y="66" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">10Gbps Multi-Hop Tunneling, Dynamic IP Rotation &amp; CleanWeb Suppression Flow</text>

