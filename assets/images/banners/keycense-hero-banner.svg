<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#31104B"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6320EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg-grad)"/>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- Glow circles -->
  <circle cx="1050" cy="180" r="260" fill="#6320EE" opacity="0.25" filter="blur(60px)"/>
  <circle cx="200" cy="400" r="180" fill="#38BDF8" opacity="0.12" filter="blur(50px)"/>

  <!-- Left Content -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Badge -->
    <g>
      <rect width="280" height="36" rx="18" fill="rgba(99, 32, 238, 0.25)" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="6" fill="#10B981"/>
      <text x="32" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#E0E7FF" letter-spacing="0.5px">OFFICIAL VERIFIED PARTNER</text>
    </g>

    <!-- Main Headings -->
    <text x="0" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1px">
      Keycense
    </text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="url(#accent-grad)" letter-spacing="-0.5px">
      Digital Games &amp; Software Licenses
    </text>
    <text x="0" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" fill="#94A3B8" width="550">
      Instant ESD Delivery • 100% Genuine Microsoft &amp; AutoDesk • Safe Checkout
    </text>

    <!-- Key Benefit Pills -->
    <g transform="translate(0, 235)">
      <g transform="translate(0, 0)">
        <rect width="165" height="40" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)"/>
        <text x="14" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">⚡ Instant Delivery</text>
      </g>
      <g transform="translate(180, 0)">
        <rect width="175" height="40" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)"/>
        <text x="14" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">🔒 Secure Payments</text>
      </g>
      <g transform="translate(370, 0)">
        <rect width="175" height="40" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.12)"/>
        <text x="14" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">🛡️ 100% Guaranteed</text>
      </g>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 305)">
      <rect width="260" height="54" rx="14" fill="url(#btn-grad)"/>
      <text x="32" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Shop Exclusive Deals →</text>
    </g>
  </g>

  <!-- Right Visual Graphics: Software & Gaming Cards Showcase -->
  <g transform="translate(720, 60)">
    <!-- Card 1: Windows & Office Suite -->
    <g transform="translate(0, 0)">
      <rect width="380" height="105" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.15)"/>
      <rect x="18" y="20" width="65" height="65" rx="12" fill="#2563EB"/>
      <text x="36" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">W</text>
      <text x="98" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Windows 11 Pro &amp; Office</text>
      <text x="98" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Lifetime ESD License • Instant Key</text>
      <rect x="285" y="32" width="75" height="28" rx="6" fill="#10B981"/>
      <text x="295" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">UP TO 80%</text>
    </g>

    <!-- Card 2: AutoDesk & Creative Software -->
    <g transform="translate(20, 125)">
      <rect width="380" height="105" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.15)"/>
      <rect x="18" y="20" width="65" height="65" rx="12" fill="#E11D48"/>
      <text x="38" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">A</text>
      <text x="98" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">AutoDesk &amp; Design CAD</text>
      <text x="98" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Architecture, 3D &amp; Engineering</text>
      <rect x="285" y="32" width="75" height="28" rx="6" fill="#7C3AED"/>
      <text x="300" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">20% OFF</text>
    </g>

    <!-- Card 3: PC Games & Gift Cards -->
    <g transform="translate(0, 250)">
      <rect width="380" height="105" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.15)"/>
      <rect x="18" y="20" width="65" height="65" rx="12" fill="#059669"/>
      <text x="38" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">🎮</text>
      <text x="98" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Steam, PSN &amp; PC Games</text>
      <text x="98" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Top-ups, Gift Cards &amp; AAA Titles</text>
      <rect x="285" y="32" width="75" height="28" rx="6" fill="#EA580C"/>
      <text x="295" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">SAVE 25%</text>
    </g>
  </g>
</svg>
