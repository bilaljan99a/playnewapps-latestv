<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <linearGradient id="adobeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0003"/>
      <stop offset="50%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1A0D10"/>
    </linearGradient>
    <linearGradient id="adobeRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#CC0000"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
  </defs>

  <!-- Banner Outer Frame -->
  <rect width="1000" height="320" rx="16" fill="url(#adobeBg)" stroke="#330006" stroke-width="2"/>

  <!-- Red Accent Brand Stripe -->
  <path d="M 0 0 L 12 0 L 12 320 L 0 320 Z" fill="url(#adobeRedGrad)"/>

  <!-- Left Content Area -->
  <g transform="translate(45, 35)">
    <!-- Student Discount Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#FF0000" fill-opacity="0.2" stroke="#FF0000" stroke-width="1"/>
    <text x="110" y="18" text-anchor="middle" fill="#FF4D4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" letter-spacing="0.5">OFFICIAL STUDENT &amp; TEACHER DEAL</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30">Save 60% OFF Creative Cloud</text>
    <text x="0" y="105" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20">Get 20+ Desktop &amp; Mobile Apps for $19.99/mo</text>

    <!-- Bullets -->
    <text x="0" y="145" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ Includes Photoshop, Illustrator, Premiere Pro, Acrobat Pro &amp; InDesign</text>
    <text x="0" y="170" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ 1,000 Monthly Firefly AI Generative Credits &amp; 100GB Cloud Storage</text>
    <text x="0" y="195" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ Access to 20,000+ Adobe Fonts &amp; Free Adobe Portfolio Website Hosting</text>

    <!-- CTA Button -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="220" height="46" rx="8" fill="url(#adobeRedGrad)"/>
      <text x="110" y="28" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15">Claim 60% Student Offer →</text>
    </g>
  </g>

  <!-- Right Visual - Software App Badges Grid -->
  <g transform="translate(610, 35)">
    <rect x="0" y="0" width="355" height="250" rx="14" fill="url(#cardBg)" stroke="#333333" stroke-width="1.5"/>
    <text x="177" y="32" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Creative Cloud All Apps Suite</text>

    <!-- App Badges Row 1 -->
    <!-- Photoshop -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#001E36" stroke="#00A4E4" stroke-width="2"/>
      <text x="30" y="40" text-anchor="middle" fill="#00A4E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Ps</text>
      <text x="30" y="74" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">Photoshop</text>
    </g>

    <!-- Illustrator -->
    <g transform="translate(105, 55)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#330000" stroke="#FF9A00" stroke-width="2"/>
      <text x="30" y="40" text-anchor="middle" fill="#FF9A00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Ai</text>
      <text x="30" y="74" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">Illustrator</text>
    </g>

    <!-- Premiere Pro -->
    <g transform="translate(185, 55)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#00005C" stroke="#9999FF" stroke-width="2"/>
      <text x="30" y="40" text-anchor="middle" fill="#9999FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Pr</text>
      <text x="30" y="74" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">Premiere</text>
    </g>

    <!-- Acrobat Pro -->
    <g transform="translate(265, 55)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#330000" stroke="#FF0000" stroke-width="2"/>
      <text x="30" y="40" text-anchor="middle" fill="#FF0000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Ac</text>
      <text x="30" y="74" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">Acrobat</text>
    </g>

    <!-- App Badges Row 2 -->
    <!-- After Effects -->
    <g transform="translate(25, 150)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#00005C" stroke="#D291FF" stroke-width="2"/>
      <text x="30" y="40" text-anchor="middle" fill="#D291FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Ae</text>
      <text x="30" y="74" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">After Effects</text>
    </g>

    <!-- InDesign -->
    <g transform="translate(105, 150)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#2B0017" stroke="#FF3366" stroke-width="2"/>
      <text x="30" y="40" text-anchor="middle" fill="#FF3366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Id</text>
      <text x="30" y="74" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">InDesign</text>
    </g>

    <!-- Lightroom -->
    <g transform="translate(185, 150)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#001E36" stroke="#31A8FF" stroke-width="2"/>
      <text x="30" y="40" text-anchor="middle" fill="#31A8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Lr</text>
      <text x="30" y="74" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">Lightroom</text>
    </g>

    <!-- Firefly AI -->
    <g transform="translate(265, 150)">
      <rect x="0" y="0" width="60" height="60" rx="12" fill="#2A1B00" stroke="#FFAB00" stroke-width="2"/>
      <text x="30" y="40" text-anchor="middle" fill="#FFAB00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22">Ff</text>
      <text x="30" y="74" text-anchor="middle" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10">Firefly AI</text>
    </g>
  </g>
</svg>
