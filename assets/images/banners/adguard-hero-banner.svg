<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67B279" />
      <stop offset="100%" stop-color="#48A05B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle grid lines in background -->
  <path d="M 0,100 L 600,100 M 0,200 L 600,200 M 0,300 L 600,300 M 150,0 L 150,400 M 300,0 L 300,400 M 450,0 L 450,400" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Main Security Dashboard Mockup Frame -->
  <rect x="50" y="40" width="500" height="320" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />

  <!-- Header Bar of Mockup -->
  <rect x="50" y="40" width="500" height="44" rx="12" fill="#1E293B" />
  <!-- Window Controls -->
  <circle cx="74" cy="62" r="5" fill="#EF4444" />
  <circle cx="90" cy="62" r="5" fill="#F59E0B" />
  <circle cx="106" cy="62" r="5" fill="#10B981" />
  <text x="130" y="66" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" fill="#94A3B8">AdGuard Protection Center 2026</text>

  <!-- Central Security Shield Graphic -->
  <g transform="translate(110, 110)">
    <path d="M 60,10 C 85,10 110,2 115,0 C 115,45 110,95 60,140 C 10,95 5,45 5,0 C 10,2 35,10 60,10 Z" fill="url(#shieldGrad)" />
    <path d="M 38,62 L 53,77 L 85,42 C 88,39 93,39 96,42 L 102,48 C 105,51 105,56 102,59 L 58,103 C 55,106 50,106 47,103 L 27,83 C 24,80 24,75 27,72 L 33,66 C 36,63 41,63 44,66 Z" fill="#FFFFFF" />
  </g>

  <!-- Protection Status Badges & Metrics -->
  <g transform="translate(260, 110)">
    <!-- Status Indicator -->
    <rect x="0" y="0" width="230" height="42" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
    <circle cx="20" cy="21" r="6" fill="#10B981" />
    <text x="36" y="26" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" fill="#ECFDF5">PROTECTION ENABLED</text>

    <!-- Stat Box 1: Ads Blocked -->
    <rect x="0" y="56" width="230" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="14" y="78" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">Ads &amp; Banners Blocked</text>
    <text x="14" y="98" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#38BDF8">1,482,930+</text>

    <!-- Stat Box 2: Trackers Stopped -->
    <rect x="0" y="118" width="230" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="14" y="140" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">Trackers &amp; Spyware Blocked</text>
    <text x="14" y="160" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#67B279">384,120+</text>

    <!-- Stat Box 3: Data Saved -->
    <rect x="0" y="180" width="230" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="14" y="202" font-family="-apple-system, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">Bandwidth Saved</text>
    <text x="14" y="222" font-family="-apple-system, sans-serif" font-weight="800" font-size="16" fill="#F59E0B">42.8 GB</text>
  </g>

  <!-- Bottom Platform Support Icons -->
  <g transform="translate(80, 325)">
    <text x="0" y="14" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#64748B">Supported Platforms:</text>
    <rect x="130" y="0" width="70" height="22" rx="4" fill="#334155" />
    <text x="165" y="15" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" text-anchor="middle">Windows</text>

    <rect x="208" y="0" width="55" height="22" rx="4" fill="#334155" />
    <text x="235" y="15" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" text-anchor="middle">macOS</text>

    <rect x="271" y="0" width="60" height="22" rx="4" fill="#334155" />
    <text x="301" y="15" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" text-anchor="middle">Android</text>

    <rect x="339" y="0" width="45" height="22" rx="4" fill="#334155" />
    <text x="361" y="15" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" text-anchor="middle">iOS</text>

    <rect x="392" y="0" width="50" height="22" rx="4" fill="#334155" />
    <text x="417" y="15" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#E2E8F0" text-anchor="middle">DNS</text>
  </g>
</svg>
