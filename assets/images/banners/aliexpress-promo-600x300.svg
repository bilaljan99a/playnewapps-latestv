<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="aliBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3838"/>
      <stop offset="55%" stop-color="#FF5A00"/>
      <stop offset="100%" stop-color="#D92200"/>
    </linearGradient>
    <linearGradient id="aliPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FFA200"/>
    </linearGradient>
    <filter id="aliDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="300" rx="16" fill="url(#aliBgGrad)"/>

  <!-- Decorative Shapes / Glow -->
  <circle cx="560" cy="40" r="140" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="40" cy="260" r="90" fill="#FFFFFF" opacity="0.05"/>
  <path d="M-20 80 Q 200 20 420 110 T 620 50" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.15"/>

  <!-- Official AliExpress Bag Logo -->
  <g transform="translate(32, 28)" filter="url(#aliDropShadow)">
    <rect width="48" height="48" rx="12" fill="#FFFFFF"/>
    <!-- Bag Shape -->
    <path d="M16 19 C16 14.5 19.5 11 24 11 C28.5 11 32 14.5 32 19 V20 H34.5 C36 20 37 21 37 22.5 L35 37 C34.8 38.5 33.5 39.5 32 39.5 H16 C14.5 39.5 13.2 38.5 13 37 L11 22.5 C11 21 12 20 13.5 20 H16 V19 Z M20 20 H28 V19 C28 16.8 26.2 15 24 15 C21.8 15 20 16.8 20 19 V20 Z" fill="#E62E04"/>
    <path d="M19 28 C21 32 27 32 29 28" stroke="#E62E04" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Brand Wordmark & Official Badge -->
  <text x="92" y="52" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">AliExpress</text>
  <rect x="230" y="34" width="105" height="24" rx="6" fill="#FFFFFF" opacity="0.95"/>
  <text x="282" y="50" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="900" fill="#D92200" text-anchor="middle" letter-spacing="0.5">CHOICE DAY</text>

  <!-- Main Value Proposition Heading -->
  <text x="32" y="112" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">UP TO 80% OFF</text>
  <text x="32" y="140" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFF2EB">Global Electronics, Smart Devices &amp; Apparel</text>

  <!-- Bullet Feature Pills -->
  <g transform="translate(32, 160)">
    <rect width="180" height="28" rx="6" fill="rgba(0,0,0,0.18)"/>
    <text x="90" y="18" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Free Shipping $10+</text>

    <rect x="190" y="0" width="170" height="28" rx="6" fill="rgba(0,0,0,0.18)"/>
    <text x="275" y="18" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Direct Factory Prices</text>

    <rect x="370" y="0" width="180" height="28" rx="6" fill="rgba(0,0,0,0.18)"/>
    <text x="460" y="18" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Buyer Escrow Shield</text>
  </g>

  <!-- Decorative Product / Cart Graphics in Right Area -->
  <g transform="translate(470, 45)" opacity="0.95" filter="url(#aliDropShadow)">
    <rect width="98" height="92" rx="12" fill="#FFFFFF" fill-opacity="0.15" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="49" cy="38" r="22" fill="#FFE600"/>
    <text x="49" y="44" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="18" font-weight="900" fill="#D92200" text-anchor="middle">%</text>
    <text x="49" y="74" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">FLASH DEALS</text>
  </g>

  <!-- Footer Banner Row & CTA Button -->
  <g transform="translate(32, 222)">
    <text x="0" y="30" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFE5D9">Verified Partner Promotions &amp; Coupons</text>

    <!-- Prominent CTA Button -->
    <g transform="translate(370, 6)" filter="url(#aliDropShadow)">
      <rect width="166" height="40" rx="8" fill="url(#aliPillGrad)"/>
      <text x="83" y="25" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="13" font-weight="900" fill="#991B00" text-anchor="middle" letter-spacing="0.5">SHOP DEALS →</text>
    </g>
  </g>
</svg>
