<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <linearGradient id="photoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B2E"/>
      <stop offset="50%" stop-color="#080F17"/>
      <stop offset="100%" stop-color="#00182B"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072CE"/>
      <stop offset="100%" stop-color="#00A4E4"/>
    </linearGradient>
    <linearGradient id="photoCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112233"/>
      <stop offset="100%" stop-color="#0B1622"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="1000" height="320" rx="16" fill="url(#photoBg)" stroke="#003B66" stroke-width="2"/>

  <path d="M 0 0 L 12 0 L 12 320 L 0 320 Z" fill="url(#blueGrad)"/>

  <!-- Left Content -->
  <g transform="translate(45, 35)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="#00A4E4" fill-opacity="0.2" stroke="#00A4E4" stroke-width="1"/>
    <text x="115" y="18" text-anchor="middle" fill="#33B8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" letter-spacing="0.5">BEST VALUE FOR PHOTOGRAPHERS</text>

    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30">Adobe Photography Plan</text>
    <text x="0" y="105" fill="#33B8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22">Photoshop + Lightroom Bundle at $9.99/mo</text>

    <text x="0" y="145" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ Full Photoshop on Desktop &amp; iPad with Generative Fill AI</text>
    <text x="0" y="170" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ Lightroom &amp; Lightroom Classic with Multi-Device Sync</text>
    <text x="0" y="195" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ 20GB or 1TB Cloud Photo Storage Included</text>

    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="220" height="46" rx="8" fill="url(#blueGrad)"/>
      <text x="110" y="28" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15">Get Photography Plan →</text>
    </g>
  </g>

  <!-- Right Visual - Photoshop &amp; Lightroom Cards -->
  <g transform="translate(600, 35)">
    <rect x="0" y="0" width="360" height="250" rx="14" fill="url(#photoCard)" stroke="#004070" stroke-width="1.5"/>

    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="135" height="160" rx="12" fill="#001E36" stroke="#00A4E4" stroke-width="2"/>
      <text x="67" y="65" text-anchor="middle" fill="#00A4E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42">Ps</text>
      <text x="67" y="105" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Photoshop</text>
      <text x="67" y="128" text-anchor="middle" fill="#33B8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11">Desktop &amp; iPad</text>
    </g>

    <g transform="translate(195, 45)">
      <rect x="0" y="0" width="135" height="160" rx="12" fill="#001E36" stroke="#31A8FF" stroke-width="2"/>
      <text x="67" y="65" text-anchor="middle" fill="#31A8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42">Lr</text>
      <text x="67" y="105" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Lightroom</text>
      <text x="67" y="128" text-anchor="middle" fill="#31A8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11">Cloud Sync</text>
    </g>

    <text x="180" y="225" text-anchor="middle" fill="#99CCFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12">Save >50% compared to single app subscriptions</text>
  </g>
</svg>
