<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
  <defs>
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B26" />
      <stop offset="100%" stop-color="#08121A" />
    </linearGradient>

    <linearGradient id="surfTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#168F9F" />
      <stop offset="100%" stop-color="#00D18F" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="glowConnect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00D18F" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Canvas Frame -->
  <rect width="1000" height="580" rx="16" fill="#0A1620" />

  <!-- App Main Window -->
  <g transform="translate(40, 30)" filter="url(#softShadow)">
    <rect width="920" height="520" rx="14" fill="#0F1F2C" stroke="#1D3447" stroke-width="1.5" />

    <!-- Top Window Titlebar -->
    <path d="M 0,14 C 0,6 6,0 14,0 L 906,0 C 914,0 920,6 920,14 L 920,44 L 0,44 Z" fill="#0A1620" />
    <!-- Traffic lights -->
    <circle cx="24" cy="22" r="5" fill="#EF4444" />
    <circle cx="40" cy="22" r="5" fill="#F59E0B" />
    <circle cx="56" cy="22" r="5" fill="#10B981" />
    <text x="460" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#8EADC2" text-anchor="middle">Surfshark VPN — v3.18.2 (Official Desktop Client)</text>

    <!-- App Body Layout (3 Columns) -->

    <!-- COLUMN 1: Narrow Left Icon Navigation Bar (w: 68px) -->
    <g transform="translate(0, 44)">
      <rect width="68" height="476" fill="#07121B" />
      <line x1="68" y1="0" x2="68" y2="476" stroke="#182E3F" stroke-width="1" />

      <!-- Official Logo Icon Top -->
      <g transform="translate(18, 18)">
        <rect width="32" height="32" rx="8" fill="#168F9F" />
        <path d="M 22,9 C 22,8.5 21.5,8 21,8 C 16,8 12,12 12,17 V 19 C 12,21.5 10,23.5 7.5,23.5 C 7,23.5 6.5,24 6.5,24.5 V 26.5 C 6.5,27 7,27.5 7.5,27.5 C 12.5,27.5 16.5,23.5 16.5,18.5 V 16.5 C 16.5,14 18.5,12 21,12 C 21.5,12 22,11.5 22,11 Z" fill="#FFFFFF" />
      </g>

      <!-- Nav Items -->
      <!-- VPN Tab (Active) -->
      <g transform="translate(14, 75)">
        <rect width="40" height="40" rx="10" fill="#168F9F" opacity="0.18" />
        <rect x="0" y="0" width="40" height="40" rx="10" fill="none" stroke="#168F9F" stroke-width="1.5" />
        <circle cx="20" cy="20" r="8" fill="none" stroke="#00D18F" stroke-width="2" />
        <path d="M 17,20 L 19,22 L 23,17" fill="none" stroke="#00D18F" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Antivirus Tab -->
      <g transform="translate(14, 130)">
        <circle cx="20" cy="20" r="10" fill="none" stroke="#68879E" stroke-width="1.5" />
        <path d="M 20,13 L 20,20 L 25,23" fill="none" stroke="#68879E" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Alert Tab -->
      <g transform="translate(14, 185)">
        <path d="M 20,12 C 16,12 14,15 14,19 L 12,24 L 28,24 L 26,19 C 26,15 24,12 20,12 Z" fill="none" stroke="#68879E" stroke-width="1.5" />
        <circle cx="20" cy="27" r="1.5" fill="#68879E" />
      </g>

      <!-- Alternative ID Tab -->
      <g transform="translate(14, 240)">
        <rect x="12" y="12" width="16" height="16" rx="4" fill="none" stroke="#68879E" stroke-width="1.5" />
        <circle cx="20" cy="18" r="3" fill="none" stroke="#68879E" stroke-width="1.5" />
      </g>

      <!-- Settings Bottom -->
      <g transform="translate(14, 420)">
        <circle cx="20" cy="20" r="9" fill="none" stroke="#68879E" stroke-width="1.5" stroke-dasharray="3 2" />
        <circle cx="20" cy="20" r="3" fill="#68879E" />
      </g>
    </g>

    <!-- COLUMN 2: Server List & Locations (w: 340px) -->
    <g transform="translate(68, 44)">
      <rect width="340" height="476" fill="#0C1A25" />
      <line x1="340" y1="0" x2="340" y2="476" stroke="#182E3F" stroke-width="1" />

      <!-- Search Input -->
      <g transform="translate(16, 16)">
        <rect width="308" height="38" rx="8" fill="#132737" stroke="#1E3E56" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="none" stroke="#68879E" stroke-width="1.5" />
        <line x1="24" y1="23" x2="28" y2="27" stroke="#68879E" stroke-width="1.5" />
        <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7597AF">Search locations or IP...</text>
      </g>

      <!-- Filter Tabs (Locations, Static IP, MultiHop) -->
      <g transform="translate(16, 66)">
        <rect width="96" height="26" rx="6" fill="#168F9F" />
        <text x="48" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">Locations</text>

        <rect x="104" width="96" height="26" rx="6" fill="#132737" stroke="#1E3E56" stroke-width="1" />
        <text x="152" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#8EADC2" text-anchor="middle">Static IP</text>

        <rect x="208" width="96" height="26" rx="6" fill="#132737" stroke="#1E3E56" stroke-width="1" />
        <text x="256" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#8EADC2" text-anchor="middle">MultiHop</text>
      </g>

      <!-- Quick Connect Shortcut -->
      <g transform="translate(16, 106)">
        <rect width="308" height="54" rx="8" fill="#112535" stroke="#1E3E56" stroke-width="1" />
        <!-- Fast lightning icon -->
        <circle cx="26" cy="27" r="14" fill="#00D18F" opacity="0.15" />
        <path d="M 27,18 L 22,27 L 26,27 L 24,35 L 30,25 L 26,25 Z" fill="#00D18F" />
        <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Fastest location</text>
        <text x="50" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7597AF">United States • 18ms latency</text>
        <circle cx="290" cy="27" r="4" fill="#00D18F" />
      </g>

      <!-- Section Label -->
      <text x="16" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#5F839C" letter-spacing="0.5">ALL COUNTRIES (100+)</text>

      <!-- Server Row 1 (Connected - US) -->
      <g transform="translate(16, 196)">
        <rect width="308" height="46" rx="8" fill="#032D23" stroke="#00D18F" stroke-width="1.5" />
        <!-- Flag badge US -->
        <rect x="12" y="14" width="24" height="18" rx="3" fill="#1E3A8A" />
        <rect x="12" y="14" width="24" height="4" fill="#DC2626" />
        <rect x="12" y="22" width="24" height="4" fill="#DC2626" />
        <text x="44" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#E6FFFA">United States — New York</text>
        <text x="278" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" fill="#00D18F">CONNECTED</text>
      </g>

      <!-- Server Row 2 (UK) -->
      <g transform="translate(16, 248)">
        <rect width="308" height="42" rx="8" fill="#0F2231" stroke="#172F42" stroke-width="1" />
        <rect x="12" y="12" width="24" height="18" rx="3" fill="#1E3A8A" />
        <path d="M 12,12 L 36,30 M 36,12 L 12,30" stroke="#FFFFFF" stroke-width="1.5" />
        <path d="M 24,12 L 24,30 M 12,21 L 36,21" stroke="#DC2626" stroke-width="2" />
        <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#D3E4F0">United Kingdom — London</text>
        <circle cx="290" cy="21" r="3" fill="#00D18F" opacity="0.6" />
      </g>

      <!-- Server Row 3 (Germany) -->
      <g transform="translate(16, 296)">
        <rect width="308" height="42" rx="8" fill="#0F2231" stroke="#172F42" stroke-width="1" />
        <rect x="12" y="12" width="24" height="6" fill="#111827" />
        <rect x="12" y="18" width="24" height="6" fill="#DC2626" />
        <rect x="12" y="24" width="24" height="6" fill="#F59E0B" />
        <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#D3E4F0">Germany — Frankfurt</text>
        <circle cx="290" cy="21" r="3" fill="#00D18F" opacity="0.6" />
      </g>

      <!-- Server Row 4 (Japan) -->
      <g transform="translate(16, 344)">
        <rect width="308" height="42" rx="8" fill="#0F2231" stroke="#172F42" stroke-width="1" />
        <rect x="12" y="12" width="24" height="18" rx="3" fill="#FFFFFF" />
        <circle cx="24" cy="21" r="5" fill="#DC2626" />
        <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#D3E4F0">Japan — Tokyo (10Gbps)</text>
        <circle cx="290" cy="21" r="3" fill="#00D18F" opacity="0.6" />
      </g>

      <!-- Server Row 5 (Singapore) -->
      <g transform="translate(16, 392)">
        <rect width="308" height="42" rx="8" fill="#0F2231" stroke="#172F42" stroke-width="1" />
        <rect x="12" y="12" width="24" height="9" fill="#DC2626" />
        <rect x="12" y="21" width="24" height="9" fill="#FFFFFF" />
        <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#D3E4F0">Singapore</text>
        <circle cx="290" cy="21" r="3" fill="#00D18F" opacity="0.6" />
      </g>
    </g>

    <!-- COLUMN 3: Connection Dashboard & Active Session (w: 512px) -->
    <g transform="translate(408, 44)">
      <rect width="512" height="476" fill="#0E1E2B" />

      <!-- Top Active Status Header -->
      <g transform="translate(24, 24)">
        <rect width="464" height="110" rx="14" fill="#042F24" stroke="#00D18F" stroke-width="1.5" filter="url(#glowConnect)" />
        
        <!-- Big Disconnect / Power Toggle Button -->
        <g transform="translate(20, 20)">
          <circle cx="35" cy="35" r="35" fill="url(#surfTealGrad)" />
          <path d="M 35,20 L 35,34 M 25,26 C 20,31 20,40 25,45 C 30,50 40,50 45,45 C 50,40 50,31 45,26" fill="none" stroke="#05131F" stroke-width="4.5" stroke-linecap="round" />
        </g>

        <!-- Status Info Text -->
        <g transform="translate(105, 28)">
          <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">CONNECTED TO SURFSHARK</text>
          <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#6EE7B7">185.246.208.92 • United States (WireGuard®)</text>
          <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#A7F3D0">Your real IP and physical location are strictly encrypted &amp; hidden</text>
        </g>
      </g>

      <!-- Live Speed & Session Telemetry -->
      <g transform="translate(24, 150)">
        <!-- Box 1: Download -->
        <rect width="144" height="74" rx="10" fill="#122737" stroke="#1D3C54" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#7597AF">DOWNLOAD SPEED</text>
        <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#00D18F">942.8 Mbps</text>
        <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5F839C">10Gbps Nexus Port</text>

        <!-- Box 2: Upload -->
        <g transform="translate(160, 0)">
          <rect width="144" height="74" rx="10" fill="#122737" stroke="#1D3C54" stroke-width="1" />
          <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#7597AF">UPLOAD SPEED</text>
          <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#38BDF8">814.2 Mbps</text>
          <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5F839C">Low Jitter (1.2ms)</text>
        </g>

        <!-- Box 3: CleanWeb Blocked -->
        <g transform="translate(320, 0)">
          <rect width="144" height="74" rx="10" fill="#122737" stroke="#1D3C54" stroke-width="1" />
          <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#7597AF">ADS &amp; MALWARE</text>
          <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#F59E0B">42,819</text>
          <text x="14" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#5F839C">CleanWeb Blocked</text>
        </g>
      </g>

      <!-- Advanced Features Switchboard -->
      <g transform="translate(24, 240)">
        <rect width="464" height="216" rx="12" fill="#0C1A25" stroke="#1A3449" stroke-width="1" />

        <!-- Feature 1: CleanWeb 2.0 -->
        <g transform="translate(16, 16)">
          <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">CleanWeb 2.0 (Ad, Tracker &amp; Malware Blocker)</text>
          <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7597AF">Blocks annoying video popups, phishing links, and malicious domains</text>
          <!-- Toggle Active -->
          <rect x="384" y="4" width="44" height="24" rx="12" fill="#00D18F" />
          <circle cx="416" cy="16" r="9" fill="#05131F" />
        </g>

        <line x1="16" y1="64" x2="448" y2="64" stroke="#182E3F" stroke-width="1" />

        <!-- Feature 2: Kill Switch -->
        <g transform="translate(16, 76)">
          <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Automatic Kill Switch</text>
          <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7597AF">Disables internet traffic immediately if VPN connection ever drops</text>
          <!-- Toggle Active -->
          <rect x="384" y="4" width="44" height="24" rx="12" fill="#00D18F" />
          <circle cx="416" cy="16" r="9" fill="#05131F" />
        </g>

        <line x1="16" y1="124" x2="448" y2="124" stroke="#182E3F" stroke-width="1" />

        <!-- Feature 3: Rotating IP (Nexus) -->
        <g transform="translate(16, 136)">
          <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">IP Rotator (Surfshark Nexus SDN)</text>
          <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7597AF">Periodically rotates exit IP every 5 minutes without dropping connection</text>
          <!-- Toggle Active -->
          <rect x="384" y="4" width="44" height="24" rx="12" fill="#00D18F" />
          <circle cx="416" cy="16" r="9" fill="#05131F" />
        </g>
      </g>
    </g>
  </g>
</svg>
