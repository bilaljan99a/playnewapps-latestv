    </text>

    <g transform="translate(0, 115)">
      <!-- Starter Pack -->
      <g transform="translate(0, 0)">
        <rect width="220" height="110" rx="14" fill="#27272A" stroke="#52525B" stroke-width="2"/>
        <text x="20" y="32" font-family="sans-serif" font-weight="800" font-size="16" fill="#F4F4F5">Starter Pack</text>
        <text x="20" y="65" font-family="sans-serif" font-weight="900" font-size="28" fill="#38BDF8">$24</text>
        <text x="20" y="90" font-family="sans-serif" font-weight="600" font-size="13" fill="#A1A1AA">$0.24 per retouch</text>
      </g>

      <!-- Advanced Pack -->
      <g transform="translate(240, 0)">
        <rect width="220" height="110" rx="14" fill="#27272A" stroke="#38BDF8" stroke-width="2"/>
        <text x="20" y="32" font-family="sans-serif" font-weight="800" font-size="16" fill="#38BDF8">Advanced Pack</text>
        <text x="20" y="65" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">$59</text>
        <text x="20" y="90" font-family="sans-serif" font-weight="600" font-size="13" fill="#A1A1AA">$0.20 per retouch</text>
      </g>

      <!-- Extended Pack -->
      <g transform="translate(480, 0)">
        <rect width="220" height="110" rx="14" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
        <text x="20" y="32" font-family="sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Extended Pack ★ POPULAR</text>
        <text x="20" y="65" font-family="sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">$179</text>
        <text x="20" y="90" font-family="sans-serif" font-weight="700" font-size="13" fill="#E0F2FE">$0.15 per retouch</text>
      </g>

      <!-- CTA -->
      <g transform="translate(730, 28)">
        <rect width="280" height="54" rx="12" fill="#F59E0B"/>
        <text x="140" y="33" font-family="sans-serif" font-weight="800" font-size="16" fill="#000000" text-anchor="middle">
          BUY PAY-AS-YOU-GO PACK →
        </text>
