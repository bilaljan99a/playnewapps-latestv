<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="b3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#3F3F46"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#b3Grad)"/>

  <g transform="translate(60, 45)">
    <rect width="250" height="32" rx="16" fill="#A1A1AA"/>
    <text x="125" y="21" font-family="sans-serif" font-weight="800" font-size="14" fill="#09090B" text-anchor="middle" letter-spacing="1">
