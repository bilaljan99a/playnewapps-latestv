      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="16" fill="url(#refGrad)" stroke="#FFC800" stroke-width="1.5" />

  <g transform="translate(40, 40)">
