<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="900" height="450" rx="20" fill="url(#bg2)"/>

  <!-- Left Side Text & Callout -->
  <g transform="translate(50, 50)">
    <rect width="210" height="34" rx="17" fill="#FFFFFF" opacity="0.2"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" letter-spacing="1">100% FREE TRIAL ACCESS</text>

    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF">Try ApplicantAlly Free</text>
    <text x="0" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#7DD3FC">15 Minutes Included</text>

    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#E0F2FE">Test live AI interview coaching on your computer risk-free.</text>
    <text x="0" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#E0F2FE">No credit card required for initial free trial minutes.</text>

    <!-- Checklist -->
    <g transform="translate(0, 240)">
      <rect width="380" height="42" rx="10" fill="#0F172A" opacity="0.6"/>
      <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#38BDF8" font-weight="700">✓ Native Audio Capture (No Bot Joins Meeting)</text>

      <rect y="52" width="380" height="42" rx="10" fill="#0F172A" opacity="0.6"/>
      <text x="16" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#38BDF8" font-weight="700">✓ Resume PDF &amp; Job Description Alignment</text>

      <rect y="104" width="380" height="42" rx="10" fill="#0F172A" opacity="0.6"/>
      <text x="16" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#38BDF8" font-weight="700">✓ Windows 10/11 &amp; macOS Desktop Apps</text>
    </g>
  </g>

  <!-- Right Side Visual: Desktop Companion App Dashboard -->
  <g transform="translate(480, 50)">
    <rect width="370" height="350" rx="18" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="2"/>
    
    <!-- Titlebar -->
    <rect width="370" height="40" rx="18" fill="#1E293B"/>
    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#38BDF8">ApplicantAlly Desktop Control Panel</text>
    <circle cx="340" cy="20" r="6" fill="#10B981"/>

    <!-- Toggles & Status -->
    <g transform="translate(20, 58)">
      <!-- Item 1: Audio Engine -->
      <rect width="330" height="48" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">System Audio Stream Capture</text>
      <rect x="260" y="13" width="54" height="22" rx="11" fill="#10B981"/>
      <circle cx="301" cy="24" r="8" fill="#FFFFFF"/>

      <!-- Item 2: Stealth Screen Share -->
      <g transform="translate(0, 58)">
        <rect width="330" height="48" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Stealth Screen Invisibility</text>
        <rect x="260" y="13" width="54" height="22" rx="11" fill="#10B981"/>
        <circle cx="301" cy="24" r="8" fill="#FFFFFF"/>
      </g>

      <!-- Item 3: Resume Indexing -->
      <g transform="translate(0, 116)">
        <rect width="330" height="48" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Uploaded Resume Indexing</text>
        <rect x="260" y="13" width="54" height="22" rx="11" fill="#10B981"/>
        <circle cx="301" cy="24" r="8" fill="#FFFFFF"/>
      </g>

      <!-- Active Minute Balance Box -->
      <g transform="translate(0, 180)">
        <rect width="330" height="85" rx="12" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#93C5FD" font-weight="700">AVAILABLE TIME PACK BALANCE</text>
        <text x="20" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF">15 Mins <tspan font-size="14" fill="#38BDF8" font-weight="700">(Free Trial Active)</tspan></text>
      </g>
    </g>
  </g>
</svg>