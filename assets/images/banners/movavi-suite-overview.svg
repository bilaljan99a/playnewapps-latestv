<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310">
  <defs>
    <linearGradient id="suiteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Canvas Container -->
  <rect width="800" height="310" rx="16" fill="url(#suiteBg)"/>
  <rect x="12" y="12" width="776" height="286" rx="12" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Main Banner Title &amp; Subtitle -->
  <text x="400" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="middle">Movavi Video Suite 2026 Core Capabilities</text>
  <text x="400" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Everything needed to edit, convert, record, and enhance media in one package</text>

  <!-- 4 Feature Cards Row -->
  <g transform="translate(30, 80)">

    <!-- CARD 1: VIDEO EDITING -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="198" rx="12" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="85" cy="38" r="22" fill="#0284C7"/>
      <text x="85" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">🎬</text>
      <text x="85" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">Video Editing</text>
      
      <text x="85" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">AI Background Removal</text>
      <text x="85" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">AI Noise Suppression</text>
      <text x="85" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Smart Motion Tracking</text>
      
      <rect x="15" y="156" width="140" height="26" rx="6" fill="#0284C7"/>
      <text x="85" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Video Editor Plus</text>
    </g>

    <!-- CARD 2: MEDIA CONVERSION -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="170" height="198" rx="12" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="85" cy="38" r="22" fill="#16A34A"/>
      <text x="85" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">⚡</text>
      <text x="85" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">Media Conversion</text>
      
      <text x="85" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">180+ File Formats</text>
      <text x="85" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">SuperSpeed NVENC</text>
      <text x="85" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">AI 4K Upscaling</text>
      
      <rect x="15" y="156" width="140" height="26" rx="6" fill="#16A34A"/>
      <text x="85" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Converter Premium</text>
    </g>

    <!-- CARD 3: SCREEN RECORDING -->
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="170" height="198" rx="12" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="85" cy="38" r="22" fill="#EA580C"/>
      <text x="85" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">📹</text>
      <text x="85" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">Screen Recording</text>
      
      <text x="85" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Full HD &amp; 4K Capture</text>
      <text x="85" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Webcam &amp; Mic Audio</text>
      <text x="85" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Scheduled Captures</text>
      
      <rect x="15" y="156" width="140" height="26" rx="6" fill="#EA580C"/>
      <text x="85" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Screen Capture Pro</text>
    </g>

    <!-- CARD 4: EFFECTS &amp; CREATIVE TOOLS -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="170" height="198" rx="12" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="85" cy="38" r="22" fill="#9333EA"/>
      <text x="85" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">🎨</text>
      <text x="85" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A" text-anchor="middle">Effects Store</text>
      
      <text x="85" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">10,000+ Title Cards</text>
      <text x="85" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">LUTs &amp; Transitions</text>
      <text x="85" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Sound FX &amp; Stickers</text>
      
      <rect x="15" y="156" width="140" height="26" rx="6" fill="#9333EA"/>
      <text x="85" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Effects Store Access</text>
    </g>

  </g>
</svg>
