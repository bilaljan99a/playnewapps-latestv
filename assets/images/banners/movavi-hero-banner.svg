  <rect x="70" y="100" width="180" height="290" rx="10" fill="#1E293B"/>
  <rect x="85" y="120" width="150" height="36" rx="8" fill="url(#accentG)"/>
  <text x="100" y="143" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0F172A">🎬 Video Editor</text>
  <rect x="85" y="170" width="150" height="36" rx="8" fill="#334155"/>
  <text x="100" y="193" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">📼 Converter Premium</text>
  <rect x="85" y="220" width="150" height="36" rx="8" fill="#334155"/>
  <text x="100" y="243" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">📹 Screen Recorder</text>
  <rect x="85" y="270" width="150" height="36" rx="8" fill="#334155"/>
  <text x="100" y="293" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">📸 AI Photo Editor</text>

