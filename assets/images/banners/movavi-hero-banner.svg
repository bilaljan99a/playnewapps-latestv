  <rect x="270" y="100" width="460" height="190" rx="10" fill="#0284C7" opacity="0.15" stroke="#0284C7" stroke-width="2"/>
  <polygon points="480,165 520,190 480,215" fill="url(#orangeG)"/>
  <text x="500" y="250" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle">4K Ultra HD AI Timeline Preview</text>

