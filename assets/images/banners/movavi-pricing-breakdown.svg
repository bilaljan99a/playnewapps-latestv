<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="priceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="20" fill="url(#priceBg)"/>
  
  <text x="400" y="50" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">Movavi License Tier &amp; Bundle Savings Comparison</text>
  <text x="400" y="75" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Choose between lifetime standalone licenses or all-inclusive annual plans</text>

  <!-- 3 Pricing Columns -->
  <g transform="translate(50, 100)">
    <!-- Plan 1 -->
    <rect x="0" y="0" width="215" height="220" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="107.5" y="35" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#38BDF8" text-anchor="middle">Video Editor</text>
    <text x="107.5" y="65" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">$79.95</text>
    <text x="107.5" y="85" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">1 PC / Mac Lifetime</text>
    <line x1="20" y1="105" x2="195" y2="105" stroke="#334155"/>
    <text x="107.5" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ Full Video Editing</text>
    <text x="107.5" y="150" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ AI Background Removal</text>
    <text x="107.5" y="170" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ Motion Tracking &amp; Audio FX</text>
    <rect x="25" y="185" width="165" height="26" rx="6" fill="#0284C7"/>
    <text x="107.5" y="202" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get Video Editor</text>

    <!-- Plan 2 - Highlighted -->
    <rect x="242.5" y="0" width="215" height="220" rx="14" fill="#0F172A" stroke="#F97316" stroke-width="3"/>
    <rect x="290" y="-12" width="120" height="22" rx="11" fill="#F97316"/>
    <text x="350" y="3" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">BEST VALUE BUNDLE</text>
    <text x="350" y="35" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#FB923C" text-anchor="middle">Video Suite 2026</text>
    <text x="350" y="65" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">$99.95</text>
    <text x="350" y="85" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">3-in-1 Lifetime Suite</text>
    <line x1="262.5" y1="105" x2="437.5" y2="105" stroke="#334155"/>
    <text x="350" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ Video Editor + Converter</text>
    <text x="350" y="150" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ 4K Screen Recorder</text>
    <text x="350" y="170" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ Save 30% vs Standalone</text>
    <rect x="267.5" y="185" width="165" height="26" rx="6" fill="#F97316"/>
    <text x="350" y="202" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Claim 30% Off Suite</text>

    <!-- Plan 3 -->
    <rect x="485" y="0" width="215" height="220" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="592.5" y="35" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#A855F7" text-anchor="middle">Movavi Unlimited</text>
    <text x="592.5" y="65" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">$155.95</text>
    <text x="592.5" y="85" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">1-Year All-Access Pass</text>
    <line x1="505" y1="105" x2="680" y2="105" stroke="#334155"/>
    <text x="592.5" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ All 10+ Movavi Apps</text>
    <text x="592.5" y="150" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ Unlimited Effects Store</text>
    <text x="592.5" y="170" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">✓ Priority Customer Care</text>
    <rect x="510" y="185" width="165" height="26" rx="6" fill="#A855F7"/>
    <text x="592.5" y="202" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Get All-Access</text>
