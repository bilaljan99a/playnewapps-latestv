  <!-- Footer Banner Row & CTA Button -->
  <g transform="translate(32, 222)">
    <text x="0" y="30" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">30-Day Money-Back Guarantee • Instant License</text>

