      <rect width="166" height="40" rx="8" fill="url(#wsAccentGrad)"/>
      <text x="83" y="25" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="13" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">GET DISCOUNTS →</text>
