  <rect x="250" y="34" width="136" height="24" rx="6" fill="#00DAC6" fill-opacity="0.2" stroke="#00DAC6" stroke-width="1"/>
  <text x="318" y="50" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="900" fill="#00DAC6" text-anchor="middle" letter-spacing="0.5">OFFICIAL PARTNER</text>

  <!-- Main Value Proposition Heading -->
  <text x="32" y="112" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="27" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">SAVE UP TO 60% OFF</text>
  <text x="32" y="140" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="15" font-weight="700" fill="#94A3B8">Filmora 15, PDFelement, Recoverit &amp; Dr.Fone</text>

  <!-- Software Products Mini Badges -->
  <g transform="translate(32, 160)">
    <rect width="128" height="28" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="64" y="18" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">🎬 Filmora Video</text>

    <rect x="138" y="0" width="138" height="28" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="207" y="18" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">📄 PDFelement Pro</text>

    <rect x="286" y="0" width="132" height="28" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="352" y="18" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">💾 Recoverit Data</text>

    <rect x="428" y="0" width="122" height="28" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="489" y="18" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">📱 Dr.Fone Suite</text>
  </g>

  <!-- Right Side Decorative Feature Pill -->
  <g transform="translate(470, 30)" opacity="0.9" filter="url(#wsDropShadow)">
    <rect width="98" height="100" rx="12" fill="#00DAC6" fill-opacity="0.12" stroke="#00DAC6" stroke-width="1.5"/>
    <circle cx="49" cy="38" r="20" fill="#00DAC6"/>
    <text x="49" y="44" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="14" font-weight="900" fill="#0F172A" text-anchor="middle">AI</text>
    <text x="49" y="74" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">POWERED</text>
    <text x="49" y="88" font-family="'Roboto', -apple-system, Arial, sans-serif" font-size="9" font-weight="600" fill="#00DAC6" text-anchor="middle">30-DAY TRIAL</text>
