<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <linearGradient id="wsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#043859"/>
    </linearGradient>
    <linearGradient id="wsAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DAC6"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="wsDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="300" rx="16" fill="url(#wsBgGrad)"/>

  <!-- Geometric / Glowing Mesh Highlights -->
  <circle cx="530" cy="50" r="160" fill="#00DAC6" opacity="0.07"/>
  <circle cx="90" cy="270" r="100" fill="#00B4D8" opacity="0.05"/>
  <path d="M-10 140 C 180 80, 360 220, 610 100" fill="none" stroke="#00DAC6" stroke-width="2" opacity="0.18"/>

  <!-- Wondershare Logo / Icon -->
  <g transform="translate(32, 28)" filter="url(#wsDropShadow)">
    <rect width="48" height="48" rx="12" fill="#00DAC6"/>
    <!-- Wondershare Geometric W Mark -->
    <path d="M14 18 L24 34 L34 18" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M20 28 L24 34 L28 28" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Brand Wordmark & Official Badge -->
