<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4747"/>
      <stop offset="50%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#E02B2B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5F0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFBE00"/>
      <stop offset="100%" stop-color="#FF9000"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Decorative Glow Patterns -->
  <circle cx="1100" cy="80" r="220" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="100" cy="420" r="180" fill="#FFFFFF" opacity="0.06"/>
  <path d="M-50 150 Q 300 50 600 200 T 1250 100" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.15"/>

  <!-- Choice Badge Tag -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="90" y="27" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" fill="#E02B2B" text-anchor="middle" letter-spacing="1">AliExpress CHOICE</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="145" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">CHOICE DAY &amp; SUPER DEALS</text>
  <text x="60" y="195" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFE5D9">Factory-Direct Electronics, Smart Gadgets &amp; Fashion Goods</text>

  <!-- Key Highlights Pills -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="220" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">⚡ Free 7-12 Day Shipping</text>

    <rect x="235" y="0" width="210" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="340" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">🏷️ Up to 80% OFF Codes</text>

    <rect x="460" y="0" width="210" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="565" y="25" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">📦 Bundle 3 Items for $1.99</text>
  </g>

  <!-- Featured Product Showcase Cards -->
  <!-- Product 1: TWS Earbuds -->
  <g transform="translate(60, 310)" filter="url(#shadow)">
    <rect width="210" height="140" rx="14" fill="url(#cardGrad)"/>
    <circle cx="105" cy="55" r="32" fill="#FFEAE0"/>
    <!-- Earbuds Icon -->
    <path d="M95 45 C95 40 100 38 105 38 C110 38 115 40 115 45 L115 60 C115 65 110 68 105 68 C100 68 95 65 95 60 Z" fill="#FF4747"/>
    <text x="105" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">Wireless ANC Earbuds</text>
    <text x="105" y="125" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#E02B2B" text-anchor="middle">$12.99 <tspan font-size="11" fill="#888888" text-decoration="line-through">$49.99</tspan></text>
  </g>

  <!-- Product 2: Smartwatch -->
  <g transform="translate(290, 310)" filter="url(#shadow)">
    <rect width="210" height="140" rx="14" fill="url(#cardGrad)"/>
    <circle cx="105" cy="55" r="32" fill="#EBF3FF"/>
    <!-- Smartwatch Icon -->
    <rect x="90" y="38" width="30" height="34" rx="6" fill="#1E88E5"/>
    <rect x="97" y="32" width="16" height="6" rx="2" fill="#666666"/>
    <rect x="97" y="72" width="16" height="6" rx="2" fill="#666666"/>
    <text x="105" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">AMOLED Smart Watch</text>
    <text x="105" y="125" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#E02B2B" text-anchor="middle">$24.50 <tspan font-size="11" fill="#888888" text-decoration="line-through">$89.00</tspan></text>
  </g>

  <!-- Product 3: Mini Drone / Tech Gadget -->
  <g transform="translate(520, 310)" filter="url(#shadow)">
    <rect width="210" height="140" rx="14" fill="url(#cardGrad)"/>
    <circle cx="105" cy="55" r="32" fill="#E8F5E9"/>
    <!-- Camera/Drone Icon -->
    <circle cx="105" cy="55" r="16" fill="#43A047"/>
    <circle cx="105" cy="55" r="8" fill="#FFFFFF"/>
    <text x="105" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#333333" text-anchor="middle">4K HD Mini Camera</text>
    <text x="105" y="125" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#E02B2B" text-anchor="middle">$18.90 <tspan font-size="11" fill="#888888" text-decoration="line-through">$65.00</tspan></text>
  </g>

  <!-- Right Visual Graphic: Giant Choice Shopping Tag & Warehouse Ship Box -->
  <g transform="translate(800, 110)" filter="url(#shadow)">
    <!-- Big Shopping Box Frame -->
    <rect width="340" height="320" rx="20" fill="#FFFFFF"/>
    
    <!-- Header inside card -->
    <rect width="340" height="70" rx="20" fill="url(#accentGrad)"/>
    <text x="170" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#333333" text-anchor="middle">🛍️ Top Verified Products</text>

    <!-- Product list rows inside graphic -->
    <g transform="translate(20, 90)">
      <rect width="300" height="60" rx="10" fill="#F8FAFC"/>
      <circle cx="35" cy="30" r="18" fill="#FF4747"/>
      <text x="35" y="36" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">📱</text>
      <text x="65" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Gadgets &amp; Phone Tech</text>
      <text x="65" y="45" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Direct Factory Vendors • Fast Ship</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="300" height="60" rx="10" fill="#F8FAFC"/>
      <circle cx="35" cy="30" r="18" fill="#FF9000"/>
      <text x="35" y="36" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">👗</text>
      <text x="65" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Fashion &amp; Apparel</text>
      <text x="65" y="45" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Seasonal Clearance • Extra 15% OFF</text>
    </g>

    <g transform="translate(20, 230)">
      <rect width="300" height="60" rx="10" fill="#F8FAFC"/>
      <circle cx="35" cy="30" r="18" fill="#10B981"/>
      <text x="35" y="36" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">🏠</text>
      <text x="65" y="27" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1E293B">Home &amp; DIY Workshop</text>
      <text x="65" y="45" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Choice Warehouse Guaranteed</text>
    </g>
  </g>
</svg>
