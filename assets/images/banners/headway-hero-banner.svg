<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep Backdrop -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="950" cy="180" r="280" fill="#0066FF" opacity="0.18" filter="blur(60px)" />
  <circle cx="200" cy="500" r="220" fill="#0284C7" opacity="0.15" filter="blur(50px)" />

  <!-- Left Column: Value Prop & Brand -->
  <g transform="translate(80, 80)">
    <!-- Brand Pill -->
    <rect width="180" height="42" rx="21" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" />
    <g transform="translate(14, 9)">
      <rect width="24" height="24" rx="6" fill="#0066FF" />
      <!-- Small ladder -->
      <path d="M 6 4 V 20 M 18 4 V 20 M 6 8 H 18 M 6 13 H 18 M 6 17 H 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="34" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="1">HEADWAY</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Bite-Sized Nonfiction
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#38BDF8" letter-spacing="-1">
      In 15-Minute Summaries
    </text>

    <!-- Subtitle / Bullet Points -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
      Key ideas from 1,500+ bestselling books in audio &amp; text
    </text>

    <g transform="translate(0, 260)">
      <!-- Metric 1 -->
      <rect width="150" height="80" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
      <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#38BDF8">30M+</text>
      <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Active Learners</text>

      <!-- Metric 2 -->
      <g transform="translate(165, 0)">
        <rect width="150" height="80" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
        <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#FBBF24">1,500+</text>
        <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Book Summaries</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(330, 0)">
        <rect width="150" height="80" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
        <text x="20" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#4ADE80">15 Min</text>
        <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Audio &amp; Text</text>
      </g>
    </g>

    <!-- App Store Badges / Trust Line -->
    <g transform="translate(0, 380)">
      <rect width="480" height="50" rx="12" fill="rgba(0,102,255,0.15)" stroke="rgba(56,189,248,0.3)" />
      <text x="20" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">
        ★ 4.8/5 Rating • App of the Day Winner • Personalized Growth
      </text>
    </g>
  </g>

  <!-- Right Column: Interactive App Interface Mockup -->
  <g transform="translate(680, 60)" filter="url(#shadow)">
    <!-- Phone / UI Device Shell -->
    <rect width="440" height="510" rx="28" fill="#1E293B" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

    <!-- Top App Bar -->
    <rect x="24" y="24" width="392" height="60" rx="16" fill="rgba(255,255,255,0.05)" />
    <text x="44" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Daily Growth Goal</text>
    <!-- Progress Indicator -->
    <rect x="260" y="44" width="136" height="18" rx="9" fill="#0F172A" />
    <rect x="260" y="44" width="100" height="18" rx="9" fill="#0066FF" />
    <text x="328" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">75% Done</text>

    <!-- Featured Summary Card: Atomic Habits -->
    <g transform="translate(24, 100)">
      <rect width="392" height="175" rx="20" fill="url(#blueCard)" />
      
      <!-- Book Icon Pill -->
      <rect x="20" y="20" width="80" height="135" rx="10" fill="#FFFFFF" />
      <g transform="translate(30, 35)">
        <rect width="60" height="8" rx="4" fill="#0066FF" />
        <rect y="16" width="45" height="6" rx="3" fill="#94A3B8" />
        <circle cx="30" cy="65" r="18" fill="#F1F5F9" />
        <!-- Micro Book Graphic -->
        <path d="M 22 65 Q 30 60 38 65 V 74 Q 30 70 22 74 Z" fill="#0066FF" />
        <rect y="92" width="60" height="5" rx="2" fill="#E2E8F0" />
        <rect y="101" width="40" height="5" rx="2" fill="#E2E8F0" />
      </g>

      <!-- Book Info -->
      <g transform="translate(115, 25)">
        <rect width="90" height="22" rx="11" fill="rgba(255,255,255,0.2)" />
        <text x="45" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">#1 BESTSELLER</text>
        <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">Atomic Habits</text>
        <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#E0F2FE">James Clear • 14 min read</text>

        <!-- Audio Waveform Player -->
        <g transform="translate(0, 88)">
          <circle cx="16" cy="16" r="16" fill="#FFFFFF" />
          <path d="M 13 10 L 22 16 L 13 22 Z" fill="#0066FF" />
          <!-- Wave Bars -->
          <rect x="42" y="10" width="4" height="12" rx="2" fill="#FFFFFF" />
          <rect x="50" y="6" width="4" height="20" rx="2" fill="#FFFFFF" />
          <rect x="58" y="2" width="4" height="28" rx="2" fill="#FFFFFF" />
          <rect x="66" y="8" width="4" height="16" rx="2" fill="#FFFFFF" />
          <rect x="74" y="12" width="4" height="8" rx="2" fill="#FFFFFF" />
          <rect x="82" y="4" width="4" height="24" rx="2" fill="#FFFFFF" />
          <rect x="90" y="10" width="4" height="12" rx="2" fill="#FFFFFF" />
          <rect x="98" y="14" width="4" height="6" rx="2" fill="#FFFFFF" />
          <rect x="106" y="6" width="4" height="20" rx="2" fill="#FFFFFF" />
          <rect x="114" y="12" width="4" height="8" rx="2" fill="#FFFFFF" />
          <text x="130" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1.5x Speed</text>
        </g>
      </g>
    </g>

    <!-- Secondary Modules -->
    <g transform="translate(24, 290)">
      <!-- Spaced Repetition Flashcard -->
      <rect width="190" height="190" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
      <g transform="translate(16, 16)">
        <rect width="32" height="32" rx="8" fill="#F59E0B" opacity="0.2" />
        <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#F59E0B" text-anchor="middle">⚡</text>
        <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Spaced Recall</text>
        <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">"You do not rise to the level of your goals..."</text>
        <rect y="120" width="158" height="32" rx="8" fill="#334155" />
        <text x="79" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">Reveal Key Insight</text>
      </g>

      <!-- Daily Streak Card -->
      <g transform="translate(202, 0)">
        <rect width="190" height="190" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" />
        <g transform="translate(16, 16)">
          <rect width="32" height="32" rx="8" fill="#EF4444" opacity="0.2" />
          <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#EF4444" text-anchor="middle">🔥</text>
          <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">14-Day Streak</text>
          <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Top 5% consistency this month!</text>
          <rect y="120" width="158" height="32" rx="8" fill="#0066FF" />
          <text x="79" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Keep Growing</text>
        </g>
      </g>
    </g>
  </g>
</svg>
