  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#fireflyBg)" stroke="#593D00" stroke-width="2"/>

  <path d="M 0 0 L 12 0 L 12 320 L 0 320 Z" fill="url(#goldGrad)"/>

  <g transform="translate(45, 35)">
