    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30">Adobe Firefly AI Suite</text>
    <text x="0" y="105" fill="#FFC107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20">Generative Fill, Expand &amp; Vector Recolor</text>

    <text x="0" y="145" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ Integrated into Photoshop, Illustrator &amp; Adobe Express</text>
    <text x="0" y="170" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ Trained strictly on licensed stock &amp; public domain assets</text>
    <text x="0" y="195" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13">✓ 100% commercially safe for client work and corporate branding</text>

