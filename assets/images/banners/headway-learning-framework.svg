<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <rect width="1100" height="500" rx="24" fill="url(#bgGrad2)" stroke="#E2E8F0" stroke-width="2" />

  <!-- Top Section Title -->
  <g transform="translate(60, 50)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">
      The Headway Microlearning Framework: 4 Steps to 10x Knowledge Retention
    </text>
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748B">
      How Headway transforms massive 300+ page nonfiction books into actionable daily habits.
    </text>
  </g>

  <!-- 4 Framework Columns -->
  <g transform="translate(60, 150)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="225" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#EFF6FF" />
      <text x="42" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#0066FF" text-anchor="middle">🎯</text>
      <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#0066FF" letter-spacing="1">STEP 01</text>
      <text x="20" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Core Idea Extraction</text>
      <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748B">
        Expert editors strip away fluff, extracting the author's top 5–7 foundational hypotheses.
      </text>
      <rect x="20" y="235" width="185" height="34" rx="8" fill="#F1F5F9" />
      <text x="112" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">15-Min Executive Read</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(250, 0)">
      <rect width="225" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#F0FDF4" />
      <text x="42" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#16A34A" text-anchor="middle">🎧</text>
      <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#16A34A" letter-spacing="1">STEP 02</text>
      <text x="20" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Studio Voice Audio</text>
      <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748B">
        Professional voice actors narrate key insights with variable playback speeds (1x to 2x).
      </text>
      <rect x="20" y="235" width="185" height="34" rx="8" fill="#F0FDF4" />
      <text x="112" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#16A34A" text-anchor="middle">Commute &amp; Gym Ready</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(500, 0)">
      <rect width="225" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#FEF3C7" />
      <text x="42" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#D97706" text-anchor="middle">🧠</text>
      <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#D97706" letter-spacing="1">STEP 03</text>
      <text x="20" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Spaced Repetition</text>
      <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748B">
        Interactive flashcards prompt cognitive recall at scientifically timed intervals.
      </text>
      <rect x="20" y="235" width="185" height="34" rx="8" fill="#FEF3C7" />
      <text x="112" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle">Long-Term Memory</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(750, 0)">
      <rect width="225" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <rect x="20" y="20" width="44" height="44" rx="12" fill="#FAF5FF" />
      <text x="42" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#9333EA" text-anchor="middle">📊</text>
      <text x="20" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#9333EA" letter-spacing="1">STEP 04</text>
      <text x="20" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Daily Action Plans</text>
      <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#64748B">
        Curated microlearning tracks (Productivity, Leadership, Finance) built for sustained streaks.
      </text>
      <rect x="20" y="235" width="185" height="34" rx="8" fill="#FAF5FF" />
      <text x="112" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7E22CE" text-anchor="middle">Gamified Habits</text>
    </g>
  </g>
</svg>
