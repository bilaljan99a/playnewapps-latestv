<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="b1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="24" fill="url(#b1Grad)"/>
  
  <!-- Decorative Grid Lines -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300" stroke="#334155" stroke-width="1" opacity="0.3"/>
  <path d="M 300 0 L 300 400 M 600 0 L 600 400 M 900 0 L 900 400" stroke="#334155" stroke-width="1" opacity="0.3"/>

  <!-- Left Content Column -->
  <g transform="translate(60, 60)">
    <!-- Badge -->
    <rect width="320" height="38" rx="19" fill="url(#badgeGrad)"/>
    <text x="160" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      🎁 EXCLUSIVE VERIFIED PROMO 2026
    </text>

    <!-- Main Headline -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">
      Free Cloud Retouch Bonuses
    </text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#38BDF8" letter-spacing="-1">
      + 20% OFF All AI Plugins
    </text>

    <!-- Subtitle -->
    <text x="0" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" fill="#CBD5E1">
      Accelerate your photo editing workflow with 15+ neural network plugins for Photoshop &amp; Lightroom.
    </text>

    <!-- CTA Button Representation -->
    <g transform="translate(0, 215)" filter="url(#shadow)">
      <rect width="280" height="56" rx="14" fill="url(#btnGrad)"/>
      <text x="140" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">
        CLAIM 20% DISCOUNT →
      </text>
    </g>
  </g>

  <!-- Right Graphic: Interactive AI Retouching UI Graphic -->
  <g transform="translate(740, 40)" filter="url(#shadow)">
    <rect width="400" height="320" rx="16" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- App Bar -->
    <rect width="400" height="40" rx="16" fill="#0F172A"/>
    <circle cx="20" cy="20" r="6" fill="#EF4444"/>
    <circle cx="36" cy="20" r="6" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="6" fill="#10B981"/>
    <text x="200" y="25" font-family="sans-serif" font-weight="700" font-size="13" fill="#94A3B8" text-anchor="middle">Retouch4me AI Engine v3.2</text>

    <!-- Simulated Portrait Before/After Canvas -->
    <rect x="20" y="60" width="220" height="235" rx="10" fill="#334155"/>
    <circle cx="130" cy="140" r="55" fill="#FCA5A5" opacity="0.8"/>
    <path d="M 80 250 C 90 200 170 200 180 250 Z" fill="#64748B"/>
    <!-- Before/After Slider bar -->
    <line x1="130" y1="60" x2="130" y2="295" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4"/>
    <circle cx="130" cy="175" r="14" fill="#0284C7" stroke="#FFFFFF" stroke-width="2"/>
    <text x="40" y="80" font-family="sans-serif" font-size="11" font-weight="800" fill="#94A3B8">ORIGINAL</text>
    <text x="150" y="80" font-family="sans-serif" font-size="11" font-weight="800" fill="#38BDF8">AI RETOUCHED</text>

    <!-- Right Controls Panel -->
    <rect x="255" y="60" width="125" height="235" rx="8" fill="#0F172A"/>
    <text x="265" y="82" font-family="sans-serif" font-size="12" font-weight="800" fill="#38BDF8">AI PLUGINS</text>
    
    <rect x="265" y="95" width="105" height="28" rx="6" fill="#0284C7"/>
    <text x="272" y="113" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">✓ Heal &amp; Skin</text>

    <rect x="265" y="130" width="105" height="28" rx="6" fill="#1E293B"/>
    <text x="272" y="148" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">✓ Dodge &amp; Burn</text>

    <rect x="265" y="165" width="105" height="28" rx="6" fill="#1E293B"/>
    <text x="272" y="183" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">✓ Eye Vessels</text>

    <rect x="265" y="200" width="105" height="28" rx="6" fill="#1E293B"/>
    <text x="272" y="218" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">✓ Teeth Whiten</text>

    <rect x="265" y="245" width="105" height="32" rx="8" fill="#10B981"/>
    <text x="317" y="266" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">BATCH PROCESS</text>
  </g>
</svg>
