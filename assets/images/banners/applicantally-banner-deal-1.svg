<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" rx="20" fill="url(#bg1)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 90 H900 M0 180 H900 M0 270 H900 M0 360 H900" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <path d="M180 0 V450 M360 0 V450 M540 0 V450 M720 0 V450" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Official Brand Header Badge -->
  <g transform="translate(50, 45)">
    <rect width="210" height="34" rx="17" fill="#2563EB" opacity="0.25" stroke="#3B82F6" stroke-width="1"/>
    <circle cx="22" cy="17" r="6" fill="#10B981"/>
    <text x="36" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#60A5FA" letter-spacing="1">OFFICIAL APPLICANTALLY DEAL</text>

    <!-- Main Headline -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF">Extra 30 Minutes</text>
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#38BDF8">On Any Time Pack Order</text>

    <!-- Description -->
    <text x="0" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94A3B8">Redeem promo code <tspan font-weight="800" fill="#F59E0B">ASTART30</tspan> during ApplicantAlly checkout.</text>
    <text x="0" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94A3B8">Applies to 1-Hour, 3-Hour, 6-Hour &amp; 9-Hour time packs.</text>

    <!-- Coupon Box -->
    <g transform="translate(0, 225)">
      <rect width="280" height="60" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing="1">VERIFIED COUPON CODE</text>
      <text x="20" y="48" font-family="monospace" font-weight="900" font-size="22" fill="#F59E0B" letter-spacing="2">ASTART30</text>
      <rect x="180" y="12" width="85" height="36" rx="8" fill="url(#amberGrad)"/>
      <text x="222" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#0F172A">APPLY</text>
    </g>

    <!-- Features Pill List -->
    <g transform="translate(0, 308)">
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" font-weight="600">✓ Unused minutes never expire</text>
      <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" font-weight="600">✓ Works on Zoom, Teams &amp; Google Meet</text>
    </g>
  </g>

  <!-- Right Visual: Simulated Live Video Call + Stealth Overlay -->
  <g transform="translate(480, 50)">
    <!-- Container Frame -->
    <rect width="370" height="350" rx="16" fill="#020617" stroke="#334155" stroke-width="2"/>
    
    <!-- Titlebar -->
    <rect width="370" height="36" rx="16" fill="#0F172A"/>
    <circle cx="20" cy="18" r="5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="5" fill="#10B981"/>
    <text x="185" y="22" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Zoom Live Call - Senior Software Engineer Interview</text>

    <!-- Video Stream Area -->
    <rect x="16" y="48" width="338" height="175" rx="10" fill="#1E293B"/>
    <!-- Interviewer Avatar -->
    <circle cx="185" cy="115" r="32" fill="#334155"/>
    <path d="M 150 155 C 150 138 168 132 185 132 C 202 132 220 138 220 155 Z" fill="#334155"/>
    <rect x="26" y="58" width="115" height="22" rx="6" fill="#0F172A" opacity="0.85"/>
    <text x="32" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#10B981">● Interviewer (Speaking)</text>

    <!-- ApplicantAlly Stealth Floating Overlay Window -->
    <rect x="24" y="232" width="322" height="102" rx="12" fill="#0F172A" fill-opacity="0.95" stroke="#2563EB" stroke-width="2"/>
    
    <!-- Overlay Header -->
    <rect x="24" y="232" width="322" height="28" rx="12" fill="#1D4ED8"/>
    <text x="36" y="250" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">ApplicantAlly Copilot • Quick Answer (~1s)</text>
    <rect x="265" y="237" width="70" height="18" rx="9" fill="#10B981"/>
    <text x="300" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" fill="#0F172A">STEALTH</text>

    <!-- Stealth Overlay Bullets -->
    <text x="36" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#F8FAFC" font-weight="600">• Situation: Scaled microservices to 50k QPS at FinTech Corp.</text>
    <text x="36" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#F8FAFC" font-weight="600">• Key Impact: Reduced p99 API latency by 35% using Redis caching.</text>
    <text x="36" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#38BDF8" font-weight="700">Hotkeys: [Alt+Q] Quick Answer • [Alt+F] STAR Breakdown</text>
  </g>
</svg>