<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="900" height="450" rx="20" fill="url(#bg3)"/>

  <!-- Left Content -->
  <g transform="translate(50, 50)">
    <rect width="210" height="34" rx="17" fill="#818CF8" opacity="0.25"/>
    <text x="18" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#C7D2FE" letter-spacing="1">DESKTOP STEALTH AI</text>

    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF">Screen Analysis &amp;</text>
    <text x="0" y="135" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#818CF8">Global Hotkey Control</text>

    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#C7D2FE">• Instant Quick Answers (~1 second response time)</text>
    <text x="0" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#C7D2FE">• Full STAR behavioral breakdowns &amp; project metrics</text>
    <text x="0" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#C7D2FE">• Real-time analysis of code snippets, diagrams &amp; slides</text>

    <g transform="translate(0, 265)">
      <rect width="260" height="52" rx="12" fill="#4F46E5"/>
      <text x="35" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">GET APPLICANTALLY DEAL →</text>
    </g>
  </g>

  <!-- Right Visual: Hotkey Shortcuts Box -->
  <g transform="translate(480, 45)">
