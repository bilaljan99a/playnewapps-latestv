    <text x="24" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#A5B4FC">Global Hotkey Shortcuts</text>
    
    <g transform="translate(24, 60)">
      <g transform="translate(0, 0)">
        <rect width="322" height="58" rx="10" fill="#1E293B"/>
        <rect x="12" y="12" width="90" height="34" rx="8" fill="#312E81" stroke="#6366F1" stroke-width="1"/>
        <text x="57" y="33" text-anchor="middle" font-family="monospace" font-weight="900" font-size="13" fill="#818CF8">Alt + Q</text>
        <text x="118" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Quick Answer (~1s)</text>
        <text x="118" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Sub-second bullet highlights</text>
      </g>

      <g transform="translate(0, 68)">
        <rect width="322" height="58" rx="10" fill="#1E293B"/>
        <rect x="12" y="12" width="90" height="34" rx="8" fill="#312E81" stroke="#6366F1" stroke-width="1"/>
        <text x="57" y="33" text-anchor="middle" font-family="monospace" font-weight="900" font-size="13" fill="#818CF8">Alt + F</text>
        <text x="118" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Full Answer (STAR)</text>
        <text x="118" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Comprehensive behavioral story</text>
      </g>

      <g transform="translate(0, 136)">
        <rect width="322" height="58" rx="10" fill="#1E293B"/>
        <rect x="12" y="12" width="90" height="34" rx="8" fill="#312E81" stroke="#6366F1" stroke-width="1"/>
        <text x="57" y="33" text-anchor="middle" font-family="monospace" font-weight="900" font-size="13" fill="#818CF8">Alt + S</text>
        <text x="118" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Screen Analysis</text>
        <text x="118" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Capture code snippet / chart</text>
      </g>

      <g transform="translate(0, 204)">
        <rect width="322" height="58" rx="10" fill="#1E293B"/>
        <rect x="12" y="12" width="90" height="34" rx="8" fill="#312E81" stroke="#6366F1" stroke-width="1"/>
        <text x="57" y="33" text-anchor="middle" font-family="monospace" font-weight="900" font-size="13" fill="#818CF8">Alt + H</text>
        <text x="118" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">Toggle Stealth Overlay</text>
        <text x="118" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Hide or reveal floating window</text>
      </g>
