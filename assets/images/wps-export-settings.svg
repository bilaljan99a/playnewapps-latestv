<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Title Bar -->
  <rect x="0" y="0" width="1280" height="50" fill="#1e293b"/>
  <text x="24" y="31" font-size="16" font-weight="800" fill="#ffffff">⚙️ WPS Office Export &amp; Format Conversion Dialog</text>
  <text x="420" y="31" font-size="13" fill="#94a3b8">Batch Export, High Resolution Rendering &amp; Security Settings</text>

  <!-- Export Dialog Modal Center Box -->
  <g transform="translate(240, 90)">
    <rect width="800" height="540" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Modal Header -->
    <rect width="800" height="60" rx="14" fill="#334155"/>
    <text x="24" y="36" font-size="18" font-weight="900" fill="#ffffff">Export Document &amp; Format Settings</text>

    <!-- Format Selector Radio Options -->
    <g transform="translate(30, 80)">
      <text x="0" y="20" font-size="15" font-weight="800" fill="#ffffff">Select Target Export Format:</text>
      
      <g transform="translate(0, 35)">
        <rect width="170" height="44" rx="8" fill="#2563eb"/>
        <text x="85" y="27" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">📄 PDF (.pdf)</text>

        <rect x="185" width="170" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
        <text x="270" y="27" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">📝 Word (.docx)</text>

        <rect x="370" width="170" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
        <text x="455" y="27" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">📊 Excel (.xlsx)</text>

        <rect x="555" width="170" height="44" rx="8" fill="#0f172a" stroke="#475569"/>
        <text x="640" y="27" font-size="13" font-weight="700" fill="#cbd5e1" text-anchor="middle">🖼️ Image (.png)</text>
      </g>
    </g>

    <!-- Quality &amp; Image Resolution Settings -->
    <g transform="translate(30, 180)">
      <text x="0" y="20" font-size="15" font-weight="800" fill="#ffffff">Export Quality &amp; Compression:</text>
      
      <g transform="translate(0, 35)">
        <rect width="740" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="30" font-size="13" fill="#cbd5e1">✓ High Resolution Print Quality (300 DPI - Vector Fonts Retained)</text>
        <text x="20" y="60" font-size="13" fill="#cbd5e1">✓ Embed All Custom Fonts &amp; Glyphs for Universal Compatibility</text>
        <text x="20" y="85" font-size="13" fill="#22c55e">✓ Preserve Hyperlinks, Bookmarks &amp; Table of Contents</text>
      </g>
    </g>

    <!-- Security &amp; Password Encryption -->
    <g transform="translate(30, 320)">
      <text x="0" y="20" font-size="15" font-weight="800" fill="#ffffff">Document Security &amp; Permissions:</text>
      
      <g transform="translate(0, 35)">
        <rect width="740" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="20" y="30" font-size="13" fill="#cbd5e1">🔒 Require Open Password: [ ************ ]</text>
        <text x="20" y="60" font-size="13" fill="#cbd5e1">🛡️ Restrict Printing &amp; Copying: AES 256-Bit Standard Encryption</text>
      </g>
    </g>

    <!-- Modal Action Buttons -->
    <g transform="translate(30, 460)">
      <rect x="420" width="150" height="44" rx="8" fill="#334155"/>
      <text x="495" y="27" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Cancel</text>

      <rect x="580" width="190" height="44" rx="8" fill="#2563eb"/>
      <text x="675" y="27" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">🚀 Export Document</text>
    </g>
  </g>

  <!-- Status Bar -->
  <rect x="0" y="690" width="1280" height="30" fill="#1e293b"/>
  <text x="20" y="710" font-size="12" fill="#94a3b8">Target Location: /Users/PlayNewApps/Documents/Exports/ | Estimated File Size: 1.4 MB | Fast Batch Processing: Ready</text>
</svg>
