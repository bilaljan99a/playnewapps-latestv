  <text x="500" y="458" font-family="'Roboto', sans-serif" font-size="28" text-anchor="middle">🚗</text>
  <text x="470" y="515" font-family="'Roboto', sans-serif" font-size="22" font-weight="800" fill="#0F172A">Monthly Parking</text>
  <text x="470" y="545" font-family="'Roboto', sans-serif" font-size="15" fill="#64748B">Secure long-term monthly garage passes in NYC, SF, Chicago, LA &amp; major US downtowns.</text>
  <text x="470" y="640" font-family="'Roboto', sans-serif" font-size="16" font-weight="800" fill="#2563EB">Save Up to 30% OFF →</text>

  <rect x="860" y="400" width="380" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="880" y="420" width="60" height="60" rx="12" fill="rgba(16,185,129,0.1)"/>
  <text x="910" y="458" font-family="'Roboto', sans-serif" font-size="28" text-anchor="middle">🛡️</text>
  <text x="880" y="515" font-family="'Roboto', sans-serif" font-size="22" font-weight="800" fill="#0F172A">Auto Insurance &amp; Wash</text>
  <text x="880" y="545" font-family="'Roboto', sans-serif" font-size="15" fill="#64748B">Compare quotes from top insurance providers and book discounted unlimited car washes.</text>
  <text x="880" y="640" font-family="'Roboto', sans-serif" font-size="16" font-weight="800" fill="#10B981">Compare &amp; Save $100s →</text>
