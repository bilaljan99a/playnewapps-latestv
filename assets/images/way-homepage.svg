  <text x="610" y="48" font-family="'Roboto', sans-serif" font-size="16" font-weight="500" fill="#64748B">Auto Insurance</text>
  <text x="750" y="48" font-family="'Roboto', sans-serif" font-size="16" font-weight="500" fill="#64748B">Car Wash</text>
  <text x="860" y="48" font-family="'Roboto', sans-serif" font-size="16" font-weight="500" fill="#64748B">Roadside</text>

