    <path d="M 25 5 C 15 5 5 15 5 26 C 5 40 25 60 25 60 C 25 60 45 40 45 26 C 45 15 35 5 25 5 Z" fill="none" stroke="#FF004B" stroke-width="4"/>
    <circle cx="25" cy="20" r="2.5" fill="#FF004B"/>
    <path d="M 17 31 Q 25 38 33 31" fill="none" stroke="#FF004B" stroke-width="3" stroke-linecap="round"/>
    <text x="55" y="44" font-family="'Roboto', sans-serif" font-size="38" font-weight="900" fill="#FF004B">way</text>
  </g>
