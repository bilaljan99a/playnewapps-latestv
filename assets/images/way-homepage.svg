  <text x="60" y="515" font-family="'Roboto', sans-serif" font-size="22" font-weight="800" fill="#0F172A">Airport Parking</text>
  <text x="60" y="545" font-family="'Roboto', sans-serif" font-size="15" fill="#64748B">Reserve guaranteed parking near JFK, LAX, ORD, MIA &amp; 100+ airports with free shuttles.</text>
