<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Title Bar -->
  <rect x="0" y="0" width="1280" height="50" fill="#1e293b"/>
  <circle cx="30" cy="25" r="14" fill="#0284c7"/>
  <text x="30" y="30" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">☁️</text>
  <text x="56" y="30" font-size="15" font-weight="800" fill="#ffffff">WPS Cloud Drive &amp; Multi-User Collaboration</text>
  <text x="370" y="30" font-size="13" fill="#38bdf8">End-to-End Encrypted Sync Across Windows, Mac, iOS &amp; Android</text>

  <!-- Left Cloud Storage Metrics Sidebar -->
  <rect x="0" y="50" width="280" height="640" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <g transform="translate(24, 80)">
    <text x="0" y="20" font-size="16" font-weight="800" fill="#ffffff">Cloud Storage Quota</text>
    
    <rect y="35" width="232" height="14" rx="7" fill="#0f172a"/>
    <rect y="35" width="90" height="14" rx="7" fill="#0284c7"/>
    <text x="0" y="70" font-size="13" font-weight="700" fill="#38bdf8">7.8 GB used of 20 GB Pro Storage</text>

    <!-- Synced Devices List -->
    <g transform="translate(0, 110)">
      <text x="0" y="20" font-size="15" font-weight="800" fill="#ffffff">Connected Devices</text>
      
      <text x="0" y="50" font-size="13" fill="#cbd5e1">💻 Windows Workstation (Active Now)</text>
      <text x="0" y="80" font-size="13" fill="#cbd5e1">🍏 MacBook Air M2 (Synced 5m ago)</text>
      <text x="0" y="110" font-size="13" fill="#cbd5e1">📱 iPhone 15 Pro (Synced 12m ago)</text>
      <text x="0" y="140" font-size="13" fill="#cbd5e1">🤖 Android Tablet (Synced 1h ago)</text>
    </g>
  </g>

  <!-- Main Cloud Files &amp; Active Editors Area -->
  <g transform="translate(300, 70)">
    <!-- Active Collaboration Banner -->
    <rect width="950" height="100" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="24" y="36" font-size="18" font-weight="800" fill="#ffffff">👥 Live Co-Editing Session: Marketing_Campaign_2026</text>
    <text x="24" y="65" font-size="13" fill="#e0f2fe">4 team members currently editing together in real-time with zero latency conflict.</text>

    <!-- User Avatars -->
    <g transform="translate(720, 28)">
      <circle cx="20" cy="20" r="18" fill="#ec4899"/>
      <text x="20" y="25" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">SJ</text>
      <circle cx="50" cy="20" r="18" fill="#10b981"/>
      <text x="50" y="25" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">MK</text>
      <circle cx="80" cy="20" r="18" fill="#f59e0b"/>
      <text x="80" y="25" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">AL</text>
      <circle cx="110" cy="20" r="18" fill="#a855f7"/>
      <text x="110" y="25" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">+12</text>
    </g>

    <!-- File Cards Grid -->
    <g transform="translate(0, 130)">
      <text x="0" y="20" font-size="16" font-weight="800" fill="#ffffff">Shared Folders &amp; Team Workspaces</text>

      <g transform="translate(0, 35)">
        <!-- Folder 1 -->
        <g transform="translate(0, 0)">
          <rect width="280" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
          <text x="20" y="35" font-size="24">📁</text>
          <text x="55" y="35" font-size="16" font-weight="800" fill="#ffffff">Q3_Financial_Audits</text>
          <text x="20" y="70" font-size="13" fill="#94a3b8">12 files | 340 MB</text>
          <text x="20" y="110" font-size="12" fill="#22c55e">🔒 Restricted Permission</text>
        </g>

        <!-- Folder 2 -->
        <g transform="translate(305, 0)">
          <rect width="280" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
          <text x="20" y="35" font-size="24">📁</text>
          <text x="55" y="35" font-size="16" font-weight="800" fill="#ffffff">Brand_Asset_Templates</text>
          <text x="20" y="70" font-size="13" fill="#94a3b8">48 files | 1.2 GB</text>
          <text x="20" y="110" font-size="12" fill="#38bdf8">🌐 Organization Public</text>
        </g>

        <!-- Folder 3 -->
        <g transform="translate(610, 0)">
          <rect width="280" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
          <text x="20" y="35" font-size="24">📁</text>
          <text x="55" y="35" font-size="16" font-weight="800" fill="#ffffff">Executive_PDF_Archives</text>
          <text x="20" y="70" font-size="13" fill="#94a3b8">105 files | 4.8 GB</text>
          <text x="20" y="110" font-size="12" fill="#f59e0b">🔑 Password Encrypted</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Status Bar -->
  <rect x="0" y="690" width="1280" height="30" fill="#1e293b"/>
  <text x="20" y="710" font-size="12" fill="#94a3b8">Cloud Sync Status: All Files Up To Date | AES-256 Cloud Encryption | Data Center Region: US-East (Virginia)</text>
</svg>
