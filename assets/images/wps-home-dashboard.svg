<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="wpsRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Window Header / Title Bar -->
  <rect x="0" y="0" width="1280" height="60" fill="#1e293b"/>
  <line x1="0" y1="60" x2="1280" y2="60" stroke="#334155" stroke-width="1"/>

  <!-- Logo &amp; Title -->
  <g transform="translate(24, 14)">
    <rect width="32" height="32" rx="8" fill="url(#wpsRed)"/>
    <text x="16" y="22" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
    <text x="44" y="21" font-size="18" font-weight="800" fill="#ffffff">WPS Office 2026</text>
    <text x="180" y="21" font-size="13" fill="#94a3b8">| Official Home Dashboard &amp; Application Launcher</text>
  </g>

  <!-- Global Search Bar -->
  <g transform="translate(500, 12)">
    <rect width="400" height="36" rx="18" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="20" y="23" font-size="13" fill="#64748b">🔍 Search templates, cloud documents, or ask WPS AI...</text>
  </g>

  <!-- User Profile / Cloud Sync -->
  <g transform="translate(1080, 14)">
    <rect width="170" height="32" rx="16" fill="#334155"/>
    <circle cx="18" cy="16" r="10" fill="#22c55e"/>
    <text x="34" y="20" font-size="12" font-weight="700" fill="#ffffff">Cloud Sync: 20GB</text>
  </g>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="60" width="220" height="660" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <g transform="translate(16, 80)">
    <!-- Create New Button -->
    <rect width="188" height="44" rx="22" fill="url(#wpsRed)"/>
    <text x="94" y="27" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">+ Create New Document</text>

    <!-- Nav Items -->
    <g transform="translate(0, 70)">
      <rect width="188" height="36" rx="8" fill="rgba(239, 68, 68, 0.15)"/>
      <text x="16" y="23" font-size="14" font-weight="700" fill="#f87171">🏠 Home Hub</text>
    </g>
    <g transform="translate(0, 115)">
      <text x="16" y="23" font-size="14" font-weight="600" fill="#cbd5e1">📝 Writer (Docs)</text>
    </g>
    <g transform="translate(0, 155)">
      <text x="16" y="23" font-size="14" font-weight="600" fill="#cbd5e1">📊 Spreadsheet (XLS)</text>
    </g>
    <g transform="translate(0, 195)">
      <text x="16" y="23" font-size="14" font-weight="600" fill="#cbd5e1">🖼️ Presentation (PPT)</text>
    </g>
    <g transform="translate(0, 235)">
      <text x="16" y="23" font-size="14" font-weight="600" fill="#cbd5e1">📄 PDF Editor Tools</text>
    </g>
    <g transform="translate(0, 275)">
      <text x="16" y="23" font-size="14" font-weight="600" fill="#a78bfa">✨ WPS AI Assistant</text>
    </g>
    <g transform="translate(0, 315)">
      <text x="16" y="23" font-size="14" font-weight="600" fill="#cbd5e1">☁️ Cloud Drive</text>
    </g>
    <g transform="translate(0, 355)">
      <text x="16" y="23" font-size="14" font-weight="600" fill="#cbd5e1">🎨 Template Store</text>
    </g>
    <g transform="translate(0, 395)">
      <text x="16" y="23" font-size="14" font-weight="600" fill="#cbd5e1">⚙️ Settings</text>
    </g>
  </g>

  <!-- Main Workspace Area -->
  <g transform="translate(240, 80)">
    
    <!-- Module Quick Creation Row -->
    <text x="0" y="20" font-size="16" font-weight="800" fill="#ffffff">Start New Document</text>
    
    <g transform="translate(0, 35)">
      <!-- Writer Card -->
      <g transform="translate(0, 0)">
        <rect width="230" height="110" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
        <rect x="16" y="16" width="36" height="36" rx="8" fill="#2563eb"/>
        <text x="34" y="40" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
        <text x="64" y="32" font-size="16" font-weight="800" fill="#ffffff">WPS Writer</text>
        <text x="64" y="48" font-size="12" fill="#93c5fd">Word (.docx) Compatible</text>
        <text x="16" y="85" font-size="12" fill="#cbd5e1">Blank doc, resume, report...</text>
      </g>

      <!-- Spreadsheet Card -->
      <g transform="translate(250, 0)">
        <rect width="230" height="110" rx="12" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5"/>
        <rect x="16" y="16" width="36" height="36" rx="8" fill="#16a34a"/>
        <text x="34" y="40" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
        <text x="64" y="32" font-size="16" font-weight="800" fill="#ffffff">Spreadsheet</text>
        <text x="64" y="48" font-size="12" fill="#86efac">Excel (.xlsx) Compatible</text>
        <text x="16" y="85" font-size="12" fill="#cbd5e1">Budget, analysis, pivot...</text>
      </g>

      <!-- Presentation Card -->
      <g transform="translate(500, 0)">
        <rect width="230" height="110" rx="12" fill="url(#cardGrad)" stroke="#ea580c" stroke-width="1.5"/>
        <rect x="16" y="16" width="36" height="36" rx="8" fill="#ea580c"/>
        <text x="34" y="40" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
        <text x="64" y="32" font-size="16" font-weight="800" fill="#ffffff">Presentation</text>
        <text x="64" y="48" font-size="12" fill="#fdba74">PPT (.pptx) Compatible</text>
        <text x="16" y="85" font-size="12" fill="#cbd5e1">Pitch decks, slides...</text>
      </g>

      <!-- PDF Tools Card -->
      <g transform="translate(750, 0)">
        <rect width="250" height="110" rx="12" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.5"/>
        <rect x="16" y="16" width="36" height="36" rx="8" fill="#dc2626"/>
        <text x="34" y="40" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">PDF</text>
        <text x="64" y="32" font-size="16" font-weight="800" fill="#ffffff">PDF Suite</text>
        <text x="64" y="48" font-size="12" fill="#fca5a5">Edit, Convert, OCR &amp; Sign</text>
        <text x="16" y="85" font-size="12" fill="#cbd5e1">Convert PDF to Word/XLS...</text>
      </g>
    </g>

    <!-- WPS AI Featured Banner -->
    <g transform="translate(0, 170)">
      <rect width="1000" height="90" rx="14" fill="url(#aiGlow)"/>
      <text x="24" y="36" font-size="20" font-weight="900" fill="#ffffff">✨ WPS AI Assistant 2026: Elevate Your Productivity</text>
      <text x="24" y="62" font-size="14" fill="#f3e8ff">Instant document summarization, generative drafting, smart spreadsheet analysis, and automated slide creation.</text>
      <rect x="800" y="24" width="170" height="42" rx="21" fill="#ffffff"/>
      <text x="885" y="50" font-size="14" font-weight="800" fill="#7c3aed" text-anchor="middle">Try WPS AI Now ➔</text>
    </g>

    <!-- Recent Documents Table -->
    <g transform="translate(0, 290)">
      <text x="0" y="20" font-size="16" font-weight="800" fill="#ffffff">Recent Cloud Documents</text>

      <rect x="0" y="35" width="1000" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect x="0" y="35" width="1000" height="40" fill="#334155"/>
      <text x="24" y="60" font-size="12" font-weight="700" fill="#94a3b8">DOCUMENT NAME</text>
      <text x="450" y="60" font-size="12" font-weight="700" fill="#94a3b8">TYPE</text>
      <text x="600" y="60" font-size="12" font-weight="700" fill="#94a3b8">LAST MODIFIED</text>
      <text x="800" y="60" font-size="12" font-weight="700" fill="#94a3b8">LOCATION</text>

      <!-- Row 1 -->
      <line x1="0" y1="120" x2="1000" y2="120" stroke="#334155" stroke-width="1"/>
      <text x="24" y="105" font-size="14" font-weight="700" fill="#ffffff">📄 2026_Q3_Enterprise_Strategy.docx</text>
      <text x="450" y="105" font-size="13" fill="#60a5fa">Writer Doc</text>
      <text x="600" y="105" font-size="13" fill="#cbd5e1">2 mins ago</text>
      <text x="800" y="105" font-size="13" fill="#22c55e">☁️ WPS Cloud Drive</text>

      <!-- Row 2 -->
      <line x1="0" y1="165" x2="1000" y2="165" stroke="#334155" stroke-width="1"/>
      <text x="24" y="150" font-size="14" font-weight="700" fill="#ffffff">📊 Annual_Financial_Budget_Forecast.xlsx</text>
      <text x="450" y="150" font-size="13" fill="#4ade80">Spreadsheet</text>
      <text x="600" y="150" font-size="13" fill="#cbd5e1">1 hour ago</text>
      <text x="800" y="150" font-size="13" fill="#22c55e">☁️ WPS Cloud Drive</text>

      <!-- Row 3 -->
      <line x1="0" y1="210" x2="1000" y2="210" stroke="#334155" stroke-width="1"/>
      <text x="24" y="195" font-size="14" font-weight="700" fill="#ffffff">🖼️ Investor_PitchDeck_SeriesB.pptx</text>
      <text x="450" y="195" font-size="13" fill="#fb923c">Presentation</text>
      <text x="600" y="195" font-size="13" fill="#cbd5e1">Yesterday</text>
      <text x="800" y="195" font-size="13" fill="#22c55e">☁️ WPS Cloud Drive</text>

      <!-- Row 4 -->
      <text x="24" y="240" font-size="14" font-weight="700" fill="#ffffff">📕 Product_Architecture_Specification.pdf</text>
      <text x="450" y="240" font-size="13" fill="#f87171">PDF Document</text>
      <text x="600" y="240" font-size="13" fill="#cbd5e1">Aug 02, 2026</text>
      <text x="800" y="240" font-size="13" fill="#94a3b8">📁 Local PC Storage</text>
    </g>

  </g>
</svg>
