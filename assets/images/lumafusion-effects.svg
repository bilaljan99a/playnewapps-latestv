    <rect x="480" y="605" width="340" height="8" rx="4" fill="#0d1117"/>
    <rect x="480" y="605" width="240" height="8" rx="4" fill="#3fb950"/>

    <text x="860" y="595" fill="#8b949e" font-size="12">Spill Suppression</text>
