          <text x="12" y="114" fill="#8b949e" font-size="10">Stylize</text>
        </g>
      
        <g transform="translate(219, 245)">
          <rect width="180" height="125" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
          <rect x="8" y="8" width="164" height="70" rx="4" fill="#21262d"/>
          <text x="90" y="48" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">FX PREVIEW</text>
          <text x="12" y="98" fill="#f0f6fc" font-size="12" font-weight="600">LUT Color Preset</text>
          <text x="12" y="114" fill="#8b949e" font-size="10">Color</text>
