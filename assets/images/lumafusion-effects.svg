    <path d="M 706 480 Q 856 360, 1006 480 Z" fill="#f0f6fc"/>
    <text x="856" y="500" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Subject Cutout Mask (Green Spills Removed)</text>

    <!-- FX Parameter Sliders -->
    <rect x="464" y="540" width="784" height="150" rx="6" fill="#161b22" stroke="#30363d"/>
