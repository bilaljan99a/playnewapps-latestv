        </g>
      

    <!-- Right Live FX Adjust Monitor -->
    <rect x="444" y="60" width="824" height="648" rx="8" fill="#010409" stroke="#30363d"/>
    <text x="464" y="88" fill="#8b949e" font-size="13" font-weight="700">CHROMA KEY GREEN SCREEN ISOLATION PREVIEW</text>

    <!-- Green Screen Studio Background -->
