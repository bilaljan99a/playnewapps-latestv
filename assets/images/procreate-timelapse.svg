<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0c10;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <rect width="1280" height="720" fill="#0a0d14"/>
  <g transform="translate(100, 40)">
    <rect width="1080" height="640" rx="16" fill="#131822" stroke="#222c3d" stroke-width="2"/>

    <!-- Canvas Preview with Onion Skins -->
    <g transform="translate(40, 30)">
      <rect width="1000" height="450" rx="12" fill="#1a202c"/>
      <!-- Previous frame (onion skin) -->
      <path d="M 250 320 C 350 120, 500 400, 650 180" fill="none" stroke="#ff007f" stroke-width="16" opacity="0.3" stroke-dasharray="8 8"/>
      <!-- Current frame -->
      <path d="M 270 300 C 370 100, 520 380, 670 160" fill="none" stroke="#ff007f" stroke-width="20" stroke-linecap="round"/>
      <circle cx="670" cy="160" r="14" fill="#00dfd8"/>

      <!-- 4K Replay Badge -->
      <rect x="20" y="20" width="160" height="32" rx="6" fill="#ff007f"/>
      <text x="100" y="41" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4K Time-Lapse Replay</text>
    </g>

    <!-- Animation Assist Timeline Bottom -->
    <g transform="translate(40, 500)">
      <rect width="1000" height="110" rx="12" fill="#0e1219" stroke="#1e293b"/>
      <text x="20" y="28" fill="#ffffff" font-size="14" font-weight="bold">Animation Assist Timeline (24 FPS)</text>

      <!-- Frame Cards -->
      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="70" height="50" rx="6" fill="#1e293b"/>
        <text x="35" y="30" fill="#64748b" font-size="11" text-anchor="middle">Frame 1</text>

        <rect x="80" y="0" width="70" height="50" rx="6" fill="#1e293b"/>
        <text x="115" y="30" fill="#64748b" font-size="11" text-anchor="middle">Frame 2</text>

        <rect x="160" y="0" width="70" height="50" rx="6" fill="#ff007f" stroke="#ffffff" stroke-width="2"/>
        <text x="195" y="30" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Frame 3 ★</text>

        <rect x="240" y="0" width="70" height="50" rx="6" fill="#1e293b"/>
        <text x="275" y="30" fill="#64748b" font-size="11" text-anchor="middle">Frame 4</text>

        <rect x="320" y="0" width="70" height="50" rx="6" fill="#1e293b"/>
        <text x="355" y="30" fill="#64748b" font-size="11" text-anchor="middle">Frame 5</text>
      </g>

      <!-- Controls Right -->
      <g transform="translate(680, 42)">
        <rect x="0" y="0" width="90" height="50" rx="8" fill="#00dfd8"/>
        <text x="45" y="30" fill="#090d14" font-size="13" font-weight="bold" text-anchor="middle">▶ Play</text>
        <rect x="100" y="0" width="100" height="50" rx="8" fill="#1e293b"/>
        <text x="150" y="30" fill="#e2e8f0" font-size="12" text-anchor="middle">Add Frame</text>
        <rect x="210" y="0" width="80" height="50" rx="8" fill="#1e293b"/>
        <text x="250" y="30" fill="#e2e8f0" font-size="12" text-anchor="middle">Settings</text>
      </g>
    </g>
  </g>
</svg>