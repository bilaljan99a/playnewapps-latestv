<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title Header -->
  <path d="M 0 16 A 16 16 0 0 1 16 0 L 984 0 A 16 16 0 0 1 1000 16 L 1000 80 L 0 80 Z" fill="url(#headerGrad)"/>
  <text x="40" y="48" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">AliExpress Product Categories &amp; Direct Factory Sourcing</text>
  <text x="960" y="48" font-family="'Inter', Arial, sans-serif" font-size="14" font-weight="700" fill="#FF6A00" text-anchor="end">FACTORY-DIRECT CATALOG</text>

  <!-- Category Grid: 4 Product Cards -->
  
  <!-- Category 1: Consumer Electronics -->
  <g transform="translate(30, 110)" filter="url(#cardShadow)">
    <rect width="210" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="130" rx="10" fill="#FEF2F2"/>
    <text x="105" y="85" font-family="Arial, sans-serif" font-size="44" text-anchor="middle">🎧</text>
    <text x="20" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Consumer Electronics</text>
    <text x="20" y="195" font-family="Arial, sans-serif" font-size="12" fill="#64748B">TWS Earbuds, Smartwatches, Chargers &amp; Audio Gear</text>

    <line x1="20" y1="215" x2="190" y2="215" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="20" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#10B981">✓ Average Discount: 60-80%</text>
    <text x="20" y="265" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Bluetooth 5.3 Headphones</text>
    <text x="20" y="285" font-family="Arial, sans-serif" font-size="12" fill="#334155">• GaN Fast Power Adapters</text>
    <text x="20" y="305" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Smart Fitness Trackers</text>

    <rect x="20" y="322" width="170" height="18" rx="4" fill="#EFF6FF"/>
    <text x="105" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">Choice Express Delivery</text>
  </g>

  <!-- Category 2: Smart Home & Appliances -->
  <g transform="translate(270, 110)" filter="url(#cardShadow)">
    <rect width="210" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="130" rx="10" fill="#FFF7ED"/>
    <text x="105" y="85" font-family="Arial, sans-serif" font-size="44" text-anchor="middle">💡</text>
    <text x="20" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Smart Home &amp; Lighting</text>
    <text x="20" y="195" font-family="Arial, sans-serif" font-size="12" fill="#64748B">RGB LED Strips, Robot Vacuums, Smart Plugs</text>

    <line x1="20" y1="215" x2="190" y2="215" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="20" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#10B981">✓ Average Discount: 50-75%</text>
    <text x="20" y="265" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Tuya/Zigbee Sensors</text>
    <text x="20" y="285" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Smart Ambient Lamps</text>
    <text x="20" y="305" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Robotic Vacuum Parts</text>

    <rect x="20" y="322" width="170" height="18" rx="4" fill="#FEF3C7"/>
    <text x="105" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">Bundle Deals Eligible</text>
  </g>

  <!-- Category 3: Fashion & Apparel -->
  <g transform="translate(510, 110)" filter="url(#cardShadow)">
    <rect width="210" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="130" rx="10" fill="#F0FDF4"/>
    <text x="105" y="85" font-family="Arial, sans-serif" font-size="44" text-anchor="middle">👟</text>
    <text x="20" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Fashion &amp; Activewear</text>
    <text x="20" y="195" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Streetwear, Sneakers, Watches &amp; Jewelry</text>

    <line x1="20" y1="215" x2="190" y2="215" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="20" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#10B981">✓ Average Discount: 55-70%</text>
    <text x="20" y="265" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Casual Footwear</text>
    <text x="20" y="285" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Stainless Steel Watches</text>
    <text x="20" y="305" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Seasonal Apparel</text>

    <rect x="20" y="322" width="170" height="18" rx="4" fill="#DCFCE7"/>
    <text x="105" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Direct Factory Outlet</text>
