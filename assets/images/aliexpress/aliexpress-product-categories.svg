  <!-- Category 4: Tools & Outdoor Gear -->
  <g transform="translate(750, 110)" filter="url(#cardShadow)">
    <rect width="210" height="350" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="15" y="15" width="180" height="130" rx="10" fill="#FAF5FF"/>
    <text x="105" y="85" font-family="Arial, sans-serif" font-size="44" text-anchor="middle">🧰</text>
    <text x="20" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Tools &amp; Auto Accessories</text>
    <text x="20" y="195" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Precision Toolkits, OBD Scanners, Dashcams</text>

    <line x1="20" y1="215" x2="190" y2="215" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="20" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#10B981">✓ Average Discount: 65-85%</text>
    <text x="20" y="265" font-family="Arial, sans-serif" font-size="12" fill="#334155">• 128-in-1 Screwdriver Sets</text>
    <text x="20" y="285" font-family="Arial, sans-serif" font-size="12" fill="#334155">• 4K Car Dash Cameras</text>
    <text x="20" y="305" font-family="Arial, sans-serif" font-size="12" fill="#334155">• Solar Camping Lights</text>

    <rect x="20" y="322" width="170" height="18" rx="4" fill="#F3E8FF"/>
    <text x="105" y="335" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#7E22CE" text-anchor="middle">Top Brand Certified</text>
  </g>
</svg>
