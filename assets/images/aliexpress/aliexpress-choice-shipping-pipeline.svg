<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4747"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="440" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Banner -->
  <path d="M 0 16 A 16 16 0 0 1 16 0 L 984 0 A 16 16 0 0 1 1000 16 L 1000 70 L 0 70 Z" fill="url(#headerBg)"/>
  <text x="30" y="44" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">AliExpress Choice 12-Day Guaranteed Sourcing &amp; Delivery Workflow</text>
  <text x="970" y="44" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="end">EXPRESS LOGISTICS</text>

  <!-- Step 1 -->
  <g transform="translate(30, 100)" filter="url(#shadowBox)">
    <rect width="200" height="300" rx="12" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="1.5"/>
    <circle cx="100" cy="45" r="28" fill="#9333EA"/>
    <text x="100" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
    
    <text x="100" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#581C87" text-anchor="middle">Factory Direct</text>
    <text x="100" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7E22CE" text-anchor="middle">Order Sourcing</text>

    <text x="15" y="155" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Direct manufacturer item selection</text>
    <text x="15" y="185" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Automated supplier discount vouchers</text>
    <text x="15" y="215" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Real-time stock verification</text>

    <rect x="15" y="250" width="170" height="32" rx="6" fill="#F3E8FF"/>
    <text x="100" y="271" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6B21A8" text-anchor="middle">Wholesale Rates</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 240 250 L 260 250" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Step 2 -->
  <g transform="translate(270, 100)" filter="url(#shadowBox)">
    <rect width="200" height="300" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="100" cy="45" r="28" fill="#D97706"/>
    <text x="100" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
    
    <text x="100" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#78350F" text-anchor="middle">Choice Hub</text>
    <text x="100" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">Consolidation</text>

    <text x="15" y="155" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Quality control inspection</text>
    <text x="15" y="185" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Combined multi-item packaging</text>
    <text x="15" y="215" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Free shipping on $10+ orders</text>

    <rect x="15" y="250" width="170" height="32" rx="6" fill="#FEF3C7"/>
    <text x="100" y="271" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Zero Delivery Fee</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 480 250 L 500 250" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Step 3 -->
  <g transform="translate(510, 100)" filter="url(#shadowBox)">
    <rect width="200" height="300" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="100" cy="45" r="28" fill="#2563EB"/>
    <text x="100" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
    
    <text x="100" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#1E3A8A" text-anchor="middle">Priority Air Line</text>
    <text x="100" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="middle">Customs Clearance</text>

    <text x="15" y="155" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Dedicated international cargo</text>
    <text x="15" y="185" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Expedited local customs clearing</text>
    <text x="15" y="215" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• End-to-end GPS tracking code</text>

    <rect x="15" y="250" width="170" height="32" rx="6" fill="#DBEAFE"/>
    <text x="100" y="271" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1E40AF" text-anchor="middle">Global Air Transit</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 720 250 L 740 250" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Step 4 -->
  <g transform="translate(750, 100)" filter="url(#shadowBox)">
    <rect width="220" height="300" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <circle cx="110" cy="45" r="28" fill="#059669"/>
    <text x="110" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>
    
    <text x="110" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#064E3B" text-anchor="middle">Doorstep Delivery</text>
    <text x="110" y="120" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">&amp; Buyer Protection</text>

    <text x="15" y="155" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• 7 to 12 day guaranteed transit</text>
    <text x="15" y="185" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• $1.00 credit for late delivery</text>
    <text x="15" y="215" font-family="Arial, sans-serif" font-size="12" fill="#4B5563">• Free 90-day return policy</text>

    <rect x="15" y="250" width="190" height="32" rx="6" fill="#D1FAE5"/>
    <text x="110" y="271" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">Full Escrow Guarantee</text>
  </g>
</svg>
