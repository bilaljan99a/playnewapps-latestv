<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <rect width="1000" height="500" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="500" fill="#1E293B"/>
  <text x="30" y="45" fill="#6366F1" font-family="sans-serif" font-weight="900" font-size="20">FlowGPT AI</text>
  
  <g transform="translate(20, 80)" font-family="sans-serif" font-size="14">
    <rect x="0" y="0" width="180" height="36" rx="8" fill="#6366F1" opacity="0.2"/>
    <text x="35" y="23" fill="#818CF8" font-weight="700">🔥 Top Prompts</text>
    
    <text x="35" y="65" fill="#94A3B8">🤖 AI Characters</text>
    <text x="35" y="105" fill="#94A3B8">💻 Coding &amp; Dev</text>
    <text x="35" y="145" fill="#94A3B8">✍️ Content Writing</text>
    <text x="35" y="185" fill="#94A3B8">🎨 Midjourney Art</text>
    <text x="35" y="225" fill="#94A3B8">📈 Marketing &amp; SEO</text>
    <text x="35" y="265" fill="#94A3B8">🏆 Bounties &amp; Cash</text>
    <text x="35" y="305" fill="#94A3B8">🧪 Prompt Studio</text>
