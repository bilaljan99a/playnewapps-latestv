    <!-- Row of 3 Marketplace Cards -->
    <g transform="translate(0, 45)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="220" height="320" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="220" height="100" rx="12" fill="#312E81"/>
      <circle cx="110" cy="50" r="28" fill="#6366F1"/>
      <text x="110" y="56" text-anchor="middle" fill="#FFFFFF" font-size="24">⚡</text>
      <text x="16" y="130" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="15">DAN Unfiltered Agent</text>
      <text x="16" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12">Advanced problem solver &amp; deep analytical system prompt.</text>
      <text x="16" y="290" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="13">⭐ 4.9 (450k uses)</text>

      <!-- Card 2 -->
      <rect x="245" y="0" width="220" height="320" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="245" y="0" width="220" height="100" rx="12" fill="#831843"/>
      <circle cx="355" cy="50" r="28" fill="#EC4899"/>
      <text x="355" y="56" text-anchor="middle" fill="#FFFFFF" font-size="24">🎭</text>
      <text x="261" y="130" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="15">Psychology Mentor</text>
      <text x="261" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12">Empathetic listener &amp; cognitive behavioral thought partner.</text>
      <text x="261" y="290" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="13">⭐ 4.92 (310k uses)</text>

      <!-- Card 3 -->
      <rect x="490" y="0" width="220" height="320" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="490" y="0" width="220" height="100" rx="12" fill="#065F46"/>
      <circle cx="600" cy="50" r="28" fill="#10B981"/>
      <text x="600" y="56" text-anchor="middle" fill="#FFFFFF" font-size="24">🚀</text>
      <text x="506" y="130" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="15">SaaS Copy Generator</text>
      <text x="506" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12">Converts feature lists into high-converting landing page text.</text>
      <text x="506" y="290" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="13">⭐ 4.88 (180k uses)</text>
