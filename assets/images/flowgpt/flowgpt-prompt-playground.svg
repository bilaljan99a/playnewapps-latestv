<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <rect width="1000" height="500" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Left Side: Prompt Editor &amp; Dynamic Variables -->
  <g transform="translate(30, 30)">
    <rect width="450" height="440" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="35" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="16">⚙️ Prompt Variable Playground</text>
    <path d="M20 50 H430" stroke="#334155" stroke-width="1"/>
    
    <!-- System Prompt Code Field -->
    <rect x="20" y="70" width="410" height="150" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <text x="35" y="95" fill="#A78BFA" font-family="monospace" font-size="12">Act as a Senior Lead Developer. Review code for:</text>
    <text x="35" y="120" fill="#F8FAFC" font-family="monospace" font-size="12">Language: {{language}}</text>
    <text x="35" y="145" fill="#F8FAFC" font-family="monospace" font-size="12">Strictness Level: {{strictness_level}}</text>
    <text x="35" y="170" fill="#F8FAFC" font-family="monospace" font-size="12">Target Framework: {{framework}}</text>
    <text x="35" y="195" fill="#64748B" font-family="monospace" font-size="11">// Dynamic variables auto-rendered below</text>

    <!-- Variable Inputs -->
    <text x="20" y="245" fill="#CBD5E1" font-family="sans-serif" font-size="13" font-weight="700">Dynamic Variable Values:</text>
    
    <rect x="20" y="260" width="125" height="36" rx="6" fill="#0F172A" stroke="#6366F1" stroke-width="1"/>
    <text x="30" y="283" fill="#818CF8" font-family="sans-serif" font-size="12">TypeScript</text>

    <rect x="160" y="260" width="125" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="170" y="283" fill="#94A3B8" font-family="sans-serif" font-size="12">Enterprise High</text>

    <rect x="300" y="260" width="130" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="310" y="283" fill="#94A3B8" font-family="sans-serif" font-size="12">React 19 + Express</text>

    <!-- Action Buttons -->
    <rect x="20" y="380" width="410" height="42" rx="8" fill="url(#btnGrad)" stroke="#8B5CF6" stroke-width="1"/>
    <text x="225" y="406" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="14">▶ Run Model Test (ChatGPT 4o / Claude 3.5)</text>
  </g>

  <!-- Right Side: Real-time Model Execution &amp; Response Output -->
  <g transform="translate(510, 30)">
    <rect width="460" height="440" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="20" y="35" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="16">💬 Model Response Stream (Latency: 240ms)</text>
    <path d="M20 50 H440" stroke="#1E293B" stroke-width="1"/>

    <!-- Simulated Chat Bubble -->
    <rect x="20" y="70" width="420" height="330" rx="8" fill="#1E293B"/>
    <text x="40" y="100" fill="#38BDF8" font-family="sans-serif" font-weight="700" font-size="13">Claude 3.5 Sonnet Response:</text>
    
    <text x="40" y="130" fill="#F1F5F9" font-family="monospace" font-size="12">Here is the architectural review for your TypeScript module:</text>
    <text x="40" y="160" fill="#34D399" font-family="monospace" font-size="12">✔ Type safety: 100% strict null checks passed</text>
    <text x="40" y="185" fill="#34D399" font-family="monospace" font-size="12">✔ Memory overhead: Zero unhandled promises</text>
    <text x="40" y="210" fill="#FBBF24" font-family="monospace" font-size="12">⚠ Recommendation: Wrap async handlers in try/catch</text>

    <rect x="40" y="235" width="380" height="130" rx="6" fill="#0F172A"/>
    <text x="55" y="260" fill="#60A5FA" font-family="monospace" font-size="11">// Suggested Code Improvement:</text>
    <text x="55" y="280" fill="#E2E8F0" font-family="monospace" font-size="11">export async function handleRequest(req, res) {</text>
    <text x="55" y="300" fill="#E2E8F0" font-family="monospace" font-size="11">   const data = await processInput(req.body);</text>
    <text x="55" y="320" fill="#E2E8F0" font-family="monospace" font-size="11">   return res.json({ success: true, data });</text>
    <text x="55" y="340" fill="#E2E8F0" font-family="monospace" font-size="11">}</text>
  </g>

  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
</svg>
