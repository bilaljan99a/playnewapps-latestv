<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <rect width="1000" height="500" rx="16" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
  
  <text x="50" y="55" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="24">FlowGPT AI Characters &amp; Multi-Persona Chat Engine</text>
  <text x="50" y="85" fill="#94A3B8" font-family="sans-serif" font-size="14">Chat with custom AI companions, historical figures, coders, mentors, and anime roleplay bots.</text>

  <!-- 4 Character Showcase Cards -->
  <g transform="translate(50, 120)">
    <!-- Character 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="320" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
      <circle cx="100" cy="70" r="40" fill="#312E81"/>
      <text x="100" y="78" text-anchor="middle" fill="#818CF8" font-size="32">🧙‍♂️</text>
      <text x="100" y="135" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">Code Wizard Gandalf</text>
      <text x="100" y="155" text-anchor="middle" fill="#A78BFA" font-family="sans-serif" font-size="11">Tech Advisor &amp; Architect</text>
      <rect x="20" y="175" width="160" height="80" rx="8" fill="#0F172A"/>
      <text x="30" y="198" fill="#94A3B8" font-family="sans-serif" font-size="11">"A variable is never late,</text>
      <text x="30" y="215" fill="#94A3B8" font-family="sans-serif" font-size="11">nor early, it initializes</text>
      <text x="30" y="232" fill="#94A3B8" font-family="sans-serif" font-size="11">precisely when needed!"</text>
      <rect x="20" y="270" width="160" height="32" rx="16" fill="#6366F1"/>
      <text x="100" y="291" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12">Start Chat</text>
    </g>

    <!-- Character 2 -->
    <g transform="translate(230, 0)">
      <rect width="200" height="320" rx="16" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
      <circle cx="100" cy="70" r="40" fill="#831843"/>
      <text x="100" y="78" text-anchor="middle" fill="#F472B6" font-size="32">👩‍💼</text>
      <text x="100" y="135" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">CEO Pitch Coach</text>
      <text x="100" y="155" text-anchor="middle" fill="#F472B6" font-family="sans-serif" font-size="11">Startup YC Mentor</text>
      <rect x="20" y="175" width="160" height="80" rx="8" fill="#0F172A"/>
      <text x="30" y="198" fill="#94A3B8" font-family="sans-serif" font-size="11">"Refine your elevator</text>
      <text x="30" y="215" fill="#94A3B8" font-family="sans-serif" font-size="11">pitch. Show me your</text>
      <text x="30" y="232" fill="#94A3B8" font-family="sans-serif" font-size="11">unit economics now."</text>
      <rect x="20" y="270" width="160" height="32" rx="16" fill="#EC4899"/>
      <text x="100" y="291" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12">Start Chat</text>
    </g>

    <!-- Character 3 -->
    <g transform="translate(460, 0)">
      <rect width="200" height="320" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
      <circle cx="100" cy="70" r="40" fill="#065F46"/>
      <text x="100" y="78" text-anchor="middle" fill="#34D399" font-size="32">🔬</text>
      <text x="100" y="135" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">Dr. Quantum</text>
      <text x="100" y="155" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="11">Physics &amp; Math Tutor</text>
      <rect x="20" y="175" width="160" height="80" rx="8" fill="#0F172A"/>
      <text x="30" y="198" fill="#94A3B8" font-family="sans-serif" font-size="11">"Let us solve complex</text>
      <text x="30" y="215" fill="#94A3B8" font-family="sans-serif" font-size="11">calculus and quantum</text>
      <text x="30" y="232" fill="#94A3B8" font-family="sans-serif" font-size="11">mechanics together."</text>
      <rect x="20" y="270" width="160" height="32" rx="16" fill="#10B981"/>
      <text x="100" y="291" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12">Start Chat</text>
    </g>

    <!-- Character 4 -->
    <g transform="translate(690, 0)">
      <rect width="200" height="320" rx="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="100" cy="70" r="40" fill="#78350F"/>
      <text x="100" y="78" text-anchor="middle" fill="#FBBF24" font-size="32">🎨</text>
      <text x="100" y="135" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">Cyberpunk Artist</text>
      <text x="100" y="155" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="11">Midjourney V6 Specialist</text>
      <rect x="20" y="175" width="160" height="80" rx="8" fill="#0F172A"/>
      <text x="30" y="198" fill="#94A3B8" font-family="sans-serif" font-size="11">"Give me your scene</text>
      <text x="30" y="215" fill="#94A3B8" font-family="sans-serif" font-size="11">concept &amp; I will yield</text>
      <text x="30" y="232" fill="#94A3B8" font-family="sans-serif" font-size="11">hyper-realistic prompts."</text>
      <rect x="20" y="270" width="160" height="32" rx="16" fill="#F59E0B"/>
      <text x="100" y="291" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12">Start Chat</text>
