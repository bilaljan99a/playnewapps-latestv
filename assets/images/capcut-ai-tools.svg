    <linearGradient id="capClipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0061ff"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <linearGradient id="capAudioGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="capMeter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="70%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" fill="#0b0f19"/>

  <!-- Header -->
  <rect width="1280" height="48" fill="url(#capHeaderGrad)"/>
