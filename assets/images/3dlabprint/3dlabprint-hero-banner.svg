<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B2E" />
      <stop offset="50%" stop-color="#002B49" />
      <stop offset="100%" stop-color="#001424" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C3FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 195, 255, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)" />
  <rect width="1200" height="600" fill="url(#gridPattern)" />

  <!-- Decorative Blueprint Rings & Glows -->
  <circle cx="950" cy="300" r="240" fill="none" stroke="rgba(0, 195, 255, 0.15)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="950" cy="300" r="180" fill="none" stroke="rgba(0, 195, 255, 0.25)" stroke-width="1" />
  <circle cx="950" cy="300" r="100" fill="none" stroke="rgba(255, 107, 0, 0.2)" stroke-width="1" />

  <!-- Technical 3D Printing Layer Lines Overlay -->
  <g opacity="0.12">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00C3FF" stroke-width="1" />
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#00C3FF" stroke-width="1" />
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00C3FF" stroke-width="1" />
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#00C3FF" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00C3FF" stroke-width="1" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#00C3FF" stroke-width="1" />
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#00C3FF" stroke-width="1" />
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#00C3FF" stroke-width="1" />
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#00C3FF" stroke-width="1" />
  </g>

  <!-- Left Content Branding & Copy -->
  <g transform="translate(80, 100)">
    <!-- Verified Badge -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="rgba(0, 195, 255, 0.12)" stroke="rgba(0, 195, 255, 0.3)" stroke-width="1.5" />
    <circle cx="20" cy="18" r="8" fill="#00C3FF" />
    <path d="M 16 18 L 19 21 L 24 15" fill="none" stroke="#021B2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#00C3FF" letter-spacing="0.5">VERIFIED OFFICIAL 3DLABPRINT DEALS</text>

    <!-- Main Title -->
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1">
      3D-Printable Scale
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="url(#accentGrad)" letter-spacing="-1">
      RC Aircraft STL Models
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#94A3B8" max-width="500">
      Hawker Tempest Mk II • A-7 Corsair II EDF Jet • Me 163B Komet
    </text>
    <text x="0" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#64748B">
      Precision thin-wall STL plane files engineered for desktop FDM 3D printing
    </text>

    <!-- Stat Badges Row -->
    <g transform="translate(0, 290)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="160" height="80" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="20" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FF6B00">UP TO 31%</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94A3B8">VALUE PACK OFFERS</text>

      <!-- Box 2 -->
      <rect x="180" y="0" width="160" height="80" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="200" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#00C3FF">50% LIGHTER</text>
      <text x="200" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94A3B8">LW-PLA FOAMING STL</text>

      <!-- Box 3 -->
      <rect x="360" y="0" width="160" height="80" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="380" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#10B981">1,850+</text>
      <text x="380" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94A3B8">PILOT REVIEWS</text>
    </g>
  </g>

  <!-- Right Graphic - Aircraft Silhouette & 3D Print Blueprint -->
  <g transform="translate(680, 80)">
    <!-- Scale Warbird Plane Blueprint Graphic -->
    <g id="plane-blueprint">
      <!-- Fuselage Contour -->
      <path d="M 270,120 C 270,120 220,100 150,110 C 80,120 30,160 0,220 C 30,280 80,320 150,330 C 220,340 270,320 270,320 L 360,300 L 420,280 C 450,260 460,220 460,220 C 460,220 450,180 420,160 L 360,140 Z" fill="none" stroke="#00C3FF" stroke-width="3" />
      <!-- Wings Top and Bottom Wireframe -->
      <path d="M 180,115 L 120,-30 C 100,-40 60,-30 40,0 L 110,125 Z" fill="rgba(0, 195, 255, 0.15)" stroke="#00C3FF" stroke-width="2" />
      <path d="M 180,325 L 120,470 C 100,480 60,470 40,440 L 110,315 Z" fill="rgba(0, 195, 255, 0.15)" stroke="#00C3FF" stroke-width="2" />
      <!-- Tail Elevator Fin -->
      <path d="M 380,145 L 430,70 L 450,80 L 410,165 Z" fill="rgba(255, 107, 0, 0.2)" stroke="#FF6B00" stroke-width="2" />
      <path d="M 380,295 L 430,370 L 450,360 L 410,275 Z" fill="rgba(255, 107, 0, 0.2)" stroke="#FF6B00" stroke-width="2" />
      <!-- Propeller Disc Nose -->
      <ellipse cx="20" cy="220" rx="12" ry="70" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4 4" />
      <circle cx="20" cy="220" r="16" fill="#FF6B00" />

      <!-- Internal Ribs / Formers Lines representing 3D printing STL -->
      <line x1="100" y1="120" x2="100" y2="320" stroke="rgba(0,195,255,0.4)" stroke-width="1.5" />
      <line x1="140" y1="112" x2="140" y2="328" stroke="rgba(0,195,255,0.4)" stroke-width="1.5" />
      <line x1="180" y1="115" x2="180" y2="325" stroke="rgba(0,195,255,0.4)" stroke-width="1.5" />
      <line x1="220" y1="125" x2="220" y2="315" stroke="rgba(0,195,255,0.4)" stroke-width="1.5" />
      <line x1="260" y1="135" x2="260" y2="305" stroke="rgba(0,195,255,0.4)" stroke-width="1.5" />
      <line x1="300" y1="145" x2="300" y2="295" stroke="rgba(0,195,255,0.4)" stroke-width="1.5" />

      <!-- Internal Spar Channel (Carbon Tube) -->
      <line x1="60" y1="220" x2="420" y2="220" stroke="#FF6B00" stroke-width="3" />
    </g>
  </g>
</svg>
