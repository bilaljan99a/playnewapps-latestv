<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <linearGradient id="bgTempest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentTempest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="1000" height="450" rx="20" fill="url(#bgTempest)" stroke="#334155" stroke-width="2"/>

  <!-- Grid Blueprint Background -->
  <g opacity="0.1">
    <path d="M 0 50 H 1000 M 0 100 H 1000 M 0 150 H 1000 M 0 200 H 1000 M 0 250 H 1000 M 0 300 H 1000 M 0 350 H 1000 M 0 400 H 1000" stroke="#38BDF8" stroke-width="1" />
    <path d="M 100 0 V 450 M 200 0 V 450 M 300 0 V 450 M 400 0 V 450 M 500 0 V 450 M 600 0 V 450 M 700 0 V 450 M 800 0 V 450 M 900 0 V 450" stroke="#38BDF8" stroke-width="1" />
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(37,99,235,0.2)" stroke="#2563EB" stroke-width="1.5"/>
    <text x="90" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#60A5FA" text-anchor="middle">VALUE PACK BUNDLE</text>

    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF">Hawker Tempest Mk II</text>
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#38BDF8">3D Printable Scale Warbird</text>

    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8" max-width="450">
      • Wingspan: 1,280 mm (50.4 in)
    </text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8">
      • Power System: 4S LiPo Brushless Motor Setup
    </text>
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8">
      • Material: LW-PLA or Standard PLA Thin-Wall
    </text>
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94A3B8">
      • Includes: STL Files, Pre-configured G-Codes &amp; Decals
    </text>

    <!-- Save Pill -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="220" height="44" rx="12" fill="#10B981" />
      <text x="110" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF" text-anchor="middle">SAVE UP TO 31% OFF</text>
    </g>
  </g>

  <!-- Right Side Scale Plane Illustration -->
  <g transform="translate(560, 80)">
    <!-- Main Wings & Fuselage Outer Contour -->
    <path d="M 50 180 L 380 40 L 400 60 L 120 220 L 400 380 L 380 400 L 50 260 Z" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="3"/>
    <path d="M 20 220 L 380 220" stroke="#EF4444" stroke-width="3" stroke-dasharray="6 4" />
    <circle cx="20" cy="220" r="14" fill="#38BDF8"/>
    <!-- Propeller Spinner -->
    <path d="M 20 180 L 5 220 L 20 260 Z" fill="#2563EB" />
    <!-- Wing Rib Lines -->
    <line x1="120" y1="120" x2="120" y2="320" stroke="rgba(56,189,248,0.5)" stroke-width="2" />
    <line x1="180" y1="100" x2="180" y2="340" stroke="rgba(56,189,248,0.5)" stroke-width="2" />
    <line x1="240" y1="80" x2="240" y2="360" stroke="rgba(56,189,248,0.5)" stroke-width="2" />
    <line x1="300" y1="60" x2="300" y2="380" stroke="rgba(56,189,248,0.5)" stroke-width="2" />
    <line x1="360" y1="45" x2="360" y2="395" stroke="rgba(56,189,248,0.5)" stroke-width="2" />

    <!-- CG Balance Tag -->
    <rect x="150" y="200" width="80" height="24" rx="6" fill="#EF4444" />
    <text x="190" y="216" font-family="sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">CG POINT</text>
  </g>
</svg>
