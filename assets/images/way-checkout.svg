  <line x1="860" y1="390" x2="1210" y2="390" stroke="#E2E8F0" stroke-width="2"/>

  <text x="860" y="440" font-family="'Roboto', sans-serif" font-size="20" font-weight="900" fill="#0F172A">Total Amount Due:</text>
  <text x="1170" y="440" font-family="'Roboto', sans-serif" font-size="24" font-weight="900" fill="#FF004B">$36.65</text>

  <rect x="860" y="480" width="350" height="170" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="880" y="515" font-family="'Roboto', sans-serif" font-size="15" font-weight="800" fill="#166534">✓ Free Cancellation up to 24 Hours</text>
  <text x="880" y="545" font-family="'Roboto', sans-serif" font-size="14" fill="#166534">• Guaranteed Space Reservation</text>
  <text x="880" y="575" font-family="'Roboto', sans-serif" font-size="14" fill="#166534">• Continuous 24/7 Airport Shuttle</text>
  <text x="880" y="605" font-family="'Roboto', sans-serif" font-size="14" fill="#166534">• Earn 366 Way Bucks Rewards</text>
