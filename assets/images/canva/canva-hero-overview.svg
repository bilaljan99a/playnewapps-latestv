<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="canvaBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c4cc"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7d2ae8"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Geometric Tech Grids -->
  <g opacity="0.15">
    <circle cx="150" cy="120" r="180" fill="none" stroke="#00c4cc" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="1050" cy="480" r="220" fill="none" stroke="#7d2ae8" stroke-width="1.5" stroke-dasharray="8,8"/>
    <path d="M 0 315 L 1200 315" stroke="#334155" stroke-width="1"/>
    <path d="M 600 0 L 600 630" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="140" fill="#00c4cc" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="220" r="160" fill="#7d2ae8" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="450" r="180" fill="#3b82f6" opacity="0.1" filter="url(#glow)"/>

  <!-- Header Badge -->
  <rect x="80" y="50" width="230" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="100" cy="69" r="6" fill="#00c4cc"/>
  <text x="115" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">CANVA REVIEW 2026</text>

  <!-- Main Headline -->
  <text x="80" y="140" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Canva Visual Suite &amp; Magic Studio AI
  </text>
  <text x="80" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    The All-in-One Cloud Graphic Design, Video, Presentation &amp; AI Platform
  </text>

  <!-- Central Visual Mockup: Canva Workspace UI Card -->
  <g transform="translate(80, 220)">
    <!-- Main Window Frame -->
    <rect width="1040" height="350" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Top App Bar -->
    <rect width="1040" height="48" rx="16" fill="#0f172a"/>
    <rect y="32" width="1040" height="16" fill="#0f172a"/>
    <line x1="0" y1="48" x2="1040" y2="48" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="24" r="6" fill="#10b981"/>

    <!-- Canva Mini Logo in Bar -->
    <rect x="96" y="12" width="24" height="24" rx="6" fill="url(#canvaBrand)"/>
    <text x="108" y="29" fill="#ffffff" font-family="cursive, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">C</text>
    <text x="130" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Canva Visual Suite 2026 - Master Creative Canvas</text>

    <!-- Rating / Score Ribbon -->
    <rect x="880" y="10" width="140" height="28" rx="14" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="950" y="29" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">★ 4.9 / 5.0 RATED</text>

    <!-- Workspace Sidebar (Tools) -->
    <rect x="0" y="48" width="80" height="302" fill="#0b1120"/>
    <line x1="80" y1="48" x2="80" y2="350" stroke="#334155" stroke-width="1"/>
    
    <!-- Tool Icons -->
    <g transform="translate(20, 68)" fill="#64748b">
      <!-- Templates Icon -->
      <rect x="4" y="0" width="32" height="32" rx="8" fill="#1e293b"/>
      <rect x="10" y="6" width="9" height="9" rx="2" fill="#38bdf8"/>
      <rect x="21" y="6" width="9" height="9" rx="2" fill="#94a3b8"/>
      <rect x="10" y="17" width="9" height="9" rx="2" fill="#94a3b8"/>
      <rect x="21" y="17" width="9" height="9" rx="2" fill="#38bdf8"/>
      <text x="20" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Design</text>

      <!-- Elements / AI Icon -->
      <g transform="translate(0, 52)">
        <rect x="4" y="0" width="32" height="32" rx="8" fill="#1e293b"/>
        <path d="M 20 8 L 22 15 L 29 17 L 22 19 L 20 26 L 18 19 L 11 17 L 18 15 Z" fill="#a855f7"/>
        <text x="20" y="44" fill="#c084fc" font-family="sans-serif" font-size="9" text-anchor="middle">Magic AI</text>
      </g>

      <!-- Brand Kit Icon -->
      <g transform="translate(0, 104)">
        <rect x="4" y="0" width="32" height="32" rx="8" fill="#1e293b"/>
        <circle cx="16" cy="14" r="5" fill="#f59e0b"/>
        <circle cx="24" cy="18" r="5" fill="#ec4899"/>
        <text x="20" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Brand</text>
      </g>

      <!-- Uploads Icon -->
      <g transform="translate(0, 156)">
        <rect x="4" y="0" width="32" height="32" rx="8" fill="#1e293b"/>
        <path d="M 20 9 L 14 15 L 18 15 L 18 23 L 22 23 L 22 15 L 26 15 Z" fill="#10b981"/>
        <text x="20" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Uploads</text>
      </g>
    </g>

    <!-- Main Workspace Cards / 3 Pillars -->
    <g transform="translate(104, 68)">
      
      <!-- Card 1: 100M+ Templates & Graphic Engine -->
      <rect x="0" y="0" width="280" height="258" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="0" y="0" width="280" height="110" rx="12" fill="url(#canvaBrand)" opacity="0.85"/>
      <text x="20" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">100M+ Assets &amp; Templates</text>
      <text x="20" y="70" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Social, Print, Presentations &amp; Video</text>
      
      <!-- Card 1 Features -->
      <g transform="translate(20, 130)" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
        <text x="0" y="0">✔ 15,000+ Ready Layout Categories</text>
        <text x="0" y="26">✔ Premium Fonts, Audio &amp; Stock</text>
        <text x="0" y="52">✔ Drag-and-Drop Vector Canvas</text>
        <text x="0" y="78">✔ Unlimited Custom Resizing</text>
      </g>
      <rect x="20" y="222" width="240" height="24" rx="6" fill="#0284c7" fill-opacity="0.2"/>
      <text x="140" y="238" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">BEGINNER FRIENDLY &amp; INTUITIVE</text>

      <!-- Card 2: Magic Studio AI Powered Suite -->
      <rect x="310" y="0" width="280" height="258" rx="12" fill="#1e293b" stroke="#7d2ae8" stroke-width="1.5"/>
      <rect x="310" y="0" width="280" height="110" rx="12" fill="url(#cardGrad)"/>
      <circle cx="340" cy="40" r="18" fill="#7d2ae8" fill-opacity="0.4"/>
      <path d="M 340 28 L 343 37 L 352 40 L 343 43 L 340 52 L 337 43 L 328 40 L 337 37 Z" fill="#c084fc"/>
      <text x="370" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">Magic Studio™ AI</text>
      <text x="370" y="68" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Generative AI Creation Suite</text>
      
      <!-- Card 2 Features -->
      <g transform="translate(330, 130)" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
        <text x="0" y="0">⚡ Magic Media (Text-to-Image &amp; Video)</text>
        <text x="0" y="26">⚡ 1-Click Background Remover &amp; Eraser</text>
        <text x="0" y="52">⚡ Magic Switch (Docs, Decks &amp; 100+ Langs)</text>
        <text x="0" y="78">⚡ Magic Write AI Copy Assistant</text>
      </g>
      <rect x="330" y="222" width="240" height="24" rx="6" fill="#7d2ae8" fill-opacity="0.3"/>
      <text x="450" y="238" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">AI WORKFLOW ACCELERATOR</text>

      <!-- Card 3: Brand Kit & Team Collaboration -->
      <rect x="620" y="0" width="290" height="258" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect x="620" y="0" width="290" height="110" rx="12" fill="#0f172a"/>
      <circle cx="650" cy="40" r="18" fill="#059669" fill-opacity="0.3"/>
      <path d="M 643 40 L 648 45 L 658 35" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="680" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800">Brand Kit &amp; Teams</text>
      <text x="680" y="68" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Enterprise Control &amp; Sharing</text>
      
      <!-- Card 3 Features -->
      <g transform="translate(640, 130)" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
        <text x="0" y="0">👥 Real-Time Multi-User Collaboration</text>
        <text x="0" y="26">🎨 Centralized Logos, Fonts &amp; Palettes</text>
        <text x="0" y="52">🔒 Brand Controls &amp; Approval Workflows</text>
        <text x="0" y="78">☁️ 1TB Cloud Storage &amp; Team Folders</text>
      </g>
      <rect x="640" y="222" width="250" height="24" rx="6" fill="#059669" fill-opacity="0.2"/>
      <text x="765" y="238" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SCALABLE TEAM WORKFLOWS</text>

    </g>

  </g>

  <!-- Bottom Brand Footer Line -->
  <g transform="translate(80, 590)">
    <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      Independent Analysis &amp; In-Depth Benchmark Review by PlayNewApps.store Editorial Team • Updated 2026
    </text>
  </g>
</svg>
