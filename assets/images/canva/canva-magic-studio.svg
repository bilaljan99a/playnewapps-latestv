<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="aiPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="aiCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="aiCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="20" fill="url(#bgAi)"/>

  <!-- Top Badge & Title -->
  <g transform="translate(60, 50)">
    <rect width="180" height="32" rx="16" fill="#7d2ae8" fill-opacity="0.25" stroke="#a855f7" stroke-width="1"/>
    <text x="90" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AI-POWERED CREATIVITY</text>
    
    <text x="0" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="900">
      Canva Magic Studio™ Deep Dive
    </text>
    <text x="0" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">
      Transforming rough ideas into finished visual content with 6 core generative AI tools
    </text>
  </g>

  <!-- 6 AI Features Grid (2 Rows x 3 Cols) -->
  <g transform="translate(60, 180)">
    
    <!-- Box 1: Magic Media (Text-to-Image & Video) -->
    <g transform="translate(0, 0)">
      <rect width="270" height="150" rx="14" fill="url(#aiCard)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="36" cy="36" r="18" fill="url(#aiPurple)"/>
      <path d="M 36 26 L 38 33 L 45 36 L 38 39 L 36 46 L 34 39 L 27 36 L 34 33 Z" fill="#ffffff"/>
      <text x="68" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Magic Media™</text>
      <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="13" width="230">
        Generate custom 3D art, photorealistic images, and 4-second video clips directly from text prompts.
      </text>
      <rect x="20" y="115" width="90" height="20" rx="10" fill="#a855f7" fill-opacity="0.2"/>
      <text x="65" y="129" fill="#d8b4fe" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">500 Credits/mo</text>
    </g>

    <!-- Box 2: Magic Switch (Reformat & Translate) -->
    <g transform="translate(305, 0)">
      <rect width="270" height="150" rx="14" fill="url(#aiCard)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="36" cy="36" r="18" fill="url(#aiCyan)"/>
      <path d="M 28 36 L 34 30 L 34 34 L 44 34 L 44 38 L 34 38 L 34 42 Z" fill="#ffffff"/>
      <text x="68" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Magic Switch™</text>
      <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="13">
        Transform pitch decks into executive summaries or blog posts, plus auto-translate text into 100+ languages.
      </text>
      <rect x="20" y="115" width="100" height="20" rx="10" fill="#0284c7" fill-opacity="0.2"/>
      <text x="70" y="129" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">1-Click Transform</text>
    </g>

    <!-- Box 3: Magic Grab & Magic Expand -->
    <g transform="translate(610, 0)">
      <rect width="270" height="150" rx="14" fill="url(#aiCard)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="36" cy="36" r="18" fill="#10b981"/>
      <circle cx="36" cy="36" r="6" fill="#ffffff"/>
      <text x="68" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Magic Grab™</text>
      <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="13">
        Isolate any object or subject inside a flat photo and move, resize, or reposition it freely like a separate layer.
      </text>
      <rect x="20" y="115" width="100" height="20" rx="10" fill="#059669" fill-opacity="0.2"/>
      <text x="70" y="129" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Subject Isolation</text>
    </g>

    <!-- Box 4: Background Remover & Eraser -->
    <g transform="translate(0, 175)">
      <rect width="270" height="150" rx="14" fill="url(#aiCard)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="36" cy="36" r="18" fill="#f59e0b"/>
      <path d="M 30 42 L 42 30 M 30 30 L 42 42" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="68" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Background Remover</text>
      <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="13">
        1-click AI cutout for photos and videos with pixel-perfect edge detection around hair, fur, and glass.
      </text>
      <rect x="20" y="115" width="105" height="20" rx="10" fill="#d97706" fill-opacity="0.2"/>
      <text x="72" y="129" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Instant Cutout</text>
    </g>

    <!-- Box 5: Magic Write AI Copywriter -->
    <g transform="translate(305, 175)">
      <rect width="270" height="150" rx="14" fill="url(#aiCard)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="36" cy="36" r="18" fill="#6366f1"/>
      <path d="M 30 42 L 34 30 L 42 38 Z" fill="#ffffff"/>
      <text x="68" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Magic Write™</text>
      <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="13">
        Generate engaging headlines, social media captions, email pitches, and brainstorm ideas in your brand voice.
      </text>
      <rect x="20" y="115" width="90" height="20" rx="10" fill="#4f46e5" fill-opacity="0.2"/>
      <text x="65" y="129" fill="#818cf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">500 Queries/mo</text>
    </g>

    <!-- Box 6: Magic Animate & Design -->
    <g transform="translate(610, 175)">
      <rect width="270" height="150" rx="14" fill="url(#aiCard)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="36" cy="36" r="18" fill="#ec4899"/>
      <path d="M 32 30 L 42 36 L 32 42 Z" fill="#ffffff"/>
      <text x="68" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Magic Animate™</text>
      <text x="20" y="75" fill="#94a3b8" font-family="sans-serif" font-size="13">
        Auto-apply smooth motion transitions and timing across all slide layers with a single AI suggestion button.
      </text>
      <rect x="20" y="115" width="115" height="20" rx="10" fill="#db2777" fill-opacity="0.2"/>
      <text x="77" y="129" fill="#f472b6" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Dynamic Motion</text>
    </g>

  </g>
</svg>
