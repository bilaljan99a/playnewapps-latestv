<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="sidebarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="nordBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1161ee"/>
      <stop offset="100%" stop-color="#2575fc"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="0" width="280" height="720" fill="url(#sidebarGrad)"/>
  <line x1="280" y1="0" x2="280" y2="720" stroke="#1f293d" stroke-width="1"/>

  <!-- NordVPN Brand Header -->
  <g transform="translate(24, 28)">
    <rect width="44" height="44" rx="12" fill="url(#nordBlue)"/>
    <path d="M22 10 L35 32 H30 L22 18 L14 32 H9 Z" fill="#ffffff"/>
    <path d="M22 10 L27 19 L22 18 L17 19 Z" fill="#9ec2ff"/>
    <text x="56" y="28" font-size="20" font-weight="700" fill="#ffffff">NordVPN</text>
    <text x="56" y="42" font-size="11" font-weight="600" fill="#3b82f6" letter-spacing="1">PREMIUM v7.24</text>
  </g>

  <!-- Connection Status Box -->
  <rect x="20" y="96" width="240" height="130" rx="14" fill="#161f33" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="44" cy="126" r="16" fill="#10b981" fill-opacity="0.15"/>
  <path d="M44 116 L44 136 M34 126 L54 126" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <text x="70" y="124" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">STATUS</text>
  <text x="70" y="142" font-size="16" font-weight="700" fill="#10b981">PROTECTED</text>
  
  <text x="36" y="174" font-size="12" fill="#cbd5e1">Connected to <tspan font-weight="700" fill="#ffffff">United States #8412</tspan></text>
  <text x="36" y="192" font-size="11" fill="#64748b">Protocol: NordLynx • IP: 198.51.100.42</text>
  <rect x="36" y="204" width="208" height="10" rx="5" fill="#0f172a"/>
  <rect x="36" y="204" width="180" height="10" rx="5" fill="url(#nordBlue)"/>

  <!-- Nav Items -->
  <g transform="translate(20, 246)">
    <!-- Active Nav item -->
    <rect x="0" y="0" width="240" height="42" rx="10" fill="#1e293b"/>
    <circle cx="24" cy="21" r="6" fill="#3b82f6"/>
    <text x="44" y="26" font-size="14" font-weight="600" fill="#ffffff">VPN Servers &amp; Map</text>

    <g transform="translate(0, 50)">
      <text x="44" y="26" font-size="14" font-weight="500" fill="#94a3b8">Threat Protection Pro</text>
    </g>
    <g transform="translate(0, 96)">
      <text x="44" y="26" font-size="14" font-weight="500" fill="#94a3b8">Meshnet</text>
    </g>
    <g transform="translate(0, 142)">
      <text x="44" y="26" font-size="14" font-weight="500" fill="#94a3b8">Dark Web Monitor</text>
    </g>
    <g transform="translate(0, 188)">
      <text x="44" y="26" font-size="14" font-weight="500" fill="#94a3b8">Double VPN &amp; Specialty</text>
    </g>
    <g transform="translate(0, 234)">
      <text x="44" y="26" font-size="14" font-weight="500" fill="#94a3b8">Settings &amp; Kill Switch</text>
    </g>
  </g>

  <!-- Quick Disconnect / Pause Button -->
  <rect x="20" y="640" width="240" height="44" rx="10" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
  <text x="140" y="667" font-size="14" font-weight="600" fill="#f87171" text-anchor="middle">Disconnect Connection</text>

  <!-- Main Map Stage -->
  <g transform="translate(280, 0)">
    <!-- Top Header Bar -->
    <rect x="0" y="0" width="1000" height="64" fill="#0f172a"/>
    <line x1="0" y1="64" x2="1000" y2="64" stroke="#1e293b" stroke-width="1"/>

    <!-- Search Input -->
    <rect x="24" y="14" width="340" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="44" y="37" font-size="13" fill="#64748b">Search country, city, or server #...</text>

    <!-- Quick Server Filters -->
    <g transform="translate(380, 14)">
      <rect x="0" y="0" width="100" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="50" y="23" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">All (6,400+)</text>
      <rect x="110" y="0" width="100" height="36" rx="8" fill="#1e293b"/>
      <text x="160" y="23" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Double VPN</text>
      <rect x="220" y="0" width="100" height="36" rx="8" fill="#1e293b"/>
      <text x="270" y="23" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Obfuscated</text>
      <rect x="330" y="0" width="100" height="36" rx="8" fill="#1e293b"/>
      <text x="380" y="23" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">P2P Peer</text>
    </g>

    <text x="960" y="38" font-size="13" font-weight="600" fill="#10b981" text-anchor="end">● 100% Secure</text>

    <!-- World Map Graphic Background -->
    <rect x="0" y="65" width="1000" height="655" fill="#090d16"/>
    
    <!-- Stylized Grid -->
    <path d="M0 150 H1000 M0 250 H1000 M0 350 H1000 M0 450 H1000 M0 550 H1000 M0 650 H1000" stroke="#161e31" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M150 65 V720 M300 65 V720 M450 65 V720 M600 65 V720 M750 65 V720 M900 65 V720" stroke="#161e31" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Continents Silhouettes (Abstract Path Shapes) -->
    <!-- North America -->
    <path d="M100 140 Q 180 120 280 160 T 320 280 T 180 340 T 100 240 Z" fill="#1e293b" fill-opacity="0.4"/>
    <!-- South America -->
    <path d="M260 380 Q 320 400 300 520 T 220 580 T 230 440 Z" fill="#1e293b" fill-opacity="0.4"/>
    <!-- Europe -->
    <path d="M440 130 Q 560 110 580 200 T 480 260 T 430 180 Z" fill="#1e293b" fill-opacity="0.4"/>
    <!-- Africa -->
    <path d="M460 280 Q 560 300 540 460 T 440 480 T 450 340 Z" fill="#1e293b" fill-opacity="0.4"/>
    <!-- Asia -->
    <path d="M600 120 Q 820 100 860 260 T 700 340 T 580 220 Z" fill="#1e293b" fill-opacity="0.4"/>
    <!-- Australia -->
    <path d="M780 440 Q 880 430 870 540 T 760 520 Z" fill="#1e293b" fill-opacity="0.4"/>

    <!-- Active Server Nodes on Map with Pulsing Radii -->
    <!-- New York / US Active Node -->
    <circle cx="220" cy="220" r="24" fill="#10b981" fill-opacity="0.25" filter="url(#glow)"/>
    <circle cx="220" cy="220" r="12" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <rect x="150" y="150" width="140" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="220" y="168" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">US #8412 (Connected)</text>
    <text x="220" y="184" font-size="10" fill="#10b981" text-anchor="middle">Ping: 12ms • Load: 24%</text>

    <!-- London Node -->
    <circle cx="480" cy="180" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="480" y="202" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">London (UK)</text>

    <!-- Frankfurt Node -->
    <circle cx="520" cy="190" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="520" y="212" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Frankfurt (DE)</text>

    <!-- Tokyo Node -->
    <circle cx="830" cy="240" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="830" y="262" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Tokyo (JP)</text>

    <!-- Sydney Node -->
    <circle cx="840" cy="490" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="840" y="512" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">Sydney (AU)</text>

    <!-- Bottom Stats Bar -->
    <rect x="24" y="600" width="952" height="96" rx="14" fill="#161f32" stroke="#1e293b" stroke-width="1"/>
    <g transform="translate(44, 620)">
      <text x="0" y="20" font-size="12" font-weight="600" fill="#94a3b8">CURRENT SPEED</text>
      <text x="0" y="48" font-size="24" font-weight="700" fill="#ffffff">948.4 <tspan font-size="14" fill="#3b82f6">Mbps</tspan></text>
      <text x="0" y="64" font-size="11" fill="#10b981">▲ 98.4% of ISP Baseline</text>
    </g>

    <line x1="260" y1="616" x2="260" y2="680" stroke="#1f293d" stroke-width="1"/>

    <g transform="translate(290, 620)">
      <text x="0" y="20" font-size="12" font-weight="600" fill="#94a3b8">ENCRYPTION PROTOCOL</text>
      <text x="0" y="48" font-size="20" font-weight="700" fill="#ffffff">NordLynx (WireGuard)</text>
      <text x="0" y="64" font-size="11" fill="#64748b">AES-256 GCM + ChaCha20</text>
    </g>

    <line x1="560" y1="616" x2="560" y2="680" stroke="#1f293d" stroke-width="1"/>

    <g transform="translate(590, 620)">
      <text x="0" y="20" font-size="12" font-weight="600" fill="#94a3b8">SECURITY SERVICES</text>
      <text x="0" y="48" font-size="18" font-weight="700" fill="#10b981">Threat Protection Active</text>
      <text x="0" y="64" font-size="11" fill="#64748b">Dark Web Alert System ON</text>
    </g>

    <line x1="820" y1="616" x2="820" y2="680" stroke="#1f293d" stroke-width="1"/>

    <g transform="translate(840, 620)">
      <text x="0" y="20" font-size="12" font-weight="600" fill="#94a3b8">SESSION TIME</text>
      <text x="0" y="48" font-size="22" font-weight="700" fill="#38bdf8">14h 32m</text>
      <text x="0" y="64" font-size="11" fill="#10b981">0 Data Leaks</text>
    </g>
  </g>
</svg>
