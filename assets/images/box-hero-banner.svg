<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" style="background:#091E42; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071938" />
      <stop offset="50%" stop-color="#0061D5" />
      <stop offset="100%" stop-color="#003780" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F6F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)" />
  <circle cx="1000" cy="100" r="300" fill="#0061D5" opacity="0.3" filter="blur(40px)"/>
  <circle cx="200" cy="500" r="250" fill="#00C7FF" opacity="0.2" filter="blur(50px)"/>

  <!-- Grid overlay -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M200 0 V600 M400 0 V600 M600 0 V600 M800 0 V600 M1000 0 V600" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Left Header Banner Text -->
  <g transform="translate(60, 80)">
    <!-- Box Logo Badge -->
    <rect width="120" height="42" rx="8" fill="#FFFFFF"/>
    <text x="60" y="28" font-size="22" font-weight="900" fill="#0061D5" text-anchor="middle">box</text>
    
    <text x="0" y="90" font-size="38" font-weight="800" fill="#FFFFFF">Box Content Cloud</text>
    <text x="0" y="125" font-size="20" font-weight="400" fill="#B3D4FF">Intelligent Cloud Storage, E-Signatures &amp; Security</text>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="130" height="50" rx="8" fill="rgba(255,255,255,0.12)"/>
      <text x="15" y="22" font-size="12" fill="#B3D4FF">Max File Size</text>
      <text x="15" y="40" font-size="16" font-weight="700" fill="#FFFFFF">500 GB</text>

      <rect x="145" y="0" width="140" height="50" rx="8" fill="rgba(255,255,255,0.12)"/>
      <text x="160" y="22" font-size="12" fill="#B3D4FF">Storage</text>
      <text x="160" y="40" font-size="16" font-weight="700" fill="#00FFB2">Unlimited</text>

      <rect x="300" y="0" width="150" height="50" rx="8" fill="rgba(255,255,255,0.12)"/>
      <text x="315" y="22" font-size="12" fill="#B3D4FF">Integrations</text>
      <text x="315" y="40" font-size="16" font-weight="700" fill="#FFFFFF">1,500+ Apps</text>
    </g>
  </g>

  <!-- Box App Window Mockup -->
  <g transform="translate(540, 60)" filter="url(#shadow)">
    <!-- Main UI Frame -->
    <rect width="600" height="480" rx="12" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Top Bar -->
    <rect width="600" height="44" rx="12" fill="#091E42"/>
    <rect y="32" width="600" height="12" fill="#091E42"/>
    <circle cx="20" cy="22" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="22" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="22" r="5" fill="#27C93F"/>
    
    <!-- Search Bar -->
    <rect x="180" y="10" width="240" height="24" rx="12" fill="rgba(255,255,255,0.15)"/>
    <text x="200" y="26" font-size="11" fill="#FFFFFF" opacity="0.8">🔍 Search Box Content Cloud...</text>
    
    <text x="500" y="27" font-size="12" font-weight="600" fill="#FFFFFF">Box AI ✨</text>

    <!-- Sidebar -->
    <rect y="44" width="150" height="436" fill="#F0F4F8"/>
    
    <g transform="translate(15, 65)">
      <!-- Sidebar items -->
      <rect x="0" y="0" width="120" height="30" rx="6" fill="#0061D5"/>
      <text x="30" y="20" font-size="12" font-weight="700" fill="#FFFFFF">📁 All Files</text>

      <text x="30" y="55" font-size="12" fill="#475569">✍️ Box Sign</text>
      <text x="30" y="85" font-size="12" fill="#475569">📝 Box Notes</text>
      <text x="30" y="115" font-size="12" fill="#475569">🤖 Box AI Hubs</text>
      <text x="30" y="145" font-size="12" fill="#475569">⚡ Workflows</text>
      <text x="30" y="175" font-size="12" fill="#475569">🛡️ Box Shield</text>
      <text x="30" y="205" font-size="12" fill="#475569">🗑️ Trash</text>
    </g>

    <!-- Main Workspace Content -->
    <g transform="translate(165, 60)">
      <text x="0" y="20" font-size="18" font-weight="700" fill="#0F172A">All Files &amp; Enterprise Projects</text>

      <!-- Action Buttons -->
      <rect x="290" y="2" width="100" height="28" rx="6" fill="#0061D5"/>
      <text x="340" y="20" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ New File</text>

      <rect x="400" y="2" width="20" height="28" rx="6" fill="#0061D5"/>
      <text x="410" y="20" font-size="11" fill="#FFFFFF" text-anchor="middle">▾</text>

      <!-- Table Header -->
      <rect x="0" y="40" width="420" height="26" fill="#E2E8F0" rx="4"/>
      <text x="12" y="57" font-size="11" font-weight="700" fill="#475569">Name</text>
      <text x="210" y="57" font-size="11" font-weight="700" fill="#475569">Updated</text>
      <text x="310" y="57" font-size="11" font-weight="700" fill="#475569">Size</text>
      <text x="370" y="57" font-size="11" font-weight="700" fill="#475569">Status</text>

      <!-- File Rows -->
      <!-- Row 1 -->
      <rect x="0" y="75" width="420" height="42" fill="#FFFFFF" rx="6" stroke="#CBD5E1"/>
      <text x="12" y="100" font-size="13" font-weight="600" fill="#0F172A">📁 Q4 Financial Audit &amp; Tax Compliance</text>
      <text x="210" y="100" font-size="11" fill="#64748B">Just now</text>
      <text x="310" y="100" font-size="11" fill="#64748B">1.4 GB</text>
      <rect x="365" y="87" width="48" height="20" rx="10" fill="#DCFCE7"/>
      <text x="389" y="101" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Synced</text>

      <!-- Row 2 -->
      <rect x="0" y="125" width="420" height="42" fill="#FFFFFF" rx="6" stroke="#CBD5E1"/>
      <text x="12" y="150" font-size="13" font-weight="600" fill="#0F172A">✍️ Master Vendor Agreement 2026.pdf</text>
      <text x="210" y="150" font-size="11" fill="#64748B">2 hrs ago</text>
      <text x="310" y="150" font-size="11" fill="#64748B">14.8 MB</text>
      <rect x="365" y="137" width="48" height="20" rx="10" fill="#DBEAFE"/>
      <text x="389" y="151" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="middle">Signed</text>

      <!-- Row 3 -->
      <rect x="0" y="175" width="420" height="42" fill="#FFFFFF" rx="6" stroke="#CBD5E1"/>
      <text x="12" y="200" font-size="13" font-weight="600" fill="#0F172A">🤖 Box AI Insights - Market Strategy.docx</text>
      <text x="210" y="200" font-size="11" fill="#64748B">Yesterday</text>
      <text x="310" y="200" font-size="11" fill="#64748B">8.2 MB</text>
      <rect x="365" y="187" width="48" height="20" rx="10" fill="#F3E8FF"/>
      <text x="389" y="201" font-size="10" font-weight="700" fill="#6B21A8" text-anchor="middle">Box AI</text>

      <!-- Row 4 -->
      <rect x="0" y="225" width="420" height="42" fill="#FFFFFF" rx="6" stroke="#CBD5E1"/>
      <text x="12" y="250" font-size="13" font-weight="600" fill="#0F172A">🎥 Product Demo Raw 4K Footage.mp4</text>
      <text x="210" y="250" font-size="11" fill="#64748B">3 days ago</text>
      <text x="310" y="250" font-size="11" fill="#64748B">84.2 GB</text>
      <rect x="365" y="237" width="48" height="20" rx="10" fill="#FEF3C7"/>
      <text x="389" y="251" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">Shared</text>

      <!-- Box AI Overlay Widget -->
      <g transform="translate(20, 285)">
        <rect width="380" height="115" rx="8" fill="#0F172A" filter="url(#shadow)"/>
        <text x="15" y="25" font-size="13" font-weight="700" fill="#00C7FF">✨ Box AI Prompt Assistant</text>
        <text x="15" y="48" font-size="11" fill="#E2E8F0">"Summarize key contract risks and payment terms in 3 bullets."</text>
        <rect x="15" y="62" width="350" height="38" rx="6" fill="#1E293B"/>
        <text x="25" y="78" font-size="10" fill="#10B981">✓ Net-30 payment terms confirmed with zero late fee penalties.</text>
        <text x="25" y="92" font-size="10" fill="#10B981">✓ Standard 100% IP ownership transferred to buyer upon signature.</text>
      </g>
    </g>
  </g>
</svg>