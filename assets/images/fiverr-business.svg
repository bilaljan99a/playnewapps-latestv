    <rect x="15" y="55" width="150" height="32" rx="6" fill="#0B4627"/>
    <text x="30" y="76" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1DBF73">📊 Dashboard</text>

    <text x="30" y="115" font-family="Arial, sans-serif" font-size="12" fill="#98A2B3">📁 Projects (12)</text>
