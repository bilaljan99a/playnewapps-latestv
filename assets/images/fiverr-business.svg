<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" rx="12" fill="#0A1118"/>
  <!-- Top Nav -->
  <rect width="800" height="55" fill="#101828"/>
  <rect x="25" y="16" width="130" height="22" rx="4" fill="#1DBF73"/>
  <text x="90" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">fiverr business.</text>
  <rect x="660" y="14" width="115" height="28" rx="14" fill="#1DBF73"/>
