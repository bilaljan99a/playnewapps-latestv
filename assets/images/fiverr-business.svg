    <text x="30" y="175" font-family="Arial, sans-serif" font-size="12" fill="#98A2B3">⭐ Saved Freelancers</text>
    <text x="30" y="205" font-family="Arial, sans-serif" font-size="12" fill="#98A2B3">💳 Budget &amp; Invoices</text>

    <!-- Main Content Panel -->
    <rect x="200" width="540" height="345" rx="10" fill="#101828" stroke="#223043" stroke-width="1"/>
    <text x="220" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">Acme Corp Freelance Operations</text>

    <!-- Stats row -->
    <g transform="translate(220, 50)">
      <rect width="150" height="70" rx="8" fill="#151E2B"/>
      <text x="15" y="28" font-family="Arial, sans-serif" font-size="10" fill="#98A2B3">TOTAL SPEND (YTD)</text>
      <text x="15" y="52" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#1DBF73">$24,500</text>

      <rect x="165" width="150" height="70" rx="8" fill="#151E2B"/>
      <text x="180" y="28" font-family="Arial, sans-serif" font-size="10" fill="#98A2B3">ACTIVE PROJECTS</text>
      <text x="180" y="52" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#38BDF8">5 Active</text>

      <rect x="330" width="150" height="70" rx="8" fill="#151E2B"/>
      <text x="345" y="28" font-family="Arial, sans-serif" font-size="10" fill="#98A2B3">SAVED FREELANCERS</text>
      <text x="345" y="52" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#A855F7">34 Pro Talents</text>
    </g>

    <!-- Active Projects Table preview -->
    <text x="220" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Team Collaborations in Progress</text>

    <rect x="220" y="165" width="500" height="40" rx="6" fill="#151E2B"/>
    <text x="235" y="189" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Mobile App UI Design System</text>
    <text x="450" y="189" font-family="Arial, sans-serif" font-size="11" fill="#1DBF73">In Review</text>
    <text x="560" y="189" font-family="Arial, sans-serif" font-size="11" fill="#98A2B3">Elena_Code</text>

    <rect x="220" y="215" width="500" height="40" rx="6" fill="#151E2B"/>
    <text x="235" y="239" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">AI Content API Integration</text>
    <text x="450" y="239" font-family="Arial, sans-serif" font-size="11" fill="#38BDF8">In Progress</text>
    <text x="560" y="239" font-family="Arial, sans-serif" font-size="11" fill="#98A2B3">David_AI</text>

    <rect x="220" y="265" width="500" height="40" rx="6" fill="#151E2B"/>
    <text x="235" y="289" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Q3 Marketing Video Animation</text>
    <text x="450" y="289" font-family="Arial, sans-serif" font-size="11" fill="#FEC84B">Milestone 2</text>
    <text x="560" y="289" font-family="Arial, sans-serif" font-size="11" fill="#98A2B3">Alex_Dev</text>
