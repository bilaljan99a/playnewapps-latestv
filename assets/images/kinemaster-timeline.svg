<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="kBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>
    <linearGradient id="kOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
    <linearGradient id="kBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e90ff"/>
      <stop offset="100%" stop-color="#70a1ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#kBg)"/>

  <!-- Left Preview Monitor -->
  <g transform="translate(40, 30)">
    <rect width="720" height="420" rx="12" fill="#182030" stroke="#2a364f" stroke-width="2"/>
    <!-- Video Scene inside monitor -->
    <path d="M 120 320 L 280 160 L 420 280 L 600 120 L 720 340 Z" fill="#1e293b" opacity="0.6"/>
    <circle cx="560" cy="110" r="40" fill="#f59e0b" opacity="0.8"/>
    <!-- Animated overlay elements -->
    <rect x="180" y="80" width="360" height="60" rx="8" fill="#ff4757" opacity="0.85"/>
    <text x="360" y="118" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">KINEMASTER PRO TIMELINE</text>
    
    <!-- Timecode & Playhead HUD -->
    <rect x="20" y="20" width="160" height="32" rx="6" fill="#0f172a" opacity="0.9"/>
    <text x="100" y="41" fill="#00e676" font-size="13" font-family="monospace" font-weight="bold" text-anchor="middle">00:02:14:18 / 60fps</text>

    <!-- Playback controls overlay -->
    <g transform="translate(310, 360)">
      <circle cx="0" cy="0" r="22" fill="#ff4757"/>
      <polygon points="-5,-8 10,0 -5,8" fill="#ffffff"/>
      <circle cx="-50" cy="0" r="16" fill="#2d3748"/>
      <text x="-50" y="4" fill="#ffffff" font-size="12" text-anchor="middle">⏮</text>
      <circle cx="50" cy="0" r="16" fill="#2d3748"/>
      <text x="50" y="4" fill="#ffffff" font-size="12" text-anchor="middle">⏭</text>
    </g>
  </g>

  <!-- Right Media Wheel Hub (Signature KineMaster UI) -->
  <g transform="translate(800, 30)">
    <rect width="440" height="420" rx="12" fill="#131b2a" stroke="#253248" stroke-width="2"/>
    <text x="220" y="36" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">MEDIA &amp; TOOL WHEEL</text>

    <!-- Radial Wheel -->
    <g transform="translate(220, 230)">
      <circle cx="0" cy="0" r="140" fill="#1c2638" stroke="#ff4757" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="46" fill="#ff4757"/>
      <text x="0" y="5" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">REC 🔴</text>

      <!-- Top: Media -->
      <g transform="translate(0, -95)">
        <circle cx="0" cy="0" r="28" fill="#2d3748" stroke="#ff4757"/>
        <text x="0" y="4" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Media</text>
      </g>
      <!-- Right: Layer -->
      <g transform="translate(95, 0)">
        <circle cx="0" cy="0" r="28" fill="#2d3748" stroke="#1e90ff"/>
        <text x="0" y="4" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Layer</text>
      </g>
      <!-- Bottom: Audio -->
      <g transform="translate(0, 95)">
        <circle cx="0" cy="0" r="28" fill="#2d3748" stroke="#00e676"/>
        <text x="0" y="4" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Audio</text>
      </g>
      <!-- Left: Asset Store -->
      <g transform="translate(-95, 0)">
        <circle cx="0" cy="0" r="28" fill="#2d3748" stroke="#f59e0b"/>
        <text x="0" y="4" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Store</text>
      </g>
    </g>
  </g>

  <!-- Bottom Multi-Track Timeline -->
  <g transform="translate(40, 470)">
    <rect width="1200" height="220" rx="12" fill="#0e131f" stroke="#222d42" stroke-width="2"/>

    <!-- Time Ruler -->
    <rect x="0" y="0" width="1200" height="30" fill="#161f31" rx="12"/>
    <text x="100" y="20" fill="#64748b" font-size="11" font-family="monospace">00:00</text>
    <text x="350" y="20" fill="#64748b" font-size="11" font-family="monospace">00:05</text>
    <text x="600" y="20" fill="#ff4757" font-size="11" font-family="monospace" font-weight="bold">00:10 ▶</text>
    <text x="850" y="20" fill="#64748b" font-size="11" font-family="monospace">00:15</text>
    <text x="1100" y="20" fill="#64748b" font-size="11" font-family="monospace">00:20</text>

    <!-- Playhead Vertical Line -->
    <line x1="600" y1="0" x2="600" y2="220" stroke="#ff4757" stroke-width="2"/>

    <!-- Track 1: Main Video (Primary A/V) -->
    <g transform="translate(10, 40)">
      <rect x="0" y="0" width="1180" height="44" rx="6" fill="#1b2538"/>
      <rect x="20" y="4" width="300" height="36" rx="4" fill="url(#kOrange)"/>
      <text x="40" y="26" fill="#ffffff" font-size="12" font-weight="bold">Primary Clip: Intro_4K.mp4</text>
      <rect x="330" y="4" width="450" height="36" rx="4" fill="#3b82f6"/>
      <text x="350" y="26" fill="#ffffff" font-size="12" font-weight="bold">Main Footage B-Roll.mp4</text>
      <rect x="790" y="4" width="370" height="36" rx="4" fill="url(#kOrange)"/>
      <text x="810" y="26" fill="#ffffff" font-size="12" font-weight="bold">Outro_Scene.mp4</text>
    </g>

    <!-- Track 2: Video Overlay / Chroma Key -->
    <g transform="translate(10, 92)">
      <rect x="0" y="0" width="1180" height="36" rx="6" fill="#141c2c"/>
      <rect x="180" y="3" width="320" height="30" rx="4" fill="#10b981"/>
      <text x="200" y="22" fill="#ffffff" font-size="11" font-weight="bold">GreenScreen_Explosion.mp4 (Chroma Key)</text>
      <rect x="540" y="3" width="280" height="30" rx="4" fill="#8b5cf6"/>
      <text x="560" y="22" fill="#ffffff" font-size="11" font-weight="bold">Text Title Keyframe Overlay</text>
    </g>

    <!-- Track 3: Audio Music & Voiceover -->
    <g transform="translate(10, 136)">
      <rect x="0" y="0" width="1180" height="36" rx="6" fill="#141c2c"/>
      <rect x="20" y="3" width="800" height="30" rx="4" fill="#059669"/>
      <path d="M 30 18 Q 60 5 90 18 T 150 18 T 210 18 T 270 18 T 330 18 T 390 18 T 450 18 T 510 18" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="530" y="22" fill="#ffffff" font-size="11" font-weight="bold">Background Music (Cinematic_Beat.mp3) - Auto-Ducked</text>
      <rect x="840" y="3" width="320" height="30" rx="4" fill="#ec4899"/>
      <text x="860" y="22" fill="#ffffff" font-size="11" font-weight="bold">Voiceover_Mic_01.wav</text>
    </g>

    <!-- Track 4: Sound Effects (SFX) -->
    <g transform="translate(10, 180)">
      <rect x="0" y="0" width="1180" height="30" rx="6" fill="#141c2c"/>
      <rect x="150" y="3" width="80" height="24" rx="4" fill="#f59e0b"/>
      <text x="160" y="19" fill="#000000" font-size="10" font-weight="bold">Whoosh SFX</text>
      <rect x="420" y="3" width="100" height="24" rx="4" fill="#f59e0b"/>
      <text x="430" y="19" fill="#000000" font-size="10" font-weight="bold">Pop Impact</text>
      <rect x="800" y="3" width="90" height="24" rx="4" fill="#f59e0b"/>
      <text x="810" y="19" fill="#000000" font-size="10" font-weight="bold">Bell Chime</text>
    </g>
  </g>
</svg>