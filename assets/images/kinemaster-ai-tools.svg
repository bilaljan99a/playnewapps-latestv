<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <rect width="1280" height="720" fill="#090d16"/>

  <g transform="translate(60, 40)">
    <rect width="1160" height="640" rx="16" fill="#131a28" stroke="#222d42" stroke-width="2"/>

    <!-- Left Screen: AI Background Magic Remover -->
    <g transform="translate(30, 30)">
      <rect width="540" height="580" rx="12" fill="#0f1522" stroke="#1e293b"/>
      <text x="24" y="40" fill="#ffffff" font-size="18" font-weight="bold">AI Magic Background Remover</text>
      
      <!-- Video Frame Preview with Transparent Grid Background -->
      <g transform="translate(24, 60)">
        <rect width="492" height="340" rx="10" fill="#1e293b"/>
        <!-- Checkerboard patterns for transparency -->
        <path d="M 0 0 L 492 0 L 492 340 L 0 340 Z" fill="#161f31"/>
        
        <!-- Cutout Subject -->
        <g transform="translate(180, 60)">
          <path d="M 60 40 Q 100 0 140 40 T 170 180 L 140 260 L 40 260 L 10 180 Z" fill="#ff4757"/>
          <circle cx="100" cy="30" r="30" fill="#ffd166"/>
          <!-- AI Selection Cyan Glow Rim -->
          <path d="M 60 40 Q 100 0 140 40 T 170 180 L 140 260 L 40 260 L 10 180 Z" fill="none" stroke="#00dfd8" stroke-width="3" stroke-dasharray="8 4"/>
        </g>

        <!-- AI Status Badge -->
        <rect x="16" y="16" width="220" height="32" rx="6" fill="#00dfd8"/>
        <text x="126" y="37" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">AI SUBJECT ISOLATED ✓</text>
      </g>

      <!-- AI Features Controls -->
      <g transform="translate(24, 420)">
        <rect width="492" height="50" rx="8" fill="#1b2538" stroke="#2c3a54"/>
        <text x="20" y="30" fill="#ffffff" font-size="13" font-weight="bold">AI Auto Noise Remover: Active (-18dB Background Hiss)</text>
      </g>
      <g transform="translate(24, 485)">
        <rect width="492" height="50" rx="8" fill="#1b2538" stroke="#2c3a54"/>
        <text x="20" y="30" fill="#ffffff" font-size="13" font-weight="bold">AI Auto Caption Generator: English (99.4% Acc)</text>
      </g>
    </g>

    <!-- Right Screen: Custom Speed Ramping Curve -->
    <g transform="translate(590, 30)">
      <rect width="540" height="580" rx="12" fill="#0f1522" stroke="#1e293b"/>
      <text x="24" y="40" fill="#ffffff" font-size="18" font-weight="bold">Speed Ramping &amp; Time Remapping</text>

      <!-- Graph Window -->
      <g transform="translate(24, 70)">
        <rect width="492" height="320" rx="10" fill="#161f31" stroke="#253248"/>
        <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="bold">SPEED CURVE: FAST IN - SLOW MO - FAST OUT</text>
        
        <!-- Center baseline 1x -->
        <line x1="20" y1="180" x2="472" y2="180" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="440" y="175" fill="#475569" font-size="11">1.0x Normal</text>

        <!-- 4x High Speed line -->
        <text x="440" y="65" fill="#ff4757" font-size="11" font-weight="bold">4.0x Fast</text>
        <!-- 0.25x Slow Motion line -->
        <text x="430" y="275" fill="#1e90ff" font-size="11" font-weight="bold">0.25x Slow</text>

        <!-- Speed Ramp Bezier Curve -->
        <path d="M 30 180 Q 120 60 200 60 T 320 270 T 450 180" fill="none" stroke="#ff4757" stroke-width="4"/>
        
        <!-- Control points -->
        <circle cx="200" cy="60" r="7" fill="#ffffff" stroke="#ff4757" stroke-width="3"/>
        <circle cx="320" cy="270" r="7" fill="#ffffff" stroke="#1e90ff" stroke-width="3"/>
      </g>

      <!-- Preset Buttons -->
      <g transform="translate(24, 420)">
        <text x="0" y="0" fill="#cbd5e1" font-size="13" font-weight="bold">SPEED RAMP PRESETS</text>
        <g transform="translate(0, 15)">
          <rect x="0" y="0" width="110" height="38" rx="6" fill="#ff4757"/>
          <text x="55" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Hero Velocity</text>
          
          <rect x="125" y="0" width="110" height="38" rx="6" fill="#1e293b"/>
          <text x="180" y="24" fill="#cbd5e1" font-size="12" text-anchor="middle">Bullet Time</text>

          <rect x="250" y="0" width="110" height="38" rx="6" fill="#1e293b"/>
          <text x="305" y="24" fill="#cbd5e1" font-size="12" text-anchor="middle">Montage Flash</text>

          <rect x="375" y="0" width="110" height="38" rx="6" fill="#1e293b"/>
          <text x="430" y="24" fill="#cbd5e1" font-size="12" text-anchor="middle">Reverse Motion</text>
        </g>
      </g>
    </g>
  </g>
</svg>