<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Title Bar -->
  <rect x="0" y="0" width="1280" height="50" fill="#1e293b"/>
  <rect x="16" y="10" width="30" height="30" rx="6" fill="#ea580c"/>
  <text x="31" y="31" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
  <text x="56" y="30" font-size="15" font-weight="800" fill="#ffffff">WPS Presentation</text>
  <text x="200" y="30" font-size="13" fill="#94a3b8">-[AI_Productivity_Suite_PitchDeck.pptx] - Slide 3 of 12</text>
  
  <!-- Ribbon Toolbar -->
  <rect x="0" y="50" width="1280" height="70" fill="#1e293b"/>
  <line x1="0" y1="50" x2="1280" y2="50" stroke="#334155" stroke-width="1"/>
  <line x1="0" y1="120" x2="1280" y2="120" stroke="#334155" stroke-width="1"/>

  <g transform="translate(20, 60)">
    <rect width="60" height="24" rx="4" fill="#ea580c"/>
    <text x="30" y="16" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Home</text>
    <text x="90" y="16" font-size="12" fill="#cbd5e1">Slide Master</text>
    <text x="175" y="16" font-size="12" fill="#cbd5e1">Transitions</text>
    <text x="255" y="16" font-size="12" fill="#cbd5e1">Animations</text>
    <rect x="335" y="-2" width="120" height="26" rx="4" fill="#8b5cf6"/>
    <text x="395" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">✨ AI Slide Creator</text>
  </g>

  <!-- Left Slide Thumbnails Pane -->
  <rect x="0" y="120" width="220" height="570" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Slide 1 Thumbnail -->
  <g transform="translate(20, 140)">
    <rect width="180" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="10" y="20" font-size="10" fill="#fdba74">Slide 1: Title Card</text>
  </g>
  
  <!-- Slide 2 Thumbnail -->
  <g transform="translate(20, 255)">
    <rect width="180" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="10" y="20" font-size="10" fill="#fdba74">Slide 2: Problem Statement</text>
  </g>

  <!-- Slide 3 Active Thumbnail -->
  <g transform="translate(20, 370)">
    <rect width="180" height="100" rx="6" fill="#0f172a" stroke="#ea580c" stroke-width="2"/>
    <text x="10" y="20" font-size="10" font-weight="700" fill="#ea580c">Slide 3: Market Size &amp; Growth</text>
  </g>

  <!-- Main Slide Canvas Stage -->
  <g transform="translate(250, 140)">
    <rect width="980" height="520" rx="10" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Slide Header -->
    <text x="50" y="60" font-size="28" font-weight="900" fill="#ffffff">Market Potential &amp; Cloud Productivity Suite Expansion</text>
    <text x="50" y="90" font-size="15" fill="#fdba74">Global Office Productivity Software Market Size (2024 - 2030 Forecast)</text>

    <!-- Slide Content Cards -->
    <g transform="translate(50, 120)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="270" height="320" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="24" y="40" font-size="32" font-weight="900" fill="#38bdf8">$58.4 B</text>
        <text x="24" y="70" font-size="16" font-weight="800" fill="#ffffff">Market Size 2026</text>
        <text x="24" y="100" font-size="13" fill="#cbd5e1" line-height="1.5">
          Driven by hybrid work policies, remote team collaboration, and generative AI adoption.
        </text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(300, 0)">
        <rect width="270" height="320" rx="12" fill="#1e293b" stroke="#ea580c"/>
        <text x="24" y="40" font-size="32" font-weight="900" fill="#f97316">500 M+</text>
        <text x="24" y="70" font-size="16" font-weight="800" fill="#ffffff">Active WPS Users</text>
        <text x="24" y="100" font-size="13" fill="#cbd5e1" line-height="1.5">
          Global user base across Windows, macOS, Android, iOS, and Linux platforms.
        </text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(600, 0)">
        <rect width="270" height="320" rx="12" fill="#1e293b" stroke="#334155"/>
        <text x="24" y="40" font-size="32" font-weight="900" fill="#4ade80">70% OFF</text>
        <text x="24" y="70" font-size="16" font-weight="800" fill="#ffffff">Enterprise Cost Advantage</text>
        <text x="24" y="100" font-size="13" fill="#cbd5e1" line-height="1.5">
          Substantial cost savings compared to traditional Microsoft 365 licensing costs.
        </text>
      </g>
    </g>
  </g>

  <!-- Status Bar -->
  <rect x="0" y="690" width="1280" height="30" fill="#1e293b"/>
  <text x="20" y="710" font-size="12" fill="#94a3b8">Slide 3 of 12 | Theme: Dark Modern Executive | Ratio: 16:9 | Presenter Notes: Active</text>
</svg>
