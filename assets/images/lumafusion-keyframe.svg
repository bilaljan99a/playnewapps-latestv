        <text x="12" y="26" fill="#f0f6fc" font-size="13" font-weight="600">Opacity</text>
        <text x="324" y="26" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="end">100 %</text>
        
        <!-- Slider Track -->
        <rect x="12" y="44" width="312" height="8" rx="4" fill="#21262d"/>
        <rect x="12" y="44" width="312" height="8" rx="4" fill="#1f6feb"/>
        <circle cx="324" cy="48" r="8" fill="#58a6ff" stroke="#ffffff"/>
      </g>
    
      <g transform="translate(24, 585)">
        <rect width="336" height="82" rx="6" fill="#0d1117" stroke="#30363d"/>
        <text x="12" y="26" fill="#f0f6fc" font-size="13" font-weight="600">Motion Blur Easing</text>
        <text x="324" y="26" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="end">Cubic Bezier</text>
        
        <!-- Slider Track -->
        <rect x="12" y="44" width="312" height="8" rx="4" fill="#21262d"/>
        <rect x="12" y="44" width="249.60000000000002" height="8" rx="4" fill="#1f6feb"/>
        <circle cx="261.6" cy="48" r="8" fill="#58a6ff" stroke="#ffffff"/>
      </g>
    

    <!-- Right Curve Canvas -->
    <rect x="384" y="60" width="884" height="648" rx="8" fill="#010409" stroke="#30363d"/>
    <text x="404" y="88" fill="#8b949e" font-size="13" font-weight="700">VELOCITY & EASING CURVE EDITOR (BÉZIER GRAPH)</text>

    <!-- Grid background lines -->
    <g stroke="#21262d" stroke-width="1">
      <line x1="400" y1="150" x2="1240" y2="150"/>
      <line x1="400" y1="270" x2="1240" y2="270"/>
      <line x1="400" y1="390" x2="1240" y2="390"/>
      <line x1="400" y1="510" x2="1240" y2="510"/>
      <line x1="400" y1="630" x2="1240" y2="630"/>

      <line x1="560" y1="110" x2="560" y2="660"/>
      <line x1="720" y1="110" x2="720" y2="660"/>
      <line x1="880" y1="110" x2="880" y2="660"/>
      <line x1="1040" y1="110" x2="1040" y2="660"/>
    </g>

    <!-- Curve Path -->
    <path d="M 420 580 C 600 580, 680 180, 880 180 C 1040 180, 1120 420, 1220 420" fill="none" stroke="#58a6ff" stroke-width="4"/>
    
    <!-- Keyframe Handle Points -->
    <!-- Point 1 -->
    <polygon points="420,570 430,580 420,590 410,580" fill="#d29922" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Point 2 -->
    <polygon points="880,170 890,180 880,190 870,180" fill="#d29922" stroke="#ffffff" stroke-width="2"/>
    <line x1="880" y1="180" x2="780" y2="180" stroke="#d29922" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="780" cy="180" r="6" fill="#d29922"/>

    <!-- Point 3 -->
    <polygon points="1220,410 1230,420 1220,430 1210,420" fill="#d29922" stroke="#ffffff" stroke-width="2"/>
