        <rect x="12" y="44" width="156" height="8" rx="4" fill="#1f6feb"/>
        <circle cx="168" cy="48" r="8" fill="#58a6ff" stroke="#ffffff"/>
      </g>
    
      <g transform="translate(24, 300)">
        <rect width="336" height="82" rx="6" fill="#0d1117" stroke="#30363d"/>
        <text x="12" y="26" fill="#f0f6fc" font-size="13" font-weight="600">Scale (Zoom)</text>
        <text x="324" y="26" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="end">145 %</text>
        
        <!-- Slider Track -->
        <rect x="12" y="44" width="312" height="8" rx="4" fill="#21262d"/>
        <rect x="12" y="44" width="234" height="8" rx="4" fill="#1f6feb"/>
        <circle cx="246" cy="48" r="8" fill="#58a6ff" stroke="#ffffff"/>
      </g>
    
      <g transform="translate(24, 395)">
        <rect width="336" height="82" rx="6" fill="#0d1117" stroke="#30363d"/>
        <text x="12" y="26" fill="#f0f6fc" font-size="13" font-weight="600">Rotation</text>
        <text x="324" y="26" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="end">12.5 deg</text>
        
        <!-- Slider Track -->
        <rect x="12" y="44" width="312" height="8" rx="4" fill="#21262d"/>
        <rect x="12" y="44" width="109.2" height="8" rx="4" fill="#1f6feb"/>
        <circle cx="121.2" cy="48" r="8" fill="#58a6ff" stroke="#ffffff"/>
