<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0c10;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <rect width="1280" height="720" fill="#0a0d14"/>
  <g transform="translate(240, 80)">
    <rect width="800" height="560" rx="16" fill="#131822" stroke="#222c3d" stroke-width="2"/>
    <text x="40" y="50" fill="#ffffff" font-size="20" font-weight="bold">Share &amp; Export Artwork</text>

    <!-- Export Grids -->
    <g transform="translate(40, 80)">
      <text x="0" y="20" fill="#ff007f" font-size="13" font-weight="700">IMAGE FORMATS</text>
      
      <rect x="0" y="35" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="60" fill="#ffffff" font-size="15" font-weight="bold">.procreate</text>
      <text x="20" y="78" fill="#94a3b8" font-size="11">Native Procreate Document</text>

      <rect x="250" y="35" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="270" y="60" fill="#ffffff" font-size="15" font-weight="bold">PSD</text>
      <text x="270" y="78" fill="#94a3b8" font-size="11">Adobe Photoshop Multi-Layer</text>

      <rect x="500" y="35" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="520" y="60" fill="#ffffff" font-size="15" font-weight="bold">PDF</text>
      <text x="520" y="78" fill="#94a3b8" font-size="11">Vector &amp; Raster Print Ready</text>

      <rect x="0" y="110" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="135" fill="#ffffff" font-size="15" font-weight="bold">PNG</text>
      <text x="20" y="153" fill="#94a3b8" font-size="11">Lossless with Transparency</text>

      <rect x="250" y="110" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="270" y="135" fill="#ffffff" font-size="15" font-weight="bold">JPEG</text>
      <text x="270" y="153" fill="#94a3b8" font-size="11">High Quality Web Image</text>

      <rect x="500" y="110" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="520" y="135" fill="#ffffff" font-size="15" font-weight="bold">TIFF</text>
      <text x="520" y="153" fill="#94a3b8" font-size="11">Uncompressed Archival</text>
    </g>

    <g transform="translate(40, 280)">
      <text x="0" y="20" fill="#00dfd8" font-size="13" font-weight="700">ANIMATION &amp; VIDEO EXPORTS</text>

      <rect x="0" y="35" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="60" fill="#ffffff" font-size="15" font-weight="bold">4K MP4 Video</text>
      <text x="20" y="78" fill="#94a3b8" font-size="11">Time-Lapse Speedpaint</text>

      <rect x="250" y="35" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="270" y="60" fill="#ffffff" font-size="15" font-weight="bold">Animated GIF</text>

      <rect x="500" y="35" width="220" height="60" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="520" y="60" fill="#ffffff" font-size="15" font-weight="bold">Animated PNG</text>
    </g>

    <!-- Bottom Buttons -->
    <g transform="translate(40, 470)">
      <rect x="0" y="0" width="720" height="50" rx="10" fill="#ff007f"/>
      <text x="360" y="31" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Export to iOS Files &amp; AirDrop</text>
    </g>
  </g>
</svg>