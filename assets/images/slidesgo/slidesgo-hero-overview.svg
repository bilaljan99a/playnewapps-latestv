<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#31103F"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#536DFE"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1DE9B6"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#7C4DFF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#heroBg)"/>
  <circle cx="200" cy="150" r="280" fill="#FF4081" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="1000" cy="500" r="320" fill="#7C4DFF" fill-opacity="0.15" filter="blur(80px)"/>

  <!-- Top App Bar Navigation Mockup -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
  <circle cx="70" cy="60" r="12" fill="#FF5252"/>
  <text x="92" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20">slidesgo</text>

  <!-- Search Bar in Header -->
  <rect x="240" y="42" width="480" height="36" rx="18" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="270" y="65" fill="#94A3B8" font-family="sans-serif" font-size="14">🔍 Search 15,000+ Google Slides &amp; PowerPoint Templates...</text>

  <!-- Header Buttons -->
  <rect x="860" y="42" width="130" height="36" rx="18" fill="url(#cardGrad2)"/>
  <text x="888" y="65" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">AI Presentation</text>

  <rect x="1005" y="42" width="130" height="36" rx="18" fill="url(#cardGrad1)"/>
  <text x="1032" y="65" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">Go Premium</text>

  <!-- Hero Content Section Mockup -->
  <text x="600" y="145" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="34">Free Google Slides Themes &amp; PowerPoint Templates</text>
  <text x="600" y="180" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="16">Boost your presentations with customizable templates and AI-powered slide generation</text>

  <!-- Template Cards Showcase Grid -->
  <!-- Card 1: Education -->
  <g transform="translate(60, 220)" filter="url(#shadowGlow)">
    <rect width="330" height="390" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <path d="M 0 20 Q 0 0 20 0 L 310 0 Q 330 0 330 20 L 330 220 L 0 220 Z" fill="url(#cardGrad1)"/>
    <text x="25" y="50" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="22">Interactive Lesson Plan</text>
    <rect x="25" y="80" width="140" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="25" y="98" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="25" y="116" width="180" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>
    <!-- Illustration graphics on card -->
    <circle cx="250" cy="150" r="45" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="235" y="160" fill="#FFFFFF" font-size="32">🎓</text>

    <!-- Card Metadata -->
    <text x="25" y="260" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="18">Cute Education Slide</text>
    <text x="25" y="285" fill="#94A3B8" font-family="sans-serif" font-size="13">Education • 34 Slides • 16:9 Widescreen</text>
    <rect x="25" y="310" width="90" height="28" rx="14" fill="#FF5252" fill-opacity="0.2"/>
    <text x="42" y="329" fill="#FF5252" font-family="sans-serif" font-weight="700" font-size="12">PREMIUM</text>
    <rect x="125" y="310" width="180" height="28" rx="14" fill="#334155"/>
    <text x="145" y="329" fill="#CBD5E1" font-family="sans-serif" font-size="12">Google Slides &amp; PPT</text>
  </g>

  <!-- Card 2: Business &amp; AI -->
  <g transform="translate(435, 220)" filter="url(#shadowGlow)">
    <rect width="330" height="390" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <path d="M 0 20 Q 0 0 20 0 L 310 0 Q 330 0 330 20 L 330 220 L 0 220 Z" fill="url(#cardGrad2)"/>
    <text x="25" y="50" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="22">AI Pitch Deck 2026</text>
    <rect x="25" y="80" width="160" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <rect x="25" y="98" width="240" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="250" cy="150" r="45" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="235" y="160" fill="#FFFFFF" font-size="32">⚡</text>

    <!-- Card Metadata -->
    <text x="25" y="260" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="18">Business &amp; Startup Pitch</text>
    <text x="25" y="285" fill="#94A3B8" font-family="sans-serif" font-size="13">Business • 48 Slides • Infographics</text>
    <rect x="25" y="310" width="70" height="28" rx="14" fill="#10B981" fill-opacity="0.2"/>
    <text x="42" y="329" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="12">FREE</text>
    <rect x="105" y="310" width="200" height="28" rx="14" fill="#334155"/>
    <text x="120" y="329" fill="#CBD5E1" font-family="sans-serif" font-size="12">AI Auto-Generator Ready</text>
  </g>

  <!-- Card 3: Medical &amp; Science -->
  <g transform="translate(810, 220)" filter="url(#shadowGlow)">
    <rect width="330" height="390" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <path d="M 0 20 Q 0 0 20 0 L 310 0 Q 330 0 330 20 L 330 220 L 0 220 Z" fill="url(#cardGrad3)"/>
    <text x="25" y="50" fill="#0F172A" font-family="sans-serif" font-weight="800" font-size="22">Medical Breakthrough</text>
    <rect x="25" y="80" width="130" height="8" rx="4" fill="#0F172A" fill-opacity="0.6"/>
    <rect x="25" y="98" width="200" height="8" rx="4" fill="#0F172A" fill-opacity="0.4"/>
    <circle cx="250" cy="150" r="45" fill="#0F172A" fill-opacity="0.1"/>
    <text x="235" y="160" fill="#0F172A" font-size="32">🧬</text>

    <!-- Card Metadata -->
    <text x="25" y="260" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="18">Healthcare &amp; Science Deck</text>
    <text x="25" y="285" fill="#94A3B8" font-family="sans-serif" font-size="13">Medical • 30 Slides • Editable Diagrams</text>
    <rect x="25" y="310" width="90" height="28" rx="14" fill="#FF5252" fill-opacity="0.2"/>
    <text x="42" y="329" fill="#FF5252" font-family="sans-serif" font-weight="700" font-size="12">PREMIUM</text>
    <rect x="125" y="310" width="180" height="28" rx="14" fill="#334155"/>
    <text x="145" y="329" fill="#CBD5E1" font-family="sans-serif" font-size="12">Google Slides &amp; PPT</text>
  </g>
</svg>
