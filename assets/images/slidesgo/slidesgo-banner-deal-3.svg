    <text x="0" y="108" fill="#E0E7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16">Empower interactive learning with gamified slide decks, lesson plans, and quiz templates.</text>

    <!-- Discount Highlight -->
    <text x="0" y="148" fill="#FFD700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="19">Get Up To 60% OFF Education Plans for Teachers &amp; Schools</text>
  </g>

  <!-- CTA Button placed safely at x=860, width=290 -->
  <g transform="translate(860, 98)">
    <rect width="290" height="64" rx="32" fill="#FFFFFF"/>
    <text x="145" y="39" text-anchor="middle" fill="#4318FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18">Claim School Discount 🎓</text>
