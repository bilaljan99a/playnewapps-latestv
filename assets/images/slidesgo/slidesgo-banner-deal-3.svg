      <stop offset="0%" stop-color="#4318FF"/>
      <stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#b3Grad)"/>
  
  <g transform="translate(50, 38)">
    <!-- Badge -->
    <rect width="230" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="14" y="20" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12">🎓 EDUCATORS &amp; STUDENTS</text>

    <!-- Main Title (Width constrained to 760px) -->
