<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="glowLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="550" rx="24" fill="url(#aiBg)"/>
  
  <!-- Outer Window Frame -->
  <rect x="30" y="30" width="940" height="490" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="6" fill="#EF4444"/>
  <circle cx="80" cy="60" r="6" fill="#F59E0B"/>
  <circle cx="100" cy="60" r="6" fill="#10B981"/>
  <text x="500" y="65" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-weight="600" font-size="14">Slidesgo AI Presentation Maker Engine</text>

  <!-- Left Sidebar: Settings & Controls -->
  <rect x="50" y="90" width="280" height="410" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="70" y="125" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">✨ AI Generator Prompt</text>
  
  <!-- Topic Input -->
  <text x="70" y="155" fill="#94A3B8" font-family="sans-serif" font-size="12">Topic / Topic Description</text>
  <rect x="70" y="165" width="240" height="44" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="82" y="192" fill="#CBD5E1" font-family="sans-serif" font-size="13">Digital Marketing Strategy 2026</text>

  <!-- Tone Selector -->
  <text x="70" y="235" fill="#94A3B8" font-family="sans-serif" font-size="12">Writing Tone</text>
  <rect x="70" y="245" width="240" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="82" y="268" fill="#FFFFFF" font-family="sans-serif" font-size="13">Professional &amp; Creative ▾</text>

  <!-- Style Selector -->
  <text x="70" y="305" fill="#94A3B8" font-family="sans-serif" font-size="12">Design Theme Style</text>
  <g transform="translate(70, 315)">
    <rect width="70" height="40" rx="6" fill="#FF4081" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="80" y="0" width="70" height="40" rx="6" fill="#7C4DFF"/>
    <rect x="160" y="0" width="70" height="40" rx="6" fill="#10B981"/>
  </g>

  <!-- Number of Slides -->
  <text x="70" y="380" fill="#94A3B8" font-family="sans-serif" font-size="12">Number of Slides</text>
  <rect x="70" y="390" width="240" height="32" rx="8" fill="#1E293B"/>
  <rect x="70" y="390" width="160" height="32" rx="8" fill="url(#glowLinear)"/>
  <text x="190" y="411" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12">12 Slides</text>

  <!-- Generate Button -->
  <rect x="70" y="440" width="240" height="44" rx="22" fill="url(#glowLinear)"/>
  <text x="190" y="467" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="15">🚀 Generate Slides with AI</text>

  <!-- Right Canvas: Generated Presentation Preview -->
  <rect x="350" y="90" width="600" height="410" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  
  <!-- Slide Live Workspace -->
  <rect x="380" y="120" width="540" height="310" rx="12" fill="#1E1B4B" stroke="#7C4DFF" stroke-width="2"/>
  
  <!-- Generated Slide Content Header -->
  <rect x="410" y="150" width="280" height="24" rx="6" fill="#FF4081"/>
  <rect x="410" y="190" width="320" height="10" rx="5" fill="#E2E8F0" fill-opacity="0.8"/>
  <rect x="410" y="210" width="290" height="10" rx="5" fill="#E2E8F0" fill-opacity="0.6"/>
  <rect x="410" y="230" width="240" height="10" rx="5" fill="#E2E8F0" fill-opacity="0.6"/>

  <!-- Generated Graphics Element -->
  <rect x="720" y="150" width="170" height="170" rx="16" fill="#312E81" stroke="#4338CA" stroke-width="1"/>
  <circle cx="805" cy="235" r="45" fill="#7C4DFF" fill-opacity="0.4"/>
  <text x="805" y="243" text-anchor="middle" fill="#FFFFFF" font-size="28">📈</text>

  <!-- Bottom Slide Carousel Strip -->
  <g transform="translate(380, 445)">
    <rect width="70" height="45" rx="6" fill="#FF4081" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="80" y="0" width="70" height="45" rx="6" fill="#334155"/>
    <rect x="160" y="0" width="70" height="45" rx="6" fill="#334155"/>
    <rect x="240" y="0" width="70" height="45" rx="6" fill="#334155"/>
    <rect x="320" y="0" width="70" height="45" rx="6" fill="#334155"/>
    <text x="440" y="28" fill="#94A3B8" font-family="sans-serif" font-size="12">+7 Auto-Generated</text>
  </g>
</svg>
