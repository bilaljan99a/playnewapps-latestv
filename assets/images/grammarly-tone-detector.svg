<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="toneGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1280" height="70" fill="#1e293b"/>
  <line x1="0" y1="70" x2="1280" y2="70" stroke="#334155" stroke-width="1"/>
  
  <g transform="translate(24, 16)">
    <rect width="36" height="36" rx="8" fill="url(#toneGrad)"/>
    <text x="18" y="24" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">🎯</text>
    <text x="48" y="22" font-size="18" font-weight="700" fill="#ffffff">Grammarly Tone Detector &amp; Impression Adjuster</text>
    <text x="48" y="38" font-size="12" fill="#c084fc">Real-time emotional sentiment analysis &amp; formality tuning across 40+ emotional tones</text>
  </g>

  <!-- Left: Real-Time Sentiment Radar & Analysis -->
  <g transform="translate(30, 90)">
    <rect width="580" height="600" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="36" font-size="18" font-weight="700" fill="#ffffff">Current Document Tone Spectrum</text>

    <!-- Emotional Tone Meters -->
    <g transform="translate(24, 60)">
      <!-- Tone 1: Confident -->
      <g transform="translate(0, 0)">
        <rect width="532" height="76" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
        <text x="16" y="28" font-size="15" font-weight="700" fill="#ffffff">💪 Confident &amp; Assertive</text>
        <text x="440" y="28" font-size="14" font-weight="800" fill="#c084fc">92% Intensity</text>
        <rect x="16" y="42" width="500" height="12" rx="6" fill="#334155"/>
        <rect x="16" y="42" width="460" height="12" rx="6" fill="#c084fc"/>
      </g>

      <!-- Tone 2: Professional -->
      <g transform="translate(0, 92)">
        <rect width="532" height="76" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
        <text x="16" y="28" font-size="15" font-weight="700" fill="#ffffff">💼 Formal &amp; Executive</text>
        <text x="440" y="28" font-size="14" font-weight="800" fill="#38bdf8">85% Intensity</text>
        <rect x="16" y="42" width="500" height="12" rx="6" fill="#334155"/>
        <rect x="16" y="42" width="425" height="12" rx="6" fill="#38bdf8"/>
      </g>

      <!-- Tone 3: Optimistic -->
      <g transform="translate(0, 184)">
        <rect width="532" height="76" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
        <text x="16" y="28" font-size="15" font-weight="700" fill="#ffffff">🌟 Optimistic &amp; Constructive</text>
        <text x="440" y="28" font-size="14" font-weight="800" fill="#22c55e">78% Intensity</text>
        <rect x="16" y="42" width="500" height="12" rx="6" fill="#334155"/>
        <rect x="16" y="42" width="390" height="12" rx="6" fill="#22c55e"/>
      </g>

      <!-- Tone 4: Direct -->
      <g transform="translate(0, 276)">
        <rect width="532" height="76" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
        <text x="16" y="28" font-size="15" font-weight="700" fill="#ffffff">🎯 Direct &amp; Concise</text>
        <text x="440" y="28" font-size="14" font-weight="800" fill="#f59e0b">70% Intensity</text>
        <rect x="16" y="42" width="500" height="12" rx="6" fill="#334155"/>
        <rect x="16" y="42" width="350" height="12" rx="6" fill="#f59e0b"/>
      </g>
    </g>

    <!-- Tone Recommendation Card -->
    <g transform="translate(24, 430)">
      <rect width="532" height="140" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="20" y="30" font-size="14" font-weight="700" fill="#c084fc">Audience Reception Prediction:</text>
      <text x="20" y="58" font-size="13" fill="#cbd5e1" font-family="Georgia, serif">
        <tspan x="20" dy="0">"This proposal projects decisiveness and authority without coming across as overly</tspan>
        <tspan x="20" dy="24">aggressive. Ideal for executive stakeholders, board members, and prospective clients."</tspan>
      </text>
    </g>
  </g>

  <!-- Right: Formality & Domain Goal Settings -->
  <g transform="translate(630, 90)">
    <rect width="620" height="600" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
    
    <text x="24" y="36" font-size="18" font-weight="700" fill="#ffffff">Set Writing Goals &amp; Audience Context</text>

    <!-- Formality Level Slider -->
    <g transform="translate(24, 60)">
      <rect width="572" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="30" font-size="14" font-weight="700" fill="#ffffff">Formality Scale Level:</text>
      <text x="480" y="30" font-size="13" font-weight="700" fill="#38bdf8">Strictly Formal</text>

      <rect x="16" y="55" width="540" height="10" rx="5" fill="#334155"/>
      <circle cx="480" cy="60" r="14" fill="#38bdf8"/>

      <text x="16" y="88" font-size="11" fill="#94a3b8">Informal</text>
      <text x="260" y="88" font-size="11" fill="#94a3b8">Neutral</text>
      <text x="480" y="88" font-size="11" font-weight="700" fill="#38bdf8">Formal</text>
    </g>

    <!-- Domain Settings Grid -->
    <g transform="translate(24, 184)">
      <text x="0" y="20" font-size="14" font-weight="700" fill="#ffffff">Select Writing Domain:</text>
      
      <g transform="translate(0, 32)">
        <rect width="180" height="90" rx="8" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
        <text x="20" y="35" font-size="20">💼</text>
        <text x="20" y="60" font-size="14" font-weight="700" fill="#ffffff">Business</text>
        <text x="20" y="78" font-size="10" fill="#86efac">Executive/Client</text>

        <rect x="196" y="0" width="180" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="216" y="35" font-size="20">🎓</text>
        <text x="216" y="60" font-size="14" font-weight="700" fill="#ffffff">Academic</text>
        <text x="216" y="78" font-size="10" fill="#94a3b8">Papers/Journals</text>

        <rect x="392" y="0" width="180" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="412" y="35" font-size="20">🚀</text>
        <text x="412" y="60" font-size="14" font-weight="700" fill="#ffffff">Casual</text>
        <text x="412" y="78" font-size="10" fill="#94a3b8">Messaging/Chat</text>
      </g>
    </g>

    <!-- Intent / Goal Tags -->
    <g transform="translate(24, 330)">
      <text x="0" y="20" font-size="14" font-weight="700" fill="#ffffff">Primary Document Intent:</text>
      
      <g transform="translate(0, 32)">
        <rect width="270" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="16" y="30" font-size="13" font-weight="600" fill="#38bdf8">🎯 Convince &amp; Persuade</text>

        <rect x="286" y="0" width="286" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="302" y="30" font-size="13" font-weight="600" fill="#cbd5e1">ℹ️ Inform &amp; Explain</text>

        <rect x="0" y="64" width="270" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="94" font-size="13" font-weight="600" fill="#cbd5e1">🎨 Storytelling &amp; Expressive</text>

        <rect x="286" y="64" width="286" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="302" y="94" font-size="13" font-weight="600" fill="#cbd5e1">✉️ Action Request</text>
      </g>
    </g>
  </g>
</svg>
