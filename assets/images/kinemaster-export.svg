<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <rect width="1280" height="720" fill="#0a0d17"/>

  <g transform="translate(140, 50)">
    <rect width="1000" height="620" rx="16" fill="#131a28" stroke="#222d42" stroke-width="2"/>
    <text x="40" y="50" fill="#ffffff" font-size="22" font-weight="bold">Save &amp; Export Project</text>

    <!-- Left Settings: Resolution &amp; FPS -->
    <g transform="translate(40, 80)">
      <text x="0" y="25" fill="#ff4757" font-size="14" font-weight="bold">RESOLUTION</text>

      <rect x="0" y="40" width="180" height="50" rx="8" fill="#ff4757"/>
      <text x="90" y="70" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">4K 2160p (UHD)</text>

      <rect x="200" y="40" width="180" height="50" rx="8" fill="#1e293b"/>
      <text x="290" y="70" fill="#cbd5e1" font-size="14" text-anchor="middle">FHD 1080p</text>

      <rect x="400" y="40" width="180" height="50" rx="8" fill="#1e293b"/>
      <text x="490" y="70" fill="#cbd5e1" font-size="14" text-anchor="middle">HD 720p</text>

      <!-- Frame Rate -->
      <text x="0" y="135" fill="#1e90ff" font-size="14" font-weight="bold">FRAME RATE (FPS)</text>

      <rect x="0" y="150" width="130" height="46" rx="8" fill="#1e90ff"/>
      <text x="65" y="178" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">60 FPS</text>

      <rect x="145" y="150" width="130" height="46" rx="8" fill="#1e293b"/>
      <text x="210" y="178" fill="#cbd5e1" font-size="14" text-anchor="middle">30 FPS</text>

      <rect x="290" y="150" width="130" height="46" rx="8" fill="#1e293b"/>
      <text x="355" y="178" fill="#cbd5e1" font-size="14" text-anchor="middle">24 FPS (Cinema)</text>

      <!-- Bitrate Slider -->
      <text x="0" y="240" fill="#cbd5e1" font-size="14">Bitrate Control: 48 Mbps (High Quality)</text>
      <rect x="0" y="255" width="580" height="12" rx="6" fill="#1e293b"/>
      <rect x="0" y="255" width="450" height="12" rx="6" fill="#ff4757"/>
      <circle cx="450" cy="261" r="11" fill="#ffffff" stroke="#ff4757" stroke-width="3"/>

      <!-- File Size Estimate -->
      <rect x="0" y="295" width="580" height="50" rx="8" fill="#1b2538" stroke="#2c3a54"/>
      <text x="20" y="325" fill="#00e676" font-size="13" font-weight="bold">Estimated File Size: 412 MB • Free Storage: 42.8 GB</text>
    </g>

    <!-- Right Render Action Card -->
    <g transform="translate(660, 80)">
      <rect width="300" height="340" rx="12" fill="#0f1522" stroke="#1e293b"/>
      <text x="20" y="35" fill="#ffffff" font-size="16" font-weight="bold">EXPORT SUMMARY</text>
      
      <text x="20" y="75" fill="#94a3b8" font-size="13">Format: MP4 (H.264)</text>
      <text x="20" y="105" fill="#94a3b8" font-size="13">Encoder: Hardware GPU</text>
      <text x="20" y="135" fill="#94a3b8" font-size="13">Watermark: REMOVED ✓</text>
      <text x="20" y="165" fill="#94a3b8" font-size="13">Audio: Stereo 320kbps AAC</text>

      <g transform="translate(20, 240)">
        <rect width="260" height="56" rx="10" fill="#ff4757"/>
        <text x="130" y="34" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">SAVE AS VIDEO ▶</text>
      </g>
    </g>
  </g>
</svg>