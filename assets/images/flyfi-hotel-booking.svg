<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="flyfiGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="35%" stop-color="#6B21A8"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="#0F172A"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="800" height="64" fill="#1E293B"/>

  <!-- Header Logo Emblem -->
  <g id="header-logo-group" transform="translate(30, 12)">
    <circle cx="20" cy="20" r="18" fill="url(#flyfiGrad)"/>
    <path d="M 8 16 C 9 14, 27 7, 35 7 C 37 7, 37 9, 33 11 C 27 14, 13 20, 10 20 Z" fill="#FFFFFF"/>
    <path d="M 10 22 C 11 19, 28 13, 34 13 C 36 13, 36 15, 32 16 C 26 20, 14 24, 11 24 Z" fill="#FFFFFF"/>
    <path d="M 13 27 C 14 26, 27 20, 32 20 C 33 20, 33 22, 30 23 C 25 26, 16 29, 14 29 Z" fill="#FFFFFF"/>
    <text x="48" y="27" font-family="sans-serif" font-weight="900" font-size="22" fill="#A855F7">flyfi <tspan font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Hotels</tspan></text>
  </g>

  <rect x="510" y="18" width="135" height="28" rx="14" fill="#334155"/>
  <text x="525" y="36" font-family="system-ui, sans-serif" font-size="12" fill="#38BDF8">Pay with 30+ Cryptos</text>
  <rect x="660" y="16" width="120" height="32" rx="16" fill="#2563EB"/>
  <text x="680" y="37" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Connect Wallet</text>

  <!-- Search Card -->
  <rect x="40" y="88" width="720" height="70" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="64" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">DESTINATION</text>
  <text x="64" y="136" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#FFFFFF">Dubai, UAE — 300,000+ Hotels</text>
  <text x="340" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">DATES &amp; GUESTS</text>
  <text x="340" y="136" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#FFFFFF">3 Nights • 2 Guests</text>
  <rect x="600" y="102" width="140" height="42" rx="8" fill="#2563EB"/>
  <text x="635" y="128" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Search Hotels</text>

  <!-- Hotel List Cards -->
  <!-- Hotel 1 -->
  <rect x="40" y="180" width="348" height="230" rx="12" fill="#1E293B" stroke="#334155"/>
  <rect x="40" y="180" width="348" height="110" rx="12" fill="#0284C7"/>
  <text x="60" y="240" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">Burj Al Arab Luxury Suite</text>
  <text x="60" y="265" font-family="system-ui, sans-serif" font-size="13" fill="#E0F2FE">Jumeirah Beach, Dubai • 5-Star Resort</text>
  <text x="60" y="320" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Flyfi Exclusive Price</text>
  <text x="60" y="348" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#38BDF8">0.0082 BTC <tspan font-size="13" fill="#94A3B8">(~$520 / night)</tspan></text>
  <rect x="60" y="365" width="308" height="32" rx="6" fill="#2563EB"/>
  <text x="160" y="386" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Book with Crypto</text>

  <!-- Hotel 2 -->
  <rect x="412" y="180" width="348" height="230" rx="12" fill="#1E293B" stroke="#334155"/>
  <rect x="412" y="180" width="348" height="110" rx="12" fill="#4F46E5"/>
  <text x="432" y="240" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">Marina Bay Sands Hotel</text>
  <text x="432" y="265" font-family="system-ui, sans-serif" font-size="13" fill="#E0E7FF">Singapore Waterfront • 5-Star</text>
  <text x="432" y="320" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Web3 Special Rate</text>
  <text x="432" y="348" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#818CF8">0.142 ETH <tspan font-size="13" fill="#94A3B8">(~$460 / night)</tspan></text>
  <rect x="432" y="365" width="308" height="32" rx="6" fill="#2563EB"/>
  <text x="532" y="386" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Book with Crypto</text>
</svg>
