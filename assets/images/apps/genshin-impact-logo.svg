<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1736"/>
      <stop offset="50%" stop-color="#1b2a57"/>
      <stop offset="100%" stop-color="#080f24"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe993"/>
      <stop offset="50%" stop-color="#d4a341"/>
      <stop offset="100%" stop-color="#996c1e"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#56bcff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#56bcff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" rx="90" fill="url(#gBg)"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="url(#gGold)" stroke-width="4" opacity="0.4"/>
  <circle cx="250" cy="250" r="180" fill="url(#gGlow)"/>
  <!-- 8-Pointed Paimon Star -->
  <g transform="translate(250,220) scale(1.4)">
    <path d="M 0,-80 Q 0,0 80,0 Q 0,0 0,80 Q 0,0 -80,0 Q 0,0 0,-80 Z" fill="url(#gGold)"/>
    <path d="M 0,-55 Q 0,0 55,0 Q 0,0 0,55 Q 0,0 -55,0 Q 0,0 0,-55 Z" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Crown / Wings -->
  <path d="M 170 340 Q 250 310 330 340 L 310 365 Q 250 340 190 365 Z" fill="url(#gGold)"/>
  <text x="250" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">GENSHIN</text>
  <text x="250" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="8" fill="#56bcff">IMPACT</text>
</svg>