<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00AEEF" />
    </linearGradient>
    <linearGradient id="darkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#005885" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Icon: 3D Airplane Crystal Facet Box -->
    <g transform="translate(5, 5)">
      <!-- Propeller -->
      <g transform="translate(42, 2)">
        <ellipse cx="0" cy="0" rx="4" ry="4" fill="#002B49" />
        <path d="M -2,-2 C -18,-20 -40,-22 -38,-10 C -36,0 -12,-3 -2,-2 Z" fill="#002B49" />
        <path d="M 2,2 C 18,20 40,22 38,10 C 36,0 12,3 2,2 Z" fill="#002B49" />
        <line x1="0" y1="0" x2="0" y2="12" stroke="#002B49" stroke-width="4" stroke-linecap="round" />
      </g>

      <!-- Poly Facet Cube -->
      <polygon points="42,16 12,32 42,50 72,32" fill="url(#cyanGrad)" stroke="#002B49" stroke-width="3" stroke-linejoin="round" />
      <polygon points="12,32 12,68 42,86 42,50" fill="url(#darkCyan)" stroke="#002B49" stroke-width="3" stroke-linejoin="round" />
      <polygon points="42,50 42,86 72,68 72,32" fill="url(#cyanGrad)" stroke="#002B49" stroke-width="3" stroke-linejoin="round" />
    </g>

    <!-- Wordmark "3DLABPRINT" in one clean horizontal block -->
    <g transform="translate(95, 20)">
      <text x="0" y="52" 
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
            font-weight="900" 
            font-size="46" 
            fill="#002B49" 
            letter-spacing="-1">3D<tspan fill="#00AEEF">LABPRINT</tspan></text>
    </g>
  </g>
</svg>
