<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="drfoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062FF" />
      <stop offset="50%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#00C2FF" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBF5FF" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#003B99" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#drfoneBg)" filter="url(#dropShadow)" />

  <!-- Smartphone Frame -->
  <rect x="156" y="96" width="200" height="320" rx="28" ry="28" fill="#FFFFFF" opacity="0.95" />
  <rect x="168" y="120" width="176" height="272" rx="16" ry="16" fill="#0A192F" />

  <!-- Screen Content / Medical Cross + Phone Recovery Pulse -->
  <path d="M 236 180 L 276 180 C 282 180, 286 184, 286 190 L 286 230 C 286 236, 290 240, 296 240 L 320 240 C 326 240, 330 244, 330 250 L 330 262 C 330 268, 326 272, 320 272 L 296 272 C 290 272, 286 276, 286 282 L 286 310 C 286 316, 282 320, 276 320 L 236 320 C 230 320, 226 316, 226 310 L 226 282 C 226 276, 222 272, 216 272 L 192 272 C 186 272, 182 268, 182 262 L 182 250 C 182 244, 186 240, 192 240 L 216 240 C 222 240, 226 236, 226 230 L 226 190 C 226 184, 230 180, 236 180 Z" fill="url(#drfoneBg)" />

  <!-- Center Diagnostic Pulse / Medical Stethoscope Heartbeat -->
  <path d="M 198 256 L 222 256 L 232 232 L 246 280 L 258 244 L 268 264 L 278 256 L 314 256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Speaker & Home Indicator -->
  <rect x="226" y="106" width="60" height="6" rx="3" ry="3" fill="#D0E2FF" />
</svg>
