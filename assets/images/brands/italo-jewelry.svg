<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100" fill="none">
  <!-- Background transparent -->
  <!-- ITALO Letters -->
  <g fill="#111827">
    <!-- Letter I -->
    <rect x="22" y="22" width="9" height="44" rx="1" />

    <!-- Letter T -->
    <rect x="39" y="22" width="36" height="7.5" rx="1" />
    <rect x="52.5" y="22" width="9" height="44" rx="1" />

    <!-- Letter A with inverted triangle inner shape -->
    <!-- Outer legs -->
    <path d="M98.5 22 L83 66 L93 66 L98.5 48 L104 66 L114 66 Z" />
    <!-- Crossbar and inverted triangle cut -->
    <polygon points="98.5,35 93,49 104,49" fill="#111827" />
    <polygon points="98.5,50 93.5,41 103.5,41" fill="#111827" />

    <!-- Letter L -->
    <path d="M124 22 L133 22 L133 58.5 L158 58.5 L158 66 L124 66 Z" />

    <!-- Letter O as an engagement ring circle -->
    <circle cx="194" cy="44" r="20" stroke="#111827" stroke-width="8" fill="none" />
    
    <!-- Diamond Gemstone atop O -->
    <g transform="translate(187, 8)">
      <!-- Diamond crown & pavilion -->
      <polygon points="7,0 0,6 7,14 14,6" fill="none" stroke="#111827" stroke-width="2" />
      <line x1="0" y1="6" x2="14" y2="6" stroke="#111827" stroke-width="1.8" />
      <line x1="4" y1="0" x2="2" y2="6" stroke="#111827" stroke-width="1.5" />
      <line x1="10" y1="0" x2="12" y2="6" stroke="#111827" stroke-width="1.5" />
      <line x1="7" y1="6" x2="7" y2="14" stroke="#111827" stroke-width="1.5" />
    </g>
  </g>

  <!-- Horizontal divider line -->
  <line x1="18" y1="73" x2="262" y2="73" stroke="#111827" stroke-width="1.2" />

  <!-- Subtitle: J e w e l r y -->
  <text x="140" y="91" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14.5" font-weight="500" fill="#111827" letter-spacing="13">JEWELRY</text>
</svg>