<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="resolveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="500" rx="16" fill="url(#resolveBg)"/>
  <rect x="1" y="1" width="998" height="498" rx="15" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Top Header Bar -->
  <rect x="30" y="25" width="940" height="45" rx="8" fill="#1e293b" filter="url(#glow)"/>
  <circle cx="55" cy="47" r="7" fill="#ef4444"/>
  <circle cx="75" cy="47" r="7" fill="#10b981"/>
  <circle cx="95" cy="47" r="7" fill="#3b82f6"/>
  <text x="120" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f8fafc">Blackmagic Design DaVinci Resolve 19 Studio: Hollywood Production Pipeline</text>
  <rect x="800" y="35" width="155" height="25" rx="6" fill="#334155"/>
  <text x="815" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">DaVinci Neural Engine</text>

  <!-- 7 Main Studio Modules -->
  <!-- 1. Media -->
  <g transform="translate(30, 95)">
    <rect width="125" height="250" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="15" y="15" width="95" height="28" rx="6" fill="#334155"/>
    <text x="62" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">1. MEDIA</text>
    <text x="62" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Blackmagic RAW</text>
    <text x="62" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">ProRes 4444 XQ</text>
    <text x="62" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">8K DCI Ingest</text>
    <text x="62" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Proxy Generator</text>
    <text x="62" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">Zero Transcode</text>
  </g>

  <!-- 2. Cut -->
  <g transform="translate(165, 95)">
    <rect width="125" height="250" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="15" y="15" width="95" height="28" rx="6" fill="#334155"/>
    <text x="62" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">2. CUT PAGE</text>
    <text x="62" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dual Timeline</text>
    <text x="62" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Fast Review Tape</text>
    <text x="62" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Sync Bin Multicam</text>
    <text x="62" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Speed Editor Dial</text>
    <text x="62" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">Rapid Assembly</text>
  </g>

  <!-- 3. Edit -->
  <g transform="translate(300, 95)">
    <rect width="125" height="250" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="15" y="15" width="95" height="28" rx="6" fill="#334155"/>
    <text x="62" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">3. EDIT PAGE</text>
    <text x="62" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Multi-Track NLE</text>
    <text x="62" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Ripple &amp; Roll</text>
    <text x="62" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Optical Flow AI</text>
    <text x="62" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Smart Reframe</text>
    <text x="62" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">Precision Cut</text>
  </g>

  <!-- 4. Fusion -->
  <g transform="translate(435, 95)">
    <rect width="125" height="250" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="15" y="15" width="95" height="28" rx="6" fill="#334155"/>
    <text x="62" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">4. FUSION VFX</text>
    <text x="62" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Node Compositor</text>
    <text x="62" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">3D Particle Space</text>
    <text x="62" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Magic Mask AI</text>
    <text x="62" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Planar Tracking</text>
    <text x="62" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a855f7" text-anchor="middle">Visual Effects</text>
  </g>

  <!-- 5. Color -->
  <g transform="translate(570, 95)">
    <rect width="130" height="250" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#glow)"/>
    <rect x="15" y="15" width="100" height="28" rx="6" fill="#f43f5e"/>
    <text x="65" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">5. COLOR (KING)</text>
    <text x="65" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">Color Wheels</text>
    <text x="65" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">HDR Color Wheels</text>
    <text x="65" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">ACES 1.3 Color</text>
    <text x="65" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle">32-bit Floating Pt</text>
    <text x="65" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#f43f5e" text-anchor="middle">Industry Standard</text>
  </g>

  <!-- 6. Fairlight -->
  <g transform="translate(710, 95)">
    <rect width="125" height="250" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="15" y="15" width="95" height="28" rx="6" fill="#334155"/>
    <text x="62" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">6. FAIRLIGHT</text>
    <text x="62" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">2,000 Realtime Tracks</text>
    <text x="62" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dolby Atmos Tools</text>
    <text x="62" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Voice Isolation AI</text>
    <text x="62" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dialogue Leveler</text>
    <text x="62" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#eab308" text-anchor="middle">Pro Audio DAW</text>
  </g>

  <!-- 7. Deliver -->
  <g transform="translate(845, 95)">
    <rect width="125" height="250" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
    <rect x="15" y="15" width="95" height="28" rx="6" fill="#334155"/>
    <text x="62" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f8fafc" text-anchor="middle">7. DELIVER</text>
    <text x="62" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AV1 / HEVC / H.264</text>
    <text x="62" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">IMF / DCP Cinema</text>
    <text x="62" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Multi-GPU Render</text>
    <text x="62" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Direct to YouTube</text>
    <text x="62" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#06b6d4" text-anchor="middle">Master Export</text>
  </g>

  <!-- Bottom Hardware Banner -->
  <rect x="30" y="370" width="940" height="95" rx="12" fill="#1e293b" stroke="#334155" filter="url(#glow)"/>
  <text x="50" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f8fafc">Hardware Acceleration: NVIDIA CUDA, Apple Metal 3 &amp; AMD ROCm</text>
  <text x="50" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Single perpetual license ($295) with free lifetime major updates vs Adobe Premiere Pro's $239.88/year perpetual subscription trap.</text>
</svg>
