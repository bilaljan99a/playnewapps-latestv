<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brandBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="chartFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#mainBg)"/>

  <!-- Subtle Blueprint / Graph Grid Lines -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200 M0,320 H1200 M0,360 H1200 M0,400 H1200 M0,440 H1200 M0,480 H1200"/>
    <path d="M60,0 V520 M120,0 V520 M180,0 V520 M240,0 V520 M300,0 V520 M360,0 V520 M420,0 V520 M480,0 V520 M540,0 V520 M600,0 V520 M660,0 V520 M720,0 V520 M780,0 V520 M840,0 V520 M900,0 V520 M960,0 V520 M1020,0 V520 M1080,0 V520 M1140,0 V520"/>
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="180" r="160" fill="#2563EB" opacity="0.16" filter="blur(40px)"/>
  <circle cx="950" cy="260" r="220" fill="#3B82F6" opacity="0.14" filter="blur(50px)"/>
  <circle cx="1100" cy="120" r="140" fill="#10B981" opacity="0.12" filter="blur(40px)"/>

  <!-- ================= LEFT COLUMN: HERO CONTENT & BRANDING ================= -->
  <g transform="translate(60, 50)">
    
    <!-- Verified Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="17" r="7" fill="#10B981"/>
      <path d="M15 17 L17 19 L21 15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="34" y="22" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#38BDF8" letter-spacing="0.8">OFFICIAL 2026 CTR ENGINE</text>
    </g>

    <!-- Main Headline -->
    <g transform="translate(0, 54)">
      <!-- Official Brand Logo Graphic -->
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="13" fill="#2563EB" filter="url(#glowEffect)"/>
        <!-- 3 Ascending Ranking Bars -->
        <rect x="13" y="28" width="6" height="13" rx="2" fill="#FFFFFF" opacity="0.75"/>
        <rect x="23" y="20" width="6" height="21" rx="2" fill="#FFFFFF" opacity="0.9"/>
        <rect x="33" y="11" width="6" height="30" rx="2" fill="#FFFFFF"/>
        <!-- Star on top of bar 3 -->
        <polygon points="36,4 37.5,8 41.5,8 38.3,10.5 39.5,14.5 36,12 32.5,14.5 33.7,10.5 30.5,8 34.5,8" fill="#FBBF24"/>
      </g>

      <text x="68" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Top of the Results</text>
      <text x="68" y="50" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#60A5FA" letter-spacing="0.5">AUTOMATED ORGANIC SEARCH CTR &amp; BEHAVIORAL SIGNALS</text>
    </g>

    <!-- Value Statement -->
    <text x="0" y="145" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" width="500">
      <tspan x="0" dy="0">Dominate competitive Google SERPs, Google Maps 3-Pack,</tspan>
      <tspan x="0" dy="24">YouTube &amp; Etsy rankings with real residential 5G IP proxies.</tspan>
    </text>

    <!-- Key Feature Pills -->
    <g transform="translate(0, 205)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="16" cy="16" r="5" fill="#3B82F6"/>
        <text x="28" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Real Residential 5G IPs</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(220, 0)">
        <rect width="210" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="16" cy="16" r="5" fill="#10B981"/>
        <text x="28" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">100% AdSense &amp; PPC Safe</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 42)">
        <rect width="210" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="16" cy="16" r="5" fill="#F59E0B"/>
        <text x="28" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Google Maps GPS Targeting</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(220, 42)">
        <rect width="210" height="32" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <circle cx="16" cy="16" r="5" fill="#8B5CF6"/>
        <text x="28" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Verified GA4 &amp; GSC Proof</text>
      </g>
    </g>

    <!-- Bottom Promo Banner Strip -->
    <g transform="translate(0, 310)">
      <rect width="440" height="66" rx="12" fill="url(#brandBlue)" filter="url(#cardShadow)"/>
      <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">SAVE 20% ON FIRST MONTH</text>
      <text x="20" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#DBEAFE">Use verified coupon code: FirstMonth20 at checkout</text>
      
      <!-- Code tag -->
      <g transform="translate(315, 14)">
        <rect width="105" height="38" rx="8" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1"/>
        <text x="52" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GET 20%</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: LIVE APP DASHBOARD PREVIEW ================= -->
  <g transform="translate(560, 40)" filter="url(#cardShadow)">
    
    <!-- Main Dashboard Window Frame -->
    <rect width="580" height="440" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Header Bar -->
    <path d="M 0,16 Q 0,0 16,0 L 564,0 Q 580,0 580,16 L 580,42 L 0,42 Z" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <!-- Window Controls -->
    <circle cx="22" cy="21" r="5" fill="#EF4444"/>
    <circle cx="38" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="21" r="5" fill="#10B981"/>
    <!-- Window Title / URL -->
    <rect x="140" y="10" width="300" height="22" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="290" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">app.topoftheresults.com/dashboard/campaigns</text>
    
    <!-- Live Status Indicator -->
    <g transform="translate(470, 12)">
      <rect width="92" height="18" rx="9" fill="#064E3B" stroke="#10B981" stroke-width="0.8"/>
      <circle cx="10" cy="9" r="3.5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#34D399">CAMPAIGN LIVE</text>
    </g>

    <!-- Dashboard Content Area -->
    <g transform="translate(24, 60)">
      
      <!-- Top Metrics Stat Cards (3 across) -->
      <!-- Card 1: Google SERP Rank -->
      <g transform="translate(0, 0)">
        <rect width="168" height="80" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94A3B8">GOOGLE POSITION</text>
        <text x="14" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">#1 <tspan font-size="13" font-weight="700" fill="#10B981">(+14 spots)</tspan></text>
        <circle cx="146" cy="38" r="14" fill="#2563EB" opacity="0.2"/>
        <path d="M140 42 L146 34 L152 42" stroke="#3B82F6" stroke-width="2" fill="none"/>
      </g>

      <!-- Card 2: CTR Lift Rate -->
      <g transform="translate(182, 0)">
        <rect width="168" height="80" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94A3B8">ORGANIC CTR LIFT</text>
        <text x="14" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900" fill="#34D399">+34.8%</text>
        <circle cx="146" cy="38" r="14" fill="#10B981" opacity="0.2"/>
        <path d="M140 42 L146 34 L152 42" stroke="#10B981" stroke-width="2" fill="none"/>
      </g>

      <!-- Card 3: GA4 Sessions -->
      <g transform="translate(364, 0)">
        <rect width="168" height="80" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94A3B8">GA4 DWELL TIME</text>
        <text x="14" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="900" fill="#FBBF24">2m 48s</text>
        <circle cx="146" cy="38" r="14" fill="#F59E0B" opacity="0.2"/>
        <circle cx="146" cy="38" r="7" stroke="#F59E0B" stroke-width="1.8" fill="none"/>
        <path d="M146 34 V38 H150" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- Chart Panel: Search Ranking & CTR Growth Over Time -->
      <g transform="translate(0, 94)">
        <rect width="532" height="175" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        
        <!-- Chart Header -->
        <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Rank Progression &amp; Navboost Interaction Signal Velocity</text>
        <text x="16" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748B">30-Day Google SERP &amp; Local Maps 3-Pack Telemetry</text>
        
        <!-- Legend -->
        <g transform="translate(380, 16)">
          <circle cx="6" cy="6" r="4" fill="#3B82F6"/>
          <text x="14" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Organic CTR</text>
          <circle cx="80" cy="6" r="4" fill="#10B981"/>
          <text x="88" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Position</text>
        </g>

        <!-- Chart Grid Lines -->
        <g stroke="#1E293B" stroke-width="1" opacity="0.6">
          <line x1="20" y1="60" x2="512" y2="60"/>
          <line x1="20" y1="90" x2="512" y2="90"/>
          <line x1="20" y1="120" x2="512" y2="120"/>
          <line x1="20" y1="150" x2="512" y2="150"/>
        </g>

        <!-- Filled Curve Area -->
        <path d="M 30,145 Q 90,140 150,125 T 270,95 T 390,65 T 500,45 L 500,150 L 30,150 Z" fill="url(#chartFillGrad)"/>

        <!-- Primary Ranking Trajectory Line (Upward Curve) -->
        <path d="M 30,145 Q 90,140 150,125 T 270,95 T 390,65 T 500,45" fill="none" stroke="url(#chartLineGrad)" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Highlighting Data Points -->
        <circle cx="30" cy="145" r="4" fill="#3B82F6"/>
        <circle cx="150" cy="125" r="4" fill="#3B82F6"/>
        <circle cx="270" cy="95" r="4" fill="#10B981"/>
        <circle cx="390" cy="65" r="4" fill="#10B981"/>
        <!-- Top Apex Point with Pulsing Ring -->
        <circle cx="500" cy="45" r="7" fill="#F59E0B" filter="url(#glowEffect)"/>
        <circle cx="500" cy="45" r="3" fill="#FFFFFF"/>

        <!-- Callout Marker at #1 -->
        <g transform="translate(420, 15)">
          <rect width="85" height="24" rx="6" fill="#F59E0B"/>
          <text x="42" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle">RANK #1 (SERP)</text>
        </g>

        <!-- X-Axis Timeline Labels -->
        <g fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">
          <text x="30" y="166">Day 1 (Pos #15)</text>
          <text x="140" y="166">Day 7 (Pos #11)</text>
          <text x="260" y="166">Day 14 (Pos #6)</text>
          <text x="375" y="166">Day 21 (Pos #3)</text>
          <text x="460" y="166">Day 30 (Pos #1)</text>
        </g>
      </g>

      <!-- Bottom Platform Compatibility Strip -->
      <g transform="translate(0, 280)">
        <rect width="532" height="85" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
        
        <text x="16" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#E2E8F0">Active Automated Routing Channels:</text>
        
        <!-- Platform Badges -->
        <g transform="translate(16, 36)">
          <!-- Google -->
          <rect width="112" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
          <text x="12" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Google Search</text>
          <circle cx="98" cy="17" r="4" fill="#10B981"/>

          <!-- GMB Maps -->
          <g transform="translate(122, 0)">
            <rect width="124" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
            <text x="12" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Google Maps 3-Pack</text>
            <circle cx="110" cy="17" r="4" fill="#10B981"/>
          </g>

          <!-- YouTube -->
          <g transform="translate(256, 0)">
            <rect width="116" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
            <text x="12" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">YouTube Video</text>
            <circle cx="102" cy="17" r="4" fill="#10B981"/>
          </g>

          <!-- Etsy -->
          <g transform="translate(382, 0)">
            <rect width="118" height="34" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
            <text x="12" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">Etsy Marketplace</text>
            <circle cx="104" cy="17" r="4" fill="#10B981"/>
          </g>
        </g>
      </g>

    </g>
  </g>
</svg>
