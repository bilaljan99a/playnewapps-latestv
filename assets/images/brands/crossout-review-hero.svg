<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#18110a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" rx="16" fill="url(#heroBg)"/>
  <circle cx="600" cy="250" r="350" fill="url(#centerGlow)"/>

  <!-- Grid Tech Lines -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
  <path d="M 200 0 L 200 500 M 400 0 L 400 500 M 600 0 L 600 500 M 800 0 L 800 500 M 1000 0 L 1000 500" stroke="#334155" stroke-width="0.5" opacity="0.3"/>

  <!-- Left Side: Review Badge & Title Overlay -->
  <g transform="translate(60, 80)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="21" font-family="sans-serif" font-weight="800" font-size="13" fill="#f59e0b" text-anchor="middle" letter-spacing="1">CRITICAL GAME REVIEW</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="sans-serif" font-weight="900" font-size="42" fill="#ffffff">CROSSOUT (2026)</text>
    <text x="0" y="125" font-family="sans-serif" font-weight="800" font-size="28" fill="#cbd5e1">The Definitive Wasteland Review</text>

    <!-- Subtitle Bullet Features -->
    <text x="0" y="175" font-family="sans-serif" font-weight="600" font-size="16" fill="#94a3b8">✓ Sandbox Vehicle Engineering &amp; Physics</text>
    <text x="0" y="205" font-family="sans-serif" font-weight="600" font-size="16" fill="#94a3b8">✓ 8v8 Real-Time Positional Destruction</text>
    <text x="0" y="235" font-family="sans-serif" font-weight="600" font-size="16" fill="#94a3b8">✓ Player Auction Economy &amp; Free-to-Play Analysis</text>

    <!-- Score Box -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <text x="20" y="45" font-family="sans-serif" font-weight="900" font-size="36" fill="#f59e0b">8.8</text>
      <text x="90" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">/ 10</text>
      <text x="90" y="52" font-family="sans-serif" font-weight="800" font-size="11" fill="#22c55e">GREAT</text>
    </g>
  </g>

  <!-- Right Side: Graphic Silhouette of Armored War Rig -->
  <g transform="translate(680, 120)">
    <!-- Base Platform Glow -->
    <ellipse cx="220" cy="270" rx="200" ry="30" fill="#ea580c" opacity="0.25"/>

    <!-- Tank / War Rig Construction -->
    <!-- Heavy Wheels -->
    <circle cx="80" cy="240" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="200" cy="240" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="320" cy="240" r="42" fill="#0f172a" stroke="#f59e0b" stroke-width="5"/>
    <circle cx="80" cy="240" r="16" fill="#f59e0b"/>
    <circle cx="200" cy="240" r="16" fill="#f59e0b"/>
    <circle cx="320" cy="240" r="16" fill="#f59e0b"/>

    <!-- Main Armor Chassis Frame -->
    <path d="M 30 220 L 70 120 L 220 100 L 370 160 L 370 220 Z" fill="#1e293b" stroke="#ea580c" stroke-width="3"/>
    <path d="M 90 120 L 130 50 L 260 50 L 290 110 Z" fill="#334155" stroke="#f59e0b" stroke-width="2"/>

    <!-- Dual Autocannon Mounts -->
    <rect x="180" y="20" width="140" height="16" rx="3" fill="#090d16" stroke="#f97316" stroke-width="2"/>
    <rect x="180" y="38" width="140" height="16" rx="3" fill="#090d16" stroke="#f97316" stroke-width="2"/>

    <!-- Muzzle Fire Effects -->
    <polygon points="320,28 360,10 345,28 370,45" fill="#f59e0b"/>

    <!-- Spikes & Saw Blades -->
    <polygon points="370,180 410,200 370,220" fill="#dc2626"/>

    <!-- Tech Specs Floating Badges -->
    <rect x="-40" y="40" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="60" font-family="sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">DAGOR ENGINE 6.5</text>

    <rect x="290" y="-10" width="130" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="355" y="10" font-family="sans-serif" font-weight="700" font-size="11" fill="#f59e0b" text-anchor="middle">PS: 11,400 WAR RIG</text>
  </g>

  <!-- Bottom Bar: PlayNewApps Editorial Seal -->
  <rect x="0" y="450" width="1200" height="50" fill="#0f172a"/>
  <text x="40" y="480" font-family="sans-serif" font-weight="700" font-size="13" fill="#64748b">PLAYNEWAPPS HANDS-ON GAMING EVALUATION</text>
  <text x="1160" y="480" font-family="sans-serif" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="end">PUBLISHED FOR 2026 GAMING BENCHMARKS</text>
</svg>
