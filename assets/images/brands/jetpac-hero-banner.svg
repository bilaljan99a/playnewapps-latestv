<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#110733"/>
            <stop offset="40%" stop-color="#1D0C4E"/>
            <stop offset="100%" stop-color="#3B12B3"/>
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00F2FE"/>
            <stop offset="100%" stop-color="#4FACFE"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#FFA500"/>
        </linearGradient>
        <radialGradient id="glow" cx="80%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#7B3FF2" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#110733" stop-opacity="0"/>
        </radialGradient>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="1200" height="500" fill="url(#bgGrad)"/>
    <rect width="1200" height="500" fill="url(#glow)"/>

    <!-- Decorative World Map Dot Grid Graphic -->
    <g opacity="0.15" fill="#FFFFFF">
        <circle cx="200" cy="100" r="3"/><circle cx="240" cy="100" r="3"/><circle cx="280" cy="100" r="3"/><circle cx="320" cy="100" r="3"/>
        <circle cx="220" cy="120" r="3"/><circle cx="260" cy="120" r="3"/><circle cx="300" cy="120" r="3"/><circle cx="340" cy="120" r="3"/>
        <circle cx="700" cy="150" r="3"/><circle cx="740" cy="150" r="3"/><circle cx="780" cy="150" r="3"/><circle cx="820" cy="150" r="3"/>
        <circle cx="860" cy="150" r="3"/><circle cx="900" cy="150" r="3"/><circle cx="940" cy="150" r="3"/><circle cx="980" cy="150" r="3"/>
        <circle cx="680" cy="180" r="3"/><circle cx="720" cy="180" r="3"/><circle cx="760" cy="180" r="3"/><circle cx="800" cy="180" r="3"/>
        <circle cx="840" cy="180" r="3"/><circle cx="880" cy="180" r="3"/><circle cx="920" cy="180" r="3"/><circle cx="960" cy="180" r="3"/>
        <circle cx="1000" cy="180" r="3"/><circle cx="1040" cy="180" r="3"/>
    </g>

    <!-- Global Connection Curves (Flight Paths) -->
    <path d="M 150 400 Q 400 100 800 250 T 1100 120" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
    <path d="M 100 250 Q 500 450 950 180" fill="none" stroke="#7B3FF2" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- Left Content Column -->
    <!-- Badge -->
    <g transform="translate(80, 60)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="url(#accentGrad)" stroke-width="1.5"/>
        <circle cx="20" cy="18" r="6" fill="#00F2FE"/>
        <text x="36" y="23" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="1">VERIFIED 2026 REVIEW</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#FFFFFF">Jetpac eSIM</text>
    <text x="80" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#accentGrad)">Travel Smarter with Global Data</text>

    <!-- Description -->
    <text x="80" y="260" font-family="system-ui, sans-serif" font-size="18" fill="#D1D5DB" width="550">
        <tspan x="80" dy="0">Instant 5G/4G connectivity across 200+ destinations worldwide.</tspan>
        <tspan x="80" dy="28">Includes free SmartDelay airport lounge passes, emergency app access,</tspan>
        <tspan x="80" dy="28">and zero international roaming fees.</tspan>
    </text>

    <!-- Key Feature Pills -->
    <g transform="translate(80, 360)">
        <!-- Pill 1 -->
        <rect x="0" y="0" width="160" height="42" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
        <text x="16" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#00F2FE">✈️ 200+ Countries</text>

        <!-- Pill 2 -->
        <rect x="175" y="0" width="190" height="42" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
        <text x="191" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFD700">🛋️ Free Lounge Pass</text>

        <!-- Pill 3 -->
        <rect x="380" y="0" width="170" height="42" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
        <text x="396" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#10B981">⚡ 5G Multi-Carrier</text>
    </g>

    <!-- Right Side Graphic: Smartphone Mockup &amp; Jet Icon -->
    <g transform="translate(780, 50)" filter="url(#dropShadow)">
        <!-- Globe Circle Background -->
        <circle cx="170" cy="200" r="160" fill="rgba(123, 63, 242, 0.25)" stroke="url(#accentGrad)" stroke-width="2"/>
        
        <!-- Smartphone Container -->
        <rect x="80" y="40" width="180" height="340" rx="28" fill="#0B0F19" stroke="#374151" stroke-width="4"/>
        <rect x="90" y="55" width="160" height="310" rx="20" fill="#111827"/>
        
        <!-- Screen Header -->
        <rect x="100" y="70" width="140" height="40" rx="8" fill="#1F2937"/>
        <circle cx="120" cy="90" r="10" fill="#551BF2"/>
        <text x="138" y="95" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">Jetpac eSIM</text>

        <!-- Connected Status Badge -->
        <rect x="100" y="120" width="140" height="50" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981"/>
        <text x="112" y="142" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#10B981">STATUS: CONNECTED</text>
        <text x="112" y="158" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">5G • SoftBank Japan</text>

        <!-- SmartDelay Lounge Badge on Phone -->
        <rect x="100" y="180" width="140" height="65" rx="10" fill="rgba(255, 215, 0, 0.12)" stroke="#FFD700"/>
        <text x="112" y="202" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFD700">SMARTDELAY PASS</text>
        <text x="112" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#E5E7EB">Free Lounge Voucher</text>
        <text x="112" y="234" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">Flight SQ638 Delayed</text>

        <!-- Data Usage Meter -->
        <rect x="100" y="255" width="140" height="35" rx="8" fill="#1F2937"/>
        <text x="110" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#D1D5DB">Data Remaining: 8.4 GB</text>
        <rect x="110" y="276" width="120" height="6" rx="3" fill="#374151"/>
        <rect x="110" y="276" width="90" height="6" rx="3" fill="#00F2FE"/>

        <!-- Flying Jet Airplane Vector Floating -->
        <g transform="translate(200, 10) scale(0.9)">
            <circle cx="40" cy="40" r="36" fill="#551BF2" stroke="#FFFFFF" stroke-width="2"/>
            <path d="M 28 36 L 46 20 L 50 24 L 40 36 L 58 36 L 62 42 L 52 42 L 58 50 L 52 52 L 42 42 L 32 42 L 28 36 Z" fill="#FFFFFF"/>
        </g>
    </g>
</svg>
