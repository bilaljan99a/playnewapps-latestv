<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100" fill="none">
  <!-- Globe & Orbit -->
  <g transform="translate(10, 10)">
    <!-- Globe Circle -->
    <circle cx="40" cy="42" r="32" fill="#0066cc" />
    
    <!-- Globe Latitudes / Longitudes -->
    <!-- Horizontal lines -->
    <path d="M10 42 H70" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M14 28 C22 33 58 33 66 28" stroke="#ffffff" stroke-width="2.2" fill="none" />
    <path d="M14 56 C22 51 58 51 66 56" stroke="#ffffff" stroke-width="2.2" fill="none" />
    
    <!-- Vertical curves -->
    <path d="M40 10 V74" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M40 10 C20 22 20 62 40 74" stroke="#ffffff" stroke-width="2.2" fill="none" />
    <path d="M40 10 C60 22 60 62 40 74" stroke="#ffffff" stroke-width="2.2" fill="none" />
    <path d="M40 10 C10 26 10 58 40 74" stroke="#ffffff" stroke-width="2" fill="none" />
    <path d="M40 10 C70 26 70 58 40 74" stroke="#ffffff" stroke-width="2" fill="none" />

    <!-- Yellow Orbit Arrow -->
    <path d="M22 75 C4 60 4 25 36 10" stroke="#f6be00" stroke-width="5" stroke-linecap="round" fill="none" />
    <polygon points="36,4 48,11 37,18" fill="#f6be00" />
    
    <!-- Airplane at top right of globe -->
    <g transform="translate(62, 8) rotate(35) scale(1.1)">
      <path d="M0,0 L12,4 L22,5 L14,14 L17,15 L26,7 L34,7 C36,7 38,5 37,3 L32,-1 L34,-8 L30,-8 L24,0 L12,1 Z" fill="#0066cc" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(92, 68)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-style="italic" font-size="44" fill="#f6be00" letter-spacing="-0.5">Cheap</text>
    <text x="135" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-style="italic" font-size="44" fill="#0066cc" letter-spacing="-0.5">vuelos</text>
    
    <!-- Blue underline bar -->
    <rect x="0" y="8" width="255" height="3.5" fill="#0066cc" rx="1.5" />
  </g>
</svg>
