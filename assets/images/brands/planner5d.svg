<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
      }
    </style>
  </defs>

  <!-- Green Brand Background Container with subtle rounding -->
  <rect width="320" height="100" rx="16" fill="#13B074"/>
  
  <!-- "Planner" Wordmark in crisp white -->
  <text x="24" y="65" fill="#FFFFFF" class="brand-text" font-size="44" letter-spacing="-0.5">Planner</text>
  
  <!-- House Badge Container with "5d" -->
  <g transform="translate(208, 16)">
    <!-- House Outline / Solid White Body -->
    <path d="M 44,4 L 84,28 L 84,62 C 84,66.4 80.4,70 76,70 L 12,70 C 7.6,70 4,66.4 4,62 L 4,28 Z" fill="#FFFFFF"/>
    <!-- House Roof Chevron in Brand Green -->
    <path d="M 12,28 L 44,8 L 76,28" fill="none" stroke="#13B074" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- "5d" Text inside house in Brand Green -->
    <text x="44" y="58" fill="#13B074" class="brand-text" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="-1">5d</text>
  </g>
</svg>
