<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="diagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" rx="12" fill="url(#diagBg)" stroke="#334155" stroke-width="2"/>

  <!-- Diagram Title Header -->
  <rect x="20" y="20" width="860" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="40" y="52" font-family="sans-serif" font-weight="900" font-size="20" fill="#ffffff">CROSSOUT VEHICLE ANATOMY &amp; ENGINEERING PRINCIPLES</text>
  <text x="860" y="52" font-family="sans-serif" font-weight="700" font-size="13" fill="#60a5fa" text-anchor="end">TECHNICAL BUILD ARCHITECTURE</text>

  <!-- Technical Grid Overlay -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <path d="M 50 100 L 850 100 M 50 200 L 850 200 M 50 300 L 850 300 M 50 400 L 850 400 M 50 500 L 850 500"/>
    <path d="M 150 80 L 150 520 M 300 80 L 300 520 M 450 80 L 450 520 M 600 80 L 600 520 M 750 80 L 750 520"/>
  </g>

  <!-- Main Vehicle Wireframe Schematic (Center) -->
  <g transform="translate(180, 140)">
    <!-- Frame Beams (Underchassis) -->
    <rect x="80" y="180" width="320" height="20" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <rect x="100" y="160" width="280" height="15" rx="3" fill="#0369a1"/>

    <!-- Generator Hidden Under Chassis -->
    <rect x="180" y="182" width="60" height="16" rx="2" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="210" y="194" font-family="sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">GEN (100% EXPLO)</text>

    <!-- Steering & Heavy Wheels -->
    <circle cx="100" cy="210" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="380" cy="210" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="200" cy="210" r="28" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="280" cy="210" r="28" fill="#0f172a" stroke="#64748b" stroke-width="2"/>

    <!-- Armored Cabin (Center Mass) -->
    <path d="M 160 160 L 190 70 L 300 70 L 320 160 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <text x="240" y="120" font-family="sans-serif" font-weight="900" font-size="14" fill="#f59e0b" text-anchor="middle">CABIN (HP CORE)</text>

    <!-- Heavy Cannons Mounted on Pass-Through Parts -->
    <rect x="200" y="15" width="120" height="22" rx="4" fill="#334155" stroke="#f97316" stroke-width="2"/>
    <rect x="300" y="20" width="130" height="12" rx="2" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
    <text x="260" y="30" font-family="sans-serif" font-weight="800" font-size="11" fill="#f97316" text-anchor="middle">88mm Cannon</text>

    <!-- Front Bumper / Ram Spikes -->
    <polygon points="400,160 450,180 400,200" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>

    <!-- Rear Spaced Armor Plates -->
    <rect x="30" y="100" width="15" height="80" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="55" y="90" width="15" height="90" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Pointer Labels & Technical Annotations -->
  <!-- 1. Weapon Mounts -->
  <path d="M 440 155 L 560 110 L 620 110" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="440" cy="155" r="5" fill="#f97316"/>
  <rect x="620" y="90" width="230" height="42" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
  <text x="630" y="108" font-family="sans-serif" font-weight="800" font-size="12" fill="#f97316">1. PASS-THROUGH MOUNTING</text>
  <text x="630" y="124" font-family="sans-serif" font-size="10" fill="#cbd5e1">Mount guns on frames/grilles to prevent instant loss.</text>

  <!-- 2. Cabin Placement -->
  <path d="M 420 220 L 580 200 L 620 200" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="420" cy="220" r="5" fill="#f59e0b"/>
  <rect x="620" y="180" width="230" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="630" y="198" font-family="sans-serif" font-weight="800" font-size="12" fill="#f59e0b">2. CABIN &amp; HP POOL</text>
  <text x="630" y="214" font-family="sans-serif" font-size="10" fill="#cbd5e1">Cabin HP determines max vehicle health pool.</text>

  <!-- 3. Hidden Generator -->
  <path d="M 390 330 L 560 310 L 620 310" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="390" cy="330" r="5" fill="#ef4444"/>
  <rect x="620" y="290" width="230" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="630" y="308" font-family="sans-serif" font-weight="800" font-size="12" fill="#ef4444">3. EXPLOSIVE HARDWARE</text>
  <text x="630" y="324" font-family="sans-serif" font-size="10" fill="#cbd5e1">Hide gas generators under frame beams.</text>

  <!-- 4. Spaced Armor -->
  <path d="M 220 230 L 120 290 L 50 290" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="220" cy="230" r="5" fill="#94a3b8"/>
  <rect x="50" y="270" width="220" height="42" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="288" font-family="sans-serif" font-weight="800" font-size="12" fill="#38bdf8">4. SPACED ARMOR LAYER</text>
  <text x="60" y="304" font-family="sans-serif" font-size="10" fill="#cbd5e1">Detonated cannons before hitting cabin.</text>

  <!-- 5. Chassis & Steering -->
  <path d="M 280 350 L 150 410 L 50 410" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <circle cx="280" cy="350" r="5" fill="#38bdf8"/>
  <rect x="50" y="390" width="220" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="408" font-family="sans-serif" font-weight="800" font-size="12" fill="#38bdf8">5. STEERING WHEEL REDUNDANCY</text>
  <text x="60" y="424" font-family="sans-serif" font-size="10" fill="#cbd5e1">Use 6+ wheels so losing 2 maintains control.</text>

  <!-- Bottom Tip Box -->
  <rect x="20" y="480" width="860" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="40" y="510" font-family="sans-serif" font-weight="800" font-size="12" fill="#22c55e">💡 GOLDEN CRAFTING RULE:</text>
  <text x="210" y="510" font-family="sans-serif" font-size="12" fill="#f8fafc">Never inflate your Power Score (PS) with decorative armor if your weapons and cabin cannot match the firepower of enemy war rigs.</text>
</svg>
