<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" rx="16"/>
  
  <!-- Decorative Grid & Nodes -->
  <circle cx="150" cy="100" r="40" fill="#3b82f6" opacity="0.15"/>
  <line x1="150" y1="100" x2="350" y2="280" stroke="#3b82f6" stroke-width="2" opacity="0.2" stroke-dasharray="6,6"/>
  <circle cx="350" cy="280" r="60" fill="#06b6d4" opacity="0.15"/>
  <circle cx="1050" cy="120" r="90" fill="#f59e0b" opacity="0.1"/>

  <!-- Content Box Left -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="32" fill="url(#accent)" rx="16"/>
    <text x="90" y="21" font-family="sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">VECTORSTOCK PRICING</text>
    
    <text x="0" y="90" font-family="sans-serif" font-weight="900" font-size="36" fill="#ffffff">Unlimited Commercial Vectors</text>
    <text x="0" y="125" font-family="sans-serif" font-weight="900" font-size="36" fill="#38bdf8">Only $14.99/Month</text>
    <text x="0" y="160" font-family="sans-serif" fill="#94a3b8" font-size="16">Save $60.00/Year on Annual Subscriptions or Buy Flexible Credit Packs ($1/Credit)</text>
    
    <!-- Feature Checkmarks -->
    <g transform="translate(0, 195)">
      <circle cx="12" cy="12" r="10" fill="#10b981"/>
      <path d="M7 12 l3 3 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="32" y="17" font-family="sans-serif" font-weight="700" font-size="15" fill="#f8fafc">100% Royalty-Free Royalty Commercial License</text>
      
      <circle cx="12" cy="42" r="10" fill="#10b981"/>
      <path d="M7 42 l3 3 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="32" y="47" font-family="sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Instant EPS, AI, PDF &amp; High-Res PNG Downloads</text>
      
      <circle cx="12" cy="72" r="10" fill="#10b981"/>
      <path d="M7 72 l3 3 l7 -7" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="32" y="77" font-family="sans-serif" font-weight="700" font-size="15" fill="#f8fafc">Over 35 Million+ Curated Premium Vector Graphics</text>
    </g>
  </g>

  <!-- Graphic Preview Card Right -->
  <g transform="translate(740, 50)">
    <rect x="0" y="0" width="380" height="300" fill="#1e293b" stroke="#334155" stroke-width="2" rx="20"/>
    <rect x="20" y="20" width="340" height="180" fill="#0f172a" rx="12"/>
    <!-- Vector Pen Tool Illustration -->
    <path d="M120 150 Q 190 40 260 150" stroke="#38bdf8" stroke-width="4" fill="none"/>
    <circle cx="120" cy="150" r="6" fill="#38bdf8"/>
    <circle cx="190" cy="95" r="6" fill="#f59e0b"/>
    <circle cx="260" cy="150" r="6" fill="#38bdf8"/>
    <line x1="120" y1="150" x2="190" y2="95" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="260" y1="150" x2="190" y2="95" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="190" y="180" font-family="sans-serif" font-weight="700" font-size="13" fill="#cbd5e1" text-anchor="middle">Scalable Vector Graphics (SVG, EPS, AI)</text>

    <!-- Pricing Tag inside preview -->
    <rect x="20" y="220" width="160" height="60" fill="#0f172a" rx="10" stroke="#38bdf8" stroke-width="1"/>
    <text x="35" y="243" font-family="sans-serif" font-size="11" fill="#94a3b8">UNLIMITED SUB</text>
    <text x="35" y="265" font-family="sans-serif" font-weight="800" font-size="18" fill="#38bdf8">$14.99/mo</text>

    <rect x="200" y="220" width="160" height="60" fill="#0f172a" rx="10" stroke="#f59e0b" stroke-width="1"/>
    <text x="215" y="243" font-family="sans-serif" font-size="11" fill="#94a3b8">CREDIT PACKS</text>
    <text x="215" y="265" font-family="sans-serif" font-weight="800" font-size="18" fill="#f59e0b">50 for $50</text>
  </g>
</svg>
