<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="edBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#edBgGrad)"/>

  <!-- Outer Window UI -->
  <g transform="translate(20, 20)" filter="url(#cardShadow)">
    <rect width="760" height="410" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="760" height="42" rx="12" fill="#0F172A"/>
    <rect y="30" width="760" height="12" fill="#0F172A"/>
    <circle cx="20" cy="21" r="5" fill="#EF4444"/>
    <circle cx="36" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="21" r="5" fill="#10B981"/>

    <!-- Title -->
    <text x="380" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">Presenti.ai — AI Slide Generation Workspace</text>

    <!-- Top Right Export Badge -->
    <rect x="630" y="9" width="110" height="24" rx="6" fill="#10B981"/>
    <text x="685" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">PPTX / PDF Export</text>

    <!-- Sidebar Slide Thumbnails -->
    <rect x="15" y="55" width="120" height="340" rx="8" fill="#0F172A"/>
    <text x="25" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#94A3B8">SLIDES (12)</text>

    <!-- Slide 1 Thumbnail -->
    <rect x="25" y="85" width="100" height="60" rx="6" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
    <rect x="33" y="95" width="50" height="6" rx="2" fill="#0F172A"/>
    <rect x="33" y="105" width="70" height="4" rx="2" fill="#64748B"/>
    <rect x="33" y="113" width="40" height="20" rx="4" fill="#EEF2FF"/>

    <!-- Slide 2 Thumbnail -->
    <rect x="25" y="155" width="100" height="60" rx="6" fill="#1E293B" stroke="#334155"/>
    <rect x="33" y="165" width="45" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="33" y="174" width="60" height="3" rx="1.5" fill="#64748B"/>

    <!-- Slide 3 Thumbnail -->
    <rect x="25" y="225" width="100" height="60" rx="6" fill="#1E293B" stroke="#334155"/>
    <rect x="33" y="235" width="55" height="5" rx="2" fill="#CBD5E1"/>

    <!-- Main Active Slide Canvas -->
    <rect x="150" y="55" width="595" height="280" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>

    <!-- Slide Content Header -->
    <rect x="180" y="80" width="280" height="18" rx="4" fill="#0F172A"/>
    <rect x="180" y="106" width="380" height="10" rx="3" fill="#64748B"/>
    <rect x="180" y="122" width="240" height="8" rx="2" fill="#94A3B8"/>

    <!-- Slide 3-Column Visual Grid -->
    <g transform="translate(180, 145)">
      <!-- Col 1 -->
      <rect width="160" height="160" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
      <circle cx="35" cy="35" r="16" fill="#6366F1"/>
      <text x="35" y="40" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">01</text>
      <rect x="15" y="65" width="100" height="10" rx="3" fill="#1E1B4B"/>
      <rect x="15" y="82" width="130" height="6" rx="2" fill="#4338CA"/>
      <rect x="15" y="93" width="110" height="6" rx="2" fill="#6366F1"/>

      <!-- Col 2 -->
      <rect x="180" width="160" height="160" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
      <circle cx="215" cy="35" r="16" fill="#10B981"/>
      <text x="215" y="40" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">02</text>
      <rect x="195" y="65" width="100" height="10" rx="3" fill="#064E3B"/>
      <rect x="195" y="82" width="130" height="6" rx="2" fill="#047857"/>
      <rect x="195" y="93" width="110" height="6" rx="2" fill="#10B981"/>

      <!-- Col 3 -->
      <rect x="360" width="160" height="160" rx="10" fill="#FDF2F8" stroke="#FBCFE8"/>
      <circle cx="395" cy="35" r="16" fill="#EC4899"/>
      <text x="395" y="40" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">03</text>
      <rect x="375" y="65" width="100" height="10" rx="3" fill="#831843"/>
      <rect x="375" y="82" width="130" height="6" rx="2" fill="#BE185D"/>
      <rect x="375" y="93" width="110" height="6" rx="2" fill="#EC4899"/>
    </g>

    <!-- Bottom AI Command Bar -->
    <g transform="translate(150, 345)">
      <rect width="595" height="50" rx="10" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#A5B4FC">✨ AI Assistant: "Add financial projections chart and re-style palette to Modern Purple"</text>

      <rect x="475" y="8" width="110" height="34" rx="8" fill="url(#btnGrad)"/>
      <text x="530" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Generate AI →</text>
    </g>
  </g>
</svg>
