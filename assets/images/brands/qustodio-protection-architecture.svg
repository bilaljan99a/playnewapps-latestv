<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="qBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F24"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="qTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#qBg)"/>

  <!-- Subtle Safety Blueprint Grid -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0,50 H1000 M0,100 H1000 M0,150 H1000 M0,200 H1000 M0,250 H1000 M0,300 H1000 M0,350 H1000 M0,400 H1000 M0,450 H1000"/>
    <path d="M50,0 V520 M100,0 V520 M150,0 V520 M200,0 V520 M250,0 V520 M300,0 V520 M350,0 V520 M400,0 V520 M450,0 V520 M500,0 V520 M550,0 V520 M600,0 V520 M650,0 V520 M700,0 V520 M750,0 V520 M800,0 V520 M850,0 V520 M900,0 V520 M950,0 V520"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(40, 30)">
    <!-- Brand Icon -->
    <rect width="36" height="36" rx="8" fill="#10B981"/>
    <circle cx="18" cy="18" r="8" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <path d="M23 23 L28 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <text x="48" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">Qustodio Digital Safety Architecture</text>
    <text x="48" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#6EE7B7">Comprehensive Cross-Platform Child Protection &amp; Screen Time Ecosystem</text>
  </g>

  <!-- 3 Main Architecture Pillars -->

  <!-- PILLAR 1: PARENT CONTROL DASHBOARD (LEFT) -->
  <g transform="translate(40, 100)" filter="url(#shadowBox)">
    <rect width="280" height="380" rx="12" fill="#04392B" stroke="#059669" stroke-width="1.5"/>
    <rect width="280" height="42" rx="12" fill="#065F46"/>
    <text x="20" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">1. PARENT APP &amp; WEB PORTAL</text>
    
    <!-- Item 1 -->
    <g transform="translate(18, 60)">
      <circle cx="10" cy="10" r="10" fill="#10B981" opacity="0.2"/>
      <circle cx="10" cy="10" r="4" fill="#10B981"/>
      <text x="28" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Daily Routine Schedules</text>
      <text x="28" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#A7F3D0">Bedtime lockouts, study time &amp; limits</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(18, 120)">
      <circle cx="10" cy="10" r="10" fill="#3B82F6" opacity="0.2"/>
      <circle cx="10" cy="10" r="4" fill="#60A5FA"/>
      <text x="28" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Instant Internet Pause</text>
      <text x="28" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#A7F3D0">1-click web lockout across all devices</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(18, 180)">
      <circle cx="10" cy="10" r="10" fill="#F59E0B" opacity="0.2"/>
      <circle cx="10" cy="10" r="4" fill="#FBBF24"/>
      <text x="28" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">AI Safety Insights &amp; Alerts</text>
      <text x="28" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#A7F3D0">Smart flagging of cyberbullying &amp; risks</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(18, 240)">
      <circle cx="10" cy="10" r="10" fill="#8B5CF6" opacity="0.2"/>
      <circle cx="10" cy="10" r="4" fill="#A78BFA"/>
      <text x="28" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Live GPS &amp; Geofenced Places</text>
      <text x="28" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#A7F3D0">Safe zones: School, Home &amp; SOS alerts</text>
    </g>

    <!-- Item 5 -->
    <g transform="translate(18, 300)">
      <circle cx="10" cy="10" r="10" fill="#EC4899" opacity="0.2"/>
      <circle cx="10" cy="10" r="4" fill="#F472B6"/>
      <text x="28" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Calls &amp; SMS Oversight</text>
      <text x="28" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#A7F3D0">Contact blocking &amp; conversation logs</text>
    </g>
  </g>

  <!-- CONNECTOR 1 -> 2 -->
  <g stroke="#10B981" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 320 280 L 360 280" stroke-dasharray="4 4"/>
    <polygon points="360,276 366,280 360,284" fill="#10B981"/>
  </g>

  <!-- PILLAR 2: CLOUD FILTERING & RULES ENGINE (CENTER) -->
  <g transform="translate(360, 100)" filter="url(#shadowBox)">
    <rect width="280" height="380" rx="12" fill="#04392B" stroke="#059669" stroke-width="1.5"/>
    <rect width="280" height="42" rx="12" fill="#065F46"/>
    <text x="20" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">2. CLOUD RULES &amp; VPN ENGINE</text>

    <!-- Center Hub Graphic -->
    <g transform="translate(30, 60)">
      <rect width="220" height="120" rx="8" fill="#022C22" stroke="#047857" stroke-width="1"/>
      <circle cx="110" cy="45" r="24" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
      <!-- Shield / Check Icon -->
      <path d="M 110 32 L 124 37 V 47 C 124 55 110 61 110 61 C 110 61 96 55 96 47 V 37 Z" fill="#10B981"/>
      <path d="M 105 46 L 109 50 L 116 42" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      
      <text x="110" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#34D399" text-anchor="middle">REAL-TIME PACKET INSPECTION</text>
      <text x="110" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#A7F3D0" text-anchor="middle">Local VPN Loopback • Zero Speed Drop</text>
    </g>

    <!-- Cloud Capabilities List -->
    <g transform="translate(20, 200)">
      <rect width="240" height="48" rx="6" fill="#064E3B"/>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">30+ Content Categories Filtered</text>
      <text x="12" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#6EE7B7">Adult, gambling, violence, drugs &amp; weapons</text>
    </g>

    <g transform="translate(20, 256)">
      <rect width="240" height="48" rx="6" fill="#064E3B"/>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Enforced SafeSearch &amp; YouTube</text>
      <text x="12" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#6EE7B7">Locks Google, Bing &amp; YouTube Kids safety</text>
    </g>

    <g transform="translate(20, 312)">
      <rect width="240" height="48" rx="6" fill="#064E3B"/>
      <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Tamper &amp; Uninstall Protection</text>
      <text x="12" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#6EE7B7">Requires parental master PIN to modify</text>
    </g>
  </g>

  <!-- CONNECTOR 2 -> 3 -->
  <g stroke="#10B981" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 640 280 L 680 280" stroke-dasharray="4 4"/>
    <polygon points="680,276 686,280 680,284" fill="#10B981"/>
  </g>

  <!-- PILLAR 3: PROTECTED CHILD DEVICES (RIGHT) -->
  <g transform="translate(680, 100)" filter="url(#shadowBox)">
    <rect width="280" height="380" rx="12" fill="#04392B" stroke="#059669" stroke-width="1.5"/>
    <rect width="280" height="42" rx="12" fill="#065F46"/>
    <text x="20" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">3. PROTECTED MULTI-DEVICE SUITE</text>

    <!-- Supported Platforms Grid (6 Badges) -->
    <g transform="translate(18, 55)">
      <!-- iOS -->
      <g transform="translate(0, 0)">
        <rect width="116" height="46" rx="8" fill="#064E3B" stroke="#047857" stroke-width="1"/>
        <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Apple iOS</text>
        <text x="10" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#A7F3D0">iPhone &amp; iPad</text>
      </g>
      <!-- Android -->
      <g transform="translate(126, 0)">
        <rect width="116" height="46" rx="8" fill="#064E3B" stroke="#047857" stroke-width="1"/>
        <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Android OS</text>
        <text x="10" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#A7F3D0">Phone &amp; Tablet</text>
      </g>
      <!-- Windows -->
      <g transform="translate(0, 54)">
        <rect width="116" height="46" rx="8" fill="#064E3B" stroke="#047857" stroke-width="1"/>
        <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Windows PC</text>
        <text x="10" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#A7F3D0">Win 10 &amp; 11</text>
      </g>
      <!-- Mac -->
      <g transform="translate(126, 54)">
        <rect width="116" height="46" rx="8" fill="#064E3B" stroke="#047857" stroke-width="1"/>
        <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Apple macOS</text>
        <text x="10" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#A7F3D0">MacBook &amp; iMac</text>
      </g>
      <!-- Chromebook -->
      <g transform="translate(0, 108)">
        <rect width="116" height="46" rx="8" fill="#064E3B" stroke="#047857" stroke-width="1"/>
        <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Chromebook</text>
        <text x="10" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#A7F3D0">Chrome OS</text>
      </g>
      <!-- Kindle -->
      <g transform="translate(126, 108)">
        <rect width="116" height="46" rx="8" fill="#064E3B" stroke="#047857" stroke-width="1"/>
        <text x="10" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">Amazon Kindle</text>
        <text x="10" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#A7F3D0">Fire OS</text>
      </g>
    </g>

    <!-- Summary Box -->
    <g transform="translate(18, 230)">
      <rect width="242" height="85" rx="8" fill="#022C22" stroke="#047857" stroke-width="1"/>
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#34D399">UNLIMITED DEVICE COVERAGE</text>
      <text x="14" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#E2E8F0">With Qustodio Complete, protect all</text>
      <text x="14" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#E2E8F0">family smartphones, laptops &amp; tablets</text>
      <text x="14" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#E2E8F0">under one single parental subscription.</text>
    </g>
  </g>
</svg>
