<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003cff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="998" height="518" rx="19" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.75">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="320" x2="1000" y2="320"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="480" x2="1000" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="800" y1="0" x2="800" y2="520"/>
  </g>

  <!-- Top Title Area -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="160" height="26" rx="13" fill="#003cff" opacity="0.2"/>
    <rect x="0" y="0" width="160" height="26" rx="13" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">F-SECURE TOTAL ARCHITECTURE</text>
    <text x="0" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Multi-Layered Cyber Security &amp; Privacy Shield</text>
    <text x="0" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Enterprise-grade endpoint protection engineered with Scandinavian privacy principles</text>
  </g>

  <!-- 5 Modular Architecture Cards -->

  <!-- 1. DeepGuard Antivirus Engine -->
  <g transform="translate(40, 150)">
    <rect width="170" height="310" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="85" cy="55" r="28" fill="#003cff" opacity="0.2"/>
    <circle cx="85" cy="55" r="20" fill="#003cff"/>
    <path d="M 85 43 L 95 48 L 95 59 C 95 65 91 70 85 72 C 79 70 75 65 75 59 L 75 48 Z" fill="#ffffff"/>
    <text x="85" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">DeepGuard AI</text>
    <text x="85" y="128" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Malware &amp; Ransomware</text>
    <line x1="25" y1="145" x2="145" y2="145" stroke="#334155"/>
    <text x="25" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Behavioral Analysis</text>
    <text x="25" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Zero-Day Exploit Block</text>
    <text x="25" y="220" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Ransomware Shield</text>
    <text x="25" y="244" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Real-Time Cloud Scans</text>
    <rect x="25" y="268" width="120" height="24" rx="6" fill="#003cff" opacity="0.25"/>
    <text x="85" y="284" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">AV-TEST Top Award</text>
  </g>

  <!-- 2. Unlimited Secure VPN -->
  <g transform="translate(230, 150)">
    <rect width="170" height="310" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="85" cy="55" r="28" fill="#0ea5e9" opacity="0.2"/>
    <circle cx="85" cy="55" r="20" fill="#0ea5e9"/>
    <path d="M 85 45 C 79.5 45 75 49.5 75 55 C 75 60.5 79.5 65 85 65 C 90.5 65 95 60.5 95 55 C 95 49.5 90.5 45 85 45 Z M 85 48 C 88.9 48 92 51.1 92 55 C 92 58.9 88.9 62 85 62 C 81.1 62 78 58.9 78 55 C 78 51.1 81.1 48 85 48 Z" fill="#ffffff"/>
    <text x="85" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Unlimited VPN</text>
    <text x="85" y="128" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Privacy &amp; Encryption</text>
    <line x1="25" y1="145" x2="145" y2="145" stroke="#334155"/>
    <text x="25" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Strict No-Logs Policy</text>
    <text x="25" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Public Wi-Fi Shield</text>
    <text x="25" y="220" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Virtual Geo Locations</text>
    <text x="25" y="244" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Automatic Kill Switch</text>
    <rect x="25" y="268" width="120" height="24" rx="6" fill="#0ea5e9" opacity="0.25"/>
    <text x="85" y="284" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Finnish Privacy Laws</text>
  </g>

  <!-- 3. Banking & Browsing Protection -->
  <g transform="translate(420, 150)">
    <rect width="170" height="310" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="85" cy="55" r="28" fill="#10b981" opacity="0.2"/>
    <circle cx="85" cy="55" r="20" fill="#10b981"/>
    <path d="M 85 45 L 75 51 L 75 54 L 95 54 L 95 51 Z M 77 56 L 79 63 L 81 63 L 81 56 Z M 84 56 L 84 63 L 86 63 L 86 56 Z M 89 56 L 89 63 L 91 63 L 91 56 Z M 74 65 L 74 67 L 96 67 L 96 65 Z" fill="#ffffff"/>
    <text x="85" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Banking Shield</text>
    <text x="85" y="128" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Safe Finance &amp; Shops</text>
    <line x1="25" y1="145" x2="145" y2="145" stroke="#334155"/>
    <text x="25" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Untrusted App Cutoff</text>
    <text x="25" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Shopping Site Checker</text>
    <text x="25" y="220" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Anti-Phishing Filter</text>
    <text x="25" y="244" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Trusted Payment Gate</text>
    <rect x="25" y="268" width="120" height="24" rx="6" fill="#10b981" opacity="0.25"/>
    <text x="85" y="284" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Financial Sandbox</text>
  </g>

  <!-- 4. ID Protection & Password Vault -->
  <g transform="translate(610, 150)">
    <rect width="170" height="310" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="85" cy="55" r="28" fill="#8b5cf6" opacity="0.2"/>
    <circle cx="85" cy="55" r="20" fill="#8b5cf6"/>
    <path d="M 85 45 C 82 45 80 47 80 50 L 80 53 L 78 53 C 77 53 76 54 76 55 L 76 65 C 76 66 77 67 78 67 L 92 67 C 93 67 94 66 94 65 L 94 55 C 94 54 93 53 92 53 L 90 53 L 90 50 C 90 47 88 45 85 45 Z M 85 47 C 86.7 47 88 48.3 88 50 L 88 53 L 82 53 L 82 50 C 82 48.3 83.3 47 85 47 Z" fill="#ffffff"/>
    <text x="85" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">ID Monitoring</text>
    <text x="85" y="128" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Vault &amp; Breach Alerts</text>
    <line x1="25" y1="145" x2="145" y2="145" stroke="#334155"/>
    <text x="25" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• 24/7 Dark Web Patrol</text>
    <text x="25" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Password Generator</text>
    <text x="25" y="220" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Instant Breach Alert</text>
    <text x="25" y="244" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Master Key Recovery</text>
    <rect x="25" y="268" width="120" height="24" rx="6" fill="#8b5cf6" opacity="0.25"/>
    <text x="85" y="284" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Zero-Knowledge Vault</text>
  </g>

  <!-- 5. Family Rules & Multi-Platform -->
  <g transform="translate(800, 150)">
    <rect width="160" height="310" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="80" cy="55" r="28" fill="#f59e0b" opacity="0.2"/>
    <circle cx="80" cy="55" r="20" fill="#f59e0b"/>
    <path d="M 80 44 C 77.2 44 75 46.2 75 49 C 75 51.8 77.2 54 80 54 C 82.8 54 85 51.8 85 49 C 85 46.2 82.8 44 80 44 Z M 80 56 C 75.6 56 68 58.2 68 62.6 L 68 66 L 92 66 L 92 62.6 C 92 58.2 84.4 56 80 56 Z" fill="#ffffff"/>
    <text x="80" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Family Rules</text>
    <text x="80" y="128" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Parental Controls</text>
    <line x1="20" y1="145" x2="140" y2="145" stroke="#334155"/>
    <text x="20" y="172" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Screen Time Limits</text>
    <text x="20" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Content Filtering</text>
    <text x="20" y="220" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• Windows / Mac Support</text>
    <text x="20" y="244" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">• iOS &amp; Android Apps</text>
    <rect x="20" y="268" width="120" height="24" rx="6" fill="#f59e0b" opacity="0.25"/>
    <text x="80" y="284" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Cross-Device Control</text>
  </g>
</svg>
