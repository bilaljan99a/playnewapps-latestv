<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Header Banner -->
  <g transform="translate(30, 30)">
    <rect width="180" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="18" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">HOW TOP OF THE RESULTS WORKS</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Organic CTR &amp; Search Signal Architecture</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(30, 120)">
    <rect width="165" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="32" cy="32" r="18" fill="#2563eb" />
    <text x="27" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">1</text>
    <text x="16" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Target Keywords</text>
    <text x="16" y="105" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400">
      <tspan x="16" dy="0">Specify exact search</tspan>
      <tspan x="16" dy="16">queries, competitor terms,</tspan>
      <tspan x="16" dy="16">GMB local listings, and</tspan>
      <tspan x="16" dy="16">desired CTR volumes.</tspan>
    </text>
    <rect x="16" y="175" width="133" height="36" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="26" y="197" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">50+ Search Queries</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 205 235 L 225 235" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />

  <!-- Step 2 -->
  <g transform="translate(230, 120)">
    <rect width="165" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="32" cy="32" r="18" fill="#d97706" />
    <text x="27" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">2</text>
    <text x="16" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Residential Network</text>
    <text x="16" y="105" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400">
      <tspan x="16" dy="0">Real residential &amp; 5G</tspan>
      <tspan x="16" dy="16">IPs across precise GPS</tspan>
      <tspan x="16" dy="16">cities and regional</tspan>
      <tspan x="16" dy="16">target markets.</tspan>
    </text>
    <rect x="16" y="175" width="133" height="36" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="26" y="197" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Geo &amp; GPS Radius</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 405 235 L 425 235" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />

  <!-- Step 3 -->
  <g transform="translate(430, 120)">
    <rect width="165" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="32" cy="32" r="18" fill="#8b5cf6" />
    <text x="27" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">3</text>
    <text x="16" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Human Engagement</text>
    <text x="16" y="105" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400">
      <tspan x="16" dy="0">Natural scroll depth,</tspan>
      <tspan x="16" dy="16">multi-page clicks, custom</tspan>
      <tspan x="16" dy="16">dwell times, and zero</tspan>
      <tspan x="16" dy="16">ad click safety.</tspan>
    </text>
    <rect x="16" y="175" width="133" height="36" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="26" y="197" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">AdSense Safe Signal</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 605 235 L 625 235" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />

  <!-- Step 4 -->
  <g transform="translate(630, 120)">
    <rect width="140" height="230" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="32" cy="32" r="18" fill="#10b981" />
    <text x="27" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">4</text>
    <text x="16" y="80" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Top Rankings</text>
    <text x="16" y="105" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400">
      <tspan x="16" dy="0">Google Navboost</tspan>
      <tspan x="16" dy="16">algorithm registers</tspan>
      <tspan x="16" dy="16">high authority,</tspan>
      <tspan x="16" dy="16">lifting positions.</tspan>
    </text>
    <rect x="16" y="175" width="108" height="36" rx="6" fill="#064e3b" stroke="#059669" />
    <text x="22" y="197" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">#1 SERP &amp; GMB</text>
  </g>
</svg>
