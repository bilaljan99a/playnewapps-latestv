<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480">
  <rect width="1000" height="480" rx="20" fill="#0F172A"/>
  <rect x="2" y="2" width="996" height="476" rx="18" fill="none" stroke="#1E293B" stroke-width="3"/>

  <!-- Title -->
  <text x="40" y="48" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="800">PureVPN WireGuard Speed &amp; Throughput Benchmark (2026 Test)</text>
  <text x="40" y="74" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600">Baseline ISP Connection Speed: 500 Mbps Download / 100 Mbps Upload</text>

  <!-- Speed Bars -->
  <!-- Bar 1: PureVPN WireGuard -->
  <g transform="translate(40, 110)">
    <text x="0" y="22" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">PureVPN WireGuard Protocol</text>
    <rect x="0" y="32" width="800" height="36" rx="8" fill="#1E293B"/>
    <rect x="0" y="32" width="752" height="36" rx="8" fill="url(#emeraldGrad)"/>
    <text x="764" y="56" fill="#00E676" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800">470 Mbps (94% Speed Retained)</text>
  </g>

  <!-- Bar 2: PureVPN OpenVPN -->
  <g transform="translate(40, 200)">
    <text x="0" y="22" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">PureVPN OpenVPN UDP Protocol</text>
    <rect x="0" y="32" width="800" height="36" rx="8" fill="#1E293B"/>
    <rect x="0" y="32" width="624" height="36" rx="8" fill="#3B82F6"/>
    <text x="636" y="56" fill="#60A5FA" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800">390 Mbps (78% Speed Retained)</text>
  </g>

  <!-- Bar 3: Industry Average VPN -->
  <g transform="translate(40, 290)">
    <text x="0" y="22" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="700">Standard Industry Average VPN</text>
    <rect x="0" y="32" width="800" height="36" rx="8" fill="#1E293B"/>
    <rect x="0" y="32" width="440" height="36" rx="8" fill="#64748B"/>
    <text x="452" y="56" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="800">275 Mbps (55% Speed Retained)</text>
  </g>

  <!-- Bottom Metric Highlights -->
  <g transform="translate(40, 390)">
    <rect width="920" height="60" rx="12" fill="#161F36" stroke="#334155" stroke-width="1"/>
    <text x="30" y="36" fill="#00E676" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800">⚡ 4K UHD Streaming: Zero Buffering</text>
    <text x="350" y="36" fill="#60A5FA" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800">🎮 Low Ping Gaming: &lt; 15ms Latency</text>
    <text x="680" y="36" fill="#F59E0B" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800">🚀 20Gbps Server Uplinks</text>
  </g>

  <defs>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
  </defs>
</svg>
