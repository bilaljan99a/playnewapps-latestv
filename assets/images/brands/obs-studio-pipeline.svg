<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="obsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <filter id="obsGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="500" rx="16" fill="url(#obsBg)"/>
  <rect x="1" y="1" width="998" height="498" rx="15" fill="none" stroke="#3f3f46" stroke-width="2"/>

  <!-- Top Header Bar -->
  <rect x="30" y="25" width="940" height="45" rx="8" fill="#27272a" filter="url(#obsGlow)"/>
  <circle cx="55" cy="47" r="7" fill="#ef4444"/>
  <circle cx="75" cy="47" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="47" r="7" fill="#10b981"/>
  <text x="120" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f4f4f5">OBS Studio 31 Production Engine: Open-Source Streaming &amp; Screen Capture Architecture</text>
  <rect x="800" y="35" width="155" height="25" rx="6" fill="#3f3f46"/>
  <text x="825" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a1a1aa">NVENC / AV1 Ready</text>

  <!-- Step 1: Input Sources -->
  <g transform="translate(30, 95)">
    <rect width="210" height="255" rx="10" fill="#27272a" stroke="#52525b" stroke-width="1.5" filter="url(#obsGlow)"/>
    <rect x="15" y="15" width="180" height="30" rx="6" fill="#3f3f46"/>
    <text x="105" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f4f4f5" text-anchor="middle">1. INPUT SOURCES</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">🎮 Game Capture (DirectX/Vulkan)</text>
    <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">🖥️ Display / Window Capture</text>
    <text x="25" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">📷 DSLR &amp; Elgato 4K60 Pro</text>
    <text x="25" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">🎙️ XLR Mic via ASIO / VST3</text>
    <text x="25" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">🌐 Browser Overlays &amp; Chat</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 245 220 L 270 220" stroke="#a1a1aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2: Real-Time Scene Compositor -->
  <g transform="translate(275, 95)">
    <rect width="210" height="255" rx="10" fill="#27272a" stroke="#6366f1" stroke-width="2" filter="url(#obsGlow)"/>
    <rect x="15" y="15" width="180" height="30" rx="6" fill="#4f46e5"/>
    <text x="105" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2. SCENE COMPOSITOR</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f4f4f5">Unlimited Nested Scenes</text>
    <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f4f4f5">Hardware Color Correction</text>
    <text x="25" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f4f4f5">Chroma Key Green Screen</text>
    <text x="25" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f4f4f5">Noise Suppression (RNNoise)</text>
    <text x="105" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">&lt; 1ms GPU Frame Latency</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 490 220 L 515 220" stroke="#a1a1aa" stroke-width="3" fill="none"/>

  <!-- Step 3: Hardware Encoders -->
  <g transform="translate(520, 95)">
    <rect width="210" height="255" rx="10" fill="#27272a" stroke="#10b981" stroke-width="2" filter="url(#obsGlow)"/>
    <rect x="15" y="15" width="180" height="30" rx="6" fill="#059669"/>
    <text x="105" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3. HARDWARE ENCODERS</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f4f4f5">NVIDIA NVENC (AV1 &amp; HEVC)</text>
    <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f4f4f5">AMD AMF Hardware Encoder</text>
    <text x="25" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f4f4f5">Intel QuickSync (QSV)</text>
    <text x="25" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f4f4f5">Apple Silicon VideoToolbox</text>
    <text x="105" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Zero CPU Gaming Impact</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 735 220 L 760 220" stroke="#a1a1aa" stroke-width="3" fill="none"/>

  <!-- Step 4: Output Destinations -->
  <g transform="translate(765, 95)">
    <rect width="205" height="255" rx="10" fill="#27272a" stroke="#52525b" stroke-width="1.5" filter="url(#obsGlow)"/>
    <rect x="15" y="15" width="175" height="30" rx="6" fill="#3f3f46"/>
    <text x="102" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#f4f4f5" text-anchor="middle">4. OUTPUT TARGETS</text>
    <text x="25" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">🔴 YouTube Live (Enhanced RTMP)</text>
    <text x="25" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">🟣 Twitch Multi-Track Audio</text>
    <text x="25" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">🟢 Kick &amp; TikTok Streaming</text>
    <text x="25" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#d4d4d8">💾 Lossless 4K ProRes/MKV</text>
    <text x="102" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Multi-Track Recording</text>
  </g>

  <!-- Bottom Open Source Philosophy Banner -->
  <rect x="30" y="370" width="940" height="95" rx="12" fill="#27272a" stroke="#3f3f46" filter="url(#obsGlow)"/>
  <text x="50" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f4f4f5">100% Free &amp; Open Source (GPL v2) — Zero Watermarks, Zero Subscriptions, Zero Paywalls</text>
  <text x="50" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a1a1aa">Maintained by a global community of developers and used by 95% of Twitch streamers, esports broadcasters, and YouTube creators worldwide.</text>
</svg>
