<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="100%" height="100%">
  <defs>
    <style>
      .asap-bg { fill: #1d69b4; rx: 10px; }
      .asap-text { font-family: 'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; letter-spacing: -0.5px; }
      .tickets-text { font-family: 'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 38px; fill: #3f444a; letter-spacing: -0.5px; }
      .years-text { font-family: 'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 24px; fill: #bfa36c; letter-spacing: 0.2px; }
    </style>
  </defs>
  <!-- ASAP Blue Badge -->
  <rect x="5" y="16" width="130" height="58" rx="8" class="asap-bg"/>
  <text x="70" y="58" text-anchor="middle" class="asap-text">asap</text>
  
  <!-- Tickets Text -->
  <text x="148" y="47" class="tickets-text">tickets</text>
  
  <!-- 20+ Years Tag -->
  <text x="149" y="73" class="years-text">20+Years</text>
</svg>
