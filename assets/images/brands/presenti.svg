<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220">
  <defs>
    <linearGradient id="presentiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background White Card -->
  <rect width="500" height="220" rx="24" fill="#FFFFFF"/>

  <g transform="translate(30, 30)">
    <!-- Slide Deck & AI Spark Icon -->
    <g transform="translate(0, 10)">
      <!-- Back Slide (Rotated) -->
      <rect x="25" y="10" width="100" height="70" rx="10" fill="#E0E7FF" transform="rotate(-8 75 45)" />
      
      <!-- Main Presentation Slide -->
      <rect x="10" y="25" width="115" height="80" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" />
      
      <!-- Screen Content Header / Chart Bars -->
      <rect x="25" y="42" width="35" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
      <rect x="25" y="54" width="55" height="4" rx="2" fill="#FFFFFF" opacity="0.6" />
      <rect x="25" y="63" width="45" height="4" rx="2" fill="#FFFFFF" opacity="0.6" />
      
      <!-- Mini Chart Graphic on Slide -->
      <rect x="90" y="65" width="8" height="22" rx="2" fill="#38BDF8" />
      <rect x="102" y="50" width="8" height="37" rx="2" fill="#F472B6" />
      <rect x="114" y="40" width="8" height="47" rx="2" fill="#FACC15" />

      <!-- AI Sparkle / Magic Star -->
      <g transform="translate(115, 12)">
        <path d="M 12 0 Q 12 12 24 12 Q 12 12 12 24 Q 12 12 0 12 Q 12 12 12 0 Z" fill="url(#presentiGrad)" />
      </g>
      <g transform="translate(15, 15) scale(0.6)">
        <path d="M 12 0 Q 12 12 24 12 Q 12 12 0 12 Q 12 12 12 0 Z" fill="#FACC15" />
      </g>
    </g>

    <!-- Brand Typography -->
    <g transform="translate(165, 38)">
      <!-- "Presenti" -->
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#0F172A" letter-spacing="-1">Presenti</text>
      <!-- ".ai" badge -->
      <text x="202" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="url(#presentiGrad)" letter-spacing="-0.5">.ai</text>
      
      <!-- Tagline -->
      <text x="2" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#64748B" letter-spacing="0.5">AI Presentation Maker</text>
    </g>
  </g>
</svg>
