<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="500" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid Overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200 M0,400 H1200 M0,450 H1200"/>
    <path d="M100,0 V500 M200,0 V500 M300,0 V500 M400,0 V500 M500,0 V500 M600,0 V500 M700,0 V500 M800,0 V500 M900,0 V500 M1000,0 V500 M1100,0 V500"/>
  </g>

  <!-- Glowing Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366F1" opacity="0.15" filter="blur(40px)"/>
  <circle cx="1000" cy="350" r="220" fill="#EC4899" opacity="0.15" filter="blur(50px)"/>

  <!-- LEFT HERO TYPOGRAPHY & BADGES -->
  <g transform="translate(80, 80)">
    <!-- Discount Badge -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="url(#badgeGrad)"/>
    <text x="110" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VERIFIED 60% OFF DEAL</text>

    <!-- Main Headline -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="-1">Presenti.ai Studio 2026</text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="url(#accentGrad)">AI Presentation &amp; Slide Deck Maker</text>

    <!-- Bullet Points -->
    <g transform="translate(0, 185)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#CBD5E1">
      <g transform="translate(0,0)">
        <circle cx="10" cy="-5" r="8" fill="#6366F1"/>
        <path d="M6 -8 L9 -5 L14 -10" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="30" y="0">Convert Text, PDF &amp; Notes into Pitch Decks in Seconds</text>
      </g>
      <g transform="translate(0,32)">
        <circle cx="10" cy="-5" r="8" fill="#8B5CF6"/>
        <path d="M6 -8 L9 -5 L14 -10" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="30" y="0">Smart Auto-Layout, Palette Styling &amp; Dynamic Diagrams</text>
      </g>
      <g transform="translate(0,64)">
        <circle cx="10" cy="-5" r="8" fill="#EC4899"/>
        <path d="M6 -8 L9 -5 L14 -10" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="30" y="0">Instant PowerPoint (.pptx) &amp; High-Res PDF Export</text>
      </g>
    </g>

    <!-- CTA Button Graphic -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="280" height="54" rx="14" fill="url(#accentGrad)"/>
      <text x="140" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">Claim 60% Off Pro Plan →</text>
    </g>
  </g>

  <!-- RIGHT SIDE APP MOCKUP CARD -->
  <g transform="translate(680, 60)" filter="url(#shadow)">
    <!-- App Outer Window Frame -->
    <rect x="0" y="0" width="460" height="360" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    
    <!-- Window Titlebar -->
    <rect x="0" y="0" width="460" height="40" rx="16" fill="#0F172A"/>
    <rect x="0" y="24" width="460" height="16" fill="#0F172A"/>
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="5" fill="#10B981"/>
    <text x="230" y="25" font-family="sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle" font-weight="600">Presenti.ai — AI Slide Generator Studio</text>

    <!-- Inner Slide Canvas -->
    <rect x="20" y="55" width="420" height="285" rx="10" fill="#090D16" stroke="#1E293B"/>

    <!-- Left Sidebar Toolbar -->
    <rect x="20" y="55" width="70" height="285" fill="#0F172A"/>
    <rect x="35" y="75" width="40" height="40" rx="8" fill="#6366F1" opacity="0.3"/>
    <rect x="35" y="125" width="40" height="30" rx="6" fill="#334155"/>
    <rect x="35" y="165" width="40" height="30" rx="6" fill="#334155"/>
    <rect x="35" y="205" width="40" height="30" rx="6" fill="#334155"/>

    <!-- Main Slide Preview -->
    <rect x="110" y="75" width="310" height="180" rx="8" fill="#FFFFFF"/>
    <!-- Slide Content Header -->
    <rect x="130" y="95" width="180" height="12" rx="4" fill="#0F172A"/>
    <rect x="130" y="115" width="220" height="8" rx="3" fill="#64748B"/>
    
    <!-- Slide Visual Cards -->
    <rect x="130" y="135" width="80" height="90" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <rect x="145" y="148" width="50" height="6" rx="2" fill="#4338CA"/>
    <rect x="145" y="160" width="35" height="4" rx="2" fill="#818CF8"/>

    <rect x="225" y="135" width="80" height="90" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
    <rect x="240" y="148" width="50" height="6" rx="2" fill="#15803D"/>
    <rect x="240" y="160" width="35" height="4" rx="2" fill="#4ADE80"/>

    <rect x="320" y="135" width="80" height="90" rx="6" fill="#FDF2F8" stroke="#FBCFE8"/>
    <rect x="335" y="148" width="50" height="6" rx="2" fill="#BE185D"/>
    <rect x="335" y="160" width="35" height="4" rx="2" fill="#F472B6"/>

    <!-- Prompt Input Box at Bottom -->
    <rect x="110" y="270" width="310" height="44" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <text x="125" y="297" font-family="sans-serif" font-size="13" fill="#A5B4FC" font-weight="500">✨ Prompt: "Build 10-slide AI Startup Pitch Deck"</text>
    <rect x="375" y="277" width="38" height="30" rx="6" fill="url(#accentGrad)"/>
    <text x="394" y="297" font-family="sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">→</text>
  </g>
</svg>
