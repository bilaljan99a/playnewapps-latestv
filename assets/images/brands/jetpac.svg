<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="100%" height="100%">
    <defs>
        <linearGradient id="jetpacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B12B3"/>
            <stop offset="50%" stop-color="#551BF2"/>
            <stop offset="100%" stop-color="#7B3FF2"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
        </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="150" rx="16" fill="url(#jetpacGrad)"/>
    
    <!-- Left Logo Icon Group (Bars + Jet Airplane) -->
    <g transform="translate(35, 30)">
        <!-- Vertical signal/chart bars -->
        <rect x="0" y="55" width="8" height="30" rx="3" fill="#FFFFFF" opacity="0.6"/>
        <rect x="14" y="40" width="8" height="45" rx="3" fill="#FFFFFF" opacity="0.8"/>
        <rect x="28" y="22" width="8" height="63" rx="3" fill="#FFFFFF" opacity="0.95"/>
        
        <!-- Flying Jet Airplane Icon -->
        <path d="M 28 20 L 52 0 L 58 6 L 46 22 L 72 22 L 78 30 L 64 30 L 72 40 L 64 42 L 50 30 L 36 30 L 28 20 Z" fill="#FFFFFF"/>
    </g>

    <!-- Brand Typography -->
    <text x="140" y="94" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="2">JETPAC</text>
</svg>
