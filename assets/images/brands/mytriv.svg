<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="100%" height="100%" fill="none">
  <!-- Compass Icon -->
  <g transform="translate(10, 10)">
    <!-- Dark Inner Circle -->
    <circle cx="45" cy="45" r="42" fill="#0B1320" />
    <!-- Bright Cyan Ring -->
    <circle cx="45" cy="45" r="38" stroke="#00C0E8" stroke-width="5" fill="none" />
    
    <!-- Top Needle (Hot Pink / Magenta) -->
    <polygon points="45,18 36,45 45,40" fill="#EC4899" />
    <polygon points="45,18 54,45 45,40" fill="#F43F5E" />
    
    <!-- Bottom Needle (Vibrant Blue) -->
    <polygon points="45,72 36,45 45,50" fill="#2563EB" />
    <polygon points="45,72 54,45 45,50" fill="#3B82F6" />
    
    <!-- Center Pivot White Dot -->
    <circle cx="45" cy="45" r="5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(112, 60)">
    <!-- Wordmark "MyTriv" -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0F172A" letter-spacing="-1px">MyTriv</text>
    
    <!-- Cyan SHOP Badge -->
    <rect x="172" y="-34" width="76" height="34" rx="8" fill="#00C0E8" />
    <text x="210" y="-11" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="16" fill="#0B1320" text-anchor="middle" letter-spacing="1px">SHOP</text>
  </g>

  <!-- Subtitle -->
  <text x="114" y="92" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="11.5" fill="#64748B" letter-spacing="1.8px">GLOBAL TRAVEL MERCHANDISE &amp; CUSTOM STUDIO</text>
</svg>