<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for UniConverter 16 -->
    <linearGradient id="ucBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1266" />
      <stop offset="50%" stop-color="#1c0b47" />
      <stop offset="100%" stop-color="#10052e" />
    </linearGradient>

    <!-- Vibrant Orange/Gold Crescent Gradient -->
    <linearGradient id="ucOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="40%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#FF3300" />
    </linearGradient>

    <!-- Vibrant Purple/Magenta Play Arrow Gradient -->
    <linearGradient id="ucPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B2CFF" />
      <stop offset="50%" stop-color="#A033FF" />
      <stop offset="100%" stop-color="#E040FF" />
    </linearGradient>

    <filter id="ucShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#ucBgGrad)" filter="url(#ucShadow)"/>

  <!-- Subtle Inner Glow Border -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Perfectly Centered UniConverter Logo Symbol -->
  <g transform="translate(136, 116)">
    <!-- Main Right Play Arrow (Purple/Magenta) -->
    <path d="M 40 20 
             C 60 8, 85 15, 105 28
             L 215 110
             C 245 130, 245 170, 215 190
             L 105 272
             C 85 285, 60 292, 40 280
             C 15 268, 0 240, 0 210
             L 0 90
             C 0 60, 15 32, 40 20 Z" 
          fill="url(#ucPurpleGrad)" />

    <!-- Left Overlay / Crescent Loop (Orange/Gold) -->
    <path d="M 40 20
             C 15 32, 0 60, 0 90
             L 0 210
             C 0 240, 15 268, 40 280
             C 60 290, 80 285, 100 270
             C 55 230, 28 175, 28 120
             C 28 75, 55 35, 100 10
             C 80 -2, 60 8, 40 20 Z" 
          fill="url(#ucOrangeGrad)" />
  </g>
</svg>
