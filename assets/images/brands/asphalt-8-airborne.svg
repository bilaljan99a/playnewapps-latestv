<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF1E27" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Wing Graphic Accent Left -->
  <path d="M20 75 L65 35 L55 75 Z" fill="url(#asphaltGrad)" opacity="0.85" />
  <path d="M10 88 L50 55 L42 88 Z" fill="#FF5722" opacity="0.6" />

  <!-- Main Wordmark ASPHALT -->
  <text x="68" y="76" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="68" fill="#0F172A" letter-spacing="1px">ASPHALT</text>

  <!-- Bold Number 8 with Flame/Gradient -->
  <text x="390" y="78" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="82" fill="url(#asphaltGrad)" filter="url(#glow)">8</text>

  <!-- AIRBORNE Banner Plate -->
  <rect x="72" y="94" width="370" height="26" rx="5" fill="#0F172A" />
  <text x="257" y="112" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="9px">AIRBORNE</text>

  <!-- Wing Graphic Accent Right -->
  <path d="M495 45 L450 78 L460 45 Z" fill="url(#asphaltGrad)" opacity="0.85" />
  <path d="M515 58 L470 90 L480 58 Z" fill="#FF5722" opacity="0.6" />
</svg>