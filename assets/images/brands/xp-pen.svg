<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="200" height="130">
  <!-- Clean Transparent Canvas -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <!-- === TOP ROW: XP === -->
    <!-- Stylized 'X': 4 symmetric angular radiating strokes around a central aperture -->
    <line x1="38" y1="20" x2="55" y2="37" stroke-width="7.5" />
    <line x1="65" y1="47" x2="82" y2="64" stroke-width="7.5" />
    <line x1="82" y1="20" x2="65" y2="37" stroke-width="7.5" />
    <line x1="55" y1="47" x2="38" y2="64" stroke-width="7.5" />

    <!-- Uppercase 'P' -->
    <line x1="102" y1="18" x2="102" y2="66" stroke-width="7.5" />
    <path d="M 102 18 L 126 18 C 141 18 152 26 152 40 C 152 54 141 62 126 62 L 102 62" stroke-width="7.5" />

    <!-- === BOTTOM ROW: pen === -->
    <!-- Lowercase 'p' -->
    <line x1="39" y1="78" x2="39" y2="124" stroke-width="6.8" />
    <path d="M 39 88 C 45 79 56 76 67 76 C 82 76 93 86 93 100 C 93 114 82 124 67 124 C 56 124 45 121 39 112" stroke-width="6.8" />

    <!-- Lowercase 'e' -->
    <path d="M 104 102 L 138 102 C 138 88 130 76 119 76 C 107 76 99 87 99 100 C 99 113 108 124 121 124 C 131 124 137 118 139 111" stroke-width="6.8" />

    <!-- Lowercase 'n' -->
    <line x1="152" y1="78" x2="152" y2="124" stroke-width="6.8" />
    <path d="M 152 90 C 158 80 168 76 179 76 C 190 76 198 84 198 97 L 198 124" stroke-width="6.8" />
  </g>
</svg>
