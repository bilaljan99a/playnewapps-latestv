<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Clean Transparent / White Background XP-PEN Rebranded Mark -->
  <rect width="300" height="200" rx="16" fill="#FFFFFF"/>
  
  <g transform="translate(65, 25)" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Distinctive XP-PEN Stylized Cross 'x' -->
    <!-- Diagonal stroke 1: top-left to bottom-right -->
    <line x1="12" y1="18" x2="62" y2="68" stroke-width="9.5" />
    <!-- Diagonal stroke 2: top-right to bottom-left with precision gap / intersection -->
    <line x1="62" y1="18" x2="12" y2="68" stroke-width="9.5" />
    
    <!-- Uppercase 'P' -->
    <path d="M 88 16 L 88 70 M 88 16 L 116 16 C 132 16 142 24 142 38 C 142 52 132 58 116 58 L 88 58" stroke-width="9" />
    
    <!-- Lowercase 'p' in 'pen' -->
    <path d="M 12 96 L 12 152 M 12 108 C 18 97 30 96 40 96 C 56 96 66 108 66 124 C 66 140 56 152 40 152 C 30 152 18 151 12 140" stroke-width="8.5" />
    
    <!-- Lowercase 'e' in 'pen' -->
    <path d="M 82 125 L 128 125 C 128 108 118 96 105 96 C 90 96 82 108 82 124 C 82 140 92 152 108 152 C 120 152 126 146 128 140" stroke-width="8.5" />
    
    <!-- Lowercase 'n' in 'pen' -->
    <path d="M 146 98 L 146 150 M 146 112 C 153 100 165 96 177 96 C 191 96 198 105 198 120 L 198 150" stroke-width="8.5" />
  </g>
</svg>
