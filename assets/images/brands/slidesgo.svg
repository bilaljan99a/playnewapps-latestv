<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="slidesgoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="sgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF4081" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#slidesgoGrad)" />
  <g transform="translate(96, 96)" filter="url(#sgShadow)">
    <!-- Presentation Slide Cards Stacked -->
    <rect x="50" y="20" width="220" height="150" rx="16" fill="#FFFFFF" fill-opacity="0.3"/>
    <rect x="30" y="50" width="240" height="160" rx="16" fill="#FFFFFF" fill-opacity="0.6"/>
    <rect x="10" y="80" width="260" height="180" rx="20" fill="#FFFFFF"/>
    <!-- Slide Header &amp; Content Elements -->
    <rect x="35" y="110" width="120" height="16" rx="8" fill="#FF4081"/>
    <rect x="35" y="140" width="210" height="12" rx="6" fill="#E0E0E0"/>
    <rect x="35" y="162" width="170" height="12" rx="6" fill="#E0E0E0"/>
    <!-- Play Icon Badge -->
    <circle cx="205" cy="195" r="32" fill="#7C4DFF"/>
    <polygon points="197,180 221,195 197,210" fill="#FFFFFF"/>
  </g>
</svg>
