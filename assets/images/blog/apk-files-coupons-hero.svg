<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="androidGlow" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="playGlow" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Google Play Official Triangle Gradients -->
    <linearGradient id="playBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C1FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <linearGradient id="playGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00A859" />
    </linearGradient>
    <linearGradient id="playRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="100%" stop-color="#D50000" />
    </linearGradient>
    <linearGradient id="playYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#FF9100" />
    </linearGradient>

    <!-- Coupon Badge Gradient -->
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="200" r="300" fill="url(#androidGlow)" />
  <circle cx="1000" cy="450" r="350" fill="url(#playGlow)" />

  <!-- Left Side: Official Android Bugdroid Mascot & Visuals -->
  <g id="android-official-group" transform="translate(100, 115)">
    <!-- Container Card Backdrop -->
    <rect x="0" y="0" width="380" height="400" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Official Android Bugdroid Robot -->
    <g id="official-bugdroid" transform="translate(190, 160)">
      <!-- Head -->
      <path d="M -75,0 C -75,-41.4 41.4,-75 0,-75 C -41.4,-75 75,-41.4 75,0 Z" fill="#3DDC84" />
      <!-- Re-drawing accurate semi-circle for Bugdroid head: center 0,0 radius 75 -->
      <path d="M -75,-5 A 75 75 0 0 1 75 -5 Z" fill="#3DDC84" />
      
      <!-- Antennas -->
      <line x1="-42" y1="-58" x2="-62" y2="-92" stroke="#3DDC84" stroke-width="8" stroke-linecap="round" />
      <line x1="42" y1="-58" x2="62" y2="-92" stroke="#3DDC84" stroke-width="8" stroke-linecap="round" />

      <!-- Eyes -->
      <circle cx="-28" cy="-36" r="7" fill="#ffffff" />
      <circle cx="28" cy="-36" r="7" fill="#ffffff" />

      <!-- Body / Torso -->
      <path d="M -75,8 L 75,8 L 75,85 C 75,100 63,112 48,112 L -48,112 C -63,112 -75,100 -75,85 Z" fill="#3DDC84" />

      <!-- Left Arm -->
      <rect x="-105" y="8" width="20" height="75" rx="10" fill="#3DDC84" />
      <!-- Right Arm -->
      <rect x="85" y="8" width="20" height="75" rx="10" fill="#3DDC84" />

      <!-- Legs -->
      <rect x="-42" y="112" width="20" height="45" rx="10" fill="#3DDC84" />
      <rect x="22" y="112" width="20" height="45" rx="10" fill="#3DDC84" />
    </g>

    <!-- Official APK Badge Overlay -->
    <g transform="translate(45, 330)">
      <rect x="0" y="0" width="290" height="46" rx="10" fill="#0f172a" stroke="#3ddc84" stroke-width="1.5" />
      <circle cx="24" cy="23" r="10" fill="#3ddc84" />
      <path d="M 19 23 L 22 26 L 29 19" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="44" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.05em">
        OFFICIAL ANDROID PACKAGE (APK)
      </text>
    </g>
  </g>

  <!-- Right Side: Content Information & Branding -->
  <g id="editorial-info" transform="translate(520, 115)">
    <!-- Top Pill: PlayNewApps Editorial -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="34" rx="17" fill="url(#badgeGradient)" />
      <text x="22" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.08em">
        EDITORIAL SAVINGS GUIDE
      </text>
    </g>

    <!-- H1 Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">
      APK Files Coupons
    </text>
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#38bdf8" letter-spacing="-0.01em">
      Best Coupon Codes &amp; Deals Guide
    </text>

    <!-- Subtitle description -->
    <text x="0" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" width="580">
      How to find verified promo codes, avoid fake generators,
    </text>
    <text x="0" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8">
      and safely redeem discount vouchers for Android apps.
    </text>

    <!-- Features Highlights Bar with Official Google Play Triangle -->
    <g transform="translate(0, 255)">
      <!-- Box 1: Verified Codes -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="180" height="85" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="0.05em">
          VERIFIED OFFERS
        </text>
        <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
          100% Tested
        </text>
      </g>

      <!-- Box 2: Google Play Integration -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="180" height="85" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
        <!-- Google Play Triangle Logo in Miniature -->
        <g transform="translate(20, 18) scale(0.65)">
          <path d="M 0,0 L 25,25 L 0,50 Z" fill="url(#playBlue)" />
          <path d="M 0,0 L 35,18 L 25,25 Z" fill="url(#playGreen)" />
          <path d="M 25,25 L 35,32 L 0,50 Z" fill="url(#playRed)" />
          <path d="M 25,25 L 35,18 L 45,25 L 35,32 Z" fill="url(#playYellow)" />
        </g>
        <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
          GOOGLE PLAY
        </text>
        <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">
          Promo Ready
        </text>
      </g>

      <!-- Box 3: Security Checked -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="185" height="85" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2" />
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a855f7" letter-spacing="0.05em">
          SAFETY AUDIT
        </text>
        <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
          Play Protect
        </text>
      </g>
    </g>

    <!-- Bottom Meta Line -->
    <g transform="translate(0, 375)">
      <circle cx="8" cy="8" r="5" fill="#10b981" />
      <text x="24" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
        PlayNewApps Research • 2026 Edition • Safe Digital Shopping
      </text>
    </g>
  </g>
</svg>
