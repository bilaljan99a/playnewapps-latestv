<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="dialogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="520" fill="#090d16" />

  <!-- Outer Frame: Android App Store Interface Simulation -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <!-- Main Modal Window -->
    <rect width="780" height="440" rx="16" fill="url(#dialogBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Header bar -->
    <g transform="translate(30, 24)">
      <!-- Google Play Logo Miniature -->
      <path d="M 0,0 L 14,14 L 0,28 Z" fill="#00C1FF" />
      <path d="M 0,0 L 20,10 L 14,14 Z" fill="#00E676" />
      <path d="M 14,14 L 20,18 L 0,28 Z" fill="#FF3D00" />
      <path d="M 14,14 L 20,10 L 26,14 L 20,18 Z" fill="#FFD600" />

      <text x="38" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
        Google Play Store • Redeem Promo Code
      </text>

      <line x1="680" y1="5" x2="695" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
      <line x1="695" y1="5" x2="680" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    </g>

    <line x1="0" y1="65" x2="780" y2="65" stroke="#334155" stroke-width="1" />

    <!-- Step Indicator Progress -->
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="720" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">
        STEP 1: Open Play Store → Payments &amp; Subscriptions → Redeem Code
      </text>
    </g>

    <!-- Interactive Promo Code Entry Field Mockup -->
    <g transform="translate(30, 150)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
        Enter Promo Code or Gift Voucher:
      </text>

      <rect x="0" y="12" width="530" height="54" rx="8" fill="#020617" stroke="#3b82f6" stroke-width="2" />
      <text x="18" y="45" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="0.15em">
        APKPLAY-SAVE2026-PRO
      </text>

      <!-- Verified Checkmark Badge inside input -->
      <g transform="translate(485, 25)">
        <circle cx="14" cy="14" r="14" fill="#10b981" />
        <path d="M 8 14 L 12 18 L 20 10" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Redeem Action Button -->
      <g transform="translate(550, 12)">
        <rect width="170" height="54" rx="8" fill="url(#accentBtn)" />
        <text x="42" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.05em">
          REDEEM
        </text>
      </g>
    </g>

    <!-- Validation & Security Details Box -->
    <g transform="translate(30, 245)">
      <rect width="720" height="150" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

      <!-- Left Column: What gets activated -->
      <g transform="translate(25, 25)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">
          APPLIED PROMO DISCOUNT:
        </text>
        <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#3DDC84">
          $15.00 OFF In-App Premium
        </text>
        <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">
          Valid on Android 12, 13, 14, 15+ official builds • Zero malware risk
        </text>
        <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
          Official Google Play account credential required. No cracked APK installation necessary.
        </text>
      </g>

      <!-- Right Column: Verification Seal -->
      <g transform="translate(540, 25)">
        <rect width="150" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="75" cy="35" r="18" fill="#10b981" />
        <path d="M 68 35 L 73 40 L 82 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="75" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
          PLAY PROTECT
        </text>
        <text x="75" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">
          CERTIFIED
        </text>
      </g>
    </g>
  </g>
</svg>
