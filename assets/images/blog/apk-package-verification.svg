<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="riskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="#090d16" />

  <!-- Title Header -->
  <g transform="translate(60, 35)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
      Official Promo Codes vs. Modded/Cracked APKs
    </text>
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
      Why verifying official developer coupons protects your device, bank accounts, and personal data.
    </text>
  </g>

  <!-- Comparison Grid: 2 Columns -->
  <!-- Left: Official Promo Codes (Safe & Legitimate) -->
  <g transform="translate(60, 110)">
    <rect width="365" height="340" rx="16" fill="url(#safeGrad)" stroke="#10b981" stroke-width="2" />

    <!-- Top Badge -->
    <g transform="translate(25, 25)">
      <rect width="180" height="28" rx="14" fill="#10b981" />
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">
        RECOMMENDED • SAFE
      </text>
      <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        Official Developer Coupons
      </text>
    </g>

    <!-- Checkpoints -->
    <g transform="translate(25, 120)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#10b981" />
        <path d="M 6 10 L 9 13 L 15 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ecfdf5">
          Play Protect Verified Signatures
        </text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 45)">
        <circle cx="10" cy="10" r="10" fill="#10b981" />
        <path d="M 6 10 L 9 13 L 15 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ecfdf5">
          Automatic Cloud Updates &amp; Patches
        </text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 90)">
        <circle cx="10" cy="10" r="10" fill="#10b981" />
        <path d="M 6 10 L 9 13 L 15 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ecfdf5">
          Permanent License Tied to Google ID
        </text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 135)">
        <circle cx="10" cy="10" r="10" fill="#10b981" />
        <path d="M 6 10 L 9 13 L 15 7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ecfdf5">
          Zero Spyware or Keystroke Loggers
        </text>
      </g>
    </g>
  </g>

  <!-- Right: Sideloaded Modded/Cracked APKs (High Risk) -->
  <g transform="translate(475, 110)">
    <rect width="365" height="340" rx="16" fill="url(#riskGrad)" stroke="#ef4444" stroke-width="2" />

    <!-- Top Badge -->
    <g transform="translate(25, 25)">
      <rect width="180" height="28" rx="14" fill="#ef4444" />
      <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">
        WARNING • HIGH RISK
      </text>
      <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        Cracked / Modded APKs
      </text>
    </g>

    <!-- Danger Points -->
    <g transform="translate(25, 120)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#ef4444" />
        <line x1="6" y1="6" x2="14" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <line x1="14" y1="6" x2="6" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#fef2f2">
          Broken Developer Cryptographic Signatures
        </text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(0, 45)">
        <circle cx="10" cy="10" r="10" fill="#ef4444" />
        <line x1="6" y1="6" x2="14" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <line x1="14" y1="6" x2="6" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#fef2f2">
          Injected Trojan &amp; Adware Payloads
        </text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(0, 90)">
        <circle cx="10" cy="10" r="10" fill="#ef4444" />
        <line x1="6" y1="6" x2="14" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <line x1="14" y1="6" x2="6" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#fef2f2">
          Frequent Account Bans by Platforms
        </text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(0, 135)">
        <circle cx="10" cy="10" r="10" fill="#ef4444" />
        <line x1="6" y1="6" x2="14" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <line x1="14" y1="6" x2="6" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#fef2f2">
          Credential &amp; Banking Token Interception
        </text>
      </g>
    </g>
  </g>
</svg>
