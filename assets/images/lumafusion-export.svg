<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="clipGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="clipGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="audioGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="70%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="accentBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
  </defs>

  <!-- Base App Background -->
  <rect width="1280" height="720" fill="#0d1117"/>

  <!-- Top Navigation Header -->
  <rect width="1280" height="48" fill="url(#headerGrad)"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#30363d" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="24" r="6" fill="#f85149"/>
  <circle cx="40" cy="24" r="6" fill="#d29922"/>
  <circle cx="60" cy="24" r="6" fill="#3fb950"/>

  <!-- App Title & Project Info -->
  <text x="90" y="29" fill="#f0f6fc" font-size="14" font-weight="600">LumaFusion Pro</text>
  <text x="210" y="29" fill="#8b949e" font-size="13">•  4K UHD High-Resolution Export Suite</text>
  <rect x="520" y="12" width="240" height="24" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="640" y="28" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">00:04:18:22 / 00:12:45:00</text>

  <!-- Top Right Action Buttons -->
  <rect x="1020" y="10" width="110" height="28" rx="6" fill="url(#accentBtn)"/>
  <text x="1075" y="28" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Export (4K)</text>
  <rect x="1145" y="10" width="115" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="1202" y="28" fill="#c9d1d9" font-size="12" font-weight="500" text-anchor="middle">Settings ⚙️</text>

  <!-- Screen Specific Content -->
  
  <!-- Export Settings Dialog Box -->
  <rect x="0" y="48" width="1280" height="672" fill="#010409" opacity="0.8"/>
  
  <g transform="translate(290, 90)">
    <rect width="700" height="540" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    
    <!-- Modal Header -->
    <rect width="700" height="56" rx="12" fill="#21262d"/>
    <text x="24" y="34" fill="#f0f6fc" font-size="16" font-weight="700">EXPORT PROJECT SETTINGS</text>
    <text x="660" y="34" fill="#8b949e" font-size="16" font-weight="700" text-anchor="middle">✕</text>
    
    <!-- Export Format Selection Pills -->
    <text x="24" y="85" fill="#8b949e" font-size="12" font-weight="700">FILE TYPE DESTINATION</text>
    <rect x="24" y="98" width="145" height="42" rx="8" fill="url(#accentBtn)"/>
    <text x="96" y="124" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">🎬 Movie (MP4)</text>
    
    <rect x="184" y="98" width="145" height="42" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="256" y="124" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">🎵 Audio Only</text>

    <rect x="344" y="98" width="155" height="42" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="421" y="124" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">📁 FCPXML Package</text>

    <rect x="514" y="98" width="160" height="42" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="594" y="124" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">☁️ Project Archive</text>

    <!-- Resolution & Framerate Dropdowns -->
    <text x="24" y="175" fill="#8b949e" font-size="12" font-weight="700">RESOLUTION & FRAMERATE</text>
    <rect x="24" y="188" width="315" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="40" y="215" fill="#f0f6fc" font-size="13" font-weight="600">4K Ultra HD (3840 x 2160)</text>
    <rect x="270" y="198" width="55" height="24" rx="4" fill="#238636"/>
    <text x="297" y="214" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">PRO</text>

    <rect x="360" y="188" width="315" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="376" y="215" fill="#f0f6fc" font-size="13" font-weight="600">60 fps (Smooth Motion)</text>

    <!-- Bitrate Slider -->
    <text x="24" y="265" fill="#8b949e" font-size="12" font-weight="700">TARGET BITRATE (QUALITY / FILE SIZE)</text>
    <rect x="24" y="280" width="650" height="10" rx="5" fill="#0d1117"/>
    <rect x="24" y="280" width="480" height="10" rx="5" fill="#1f6feb"/>
    <circle cx="504" cy="285" r="12" fill="#58a6ff" stroke="#ffffff" stroke-width="2"/>
    <text x="24" y="312" fill="#58a6ff" font-size="13" font-weight="700">150 Mbps (Extreme Quality - Approx 1.45 GB)</text>

    <!-- Render Progress Bar -->
    <rect x="24" y="340" width="652" height="70" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="40" y="365" fill="#f0f6fc" font-size="13" font-weight="700">Rendering Hardware Acceleration (78% Complete)...</text>
    <rect x="40" y="380" width="620" height="14" rx="7" fill="#21262d"/>
    <rect x="40" y="380" width="484" height="14" rx="7" fill="url(#meterGrad)"/>

    <!-- Action Buttons -->
    <rect x="360" y="460" width="150" height="44" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="435" y="487" fill="#c9d1d9" font-size="13" font-weight="600" text-anchor="middle">Cancel</text>
    
    <rect x="526" y="460" width="150" height="44" rx="6" fill="url(#accentBtn)"/>
    <text x="601" y="487" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Start Export 🚀</text>
  </g>

</svg>