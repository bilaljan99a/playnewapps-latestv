<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <rect width="1280" height="720" fill="#0a0d17"/>

  <g transform="translate(60, 40)">
    <rect width="1160" height="640" rx="16" fill="#131a28" stroke="#222d42" stroke-width="2"/>

    <!-- Canvas Preview with Keyframe Path -->
    <g transform="translate(30, 30)">
      <rect width="680" height="580" rx="12" fill="#0f1522" stroke="#1e293b"/>
      <text x="24" y="36" fill="#ffffff" font-size="18" font-weight="bold">Keyframe Motion Path Inspector</text>

      <!-- Scene Stage -->
      <g transform="translate(24, 60)">
        <rect width="632" height="470" rx="10" fill="#162032"/>

        <!-- Motion Motion Dotted Path -->
        <path d="M 80 380 Q 250 80 400 240 T 560 120" fill="none" stroke="#ff4757" stroke-width="3" stroke-dasharray="6 6"/>

        <!-- Keyframe Diamond Nodes -->
        <polygon points="80,370 90,380 80,390 70,380" fill="#ffd166" stroke="#ffffff" stroke-width="2"/>
        <text x="80" y="410" fill="#ffd166" font-size="11" text-anchor="middle">KF 1 (Scale 0%)</text>

        <polygon points="250,150 260,160 250,170 240,160" fill="#ffd166" stroke="#ffffff" stroke-width="2"/>
        <text x="250" y="140" fill="#ffd166" font-size="11" text-anchor="middle">KF 2 (Rot 180°)</text>

        <polygon points="400,230 410,240 400,250 390,240" fill="#ff4757" stroke="#ffffff" stroke-width="3"/>
        <text x="400" y="275" fill="#ff4757" font-size="11" font-weight="bold" text-anchor="middle">ACTIVE KF 3 ★</text>

        <polygon points="560,110 570,120 560,130 550,120" fill="#ffd166" stroke="#ffffff" stroke-width="2"/>
        <text x="560" y="95" fill="#ffd166" font-size="11" text-anchor="middle">KF 4 (Exit 100%)</text>

        <!-- Layer Element moving along path -->
        <g transform="translate(400, 240)">
          <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#ff4757"/>
          <text x="0" y="5" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LOGO</text>
        </g>
      </g>
    </g>

    <!-- Right Controls Panel -->
    <g transform="translate(730, 30)">
      <rect width="400" height="580" rx="12" fill="#0f1522" stroke="#1e293b"/>
      <text x="24" y="40" fill="#ffffff" font-size="18" font-weight="bold">Transform &amp; Easing</text>

      <!-- Keyframe Action Buttons -->
      <g transform="translate(24, 65)">
        <rect width="160" height="42" rx="8" fill="#ff4757"/>
        <text x="80" y="26" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">◆ Add Keyframe</text>
        <rect x="180" y="0" width="160" height="42" rx="8" fill="#1e293b"/>
        <text x="260" y="26" fill="#cbd5e1" font-size="13" text-anchor="middle">◇ Remove Keyframe</text>
      </g>

      <!-- Position X/Y -->
      <g transform="translate(24, 130)">
        <text x="0" y="20" fill="#cbd5e1" font-size="13">Position X: 400px • Position Y: 240px</text>
      </g>

      <!-- Scale Slider -->
      <g transform="translate(24, 180)">
        <text x="0" y="0" fill="#cbd5e1" font-size="13">Scale Ratio: 125%</text>
        <rect x="0" y="12" width="350" height="10" rx="5" fill="#1e293b"/>
        <rect x="0" y="12" width="220" height="10" rx="5" fill="#ff4757"/>
        <circle cx="220" cy="17" r="10" fill="#ffffff"/>
      </g>

      <!-- Rotation Slider -->
      <g transform="translate(24, 240)">
        <text x="0" y="0" fill="#cbd5e1" font-size="13">Rotation Angle: 45°</text>
        <rect x="0" y="12" width="350" height="10" rx="5" fill="#1e293b"/>
        <rect x="0" y="12" width="140" height="10" rx="5" fill="#1e90ff"/>
        <circle cx="140" cy="17" r="10" fill="#ffffff"/>
      </g>

      <!-- Easing Curve Presets -->
      <g transform="translate(24, 310)">
        <text x="0" y="0" fill="#00e676" font-size="13" font-weight="bold">EASING VELOCITY CURVE</text>
        <g transform="translate(0, 15)">
          <rect x="0" y="0" width="100" height="36" rx="6" fill="#ff4757"/>
          <text x="50" y="22" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Ease In Out</text>
          
          <rect x="110" y="0" width="100" height="36" rx="6" fill="#1e293b"/>
          <text x="160" y="22" fill="#cbd5e1" font-size="12" text-anchor="middle">Linear</text>

          <rect x="220" y="0" width="100" height="36" rx="6" fill="#1e293b"/>
          <text x="270" y="22" fill="#cbd5e1" font-size="12" text-anchor="middle">Bounce Out</text>
        </g>
      </g>
    </g>
  </g>
</svg>