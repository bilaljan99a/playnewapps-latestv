<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#02132B" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
    <linearGradient id="glowRad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFC8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0052CC" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#heroBg)" />
  <circle cx="950" cy="250" r="280" fill="url(#glowRad)" />

  <!-- Grid Tech Lines -->
  <g opacity="0.1" stroke="#00C8FF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 80)">
    <!-- Badge -->
    <rect width="260" height="34" rx="17" fill="#00C8FF" fill-opacity="0.15" stroke="#00C8FF" stroke-width="1" />
    <text x="130" y="22" fill="#00FFC8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">🛡️ 2026 OFFICIAL REVIEW &amp; TEST</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44">Wondershare Recoverit 13</text>
    <text x="0" y="125" fill="#00C8FF" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32">AI-Powered Data Recovery Suite</text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="16">Recover lost photos, 4K/8K videos, office documents &amp; NAS drives</text>
    <text x="0" y="188" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="16">with 99.5% recovery rate &amp; patented AI Fragmented Video Repair.</text>

    <!-- Highlights Badges -->
    <g transform="translate(0, 220)">
      <!-- Badge 1 -->
      <rect width="150" height="40" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="15" y="25" fill="#00FFC8" font-family="sans-serif" font-weight="bold" font-size="14">99.5%</text>
      <text x="65" y="25" fill="#CBD5E1" font-family="sans-serif" font-size="12">Success Rate</text>

      <!-- Badge 2 -->
      <rect x="160" width="160" height="40" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="175" y="25" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="14">1000+</text>
      <text x="225" y="25" fill="#CBD5E1" font-family="sans-serif" font-size="12">File Formats</text>

      <!-- Badge 3 -->
      <rect x="330" width="180" height="40" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="345" y="25" fill="#F59E0B" font-family="sans-serif" font-weight="bold" font-size="14">AI Video</text>
      <text x="405" y="25" fill="#CBD5E1" font-family="sans-serif" font-size="12">Deep Repair</text>
    </g>

    <!-- Offer Pill -->
    <g transform="translate(0, 280)">
      <rect width="510" height="48" rx="24" fill="url(#cyanBlue)" />
      <text x="255" y="30" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="15" text-anchor="middle">🔥 Exclusive Discount: Save Up to 51% OFF + Extra 10% Auto-Applied</text>
    </g>
  </g>

  <!-- Right Visual Mockup -->
  <g transform="translate(680, 70)">
    <!-- Main Window Frame -->
    <rect width="450" height="340" rx="12" fill="#1E293B" stroke="#00C8FF" stroke-width="2" />
    <rect width="450" height="32" rx="12" fill="#0F172A" />
    <circle cx="20" cy="16" r="5" fill="#EF4444" />
    <circle cx="35" cy="16" r="5" fill="#F59E0B" />
    <circle cx="50" cy="16" r="5" fill="#10B981" />
    <text x="225" y="20" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">Wondershare Recoverit 13 Pro</text>

    <!-- Inner UI Elements -->
    <!-- Scanning Radar Animation Effect -->
    <circle cx="225" cy="170" r="90" fill="none" stroke="#00C8FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="225" cy="170" r="60" fill="none" stroke="#00FFC8" stroke-width="2" opacity="0.8" />
    <circle cx="225" cy="170" r="30" fill="#00C8FF" opacity="0.2" />
    <circle cx="225" cy="170" r="8" fill="#00FFC8" />

    <!-- File Icons floating -->
    <rect x="100" y="90" width="70" height="50" rx="6" fill="#334155" />
    <text x="135" y="120" fill="#00FFC8" font-family="sans-serif" font-size="12" text-anchor="middle">📷 JPG/RAW</text>

    <rect x="280" y="90" width="70" height="50" rx="6" fill="#334155" />
    <text x="315" y="120" fill="#00C8FF" font-family="sans-serif" font-size="12" text-anchor="middle">🎬 MP4/MOV</text>

    <rect x="90" y="220" width="80" height="50" rx="6" fill="#334155" />
    <text x="130" y="250" fill="#F59E0B" font-family="sans-serif" font-size="12" text-anchor="middle">📄 PDF/DOC</text>

    <rect x="280" y="220" width="80" height="50" rx="6" fill="#334155" />
    <text x="320" y="250" fill="#EC4899" font-family="sans-serif" font-size="12" text-anchor="middle">💾 NAS/BTRFS</text>

    <!-- Scan Progress Bar -->
    <rect x="40" y="290" width="370" height="24" rx="12" fill="#0F172A" stroke="#334155" />
    <rect x="42" y="292" width="310" height="20" rx="10" fill="url(#cyanBlue)" />
    <text x="225" y="306" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Deep Scan Progress: 87% (14,280 files found)</text>
  </g>
</svg>
