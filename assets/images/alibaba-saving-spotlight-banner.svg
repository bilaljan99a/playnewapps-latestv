<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Dark Royalty Background -->
    <linearGradient id="spotlightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Glowing Blue Gradient -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Vibrant Orange Gradient -->
    <linearGradient id="vibrantOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <!-- Emerald Green -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feBlend in="SourceGraphic" in2="blur" mode="normal" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="url(#spotlightBg)"/>

  <!-- Glowing Spotlight Beams -->
  <path d="M 600 -100 L 200 400 L 1000 400 Z" fill="#2563EB" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1000" cy="100" r="250" fill="#FF6A00" opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="100" cy="300" r="200" fill="#2563EB" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Geometric Grid Accent -->
  <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Left Main Content -->
  <!-- Top Tag -->
  <g transform="translate(60, 48)">
    <rect width="250" height="36" rx="18" fill="url(#blueGlow)"/>
    <text x="125" y="23" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SAVING SPOTLIGHT DEALS</text>
  </g>

  <!-- Big Hero Title -->
  <text x="60" y="132" font-family="'Roboto', Arial, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    Save Up To 80% Below Retail Prices
  </text>

  <!-- Description -->
  <text x="60" y="174" font-family="'Roboto', Arial, sans-serif" font-size="19" font-weight="400" fill="#94A3B8">
    Explore Alibaba's curated Saving Spotlight collection across electronics, fashion, home &amp; tools.
  </text>

  <!-- Key Highlights Badges -->
  <g transform="translate(60, 210)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="url(#vibrantOrange)"/>
    <text x="90" y="25" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">🔥 Up To 80% OFF</text>

    <rect x="195" y="0" width="180" height="40" rx="8" fill="url(#emeraldGrad)"/>
    <text x="285" y="25" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓ Low MOQ Samples</text>

    <rect x="390" y="0" width="210" height="40" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="495" y="25" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="800" fill="#38BDF8" text-anchor="middle">⚡ Code HH12: $20 OFF</text>
  </g>

  <!-- Coupon Code Banner -->
  <g transform="translate(60, 278)">
    <rect width="570" height="72" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">VERIFIED COUPON OFFER:</text>
    <text x="24" y="55" font-family="'Roboto', Arial, sans-serif" font-size="20" font-weight="900" fill="#10B981">$20 OFF On Eligible Orders</text>

    <rect x="390" y="15" width="155" height="42" rx="8" fill="url(#vibrantOrange)"/>
    <text x="467" y="41" font-family="'Roboto', Arial, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">CODE: HH12</text>
  </g>

  <!-- Right Visual Graphics: Deals Badge -->
  <g transform="translate(750, 45)">
    <rect x="0" y="0" width="390" height="310" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>

    <!-- Large Badge Graphic -->
    <circle cx="195" cy="120" r="75" fill="url(#vibrantOrange)" filter="url(#softGlow)"/>
    <circle cx="195" cy="120" r="65" fill="#0F172A" stroke="#FF6A00" stroke-width="3"/>
    <text x="195" y="112" font-family="'Roboto', Arial, sans-serif" font-size="34" font-weight="900" fill="#FF6A00" text-anchor="middle">80%</text>
    <text x="195" y="138" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">MAX DISCOUNT</text>

    <!-- Spotlight Categories -->
    <g transform="translate(25, 215)">
      <rect x="0" y="0" width="105" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="52" y="28" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">Electronics</text>
      <text x="52" y="48" font-family="'Roboto', Arial, sans-serif" font-size="12" font-weight="900" fill="#10B981" text-anchor="middle">Direct Factory</text>

      <rect x="117" y="0" width="105" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="169" y="28" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">Home Goods</text>
      <text x="169" y="48" font-family="'Roboto', Arial, sans-serif" font-size="12" font-weight="900" fill="#10B981" text-anchor="middle">Bulk Pricing</text>

      <rect x="235" y="0" width="105" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="287" y="28" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">Machinery</text>
      <text x="287" y="48" font-family="'Roboto', Arial, sans-serif" font-size="12" font-weight="900" fill="#10B981" text-anchor="middle">OEM / ODM</text>
    </g>
  </g>
</svg>
