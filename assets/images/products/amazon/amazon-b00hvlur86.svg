<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <rect width="400" height="300" rx="16" fill="url(#spotlight)"/>
  <rect x="1" y="1" width="398" height="298" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Metadata Header -->
  <g transform="translate(24, 28)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="85" height="22" rx="11" fill="#0f172a"/>
    <text x="42.5" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">AUDIO-TECHNICA</text>
  </g>

  <!-- Amazon Verified Badge Top Right -->
  <g transform="translate(315, 24)">
    <circle cx="16" cy="16" r="14" fill="#ff9900" fill-opacity="0.15"/>
    <circle cx="16" cy="16" r="10" fill="#ff9900"/>
    <path d="M 12 16 L 15 19 L 21 13" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Center Artwork -->
  
        <!-- Headphones Vector Art -->
        <g transform="translate(130, 45)">
          <defs>
            <linearGradient id="headband-1e293b" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#334155" />
              <stop offset="50%" stop-color="#64748b" />
              <stop offset="100%" stop-color="#334155" />
            </linearGradient>
            <linearGradient id="cup-1e293b" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1e293b" />
              <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>
          </defs>
          <!-- Headband Arc -->
          <path d="M 15 90 C 15 15, 125 15, 125 90" fill="none" stroke="url(#headband-1e293b)" stroke-width="12" stroke-linecap="round"/>
          <path d="M 25 80 C 25 30, 115 30, 115 80" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
          <!-- Left Ear Cup -->
          <g transform="translate(0, 75)">
            <rect x="0" y="0" width="30" height="55" rx="15" fill="url(#cup-1e293b)" stroke="#1e293b" stroke-width="2"/>
            <rect x="5" y="8" width="10" height="39" rx="5" fill="#334155"/>
            <circle cx="15" cy="27" r="4" fill="#1e293b"/>
          </g>
          <!-- Right Ear Cup -->
          <g transform="translate(110, 75)">
            <rect x="0" y="0" width="30" height="55" rx="15" fill="url(#cup-1e293b)" stroke="#1e293b" stroke-width="2"/>
            <rect x="15" y="8" width="10" height="39" rx="5" fill="#334155"/>
            <circle cx="15" cy="27" r="4" fill="#1e293b"/>
          </g>
        </g>
      

  <!-- Bottom Details Bar -->
  <g transform="translate(24, 238)">
    <rect x="0" y="0" width="352" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#card-shadow)"/>
    <!-- Title -->
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#0f172a">ATH-M50x Studio Monitors</text>
    <!-- Subtitle -->
    <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#64748b">45mm Drivers • Pro Sound Isolation</text>
    <!-- Accent Dot -->
    <circle cx="334" cy="21" r="5" fill="#1e293b"/>
  </g>
</svg>