<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="capHeaderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181f2e"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="capBtnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="capPinkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="capClipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0061ff"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <linearGradient id="capAudioGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="capMeter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="70%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" fill="#0b0f19"/>

  <!-- Header -->
  <rect width="1280" height="48" fill="url(#capHeaderGrad)"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#252f44" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="20" cy="24" r="6" fill="#ff4b5c"/>
  <circle cx="40" cy="24" r="6" fill="#fdb813"/>
  <circle cx="60" cy="24" r="6" fill="#00e676"/>

  <!-- App Title and Mode -->
  <text x="90" y="29" fill="#ffffff" font-size="14" font-weight="700">CapCut Pro</text>
  <text x="200" y="29" fill="#8da0c4" font-size="13">•  Auto-Captions Generator &amp;amp; Viral Text Animations</text>
  <rect x="520" y="12" width="240" height="24" rx="6" fill="#0b0f19" stroke="#252f44"/>
  <text x="640" y="28" fill="#4facfe" font-size="12" font-weight="600" text-anchor="middle">00:00:15:10 / 00:00:45:00</text>

  <!-- Top Right Actions -->
  <rect x="1010" y="10" width="120" height="28" rx="6" fill="url(#capBtnGrad)"/>
  <text x="1070" y="28" fill="#000000" font-size="12" font-weight="700" text-anchor="middle">Export (4K / 60)</text>
  <rect x="1140" y="10" width="120" height="28" rx="6" fill="#181f2e" stroke="#252f44"/>
  <text x="1200" y="28" fill="#c3d2ec" font-size="12" font-weight="600" text-anchor="middle">TikTok Direct</text>

  <!-- Content -->
  
  <rect x="12" y="60" width="420" height="648" rx="8" fill="#111622" stroke="#252f44"/>
  <text x="28" y="88" fill="#8da0c4" font-size="13" font-weight="700">AUTO-CAPTIONS &amp; KARAOKE STYLING PRESETS</text>

  
    <g transform="translate(24, 110)">
      <rect width="372" height="90" rx="8" fill="#0b0f19" stroke="#00f2fe" stroke-width="2"/>
      <text x="16" y="28" fill="#ffffff" font-size="14" font-weight="700">Hormozi Viral Bold</text>
      <text x="16" y="50" fill="#8da0c4" font-size="12">Font: Montserrat Black • Yellow + Dark Outline</text>
      <rect x="16" y="60" width="80" height="20" rx="4" fill="#00f2fe"/>
      <text x="56" y="74" fill="#000000" font-size="11" font-weight="700" text-anchor="middle">ACTIVE</text>
    </g>
  
    <g transform="translate(24, 215)">
      <rect width="372" height="90" rx="8" fill="#0b0f19" stroke="#252f44" stroke-width="1"/>
      <text x="16" y="28" fill="#ffffff" font-size="14" font-weight="700">Ali Abdaal Clean Minimal</text>
      <text x="16" y="50" fill="#8da0c4" font-size="12">Font: Inter SemiBold • Cyan Accent Background</text>
      <rect x="16" y="60" width="80" height="20" rx="4" fill="#181f2e"/>
      <text x="56" y="74" fill="#8da0c4" font-size="11" font-weight="700" text-anchor="middle">SELECT</text>
    </g>
  
    <g transform="translate(24, 320)">
      <rect width="372" height="90" rx="8" fill="#0b0f19" stroke="#252f44" stroke-width="1"/>
      <text x="16" y="28" fill="#ffffff" font-size="14" font-weight="700">MrBeast Dynamic Bounce</text>
      <text x="16" y="50" fill="#8da0c4" font-size="12">Font: Komika Display • Red Fill + 3D Stroke</text>
      <rect x="16" y="60" width="80" height="20" rx="4" fill="#181f2e"/>
      <text x="56" y="74" fill="#8da0c4" font-size="11" font-weight="700" text-anchor="middle">SELECT</text>
    </g>
  
    <g transform="translate(24, 425)">
      <rect width="372" height="90" rx="8" fill="#0b0f19" stroke="#252f44" stroke-width="1"/>
      <text x="16" y="28" fill="#ffffff" font-size="14" font-weight="700">Neon Cyberpunk Glow</text>
      <text x="16" y="50" fill="#8da0c4" font-size="12">Font: Space Grotesk • Neon Pink Shadow</text>
      <rect x="16" y="60" width="80" height="20" rx="4" fill="#181f2e"/>
      <text x="56" y="74" fill="#8da0c4" font-size="11" font-weight="700" text-anchor="middle">SELECT</text>
    </g>
  
    <g transform="translate(24, 530)">
      <rect width="372" height="90" rx="8" fill="#0b0f19" stroke="#252f44" stroke-width="1"/>
      <text x="16" y="28" fill="#ffffff" font-size="14" font-weight="700">Podcast Executive Serif</text>
      <text x="16" y="50" fill="#8da0c4" font-size="12">Font: Playfair Display • Gold Underline Accent</text>
      <rect x="16" y="60" width="80" height="20" rx="4" fill="#181f2e"/>
      <text x="56" y="74" fill="#8da0c4" font-size="11" font-weight="700" text-anchor="middle">SELECT</text>
    </g>
  

  <!-- Right Caption Preview Stage -->
  <rect x="444" y="60" width="824" height="648" rx="8" fill="#06090e" stroke="#252f44"/>
  <text x="464" y="88" fill="#8da0c4" font-size="13" font-weight="700">LIVE DYNAMIC KARAOKE CAPTION SIMULATOR (TIMED WORD HIGHLIGHTING)</text>

  <rect x="680" y="140" width="350" height="460" rx="20" fill="#181f2e" stroke="#4facfe" stroke-width="2"/>
  <rect x="710" y="170" width="290" height="180" rx="10" fill="#111622"/>
  <circle cx="855" cy="260" r="50" fill="#0061ff"/>

  <!-- Caption Overlay on phone screen -->
  <rect x="710" y="380" width="290" height="90" rx="8" fill="#0b0f19" opacity="0.9"/>
  <text x="855" y="415" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">HERE IS THE <tspan fill="#f6d365">SECRET</tspan></text>
  <text x="855" y="445" fill="#ffffff" font-size="20" font-weight="900" text-anchor="middle">TO <tspan fill="#00f2fe">10 MILLION</tspan> VIEWS</text>

</svg>