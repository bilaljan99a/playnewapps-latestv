<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="40%" stop-color="#222633"/>
      <stop offset="100%" stop-color="#111319"/>
    </linearGradient>

    <!-- Accent Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>

    <!-- Gold/Yellow Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>

    <!-- Green Badge Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Blue Badge Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)"/>

  <!-- Decorative Abstract Geometric Accents -->
  <circle cx="1100" cy="80" r="220" fill="#FF5000" opacity="0.08" filter="url(#glow)"/>
  <circle cx="150" cy="350" r="180" fill="#10B981" opacity="0.05" filter="url(#glow)"/>
  <path d="M 900 -50 L 1250 300 L 1050 450 Z" fill="url(#orangeGrad)" opacity="0.06"/>
  <path d="M 0 0 L 300 0 L 0 300 Z" fill="url(#orangeGrad)" opacity="0.04"/>

  <!-- Grid Pattern Overlay -->
  <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Left Content Column -->
  <!-- Top Badge -->
  <g transform="translate(60, 48)">
    <rect width="280" height="36" rx="18" fill="url(#orangeGrad)"/>
    <text x="140" y="23" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">FACTORY-DIRECT WHOLESALE</text>
  </g>

  <!-- Headline Title -->
  <text x="60" y="130" font-family="'Roboto', Arial, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    Alibaba Global B2B Marketplace
  </text>

  <!-- Subheadline -->
  <text x="60" y="172" font-family="'Roboto', Arial, sans-serif" font-size="20" font-weight="400" fill="#A0AEC0">
    Source directly from verified manufacturers with Trade Assurance escrow protection.
  </text>

  <!-- Feature Bullet Badges -->
  <g transform="translate(60, 205)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="190" height="38" rx="8" fill="url(#greenGrad)"/>
    <text x="95" y="24" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Trade Assurance 100%</text>

    <!-- Badge 2 -->
    <rect x="205" y="0" width="180" height="38" rx="8" fill="url(#blueGrad)"/>
    <text x="295" y="24" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">★ Verified Suppliers</text>

    <!-- Badge 3 -->
    <rect x="400" y="0" width="180" height="38" rx="8" fill="#2D3748" stroke="#4A5568" stroke-width="1"/>
    <text x="490" y="24" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="700" fill="#FF7A00" text-anchor="middle">⚡ Low MOQ Samples</text>
  </g>

  <!-- Promo Offer Box -->
  <g transform="translate(60, 275)">
    <rect width="560" height="75" rx="12" fill="#222736" stroke="url(#orangeGrad)" stroke-width="2"/>
    <text x="25" y="32" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="700" fill="#A0AEC0">EXCLUSIVE VERIFIED PROMOTION:</text>
    <text x="25" y="58" font-family="'Roboto', Arial, sans-serif" font-size="22" font-weight="900" fill="#FFB800">$20 OFF Your First Wholesale Order</text>

    <rect x="380" y="16" width="160" height="42" rx="8" fill="url(#orangeGrad)"/>
    <text x="460" y="42" font-family="'Roboto', Arial, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle">USE CODE: HH12</text>
  </g>

  <!-- Right Visual Graphics Illustration -->
  <g transform="translate(740, 45)">
    <!-- Main Card Container -->
    <rect x="0" y="0" width="400" height="310" rx="16" fill="#212531" stroke="#32384A" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Alibaba Logo Badge -->
    <rect x="30" y="25" width="80" height="80" rx="16" fill="url(#orangeGrad)"/>
    <!-- Logo Icon 'a' -->
    <path d="M70 42 C57 42 48 51 48 64 C48 77 57 87 70 87 C78 87 85 83 89 77 L89 85 L98 85 L98 44 L89 44 L89 52 C85 46 78 42 70 42 Z M72 51 C80 51 89 57 89 66 C89 75 80 80 72 80 C63 80 57 73 57 66 C57 57 63 51 72 51 Z" fill="#FFFFFF"/>

    <text x="125" y="60" font-family="'Roboto', Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Alibaba<tspan fill="#FF7A00">.com</tspan></text>
    <text x="125" y="85" font-family="'Roboto', Arial, sans-serif" font-size="13" font-weight="700" fill="#A0AEC0" letter-spacing="1">GLOBAL B2B SOURCING</text>

    <!-- Stats Divider -->
    <line x1="30" y1="125" x2="370" y2="125" stroke="#32384A" stroke-width="1"/>

    <!-- Dynamic Metrics Box -->
    <g transform="translate(30, 145)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="105" height="70" rx="8" fill="#181B24"/>
      <text x="52" y="30" font-family="'Roboto', Arial, sans-serif" font-size="20" font-weight="900" fill="#FF7A00" text-anchor="middle">200K+</text>
      <text x="52" y="52" font-family="'Roboto', Arial, sans-serif" font-size="11" font-weight="600" fill="#718096" text-anchor="middle">Suppliers</text>

      <!-- Metric 2 -->
      <rect x="117" y="0" width="105" height="70" rx="8" fill="#181B24"/>
      <text x="169" y="30" font-family="'Roboto', Arial, sans-serif" font-size="20" font-weight="900" fill="#10B981" text-anchor="middle">100%</text>
      <text x="169" y="52" font-family="'Roboto', Arial, sans-serif" font-size="11" font-weight="600" fill="#718096" text-anchor="middle">Escrow Safe</text>

      <!-- Metric 3 -->
      <rect x="235" y="0" width="105" height="70" rx="8" fill="#181B24"/>
      <text x="287" y="30" font-family="'Roboto', Arial, sans-serif" font-size="20" font-weight="900" fill="#3B82F6" text-anchor="middle">200+</text>
      <text x="287" y="52" font-family="'Roboto', Arial, sans-serif" font-size="11" font-weight="600" fill="#718096" text-anchor="middle">Countries</text>
    </g>

    <!-- Trust Seal Bottom -->
    <rect x="30" y="235" width="340" height="48" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" stroke-width="1"/>
    <text x="200" y="264" font-family="'Roboto', Arial, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">🔒 Verified Trade Protection & On-Time Shipping</text>
  </g>
</svg>
