<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="capHeaderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181f2e"/>
      <stop offset="100%" stop-color="#111622"/>
    </linearGradient>
    <linearGradient id="capBtnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="capPinkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="capClipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0061ff"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>
    <linearGradient id="capAudioGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="capMeter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="70%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" fill="#0b0f19"/>

  <!-- Header -->
  <rect width="1280" height="48" fill="url(#capHeaderGrad)"/>
  <line x1="0" y1="48" x2="1280" y2="48" stroke="#252f44" stroke-width="1"/>

  <!-- Window Buttons -->
  <circle cx="20" cy="24" r="6" fill="#ff4b5c"/>
  <circle cx="40" cy="24" r="6" fill="#fdb813"/>
  <circle cx="60" cy="24" r="6" fill="#00e676"/>

  <!-- App Title and Mode -->
  <text x="90" y="29" fill="#ffffff" font-size="14" font-weight="700">CapCut Pro</text>
  <text x="200" y="29" fill="#8da0c4" font-size="13">•  3D Color Grading Suite &amp;amp; Cinematic LUT Importer</text>
  <rect x="520" y="12" width="240" height="24" rx="6" fill="#0b0f19" stroke="#252f44"/>
  <text x="640" y="28" fill="#4facfe" font-size="12" font-weight="600" text-anchor="middle">00:00:15:10 / 00:00:45:00</text>

  <!-- Top Right Actions -->
  <rect x="1010" y="10" width="120" height="28" rx="6" fill="url(#capBtnGrad)"/>
  <text x="1070" y="28" fill="#000000" font-size="12" font-weight="700" text-anchor="middle">Export (4K / 60)</text>
  <rect x="1140" y="10" width="120" height="28" rx="6" fill="#181f2e" stroke="#252f44"/>
  <text x="1200" y="28" fill="#c3d2ec" font-size="12" font-weight="600" text-anchor="middle">TikTok Direct</text>

  <!-- Content -->
  
  <rect x="12" y="60" width="700" height="400" rx="8" fill="#111622" stroke="#252f44"/>
  <text x="28" y="85" fill="#8da0c4" font-size="12" font-weight="700">CAPCUT PRO COLOR CORRECTOR &amp; LUT PALETTE PREVIEW</text>

  <rect x="28" y="100" width="320" height="340" fill="#181f2e"/>
  <circle cx="188" cy="230" r="65" fill="#5c4033"/>
  <text x="188" y="380" fill="#8da0c4" font-size="13" font-weight="700" text-anchor="middle">RAW FLAT LOG</text>

  <rect x="360" y="100" width="336" height="340" fill="#08101a"/>
  <circle cx="528" cy="230" r="65" fill="#ff4b5c"/>
  <text x="528" y="380" fill="#00f2fe" font-size="13" font-weight="700" text-anchor="middle">TEAL &amp; ORANGE LUT GRADED</text>
  <line x1="354" y1="100" x2="354" y2="440" stroke="#00f2fe" stroke-width="3"/>

  <!-- Right HSL and Curves -->
  <rect x="724" y="60" width="544" height="400" rx="8" fill="#111622" stroke="#252f44"/>
  <text x="740" y="85" fill="#8da0c4" font-size="12" font-weight="700">HSL TARGETING &amp; RGB TONE CURVES</text>
  <rect x="740" y="100" width="512" height="340" fill="#0b0f19" stroke="#252f44"/>
  <path d="M 770 390 C 880 340, 950 180, 1200 130" fill="none" stroke="#00f2fe" stroke-width="3"/>
  <circle cx="950" cy="245" r="8" fill="#ff0844" stroke="#ffffff" stroke-width="2"/>
  <text x="950" y="280" fill="#ffffff" font-size="12" text-anchor="middle">Midtone Saturation Boost (+18)</text>

  <!-- Bottom Color Wheel Controls -->
  <rect x="12" y="472" width="1256" height="236" rx="8" fill="#111622" stroke="#252f44"/>
  <g transform="translate(180, 580)">
    <circle cx="0" cy="0" r="65" fill="#0b0f19" stroke="#252f44" stroke-width="3"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#4facfe" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="-12" cy="15" r="8" fill="#4facfe"/>
    <text x="0" y="85" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">SHADOW TONES</text>
  </g>
  <g transform="translate(640, 580)">
    <circle cx="0" cy="0" r="65" fill="#0b0f19" stroke="#252f44" stroke-width="3"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#f6d365" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="10" cy="-15" r="8" fill="#f6d365"/>
    <text x="0" y="85" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">MIDTONE BALANCE</text>
  </g>
  <g transform="translate(1100, 580)">
    <circle cx="0" cy="0" r="65" fill="#0b0f19" stroke="#252f44" stroke-width="3"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ff0844" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="18" cy="-10" r="8" fill="#ff0844"/>
    <text x="0" y="85" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">HIGHLIGHT ROLLOFF</text>
  </g>

</svg>