<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1280" height="80" fill="#0f172a"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#1e293b" stroke-width="1"/>
  
  <g transform="translate(32, 22)">
    <rect width="36" height="36" rx="8" fill="url(#darkGrad)"/>
    <text x="18" y="24" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">👁️</text>
    <text x="48" y="24" font-size="20" font-weight="700" fill="#ffffff">Dark Web Monitor™</text>
    <text x="48" y="40" font-size="12" font-weight="500" fill="#f59e0b">24/7 automated dark web database scanning for compromised emails, passwords, &amp; credentials</text>
  </g>

  <!-- Status Shield Card -->
  <g transform="translate(40, 110)">
    <rect width="1200" height="180" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    
    <circle cx="90" cy="90" r="44" fill="#10b981" fill-opacity="0.15"/>
    <path d="M90 60 L110 70 V95 C110 110 90 120 90 120 C90 120 70 110 70 95 V70 Z" fill="#10b981"/>
    
    <text x="160" y="70" font-size="22" font-weight="800" fill="#ffffff">NO BREACHES FOUND FOR YOUR PRIMARY EMAIL</text>
    <text x="160" y="98" font-size="14" fill="#cbd5e1">Monitored Email: <tspan font-weight="700" fill="#ffffff">alex.turner@techreview.com</tspan></text>
    <text x="160" y="122" font-size="13" fill="#10b981">✓ NordVPN scanned 14.8 billion leaked credentials in dark web marketplaces. Zero matches detected.</text>
    
    <rect x="980" y="65" width="180" height="46" rx="10" fill="#10b981"/>
    <text x="1070" y="93" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Scan Now</text>
  </g>

  <!-- Monitored Accounts & Protection Advice -->
  <g transform="translate(40, 310)">
    <!-- Left: Monitored Email Addresses -->
    <rect width="680" height="370" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="32" y="40" font-size="18" font-weight="700" fill="#ffffff">Monitored Identities &amp; Passwords</text>

    <!-- Email item 1 -->
    <g transform="translate(32, 64)">
      <rect width="616" height="72" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <circle cx="36" cy="36" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="36" y="41" font-size="14" text-anchor="middle">✉️</text>
      <text x="64" y="32" font-size="15" font-weight="700" fill="#ffffff">alex.turner@techreview.com</text>
      <text x="64" y="52" font-size="12" fill="#10b981">● Clean • Last checked 12 mins ago</text>
      <text x="540" y="42" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="end">Primary</text>
    </g>

    <!-- Email item 2 -->
    <g transform="translate(32, 152)">
      <rect width="616" height="72" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <circle cx="36" cy="36" r="14" fill="#10b981" fill-opacity="0.2"/>
      <text x="36" y="41" font-size="14" text-anchor="middle">✉️</text>
      <text x="64" y="32" font-size="15" font-weight="700" fill="#ffffff">alex.personal@gmail.com</text>
      <text x="64" y="52" font-size="12" fill="#10b981">● Clean • Last checked 1 hour ago</text>
      <text x="540" y="42" font-size="12" font-weight="600" fill="#3b82f6" text-anchor="end">Linked</text>
    </g>

    <!-- Email item 3 -->
    <g transform="translate(32, 240)">
      <rect width="616" height="72" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="36" cy="36" r="14" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="36" y="41" font-size="14" text-anchor="middle">⚠️</text>
      <text x="64" y="32" font-size="15" font-weight="700" fill="#ffffff">old.alias.gaming@yahoo.com</text>
      <text x="64" y="52" font-size="12" fill="#f59e0b">▲ 1 Historic Leak (2021 Canva Breach - Password Changed)</text>
      <text x="540" y="42" font-size="12" font-weight="600" fill="#10b981" text-anchor="end">Resolved</text>
    </g>
  </g>

  <!-- Right: Breach Protection Engine -->
  <g transform="translate(740, 310)">
    <rect width="500" height="370" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="32" y="40" font-size="18" font-weight="700" fill="#ffffff">How Dark Web Monitor Works</text>

    <g transform="translate(32, 64)">
      <text x="0" y="20" font-size="14" font-weight="700" fill="#38bdf8">1. Continuous Database Indexing</text>
      <text x="0" y="40" font-size="12" fill="#cbd5e1">Scans underground hacker forums, Pastebin dumps, and encrypted dark web black markets in real time.</text>

      <text x="0" y="90" font-size="14" font-weight="700" fill="#38bdf8">2. Instant Mobile &amp; Desktop Push Alerts</text>
      <text x="0" y="110" font-size="12" fill="#cbd5e1">Alerts you immediately if your password, email, or credit card details appear in any new data leak.</text>

      <text x="0" y="160" font-size="14" font-weight="700" fill="#38bdf8">3. One-Click NordPass Integration</text>
      <text x="0" y="180" font-size="12" fill="#cbd5e1">Automatically generates strong 32-character passwords to update compromised accounts instantly.</text>

      <rect x="0" y="230" width="436" height="50" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="20" y="260" font-size="13" font-weight="600" fill="#60a5fa">🛡️ Included in NordVPN Premium Subscriptions</text>
    </g>
  </g>
</svg>
