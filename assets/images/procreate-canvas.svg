<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0c10;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="proBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="artGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00dfd8"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#proBg)"/>
  
  <!-- Canvas Area -->
  <g transform="translate(140, 40)">
    <rect width="1000" height="640" rx="16" fill="#181d28" stroke="#252d3d" stroke-width="2"/>
    <!-- Artwork Preview -->
    <path d="M 150 450 C 300 150, 450 550, 600 200 C 750 100, 850 400, 950 250" fill="none" stroke="url(#artGrad)" stroke-width="28" stroke-linecap="round"/>
    <path d="M 200 500 C 350 200, 500 600, 650 250" fill="none" stroke="#ff007f" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
    <path d="M 250 250 Q 400 100 550 350 T 850 450" fill="none" stroke="#00dfd8" stroke-width="18" stroke-linecap="round" opacity="0.8"/>
    <circle cx="600" cy="200" r="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="450" cy="550" r="22" fill="#7928ca" opacity="0.6"/>

    <!-- QuickMenu Radial Wheel -->
    <g transform="translate(500, 320)">
      <circle cx="0" cy="0" r="75" fill="#121620" opacity="0.9" stroke="#ff007f" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#ff007f"/>
      <text x="0" y="4" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">QuickMenu</text>
      <!-- Radial buttons -->
      <circle cx="0" cy="-52" r="16" fill="#222a3a" stroke="#334155"/>
      <text x="0" y="-48" fill="#e2e8f0" font-size="9" text-anchor="middle">Flip H</text>
      <circle cx="52" cy="0" r="16" fill="#222a3a" stroke="#334155"/>
      <text x="52" y="4" fill="#e2e8f0" font-size="9" text-anchor="middle">Copy</text>
      <circle cx="0" cy="52" r="16" fill="#222a3a" stroke="#334155"/>
      <text x="0" y="56" fill="#e2e8f0" font-size="9" text-anchor="middle">Clear</text>
      <circle cx="-52" cy="0" r="16" fill="#222a3a" stroke="#334155"/>
      <text x="-52" y="4" fill="#e2e8f0" font-size="9" text-anchor="middle">Fill</text>
    </g>

    <!-- Top Toolbar -->
    <rect x="0" y="0" width="1000" height="56" fill="#0f131a" opacity="0.95" rx="16"/>
    <text x="24" y="34" fill="#ffffff" font-size="16" font-weight="700">Procreate Pocket Canvas</text>
    <text x="210" y="34" fill="#64748b" font-size="13">4096 x 4096 px • RGB</text>

    <!-- Tool Icons Right -->
    <g transform="translate(740, 14)">
      <!-- Modify -->
      <rect x="0" y="0" width="32" height="28" rx="6" fill="#1e293b"/>
      <text x="16" y="19" fill="#94a3b8" font-size="11" text-anchor="middle">FX</text>
      <!-- Brush -->
      <rect x="44" y="0" width="32" height="28" rx="6" fill="#ff007f"/>
      <text x="60" y="19" fill="#ffffff" font-size="11" text-anchor="middle">🖌️</text>
      <!-- Smudge -->
      <rect x="88" y="0" width="32" height="28" rx="6" fill="#1e293b"/>
      <text x="104" y="19" fill="#94a3b8" font-size="11" text-anchor="middle">☝️</text>
      <!-- Erase -->
      <rect x="132" y="0" width="32" height="28" rx="6" fill="#1e293b"/>
      <text x="148" y="19" fill="#94a3b8" font-size="11" text-anchor="middle">🧹</text>
      <!-- Layers -->
      <rect x="176" y="0" width="32" height="28" rx="6" fill="#1e293b"/>
      <text x="192" y="19" fill="#94a3b8" font-size="11" text-anchor="middle">🥞</text>
      <!-- Color Swatch -->
      <circle cx="232" cy="14" r="12" fill="#00dfd8" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- Left Sidebar Sliders (Size & Opacity) -->
  <g transform="translate(60, 180)">
    <rect x="0" y="0" width="48" height="360" rx="24" fill="#111622" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Size Slider -->
    <rect x="21" y="40" width="6" height="120" rx="3" fill="#334155"/>
    <circle cx="24" cy="80" r="12" fill="#ff007f" stroke="#ffffff" stroke-width="2"/>
    <text x="24" y="25" fill="#94a3b8" font-size="10" text-anchor="middle">SIZE</text>
    <!-- Opacity Slider -->
    <rect x="21" y="220" width="6" height="120" rx="3" fill="#334155"/>
    <circle cx="24" cy="270" r="12" fill="#00dfd8" stroke="#ffffff" stroke-width="2"/>
    <text x="24" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">OPAC</text>
  </g>
</svg>