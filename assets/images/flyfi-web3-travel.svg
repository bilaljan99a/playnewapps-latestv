  <text x="630" y="110" font-family="sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" text-anchor="middle">SCAN AT CHECK-IN</text>
  <rect x="565" y="130" width="130" height="130" fill="#FFFFFF" rx="6"/>
  <rect x="575" y="140" width="40" height="40" fill="#0F172A"/>
  <rect x="645" y="140" width="40" height="40" fill="#0F172A"/>
  <rect x="575" y="210" width="40" height="40" fill="#0F172A"/>
  <rect x="625" y="190" width="30" height="30" fill="#2563EB"/>

  <text x="630" y="290" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Voucher #FLY-98421</text>
  <text x="630" y="315" font-family="sans-serif" font-weight="700" font-size="12" fill="#A855F7" text-anchor="middle">Guaranteed Booking</text>
