<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="speedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Header -->
  <rect x="0" y="0" width="1280" height="80" fill="#0f172a"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#1e293b" stroke-width="1"/>
  
  <g transform="translate(32, 22)">
    <rect width="36" height="36" rx="8" fill="#1161ee"/>
    <path d="M18 8 L29 26 H25 L18 15 L11 26 H7 Z" fill="#ffffff"/>
    <text x="48" y="24" font-size="20" font-weight="700" fill="#ffffff">NordLynx Next-Gen Speed Test</text>
    <text x="48" y="40" font-size="12" font-weight="500" fill="#94a3b8">Ultra-fast WireGuard protocol benchmark comparison</text>
  </g>

  <!-- Speed Dial / Gauge Container -->
  <g transform="translate(40, 110)">
    <rect width="580" height="570" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    
    <text x="32" y="44" font-size="18" font-weight="700" fill="#ffffff">Real-time Connection Speed</text>
    <text x="32" y="66" font-size="13" fill="#64748b">Tested on 1Gbps Fiber Line • Server: US East #8412</text>

    <!-- Circular Speed Gauge Graphic -->
    <g transform="translate(290, 260)">
      <!-- Outer Track -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="#1e293b" stroke-width="24" stroke-dasharray="660" stroke-dashoffset="160"/>
      <!-- Active Speed Arc -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="url(#speedGrad)" stroke-width="24" stroke-dasharray="660" stroke-dashoffset="240" stroke-linecap="round"/>
      
      <!-- Needle / Center text -->
      <text x="0" y="-10" font-size="48" font-weight="800" fill="#ffffff" text-anchor="middle">948.4</text>
      <text x="0" y="24" font-size="16" font-weight="700" fill="#10b981" text-anchor="middle">MBPS DOWNLOAD</text>
      <text x="0" y="50" font-size="12" fill="#64748b" text-anchor="middle">Latency: 11ms • Jitter: 0.4ms</text>
    </g>

    <!-- Metrics Breakdown Grid -->
    <g transform="translate(32, 450)">
      <rect x="0" y="0" width="248" height="84" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" font-size="12" font-weight="600" fill="#94a3b8">UPLOAD SPEED</text>
      <text x="20" y="60" font-size="22" font-weight="700" fill="#38bdf8">884.2 Mbps</text>

      <rect x="268" y="0" width="248" height="84" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="288" y="32" font-size="12" font-weight="600" fill="#94a3b8">PACKET LOSS</text>
      <text x="288" y="60" font-size="22" font-weight="700" fill="#10b981">0.00 %</text>
    </g>
  </g>

  <!-- Comparison Charts Container -->
  <g transform="translate(650, 110)">
    <rect width="590" height="570" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    
    <text x="32" y="44" font-size="18" font-weight="700" fill="#ffffff">Protocol Speed Comparison (Mbps)</text>
    <text x="32" y="66" font-size="13" fill="#64748b">Benchmarked across 50 global server locations</text>

    <!-- Bar 1: NordLynx -->
    <g transform="translate(32, 110)">
      <text x="0" y="20" font-size="14" font-weight="700" fill="#ffffff">NordLynx (WireGuard + Double NAT)</text>
      <text x="520" y="20" font-size="14" font-weight="700" fill="#10b981" text-anchor="end">948 Mbps</text>
      <rect x="0" y="30" width="520" height="28" rx="6" fill="#1e293b"/>
      <rect x="0" y="30" width="492" height="28" rx="6" fill="url(#speedGrad)"/>
    </g>

    <!-- Bar 2: OpenVPN UDP -->
    <g transform="translate(32, 190)">
      <text x="0" y="20" font-size="14" font-weight="600" fill="#cbd5e1">OpenVPN (UDP)</text>
      <text x="520" y="20" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="end">410 Mbps</text>
      <rect x="0" y="30" width="520" height="28" rx="6" fill="#1e293b"/>
      <rect x="0" y="30" width="212" height="28" rx="6" fill="#3b82f6" fill-opacity="0.6"/>
    </g>

    <!-- Bar 3: IKEv2 / IPsec -->
    <g transform="translate(32, 270)">
      <text x="0" y="20" font-size="14" font-weight="600" fill="#cbd5e1">IKEv2 / IPsec</text>
      <text x="520" y="20" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="end">385 Mbps</text>
      <rect x="0" y="30" width="520" height="28" rx="6" fill="#1e293b"/>
      <rect x="0" y="30" width="200" height="28" rx="6" fill="#64748b" fill-opacity="0.5"/>
    </g>

    <!-- Feature Highlights Box -->
    <rect x="32" y="370" width="526" height="160" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="56" y="402" font-size="15" font-weight="700" fill="#38bdf8">Why NordLynx is Faster &amp; Safer:</text>
    
    <text x="56" y="432" font-size="13" fill="#cbd5e1">✓ <tspan font-weight="600" fill="#ffffff">Double NAT System:</tspan> Ensures zero identifiable logs touch the server.</text>
    <text x="56" y="460" font-size="13" fill="#cbd5e1">✓ <tspan font-weight="600" fill="#ffffff">Lean Codebase:</tspan> 4,000 lines of code vs 400,000+ in OpenVPN.</text>
    <text x="56" y="488" font-size="13" fill="#cbd5e1">✓ <tspan font-weight="600" fill="#ffffff">4K/8K Streaming:</tspan> Zero buffering on Netflix 4K UHD, Twitch, &amp; YouTube.</text>
  </g>
</svg>
