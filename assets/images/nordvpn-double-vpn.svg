<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="doubleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1280" height="80" fill="#0f172a"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#1e293b" stroke-width="1"/>
  
  <g transform="translate(32, 22)">
    <rect width="36" height="36" rx="8" fill="url(#doubleGrad)"/>
    <text x="18" y="24" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">2x</text>
    <text x="48" y="24" font-size="20" font-weight="700" fill="#ffffff">Double VPN Multi-Hop Architecture</text>
    <text x="48" y="40" font-size="12" font-weight="500" fill="#a78bfa">Encrypts traffic through 2 distinct servers across different jurisdictions</text>
  </g>

  <!-- Main Diagram Stage -->
  <g transform="translate(40, 110)">
    <rect width="1200" height="340" rx="16" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="32" y="40" font-size="18" font-weight="700" fill="#ffffff">Multi-Hop Routing Diagram</text>

    <!-- Node 1: User PC -->
    <g transform="translate(60, 100)">
      <rect width="200" height="180" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="100" cy="50" r="28" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="100" y="56" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">💻</text>
      <text x="100" y="110" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Your Device</text>
      <text x="100" y="130" font-size="12" fill="#94a3b8" text-anchor="middle">True IP: 72.229.28.14</text>
      <text x="100" y="150" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">1st AES-256 Layer</text>
    </g>

    <!-- Connection Line 1 -->
    <path d="M260 190 H350" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 6"/>
    <polygon points="350,185 362,190 350,195" fill="#3b82f6"/>
    <text x="310" y="175" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">Encrypted Tunnel #1</text>

    <!-- Node 2: First VPN Server -->
    <g transform="translate(360, 100)">
      <rect width="220" height="180" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="110" cy="50" r="28" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="110" y="56" font-size="20" font-weight="700" fill="#a78bfa" text-anchor="middle">🛡️</text>
      <text x="110" y="110" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Server 1: Canada</text>
      <text x="110" y="130" font-size="12" fill="#94a3b8" text-anchor="middle">Re-encrypts payload</text>
      <text x="110" y="150" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">2nd AES-256 Layer</text>
    </g>

    <!-- Connection Line 2 -->
    <path d="M580 190 H670" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="8 6"/>
    <polygon points="670,185 682,190 670,195" fill="#8b5cf6"/>
    <text x="630" y="175" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Encrypted Tunnel #2</text>

    <!-- Node 3: Second VPN Server (Exit) -->
    <g transform="translate(680, 100)">
      <rect width="220" height="180" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <circle cx="110" cy="50" r="28" fill="#10b981" fill-opacity="0.2"/>
      <text x="110" y="56" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle">🔒</text>
      <text x="110" y="110" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Server 2: Switzerland</text>
      <text x="110" y="130" font-size="12" fill="#94a3b8" text-anchor="middle">Exit Node (Zero Logs)</text>
      <text x="110" y="150" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Visible IP: 185.220.101.5</text>
    </g>

    <!-- Connection Line 3 -->
    <path d="M900 190 H980" stroke="#10b981" stroke-width="3"/>
    <polygon points="980,185 992,190 980,195" fill="#10b981"/>

    <!-- Node 4: Web Target -->
    <g transform="translate(990, 100)">
      <rect width="160" height="180" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="80" cy="50" r="28" fill="#1e293b"/>
      <text x="80" y="56" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">🌐</text>
      <text x="80" y="110" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Target Website</text>
      <text x="80" y="130" font-size="11" fill="#64748b" text-anchor="middle">Sees only Server 2</text>
      <text x="80" y="150" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">100% Anonymous</text>
    </g>
  </g>

  <!-- Lower Specialty Servers List -->
  <g transform="translate(40, 470)">
    <rect width="1200" height="210" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="32" y="36" font-size="16" font-weight="700" fill="#ffffff">Available Double VPN &amp; Specialty Pairs</text>

    <g transform="translate(32, 56)">
      <!-- Pair 1 -->
      <rect width="270" height="120" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="20" y="32" font-size="14" font-weight="700" fill="#ffffff">US ➔ Canada</text>
      <text x="20" y="54" font-size="12" fill="#94a3b8">Entry: New York #802</text>
      <text x="20" y="72" font-size="12" fill="#94a3b8">Exit: Toronto #410</text>
      <text x="20" y="98" font-size="11" font-weight="600" fill="#10b981">Ping: 24ms • Load: 18%</text>

      <!-- Pair 2 -->
      <g transform="translate(290, 0)">
        <rect width="270" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="20" y="32" font-size="14" font-weight="700" fill="#ffffff">UK ➔ Netherlands</text>
        <text x="20" y="54" font-size="12" fill="#94a3b8">Entry: London #1204</text>
        <text x="20" y="72" font-size="12" fill="#94a3b8">Exit: Amsterdam #901</text>
        <text x="20" y="98" font-size="11" font-weight="600" fill="#10b981">Ping: 19ms • Load: 22%</text>
      </g>

      <!-- Pair 3 -->
      <g transform="translate(580, 0)">
        <rect width="270" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="20" y="32" font-size="14" font-weight="700" fill="#ffffff">Taiwan ➔ Hong Kong</text>
        <text x="20" y="54" font-size="12" fill="#94a3b8">Entry: Taipei #104</text>
        <text x="20" y="72" font-size="12" fill="#94a3b8">Exit: Hong Kong #302</text>
        <text x="20" y="98" font-size="11" font-weight="600" fill="#10b981">Ping: 32ms • Load: 15%</text>
      </g>

      <!-- Pair 4 -->
      <g transform="translate(870, 0)">
        <rect width="266" height="120" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="20" y="32" font-size="14" font-weight="700" fill="#ffffff">Sweden ➔ Switzerland</text>
        <text x="20" y="54" font-size="12" fill="#94a3b8">Entry: Stockholm #502</text>
        <text x="20" y="72" font-size="12" fill="#94a3b8">Exit: Zurich #112</text>
        <text x="20" y="98" font-size="11" font-weight="600" fill="#10b981">Ping: 28ms • Load: 19%</text>
      </g>
    </g>
  </g>
</svg>
