<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="flyfiGradPay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="35%" stop-color="#6B21A8"/>
      <stop offset="70%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="#0F172A"/>

  <!-- Header Branding -->
  <g id="header-logo-group" transform="translate(50, 30)">
    <circle cx="20" cy="20" r="18" fill="url(#flyfiGradPay)"/>
    <path d="M 8 16 C 9 14, 27 7, 35 7 C 37 7, 37 9, 33 11 C 27 14, 13 20, 10 20 Z" fill="#FFFFFF"/>
    <path d="M 10 22 C 11 19, 28 13, 34 13 C 36 13, 36 15, 32 16 C 26 20, 14 24, 11 24 Z" fill="#FFFFFF"/>
    <path d="M 13 27 C 14 26, 27 20, 32 20 C 33 20, 33 22, 30 23 C 25 26, 16 29, 14 29 Z" fill="#FFFFFF"/>
    <text x="48" y="27" font-family="sans-serif" font-weight="900" font-size="22" fill="#A855F7">flyfi <tspan font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">Crypto Payment Gateway</tspan></text>
  </g>
  <text x="50" y="85" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Pay for 300,000+ hotels with 30+ Cryptocurrencies — No KYC &amp; Zero Account Required</text>

  <!-- Left: Crypto Tokens selector -->
  <rect x="50" y="110" width="340" height="300" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="75" y="145" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#38BDF8">Select Crypto Currency</text>

  <!-- Token 1: Bitcoin -->
  <rect x="75" y="165" width="290" height="48" rx="8" fill="#334155" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="100" cy="189" r="14" fill="#F7931A"/>
  <text x="96" y="194" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">₿</text>
  <text x="125" y="186" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Bitcoin (BTC)</text>
  <text x="125" y="202" font-family="sans-serif" font-size="11" fill="#94A3B8">Instant Layer 1 Transfer</text>

  <!-- Token 2: Ethereum -->
  <rect x="75" y="223" width="290" height="48" rx="8" fill="#0F172A" stroke="#334155"/>
  <circle cx="100" cy="247" r="14" fill="#627EEA"/>
  <text x="97" y="252" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">Ξ</text>
  <text x="125" y="244" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Ethereum (ETH)</text>
  <text x="125" y="260" font-family="sans-serif" font-size="11" fill="#94A3B8">ERC-20 &amp; Arbitrum / Optimism</text>

  <!-- Token 3: USDT / USDC -->
  <rect x="75" y="281" width="290" height="48" rx="8" fill="#0F172A" stroke="#334155"/>
  <circle cx="100" cy="305" r="14" fill="#26A17B"/>
  <text x="95" y="310" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">₮</text>
  <text x="125" y="302" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Tether (USDT) / USDC</text>
  <text x="125" y="318" font-family="sans-serif" font-size="11" fill="#94A3B8">Stablecoin Booking Guarantee</text>

  <!-- Token 4: Solana & Others -->
  <rect x="75" y="339" width="290" height="48" rx="8" fill="#0F172A" stroke="#334155"/>
  <circle cx="100" cy="363" r="14" fill="#14F195"/>
  <text x="96" y="368" font-family="sans-serif" font-weight="900" font-size="12" fill="#0F172A">S</text>
  <text x="125" y="360" font-family="sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Solana (SOL) &amp; 30+ Tokens</text>
  <text x="125" y="376" font-family="sans-serif" font-size="11" fill="#94A3B8">Sub-second Confirmation</text>

  <!-- Right: Payment QR & Wallet Panel -->
  <rect x="410" y="110" width="340" height="300" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="435" y="145" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Pay via Web3 Wallet or QR</text>

  <!-- QR Code Mock -->
  <rect x="520" y="165" width="120" height="120" rx="8" fill="#FFFFFF"/>
  <rect x="532" y="177" width="36" height="36" fill="#0F172A"/>
  <rect x="592" y="177" width="36" height="36" fill="#0F172A"/>
  <rect x="532" y="237" width="36" height="36" fill="#0F172A"/>
  <rect x="578" y="222" width="24" height="24" fill="#2563EB"/>

  <text x="580" y="312" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">Scan QR with Web3 Wallet App</text>
  <rect x="435" y="335" width="290" height="44" rx="8" fill="#2563EB"/>
  <text x="580" y="362" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Connect Wallet (MetaMask / Phantom)</text>
</svg>
