  <path d="M 0 320 L 80 260 L 140 300 L 220 220 L 300 350 L 380 180 L 460 300 L 540 240 L 640 280 L 720 200 L 800 320 L 800 450 L 0 450 Z" fill="#1E293B" opacity="0.8"/>
