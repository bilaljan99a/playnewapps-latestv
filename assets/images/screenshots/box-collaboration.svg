          <circle cx="30" cy="30" r="14" fill="#059669" opacity="0.2"/>
          <text x="30" y="34" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">01</text>
          <text x="60" y="26" font-size="14" font-weight="700" fill="#F8FAFC">Box Notes Co-Authoring Studio</text>
          <text x="60" y="44" font-size="12" fill="#94A3B8">Collaborative doc creation with live cursor tracking and inline comments.</text>
          <rect x="580" y="18" width="80" height="24" rx="12" fill="#059669" opacity="0.15"/>
          <text x="620" y="34" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Live Sync</text>
        </g>
      
        <g transform="translate(0, 72)">
          <rect width="680" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="14" fill="#059669" opacity="0.2"/>
          <text x="30" y="34" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">02</text>
          <text x="60" y="26" font-size="14" font-weight="700" fill="#F8FAFC">Box Relay Workflow Automation</text>
          <text x="60" y="44" font-size="12" fill="#94A3B8">Automate contract approvals, document routing, and review triggers.</text>
          <rect x="580" y="18" width="80" height="24" rx="12" fill="#059669" opacity="0.15"/>
          <text x="620" y="34" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Automated</text>
        </g>
      
        <g transform="translate(0, 144)">
          <rect width="680" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="14" fill="#059669" opacity="0.2"/>
          <text x="30" y="34" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">03</text>
          <text x="60" y="26" font-size="14" font-weight="700" fill="#F8FAFC">Box Hubs Curated Portals</text>
          <text x="60" y="44" font-size="12" fill="#94A3B8">Build organized content hubs for team knowledge sharing and wikis.</text>
          <rect x="580" y="18" width="80" height="24" rx="12" fill="#059669" opacity="0.15"/>
          <text x="620" y="34" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Knowledge</text>
        </g>
      
        <g transform="translate(0, 216)">
          <rect width="680" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="14" fill="#059669" opacity="0.2"/>
          <text x="30" y="34" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">04</text>
          <text x="60" y="26" font-size="14" font-weight="700" fill="#F8FAFC">1,500+ App Integrations</text>
          <text x="60" y="44" font-size="12" fill="#94A3B8">Seamless integration with Microsoft 365, Google Workspace, Slack & Zoom.</text>
          <rect x="580" y="18" width="80" height="24" rx="12" fill="#059669" opacity="0.15"/>
          <text x="620" y="34" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Integrated</text>
        </g>
      
