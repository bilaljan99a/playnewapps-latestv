<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#091E42"/>
  
  <g transform="translate(30, 30)" filter="url(#shadow)">
    <rect width="740" height="440" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    
    <rect width="740" height="42" rx="12" fill="#1E293B"/>
    <rect y="30" width="740" height="12" fill="#1E293B"/>
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="5" fill="#10B981"/>
    
    <text x="370" y="25" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Box Platform — Cloud Collaboration Platform</text>
    
    <g transform="translate(30, 65)">
      <text x="0" y="25" font-size="22" font-weight="800" fill="#FFFFFF">🤝 Cloud Collaboration Platform</text>
      <text x="0" y="48" font-size="13" fill="#94A3B8">Real-time Box Notes co-authoring, Box Relay workflows, and Box Hubs</text>
    </g>
    
    <g transform="translate(30, 135)">
      
        <g transform="translate(0, 0)">
