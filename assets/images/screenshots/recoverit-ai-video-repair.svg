<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <!-- Title Bar -->
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" />
  <circle cx="38" cy="20" r="6" fill="#F59E0B" />
  <circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare Recoverit 13 Pro - AI Enhanced Video Repair Engine</text>

  <!-- Left Side: Unrepaired / Corrupted Video -->
  <g transform="translate(60, 80)">
    <rect width="510" height="420" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
    <text x="255" y="35" fill="#EF4444" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">❌ Corrupted Source File: DJI_Mavic_4K_0821.MP4</text>
    
    <!-- Video Player Simulation with Artifact Glitch Lines -->
    <rect x="25" y="55" width="460" height="260" rx="8" fill="#090D16" />
    <!-- Glitch lines -->
    <rect x="50" y="100" width="410" height="15" fill="#EF4444" opacity="0.6" />
    <rect x="30" y="180" width="450" height="25" fill="#3B82F6" opacity="0.4" />
    <text x="255" y="195" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">⚠️ Header Missing / Cannot Play Frame #240</text>
    <rect x="100" y="220" width="310" height="12" fill="#EF4444" opacity="0.8" />

    <!-- File Meta -->
    <text x="30" y="345" fill="#94A3B8" font-family="sans-serif" font-size="13">Status: Header Corrupted &amp; Audio Track Out of Sync</text>
    <text x="30" y="370" fill="#94A3B8" font-family="sans-serif" font-size="13">Camera Model: DJI Mavic 3 Pro (H.265 / 4K @ 60fps)</text>
    <text x="30" y="395" fill="#94A3B8" font-family="sans-serif" font-size="13">File Size: 4.85 GB • Recovery Quality: Requires AI Sample</text>
  </g>

  <!-- Right Side: AI Repaired Video Preview -->
  <g transform="translate(630, 80)">
    <rect width="510" height="420" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2" />
    <text x="255" y="35" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">✅ AI Advanced Repaired Result (Full 4K Restored)</text>
    
    <!-- Clean Video Frame -->
    <rect x="25" y="55" width="460" height="260" rx="8" fill="#0284C7" />
    <!-- Landscape Artwork simulation -->
    <path d="M25 240 L120 160 L220 220 L360 140 L485 260 Z" fill="#0369A1" />
    <circle cx="380" cy="100" r="30" fill="#FDE047" opacity="0.9" />
    <circle cx="255" cy="185" r="30" fill="#FFFFFF" opacity="0.3" />
    <polygon points="248,170 268,185 248,200" fill="#FFFFFF" />

    <!-- Success Meta -->
    <text x="30" y="345" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="13">✓ AI Sample Alignment Matched (99.8% Fidelity)</text>
    <text x="30" y="370" fill="#CBD5E1" font-family="sans-serif" font-size="13">Restored Streams: Video (3840x2160 HEVC) + Audio (AAC Stereo)</text>
    <text x="30" y="395" fill="#CBD5E1" font-family="sans-serif" font-size="13">Frame Rate: Smooth 59.94 fps • Zero Stuttering</text>
  </g>

  <!-- Bottom AI Processing Status & CTA -->
  <g transform="translate(60, 520)">
    <rect width="1080" height="140" rx="12" fill="#1E293B" stroke="#00C8FF" stroke-width="1.5" />
    <text x="30" y="35" fill="#00FFC8" font-family="sans-serif" font-weight="bold" font-size="16">🤖 AI Frame Matching Technology (Patented Algorithm)</text>
    <text x="30" y="60" fill="#94A3B8" font-family="sans-serif" font-size="13">Recoverit uses deep learning algorithms to automatically reconstruct corrupted container headers, repair keyframes, and align audio timestamps using sample video reference files from the exact same camera device.</text>

    <!-- Progress Bar & Action Button -->
    <g transform="translate(30, 85)">
      <rect width="680" height="28" rx="14" fill="#0F172A" stroke="#334155" />
      <rect width="680" height="28" rx="14" fill="linear-gradient(90deg, #10B981, #00C8FF)" />
      <text x="340" y="19" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">AI Video Repair Finished - 100% Repaired &amp; Verified</text>

      <g transform="translate(720, -5)">
        <rect width="300" height="42" rx="8" fill="linear-gradient(90deg, #00C8FF, #0052CC)" />
        <text x="150" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">💾 Export Repaired 4K Video</text>
      </g>
    </g>
  </g>
</svg>
