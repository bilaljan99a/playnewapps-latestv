<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" /><circle cx="38" cy="20" r="6" fill="#F59E0B" /><circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare PDFelement 2026 - High-Speed Batch PDF Processing Studio</text>

  <!-- Main Batch Dialog Window -->
  <rect x="100" y="70" width="1000" height="580" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="100" y="70" width="1000" height="50" rx="12" fill="#0F172A" />
  <text x="130" y="102" fill="#EC4899" font-family="sans-serif" font-weight="bold" font-size="18">⚡ Batch PDF Processing Studio</text>
  <text x="950" y="102" fill="#94A3B8" font-family="sans-serif" font-size="13">Queue: 124 Files Selected</text>

  <!-- Left: Batch Operations Menu -->
  <rect x="120" y="140" width="220" height="490" rx="8" fill="#0F172A" />
  <rect x="130" y="155" width="200" height="38" rx="6" fill="#EC4899" />
  <text x="150" y="179" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">🔄 Batch Convert</text>

  <text x="150" y="225" fill="#94A3B8" font-family="sans-serif" font-size="13">🔍 Batch OCR</text>
  <text x="150" y="265" fill="#94A3B8" font-family="sans-serif" font-size="13">🗜️ Batch Compress</text>
  <text x="150" y="305" fill="#94A3B8" font-family="sans-serif" font-size="13">🏷️ Batch Watermark</text>
  <text x="150" y="345" fill="#94A3B8" font-family="sans-serif" font-size="13">🔒 Batch Encrypt</text>
  <text x="150" y="385" fill="#94A3B8" font-family="sans-serif" font-size="13">📑 Batch Numbering</text>

  <!-- Right: Queue Table & Controls -->
  <rect x="360" y="140" width="720" height="380" rx="8" fill="#0F172A" />
  <!-- Table Header -->
  <rect x="360" y="140" width="720" height="36" rx="8" fill="#1E293B" />
  <text x="380" y="163" fill="#64748B" font-family="sans-serif" font-weight="bold" font-size="12">FILE NAME</text>
  <text x="680" y="163" fill="#64748B" font-family="sans-serif" font-weight="bold" font-size="12">TARGET FORMAT</text>
  <text x="830" y="163" fill="#64748B" font-family="sans-serif" font-weight="bold" font-size="12">PROGRESS</text>
  <text x="970" y="163" fill="#64748B" font-family="sans-serif" font-weight="bold" font-size="12">STATUS</text>

  <!-- Row 1 -->
  <text x="380" y="200" fill="#FFFFFF" font-family="sans-serif" font-size="13">📄 Q1_Invoices_Batch_2026_01.pdf</text>
  <text x="680" y="200" fill="#3B82F6" font-family="sans-serif" font-weight="bold" font-size="12">DOCX (Word)</text>
  <rect x="830" y="190" width="100" height="10" rx="5" fill="#334155" />
  <rect x="830" y="190" width="100" height="10" rx="5" fill="#10B981" />
  <text x="970" y="200" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="12">Completed</text>

  <!-- Row 2 -->
  <text x="380" y="240" fill="#FFFFFF" font-family="sans-serif" font-size="13">📄 Q1_Invoices_Batch_2026_02.pdf</text>
  <text x="680" y="240" fill="#3B82F6" font-family="sans-serif" font-weight="bold" font-size="12">DOCX (Word)</text>
  <rect x="830" y="230" width="100" height="10" rx="5" fill="#334155" />
  <rect x="830" y="230" width="65" height="10" rx="5" fill="#EC4899" />
  <text x="970" y="240" fill="#EC4899" font-family="sans-serif" font-weight="bold" font-size="12">65% Active</text>

  <!-- Row 3 -->
  <text x="380" y="280" fill="#FFFFFF" font-family="sans-serif" font-size="13">📄 Q1_Invoices_Batch_2026_03.pdf</text>
  <text x="680" y="280" fill="#3B82F6" font-family="sans-serif" font-weight="bold" font-size="12">DOCX (Word)</text>
  <rect x="830" y="270" width="100" height="10" rx="5" fill="#334155" />
  <text x="970" y="280" fill="#64748B" font-family="sans-serif" font-size="12">Queued</text>

  <!-- Progress Summary Footer -->
  <rect x="360" y="540" width="720" height="90" rx="8" fill="#0F172A" />
  <text x="380" y="570" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">Processing Speed: 18.4 Files / Second (GPU Accelerated)</text>
  <rect x="380" y="585" width="500" height="12" rx="6" fill="#334155" />
  <rect x="380" y="585" width="320" height="12" rx="6" fill="linear-gradient(90deg, #EC4899, #10B981)" />
  <text x="900" y="596" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="13">64% Overall Progress</text>

  <rect x="940" y="555" width="120" height="40" rx="8" fill="#EC4899" />
  <text x="1000" y="580" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Start Batch</text>
</svg>
