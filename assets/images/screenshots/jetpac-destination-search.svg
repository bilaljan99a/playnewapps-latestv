    <text x="50" y="200" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#10B981">From $1.00 / 1GB</text>
    <rect x="50" y="215" width="180" height="26" rx="6" fill="#551BF2"/>
    <text x="105" y="232" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">View Plans</text>

    <!-- Destination Card 2: Regional Europe -->
    <rect x="280" y="115" width="220" height="140" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="300" y="145" font-size="28">🇪🇺</text>
    <text x="340" y="145" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Europe 40 Regional</text>
    <text x="300" y="175" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Vodafone, Orange, O2</text>
    <text x="300" y="200" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#10B981">From $4.00 / 3GB</text>
    <rect x="300" y="215" width="180" height="26" rx="6" fill="#551BF2"/>
    <text x="355" y="232" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">View Plans</text>

    <!-- Destination Card 3: USA &amp; Canada -->
    <rect x="530" y="115" width="220" height="140" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="550" y="145" font-size="28">🇺🇸</text>
    <text x="590" y="145" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">USA 5G Ultra</text>
    <text x="550" y="175" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">T-Mobile &amp; AT&amp;T</text>
    <text x="550" y="200" font-family="system-ui, sans-serif" font-weight="700" font-size="15" fill="#10B981">From $5.00 / 5GB</text>
    <rect x="550" y="215" width="180" height="26" rx="6" fill="#551BF2"/>
    <text x="605" y="232" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">View Plans</text>

    <!-- Global Pack Banner -->
    <rect x="30" y="280" width="720" height="130" rx="12" fill="linear-gradient(90deg, #311B92 0%, #4A148C 100%)" stroke="#7C4DFF"/>
    <text x="60" y="320" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">🌐 Global 100+ Countries Pass</text>
    <text x="60" y="348" font-family="system-ui, sans-serif" font-size="14" fill="#E0E7FF">Single eSIM profile for multi-destination trips. Free SmartDelay Airport Lounge Pass included.</text>
    <rect x="60" y="365" width="200" height="32" rx="6" fill="#00F2FE"/>
    <text x="95" y="386" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#000000">EXPLORE GLOBAL PACKS</text>
