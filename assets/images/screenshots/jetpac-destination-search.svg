    <!-- App Header -->
    <rect x="0" y="0" width="800" height="60" fill="#1E1B4B"/>
    <text x="30" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">JETPAC</text>
