    <text x="150" y="36" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">🔍 Search 200+ destinations (Japan, USA, Europe...)</text>
    
    <!-- Country Grid / Search Results -->
    <text x="30" y="95" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">Popular Travel eSIM Destinations (2026)</text>

    <!-- Destination Card 1: Japan -->
