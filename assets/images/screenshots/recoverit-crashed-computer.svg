<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <!-- Title Bar -->
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" />
  <circle cx="38" cy="20" r="6" fill="#F59E0B" />
  <circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare Recoverit 13 Pro - System Crashed Computer Rescue Studio (WinPE Creator)</text>

  <!-- Left Side: Wizard Steps -->
  <g transform="translate(60, 80)">
    <rect width="360" height="560" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="30" y="40" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="18">💻 Crash Recovery Wizard</text>

    <!-- Steps -->
    <g transform="translate(30, 80)">
      <!-- Step 1 -->
      <circle cx="20" cy="20" r="16" fill="#10B981" />
      <text x="20" y="25" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">✓</text>
      <text x="50" y="18" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Step 1: Select Drive Type</text>
      <text x="50" y="36" fill="#94A3B8" font-family="sans-serif" font-size="12">USB Drive / Bootable CD/DVD</text>

      <line x1="20" y1="40" x2="20" y2="70" stroke="#10B981" stroke-width="2" />

      <!-- Step 2 -->
      <circle cx="20" cy="85" r="16" fill="#00C8FF" />
      <text x="20" y="90" fill="#0F172A" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">2</text>
      <text x="50" y="83" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="14">Step 2: Create Bootable USB</text>
      <text x="50" y="101" fill="#94A3B8" font-family="sans-serif" font-size="12">Formats drive &amp; writes WinPE OS</text>

      <line x1="20" y1="105" x2="20" y2="135" stroke="#334155" stroke-width="2" />

      <!-- Step 3 -->
      <circle cx="20" cy="150" r="16" fill="#334155" />
      <text x="20" y="155" fill="#94A3B8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">3</text>
      <text x="50" y="148" fill="#94A3B8" font-family="sans-serif" font-weight="bold" font-size="14">Step 3: Boot Crashed PC</text>
      <text x="50" y="166" fill="#64748B" font-family="sans-serif" font-size="12">Insert USB &amp; select BIOS boot</text>

      <line x1="20" y1="170" x2="20" y2="200" stroke="#334155" stroke-width="2" />

      <!-- Step 4 -->
      <circle cx="20" cy="215" r="16" fill="#334155" />
      <text x="20" y="220" fill="#94A3B8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">4</text>
      <text x="50" y="213" fill="#94A3B8" font-family="sans-serif" font-weight="bold" font-size="14">Step 4: Recover Data</text>
      <text x="50" y="231" fill="#64748B" font-family="sans-serif" font-size="12">Copy files to external drive</text>
    </g>

    <!-- Support Crash Types -->
    <g transform="translate(30, 360)">
      <text x="0" y="0" fill="#F59E0B" font-family="sans-serif" font-weight="bold" font-size="13">Supports All Hardware Crash Types:</text>
      <text x="0" y="25" fill="#CBD5E1" font-family="sans-serif" font-size="12">• Blue Screen of Death (BSOD - 0x0000007B)</text>
      <text x="0" y="45" fill="#CBD5E1" font-family="sans-serif" font-size="12">• Black Screen / Bootloop / Infinite Loading</text>
      <text x="0" y="65" fill="#CBD5E1" font-family="sans-serif" font-size="12">• Missing Bootloader (NTLDR / Bootmgr error)</text>
      <text x="0" y="85" fill="#CBD5E1" font-family="sans-serif" font-size="12">• Corrupted OS Registry &amp; Malware Attack</text>
    </g>
  </g>

  <!-- Right Side: USB Creation Dashboard -->
  <g transform="translate(450, 80)">
    <rect width="690" height="560" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="40" y="40" fill="#00FFC8" font-family="sans-serif" font-weight="bold" font-size="20">Create Bootable USB Rescue Drive</text>
    <text x="40" y="65" fill="#94A3B8" font-family="sans-serif" font-size="14">Connect a USB drive with at least 8 GB space. All contents on the USB will be formatted.</text>

    <!-- USB Device Selector -->
    <g transform="translate(40, 95)">
      <rect width="610" height="70" rx="10" fill="#0F172A" stroke="#00C8FF" stroke-width="1.5" />
      <text x="20" y="42" fill="#00C8FF" font-family="sans-serif" font-size="26">🔌</text>
      <text x="60" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">Kingston DataTraveler 3.0 (F:) - [16.0 GB Ready]</text>
      <text x="60" y="55" fill="#10B981" font-family="sans-serif" font-size="12">✓ Device Connected &amp; Formatted FAT32 • Write Speed: 140 MB/s</text>
    </g>

    <!-- Creating WinPE Image Animation Visual -->
    <g transform="translate(40, 190)">
      <rect width="610" height="230" rx="12" fill="#090D16" stroke="#334155" />
      <text x="30" y="40" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="16">Writing WinPE Emergency Environment to USB...</text>

      <!-- Progress bar -->
      <rect x="30" y="65" width="550" height="20" rx="10" fill="#1E293B" />
      <rect x="32" y="67" width="410" height="16" rx="8" fill="linear-gradient(90deg, #00C8FF, #00FFC8)" />
      <text x="305" y="81" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">75% Completed (Downloading WinPE Kernel Assets)</text>

      <!-- Logs -->
      <g font-family="monospace" font-size="12" transform="translate(30, 105)">
        <text x="0" y="15" fill="#94A3B8">[1/4] Preparing Win11 PE boot environment... Done</text>
        <text x="0" y="35" fill="#94A3B8">[2/4] Injecting NVMe SSD &amp; RAID Controller Drivers... Done</text>
        <text x="0" y="55" fill="#00FFC8">[3/4] Writing Bootloader (UEFI / Legacy dual mode)... 75%</text>
        <text x="0" y="75" fill="#64748B">[4/4] Verifying USB checksum signature...</text>
      </g>
    </g>

    <!-- Action Button -->
    <g transform="translate(40, 450)">
      <rect width="610" height="60" rx="10" fill="linear-gradient(90deg, #00C8FF, #0052CC)" />
      <text x="305" y="36" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">🚀 Create Bootable Rescue Drive Now</text>
    </g>
  </g>
</svg>
