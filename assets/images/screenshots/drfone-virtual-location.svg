<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect width="1000" height="50" fill="#1e293b" />
  <circle cx="25" cy="25" r="6" fill="#ef4444"/><circle cx="45" cy="25" r="6" fill="#f59e0b"/><circle cx="65" cy="25" r="6" fill="#22c55e"/>
  <text x="500" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Wondershare Dr.Fone - Virtual Location &amp; GPS Joystick Spoofer</text>

  <!-- Map Visual Canvas -->
  <g transform="translate(40, 70)">
    <rect width="920" height="490" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Stylized Map Grid Lines -->
    <path d="M 100 0 L 100 490 M 250 0 L 250 490 M 400 0 L 400 490 M 550 0 L 550 490 M 700 0 L 700 490 M 850 0 L 850 490" stroke="#1e293b" stroke-width="1" />
    <path d="M 0 100 L 920 100 M 0 220 L 920 220 M 0 340 L 920 340 M 0 420 L 920 420" stroke="#1e293b" stroke-width="1" />

    <!-- Simulated Route Line -->
    <path d="M 180 320 Q 350 180 520 260 T 780 180" stroke="#06b6d4" stroke-width="4" stroke-dasharray="8 6" fill="none" />

    <!-- Pin 1: Start -->
    <circle cx="180" cy="320" r="10" fill="#22c55e" />
    <text x="180" y="348" fill="#22c55e" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">Start Point (Tokyo)</text>

    <!-- Pin 2: Current Location Teleport -->
    <circle cx="520" cy="260" r="14" fill="#06b6d4" stroke="#ffffff" stroke-width="3" />
    <text x="520" y="235" fill="#22d3ee" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle">📍 Current Virtual GPS Position</text>

    <!-- Pin 3: End -->
    <circle cx="780" cy="180" r="10" fill="#f59e0b" />
    <text x="780" y="160" fill="#fbbf24" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">Destination (Shinjuku)</text>

    <!-- Floating Controller Panel -->
    <g transform="translate(30, 30)">
      <rect width="280" height="200" rx="12" fill="#1e293b" fill-opacity="0.95" stroke="#06b6d4" stroke-width="1.5" />
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="15">GPS Teleport &amp; Joystick</text>
      
      <text x="20" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">Target Coordinates:</text>
      <text x="20" y="80" fill="#22d3ee" font-family="sans-serif" font-weight="600" font-size="13">35.6895° N, 139.6917° E</text>

      <text x="20" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">Simulated Movement Speed:</text>
      <rect x="20" y="125" width="240" height="8" rx="4" fill="#0f172a" />
      <rect x="20" y="125" width="160" height="8" rx="4" fill="#06b6d4" />
      <text x="20" y="150" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="12">Cycling Speed (18 km/h)</text>

      <rect x="20" y="162" width="115" height="28" rx="6" fill="#06b6d4" />
      <text x="77" y="181" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">Move Here</text>

      <rect x="145" y="162" width="115" height="28" rx="6" fill="#334155" />
      <text x="202" y="181" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">Pause Route</text>
    </g>
  </g>
</svg>
