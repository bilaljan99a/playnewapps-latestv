<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" /><circle cx="38" cy="20" r="6" fill="#F59E0B" /><circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare PDFelement 2026 - WYSIWYG Text &amp; Object Editor</text>
  <rect y="40" width="1200" height="48" fill="#1E293B" stroke-bottom="#334155" />
  <rect x="20" y="48" width="80" height="32" rx="6" fill="#0066FF" />
  <text x="60" y="69" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Edit Text</text>
  <rect x="110" y="48" width="90" height="32" rx="6" fill="#334155" />
  <text x="155" y="69" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">Add Image</text>
  <rect x="210" y="48" width="80" height="32" rx="6" fill="#334155" />
  <text x="250" y="69" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">Add Link</text>
  <text x="350" y="69" fill="#94A3B8" font-family="sans-serif" font-size="12">Font: Montserrat Bold | Size: 24pt | Alignment: Left</text>

  <!-- Document Canvas Center -->
  <rect x="200" y="100" width="800" height="570" rx="4" fill="#FFFFFF" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))" />
  
  <text x="240" y="150" fill="#0F172A" font-family="sans-serif" font-weight="bold" font-size="28">Annual Global Operations Strategy 2026</text>
  
  <!-- Active Editing Bounding Box 1 -->
  <rect x="235" y="180" width="730" height="90" fill="none" stroke="#0066FF" stroke-width="1.5" stroke-dasharray="4,4" />
  <rect x="230" y="175" width="8" height="8" fill="#0066FF" />
  <rect x="965" y="175" width="8" height="8" fill="#0066FF" />
  <rect x="230" y="270" width="8" height="8" fill="#0066FF" />
  <rect x="965" y="270" width="8" height="8" fill="#0066FF" />
  <text x="245" y="205" fill="#1E293B" font-family="sans-serif" font-size="14">1. Executive Overview &amp; Market Dynamics</text>
  <text x="245" y="230" fill="#475569" font-family="sans-serif" font-size="13">Our core objectives for 2026 center around accelerating enterprise digital transformation, streamlining</text>
  <text x="245" y="250" fill="#475569" font-family="sans-serif" font-size="13">cross-border document collaboration, and maintaining rigorous compliance with SOC2 &amp; GDPR standards.</text>
  <!-- Active Cursor -->
  <line x1="885" y1="238" x2="885" y2="253" stroke="#0066FF" stroke-width="2" />

  <!-- Embedded Image Object with Transform Handles -->
  <rect x="240" y="295" width="340" height="200" rx="6" fill="#F1F5F9" stroke="#CBD5E1" />
  <rect x="240" y="295" width="340" height="200" fill="none" stroke="#10B981" stroke-width="2" />
  <text x="410" y="390" fill="#059669" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">📊 High-Res Vector Chart (Resized)</text>
  
  <!-- Editing Text Box 2 -->
  <rect x="600" y="295" width="360" height="200" fill="none" stroke="#CBD5E1" stroke-dasharray="2,2" />
  <text x="615" y="325" fill="#0F172A" font-family="sans-serif" font-weight="bold" font-size="16">Key Performance Metrics</text>
  <text x="615" y="355" fill="#475569" font-family="sans-serif" font-size="13">• Revenue Growth: +28.4% YoY</text>
  <text x="615" y="380" fill="#475569" font-family="sans-serif" font-size="13">• Operational Savings: $1.4M</text>
  <text x="615" y="405" fill="#475569" font-family="sans-serif" font-size="13">• Document Retention: 99.99%</text>

  <!-- Status Bar Footer -->
  <rect y="670" width="1200" height="30" fill="#1E293B" />
  <text x="20" y="690" fill="#94A3B8" font-family="sans-serif" font-size="12">Page 1 of 12 | Zoom: 125% | Mode: Inline Text &amp; Image Editor</text>
</svg>
