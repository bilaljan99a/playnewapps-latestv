<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <rect width="900" height="450" rx="16" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <rect width="900" height="40" rx="16" fill="#1E293B"/>
  <text x="450" y="25" font-family="sans-serif" font-weight="700" font-size="14" fill="#38BDF8" text-anchor="middle">
    Retouch4me Dodge &amp; Burn AI Plugin — Soft Portrait Sculpting &amp; Highlight Control
  </text>

  <g transform="translate(30, 60)">
    <!-- Split Screen Comparison Wireframe -->
    <rect width="400" height="340" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <text x="20" y="30" font-family="sans-serif" font-weight="800" font-size="13" fill="#EF4444">WITHOUT DODGE &amp; BURN</text>
    <circle cx="200" cy="180" r="75" fill="#FCA5A5"/>
    <text x="200" y="310" font-family="sans-serif" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">Flat lighting with minor skin shadow irregularities</text>

    <rect x="440" y="0" width="400" height="340" rx="12" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
    <text x="460" y="30" font-family="sans-serif" font-weight="800" font-size="13" fill="#10B981">WITH RETOUCH4ME DODGE &amp; BURN AI</text>
    <circle cx="640" cy="180" r="75" fill="#FCA5A5"/>
    <!-- Highlight &amp; Contour overlays -->
    <ellipse cx="640" cy="145" rx="30" ry="12" fill="#FFFFFF" opacity="0.4"/>
    <ellipse cx="640" cy="205" rx="25" ry="10" fill="#78350F" opacity="0.2"/>
    <text x="640" y="310" font-family="sans-serif" font-weight="600" font-size="12" fill="#38BDF8" text-anchor="middle">3D dimensional cheek &amp; nose contouring, smooth skin transition</text>
  </g>
</svg>
