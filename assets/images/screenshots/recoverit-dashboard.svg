<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <!-- Window Header -->
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" />
  <circle cx="38" cy="20" r="6" fill="#F59E0B" />
  <circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Wondershare Recoverit 13 Pro - Primary Recovery Hub</text>

  <!-- Sidebar -->
  <rect y="40" width="240" height="660" fill="#1E293B" />
  
  <g transform="translate(20, 60)">
    <!-- Logo -->
    <rect width="36" height="36" rx="8" fill="#00C8FF" />
    <text x="18" y="24" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">R</text>
    <text x="48" y="24" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16">Recoverit 13</text>
  </g>

  <!-- Navigation items -->
  <g transform="translate(15, 120)">
    <rect width="210" height="40" rx="8" fill="#00C8FF" opacity="0.2" stroke="#00C8FF" />
    <text x="35" y="25" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="13">💾 Hard Drives &amp; Locations</text>

    <text x="35" y="70" fill="#94A3B8" font-family="sans-serif" font-size="13">💻 System Crashed Computer</text>
    <text x="35" y="110" fill="#94A3B8" font-family="sans-serif" font-size="13">🎬 Enhanced Video Recovery</text>
    <text x="35" y="150" fill="#94A3B8" font-family="sans-serif" font-size="13">🛠️ Corrupted Video Repair</text>
    <text x="35" y="190" fill="#94A3B8" font-family="sans-serif" font-size="13">🌐 NAS &amp; Linux Recovery</text>
    <text x="35" y="230" fill="#94A3B8" font-family="sans-serif" font-size="13">☁️ Cloud Drive Recovery</text>
  </g>

  <!-- Main Content Dashboard -->
  <g transform="translate(270, 60)">
    <text x="0" y="25" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="22">Select a Location to Start Recovery</text>
    <text x="0" y="50" fill="#94A3B8" font-family="sans-serif" font-size="14">Recover lost, formatted, or deleted files from internal/external drives and partitions.</text>

    <!-- Hard Disk Drives Group -->
    <text x="0" y="95" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="15">Hard Disk Drives (3)</text>
    
    <g transform="translate(0, 110)">
      <!-- Drive 1 -->
      <rect width="280" height="110" rx="10" fill="#1E293B" stroke="#334155" />
      <text x="20" y="35" fill="#00FFC8" font-family="sans-serif" font-size="24">💽</text>
      <text x="60" y="30" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Local Disk (C:)</text>
      <text x="60" y="48" fill="#94A3B8" font-family="sans-serif" font-size="12">NVMe SSD • 312 GB / 1 TB Free</text>
      <!-- Usage bar -->
      <rect x="60" y="60" width="200" height="8" rx="4" fill="#334155" />
      <rect x="60" y="60" width="138" height="8" rx="4" fill="#00C8FF" />
      <rect x="20" y="78" width="240" height="24" rx="6" fill="#00C8FF" opacity="0.15" />
      <text x="140" y="94" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Scan Local Disk C:</text>

      <!-- Drive 2 -->
      <g transform="translate(300, 0)">
        <rect width="280" height="110" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="20" y="35" fill="#00C8FF" font-family="sans-serif" font-size="24">💾</text>
        <text x="60" y="30" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Data Volume (D:)</text>
        <text x="60" y="48" fill="#94A3B8" font-family="sans-serif" font-size="12">SATA HDD • 1.2 TB / 2 TB Free</text>
        <rect x="60" y="60" width="200" height="8" rx="4" fill="#334155" />
        <rect x="60" y="60" width="80" height="8" rx="4" fill="#10B981" />
        <rect x="20" y="78" width="240" height="24" rx="6" fill="#00C8FF" opacity="0.15" />
        <text x="140" y="94" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Scan Volume D:</text>
      </g>

      <!-- Drive 3 -->
      <g transform="translate(600, 0)">
        <rect width="280" height="110" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="20" y="35" fill="#F59E0B" font-family="sans-serif" font-size="24">🔌</text>
        <text x="60" y="30" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">External SanDisk Extreme (E:)</text>
        <text x="60" y="48" fill="#94A3B8" font-family="sans-serif" font-size="12">USB 3.2 SSD • 800 GB / 2 TB Free</text>
        <rect x="60" y="60" width="200" height="8" rx="4" fill="#334155" />
        <rect x="60" y="60" width="120" height="8" rx="4" fill="#F59E0B" />
        <rect x="20" y="78" width="240" height="24" rx="6" fill="#00C8FF" opacity="0.15" />
        <text x="140" y="94" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Scan External Drive E:</text>
      </g>
    </g>

    <!-- Quick Access Locations -->
    <text x="0" y="255" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="15">Quick Access Shortcuts</text>
    <g transform="translate(0, 270)">
      <rect width="280" height="75" rx="10" fill="#1E293B" stroke="#334155" />
      <text x="20" y="45" fill="#EF4444" font-family="sans-serif" font-size="22">🗑️</text>
      <text x="60" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Recycle Bin</text>
      <text x="60" y="56" fill="#94A3B8" font-family="sans-serif" font-size="12">Recover permanently emptied files</text>

      <g transform="translate(300, 0)">
        <rect width="280" height="75" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="20" y="45" fill="#F59E0B" font-family="sans-serif" font-size="22">🖥️</text>
        <text x="60" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Desktop Folder</text>
        <text x="60" y="56" fill="#94A3B8" font-family="sans-serif" font-size="12">Target desktop items &amp; shortcuts</text>
      </g>

      <g transform="translate(600, 0)">
        <rect width="280" height="75" rx="10" fill="#1E293B" stroke="#334155" />
        <text x="20" y="45" fill="#10B981" font-family="sans-serif" font-size="22">📁</text>
        <text x="60" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Select Specific Folder</text>
        <text x="60" y="56" fill="#94A3B8" font-family="sans-serif" font-size="12">Browse custom directory path</text>
      </g>
    </g>

    <!-- Advanced Recovery Feature Cards -->
    <text x="0" y="380" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="15">Advanced Specialized Recovery Modes</text>
    <g transform="translate(0, 395)">
      <!-- Card 1 -->
      <rect width="430" height="110" rx="10" fill="linear-gradient(90deg, #1E293B, #0F2847)" stroke="#00C8FF" stroke-width="1" />
      <text x="20" y="40" fill="#00FFC8" font-family="sans-serif" font-size="28">🎬</text>
      <text x="65" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">Enhanced Video Recovery &amp; Stitching</text>
      <text x="65" y="58" fill="#94A3B8" font-family="sans-serif" font-size="12">Recover &amp; merge fragmented 4K/8K camera video clips (GoPro, DJI, Sony, Canon).</text>
      <rect x="65" y="72" width="120" height="24" rx="4" fill="#00C8FF" />
      <text x="125" y="88" fill="#0F172A" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Start Video Scan</text>

      <!-- Card 2 -->
      <g transform="translate(450, 0)">
        <rect width="430" height="110" rx="10" fill="linear-gradient(90deg, #1E293B, #1F1D38)" stroke="#A855F7" stroke-width="1" />
        <text x="20" y="40" fill="#A855F7" font-family="sans-serif" font-size="28">🌐</text>
        <text x="65" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">NAS &amp; Linux Remote Recovery</text>
        <text x="65" y="58" fill="#94A3B8" font-family="sans-serif" font-size="12">Connect via SSH to recover files from BTRFS/EXT4 Synology, QNAP &amp; Linux servers.</text>
        <rect x="65" y="72" width="120" height="24" rx="4" fill="#A855F7" />
        <text x="125" y="88" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Connect NAS Drive</text>
      </g>
    </g>
  </g>
</svg>
