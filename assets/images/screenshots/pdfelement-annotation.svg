<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" /><circle cx="38" cy="20" r="6" fill="#F59E0B" /><circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare PDFelement 2026 - Annotation, Markup &amp; Collaboration Toolbar</text>

  <!-- Toolbar Ribbon -->
  <rect y="40" width="1200" height="50" fill="#1E293B" />
  <rect x="20" y="48" width="100" height="34" rx="6" fill="#F59E0B" />
  <text x="70" y="70" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">✏️ Highlight</text>

  <rect x="130" y="48" width="100" height="34" rx="6" fill="#334155" />
  <text x="180" y="70" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">💬 Sticky Note</text>

  <rect x="240" y="48" width="100" height="34" rx="6" fill="#334155" />
  <text x="290" y="70" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">🔍 Callout Box</text>

  <rect x="350" y="48" width="100" height="34" rx="6" fill="#334155" />
  <text x="400" y="70" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">🖊️ Freehand</text>

  <rect x="460" y="48" width="100" height="34" rx="6" fill="#334155" />
  <text x="510" y="70" fill="#E2E8F0" font-family="sans-serif" font-size="12" text-anchor="middle">🏷️ Stamp</text>

  <!-- Main PDF Page Workspace -->
  <rect x="150" y="110" width="900" height="560" rx="6" fill="#FFFFFF" />
  <text x="190" y="160" fill="#0F172A" font-family="sans-serif" font-weight="bold" font-size="22">Contractual Terms &amp; Conditions Review</text>

  <!-- Highlighted Text 1 (Yellow) -->
  <rect x="190" y="185" width="480" height="22" fill="#FEF08A" opacity="0.8" />
  <text x="195" y="201" fill="#0F172A" font-family="sans-serif" font-size="14">Section 4.2: Payment shall be rendered within 30 business days upon invoice issuance.</text>
  
  <!-- Sticky Note Icon &amp; Popup Callout -->
  <circle cx="690" cy="196" r="12" fill="#F59E0B" />
  <text x="690" y="201" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">💬</text>

  <rect x="715" y="170" width="280" height="90" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
  <text x="730" y="195" fill="#92400E" font-family="sans-serif" font-weight="bold" font-size="12">Legal Reviewer (Sarah Connor):</text>
  <text x="730" y="215" fill="#78350F" font-family="sans-serif" font-size="11">Please update payment term to net-15 for</text>
  <text x="730" y="232" fill="#78350F" font-family="sans-serif" font-size="11">international enterprise accounts.</text>

  <!-- Strike-through Text (Red) -->
  <line x1="190" y1="280" x2="620" y2="280" stroke="#EF4444" stroke-width="2" />
  <text x="195" y="278" fill="#991B1B" font-family="sans-serif" font-size="14">Unilateral termination without cause requires 90 days advance written notice.</text>

  <!-- Underline Text (Blue) -->
  <line x1="190" y1="330" x2="520" y2="330" stroke="#0066FF" stroke-width="2" />
  <text x="195" y="325" fill="#0F172A" font-family="sans-serif" font-size="14">All arbitration proceedings shall take place in Wilmington, Delaware.</text>

  <!-- Custom Approved Stamp -->
  <g transform="translate(680, 360) rotate(-12)">
    <rect width="220" height="70" rx="8" fill="none" stroke="#10B981" stroke-width="4" />
    <text x="110" y="45" fill="#10B981" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="2">APPROVED</text>
  </g>
</svg>
