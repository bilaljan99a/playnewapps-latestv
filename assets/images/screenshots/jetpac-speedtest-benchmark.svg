<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <rect width="800" height="450" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="800" height="55" fill="#1E1B4B"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">⚡ Jetpac 5G Network Performance Benchmark (Ookla Speedtest)</text>

    <!-- Speed Test Display Card -->
    <rect x="50" y="80" width="700" height="330" rx="12" fill="#1E293B" stroke="#334155"/>
    
    <!-- Gauges / Metrics -->
    <!-- Download Speed -->
    <rect x="80" y="110" width="190" height="130" rx="10" fill="#0F172A" stroke="#551BF2"/>
    <text x="175" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">DOWNLOAD SPEED</text>
    <text x="175" y="185" font-family="system-ui, sans-serif" font-weight="900" font-size="38" fill="#00F2FE" text-anchor="middle">284.5</text>
    <text x="175" y="215" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#94A3B8" text-anchor="middle">Mbps 5G</text>

    <!-- Upload Speed -->
    <rect x="305" y="110" width="190" height="130" rx="10" fill="#0F172A" stroke="#551BF2"/>
    <text x="400" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">UPLOAD SPEED</text>
    <text x="400" y="185" font-family="system-ui, sans-serif" font-weight="900" font-size="38" fill="#10B981" text-anchor="middle">48.2</text>
    <text x="400" y="215" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#94A3B8" text-anchor="middle">Mbps 5G</text>

    <!-- Latency / Ping -->
    <rect x="530" y="110" width="190" height="130" rx="10" fill="#0F172A" stroke="#551BF2"/>
    <text x="625" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">PING LATENCY</text>
    <text x="625" y="185" font-family="system-ui, sans-serif" font-weight="900" font-size="38" fill="#FFD700" text-anchor="middle">18</text>
    <text x="625" y="215" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#94A3B8" text-anchor="middle">ms (Ultra Low)</text>

    <!-- Details Breakdown Table -->
    <rect x="80" y="260" width="640" height="120" rx="10" fill="#0F172A"/>
    <text x="100" y="290" font-family="system-ui, sans-serif" font-size="13" fill="#E2E8F0"><tspan font-weight="800">Connected Carrier:</tspan> NTT Docomo 5G (Tokyo Central)</text>
    <text x="100" y="315" font-family="system-ui, sans-serif" font-size="13" fill="#E2E8F0"><tspan font-weight="800">Video Streaming Test:</tspan> 4K Ultra HD Seamless (Zero Buffering)</text>
    <text x="100" y="340" font-family="system-ui, sans-serif" font-size="13" fill="#E2E8F0"><tspan font-weight="800">VoIP &amp; Zoom Call Quality:</tspan> 100% Crisp Audio &amp; HD Video Clarity</text>
    <text x="100" y="365" font-family="system-ui, sans-serif" font-size="13" fill="#10B981"><tspan font-weight="800">Test Result:</tspan> Pass (Top Tier Global eSIM Speed Index)</text>
</svg>
