<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <!-- Top Navigation Bar -->
  <rect width="1000" height="50" fill="#1e293b" />
  <circle cx="25" cy="25" r="6" fill="#ef4444"/>
  <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="6" fill="#22c55e"/>
  <text x="500" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Wondershare Dr.Fone 14 - Primary Workspace Dashboard</text>
  
  <!-- Left Navigation Sidebar -->
  <rect y="50" width="220" height="550" fill="#182238" />
  <g transform="translate(20, 80)" font-family="sans-serif" font-size="14" font-weight="600">
    <rect x="-10" y="-10" width="200" height="38" rx="8" fill="#0284c7" />
    <text x="15" y="15" fill="#ffffff">Home Hub</text>

    <text x="15" y="60" fill="#94a3b8">Data Recovery</text>
    <text x="15" y="100" fill="#94a3b8">WhatsApp Transfer</text>
    <text x="15" y="140" fill="#94a3b8">Phone Transfer</text>
    <text x="15" y="180" fill="#94a3b8">System Repair</text>
    <text x="15" y="220" fill="#94a3b8">Screen Unlock</text>
    <text x="15" y="260" fill="#94a3b8">Virtual Location</text>
    <text x="15" y="300" fill="#94a3b8">Data Eraser</text>
    <text x="15" y="340" fill="#94a3b8">Password Manager</text>
    <text x="15" y="380" fill="#94a3b8">Backup &amp; Restore</text>
  </g>

  <!-- Main Grid Area -->
  <g transform="translate(250, 70)">
    <text x="0" y="25" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22">Welcome to Dr.Fone Toolkit</text>
    <text x="0" y="50" fill="#94a3b8" font-family="sans-serif" font-size="14">Select a module below to start managing or repairing your connected mobile device.</text>

    <!-- Grid Cards -->
    <!-- Card 1 -->
    <rect x="0" y="80" width="230" height="130" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="40" cy="120" r="20" fill="#0284c7" fill-opacity="0.2" />
    <text x="40" y="126" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">🔍</text>
    <text x="75" y="120" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="15">Data Recovery</text>
    <text x="75" y="140" fill="#94a3b8" font-family="sans-serif" font-size="12">Recover photos, SMS, contacts</text>

    <!-- Card 2 -->
    <rect x="250" y="80" width="230" height="130" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="290" cy="120" r="20" fill="#10b981" fill-opacity="0.2" />
    <text x="290" y="126" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">💬</text>
    <text x="325" y="120" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="15">WhatsApp Transfer</text>
    <text x="325" y="140" fill="#94a3b8" font-family="sans-serif" font-size="12">iOS ↔ Android cross copy</text>

    <!-- Card 3 -->
    <rect x="500" y="80" width="230" height="130" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="540" cy="120" r="20" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="540" y="126" fill="#a78bfa" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">🛠️</text>
    <text x="575" y="120" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="15">System Repair</text>
    <text x="575" y="140" fill="#94a3b8" font-family="sans-serif" font-size="12">Fix boot loops &amp; black screen</text>

    <!-- Card 4 -->
    <rect x="0" y="230" width="230" height="130" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="40" cy="270" r="20" fill="#f59e0b" fill-opacity="0.2" />
    <text x="40" y="276" fill="#fbbf24" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">🔓</text>
    <text x="75" y="270" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="15">Screen Unlock</text>
    <text x="75" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">Remove PIN, FaceID, Pattern</text>

    <!-- Card 5 -->
    <rect x="250" y="230" width="230" height="130" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="290" cy="270" r="20" fill="#ec4899" fill-opacity="0.2" />
    <text x="290" y="276" fill="#f472b6" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">📲</text>
    <text x="325" y="270" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="15">Phone Transfer</text>
    <text x="325" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">1-Click device-to-device</text>

    <!-- Card 6 -->
    <rect x="500" y="230" width="230" height="130" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="540" cy="270" r="20" fill="#06b6d4" fill-opacity="0.2" />
    <text x="540" y="276" fill="#22d3ee" font-family="sans-serif" font-weight="900" font-size="18" text-anchor="middle">📍</text>
    <text x="575" y="270" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="15">Virtual Location</text>
    <text x="575" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">GPS spoofing &amp; route simulation</text>

    <!-- Device Connection Status Banner -->
    <rect x="0" y="380" width="730" height="120" rx="12" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1" />
    <text x="20" y="415" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="16">Active Device Connection Status</text>
    <text x="20" y="445" fill="#f8fafc" font-family="sans-serif" font-size="14">📱 Samsung Galaxy S24 Ultra (Android 15) connected via USB 3.2 High-Speed</text>
    <text x="20" y="475" fill="#22c55e" font-family="sans-serif" font-weight="600" font-size="13">✓ USB Debugging Authorized • MTP Protocol Active • Hardware Diagnostics Passed</text>
  </g>
</svg>
