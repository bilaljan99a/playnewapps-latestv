<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <rect width="800" height="450" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Title -->
    <rect x="0" y="0" width="800" height="55" fill="#1E1B4B"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">🔄 Intelligent Multi-Carrier Network Auto-Switching</text>

    <!-- Main Body Container -->
    <g transform="translate(40, 80)">
        <rect x="0" y="0" width="720" height="330" rx="12" fill="#1E293B" stroke="#334155"/>
        
        <text x="30" y="40" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#00F2FE">Jetpac Auto-Selects Strongest Signal Carrier in Real Time</text>
        <text x="30" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Seamless handover between tier-1 local telecommunication partners.</text>

        <!-- Carrier Box 1: SoftBank -->
        <rect x="30" y="90" width="200" height="150" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
        <rect x="30" y="90" width="200" height="35" rx="10" fill="#10B981"/>
        <text x="130" y="113" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#000000" text-anchor="middle">ACTIVE PRIMARY</text>
        <text x="130" y="155" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">SoftBank 5G</text>
        <text x="130" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#10B981" text-anchor="middle">Signal Strength: 100%</text>
        <text x="130" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Band n77 / n78 High Band</text>

        <!-- Switching Arrow -->
        <text x="250" y="170" font-size="28" text-anchor="middle" fill="#551BF2">⇄</text>

        <!-- Carrier Box 2: NTT Docomo -->
        <rect x="270" y="90" width="200" height="150" rx="10" fill="#0F172A" stroke="#334155"/>
        <rect x="270" y="90" width="200" height="35" rx="10" fill="#312E81"/>
        <text x="370" y="113" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">AUTO STANDBY</text>
        <text x="370" y="155" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">NTT Docomo</text>
        <text x="370" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Signal Strength: 92%</text>
        <text x="370" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Sub-6GHz Rural Backup</text>

        <!-- Switching Arrow -->
        <text x="490" y="170" font-size="28" text-anchor="middle" fill="#551BF2">⇄</text>

        <!-- Carrier Box 3: KDDI au -->
        <rect x="510" y="90" width="180" height="150" rx="10" fill="#0F172A" stroke="#334155"/>
        <rect x="510" y="90" width="180" height="35" rx="10" fill="#312E81"/>
        <text x="600" y="113" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">FALLBACK</text>
        <text x="600" y="155" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">KDDI au 5G</text>
        <text x="600" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Signal Strength: 88%</text>
        <text x="600" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Subway &amp; Tunnel Network</text>

        <!-- Feature Banner -->
        <rect x="30" y="260" width="660" height="45" rx="8" fill="#311B92"/>
        <text x="50" y="287" font-family="system-ui, sans-serif" font-size="13" fill="#FFFFFF">✨ Zero manual intervention — Jetpac automatically connects to whichever tower offers peak throughput.</text>
    </g>
</svg>
