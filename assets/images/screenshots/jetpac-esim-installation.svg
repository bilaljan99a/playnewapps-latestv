<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <rect width="800" height="450" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Title -->
    <rect x="0" y="0" width="800" height="55" fill="#1E1B4B"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">📲 Express eSIM Profile Installation (iOS &amp; Android)</text>

    <!-- Column 1: Direct 1-Click Installation -->
    <rect x="40" y="80" width="340" height="330" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="70" y="115" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#00F2FE">⚡ Method 1: In-App Direct Install</text>
    <text x="70" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Automatic 1-click iOS &amp; Android provisioning.</text>
    
    <rect x="70" y="165" width="280" height="150" rx="10" fill="#0F172A" stroke="#551BF2"/>
    <text x="90" y="195" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Jetpac Profile Ready</text>
    <text x="90" y="220" font-family="system-ui, sans-serif" font-size="12" fill="#10B981">✓ Profile ID: JET-839201-JP</text>
    <text x="90" y="240" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">✓ Network: SoftBank / Docomo 5G</text>
    <text x="90" y="260" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">✓ Data Roaming: Ready to toggle</text>

    <rect x="70" y="335" width="280" height="45" rx="8" fill="#551BF2"/>
    <text x="210" y="362" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle">INSTALL ESIM NOW</text>

    <!-- Column 2: QR Code Scan Installation -->
    <rect x="420" y="80" width="340" height="330" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="450" y="115" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#FFD700">📷 Method 2: QR Code Activation</text>
    <text x="450" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Scan with phone camera or email receipt.</text>

    <!-- QR Code graphic -->
    <rect x="520" y="165" width="140" height="140" fill="#FFFFFF" rx="8"/>
    <!-- QR Pixels Simulation -->
    <rect x="530" y="175" width="35" height="35" fill="#000"/>
    <rect x="615" y="175" width="35" height="35" fill="#000"/>
    <rect x="530" y="260" width="35" height="35" fill="#000"/>
    <rect x="575" y="220" width="30" height="30" fill="#551BF2"/>
    <rect x="580" y="180" width="20" height="20" fill="#000"/>
    <rect x="620" y="240" width="25" height="25" fill="#000"/>

    <text x="450" y="345" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">
        <tspan x="590" dy="0">Reusable eSIM profile — Install once,</tspan>
        <tspan x="590" dy="18">top up or change destinations anytime!</tspan>
    </text>
