<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" /><circle cx="38" cy="20" r="6" fill="#F59E0B" /><circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare PDFelement 2026 - Interactive Form Creator &amp; Field Recognition</text>

  <!-- Interactive Form Document Canvas -->
  <rect x="200" y="70" width="800" height="590" rx="6" fill="#FFFFFF" />
  <text x="240" y="120" fill="#0F172A" font-family="sans-serif" font-weight="bold" font-size="22">Interactive Vendor Onboarding Application</text>
  
  <!-- Automatic Form Recognition Banner -->
  <rect x="240" y="135" width="720" height="36" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1" />
  <text x="260" y="158" fill="#1E40AF" font-family="sans-serif" font-weight="bold" font-size="12">⚡ Form Field Recognition Active: 8 Interactive Input Fields Detected Automatically</text>

  <!-- Form Field 1: Text Box -->
  <text x="240" y="200" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13">Legal Company Name *</text>
  <rect x="240" y="210" width="340" height="38" rx="6" fill="#F8FAFC" stroke="#0066FF" stroke-width="1.5" />
  <text x="255" y="234" fill="#0F172A" font-family="sans-serif" font-size="13">Acme Industrial Solutions Inc.</text>

  <!-- Form Field 2: Text Box -->
  <text x="620" y="200" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13">Tax Registration / EIN Number *</text>
  <rect x="620" y="210" width="340" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="635" y="234" fill="#0F172A" font-family="sans-serif" font-size="13">XX-XXX9281</text>

  <!-- Form Field 3: Dropdown Menu -->
  <text x="240" y="280" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13">Business Category (Dropdown) *</text>
  <rect x="240" y="290" width="340" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="255" y="314" fill="#0F172A" font-family="sans-serif" font-size="13">Software &amp; Cloud Infrastructure ▼</text>

  <!-- Form Field 4: Date Picker -->
  <text x="620" y="280" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13">Incorporation Date *</text>
  <rect x="620" y="290" width="340" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="635" y="314" fill="#0F172A" font-family="sans-serif" font-size="13">2018-04-15 📅</text>

  <!-- Checkboxes -->
  <text x="240" y="360" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13">Compliance Certification Checklist</text>
  <rect x="240" y="375" width="20" height="20" rx="4" fill="#0066FF" />
  <text x="245" y="390" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">✓</text>
  <text x="270" y="390" fill="#1E293B" font-family="sans-serif" font-size="13">SOC2 Type II Audit Completed</text>

  <rect x="520" y="375" width="20" height="20" rx="4" fill="#0066FF" />
  <text x="525" y="390" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">✓</text>
  <text x="550" y="390" fill="#1E293B" font-family="sans-serif" font-size="13">GDPR &amp; CCPA Privacy Compliant</text>

  <!-- Digital Signature Field Box -->
  <text x="240" y="440" fill="#334155" font-family="sans-serif" font-weight="bold" font-size="13">Authorized Executive Signature *</text>
  <rect x="240" y="455" width="720" height="90" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Cursive Signature Graphic -->
  <path d="M 270 510 C 310 470, 340 530, 390 480 C 420 520, 460 470, 510 500" stroke="#059669" stroke-width="3" fill="none" />
  <text x="750" y="505" fill="#059669" font-family="sans-serif" font-weight="bold" font-size="12">🔒 Certified Cryptographic e-Sign</text>

  <!-- Submit Action Button -->
  <rect x="500" y="575" width="200" height="42" rx="8" fill="#0066FF" />
  <text x="600" y="601" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Submit Form Data</text>
</svg>
