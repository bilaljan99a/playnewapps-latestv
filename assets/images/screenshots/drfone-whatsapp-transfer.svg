<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect width="1000" height="50" fill="#1e293b" />
  <circle cx="25" cy="25" r="6" fill="#ef4444"/><circle cx="45" cy="25" r="6" fill="#f59e0b"/><circle cx="65" cy="25" r="6" fill="#22c55e"/>
  <text x="500" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Wondershare Dr.Fone - WhatsApp &amp; Business Cross-Platform Transfer</text>

  <!-- Left Source Device Card -->
  <g transform="translate(60, 100)">
    <rect width="360" height="380" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="20" y="20" width="320" height="40" rx="8" fill="#10b981" fill-opacity="0.2" />
    <text x="180" y="45" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">SOURCE DEVICE</text>

    <text x="180" y="110" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22" text-anchor="middle">iPhone 16 Pro</text>
    <text x="180" y="135" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">iOS 18.2 Connected</text>

    <g transform="translate(40, 170)" font-family="sans-serif" font-size="13" fill="#cbd5e1">
      <text x="0" y="0">✓ WhatsApp Messages (14,280)</text>
      <text x="0" y="30">✓ Photos &amp; Videos (3,840)</text>
      <text x="0" y="60">✓ Voice Notes &amp; Audio (920)</text>
      <text x="0" y="90">✓ PDF Attachments &amp; Docs (450)</text>
      <text x="0" y="120">✓ Chat Stickers &amp; Starred (180)</text>
    </g>
  </g>

  <!-- Center Arrow Action -->
  <g transform="translate(460, 240)">
    <circle cx="40" cy="40" r="36" fill="#10b981" />
    <text x="40" y="48" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle">➔</text>
    <text x="40" y="100" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="13" text-anchor="middle">100% Seamless</text>
  </g>

  <!-- Right Target Device Card -->
  <g transform="translate(580, 100)">
    <rect width="360" height="380" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <rect x="20" y="20" width="320" height="40" rx="8" fill="#0284c7" fill-opacity="0.2" />
    <text x="180" y="45" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">DESTINATION DEVICE</text>

    <text x="180" y="110" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22" text-anchor="middle">Samsung S24 Ultra</text>
    <text x="180" y="135" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Android 15 Connected</text>

    <g transform="translate(40, 170)" font-family="sans-serif" font-size="13" fill="#cbd5e1">
      <text x="0" y="0">✓ Destination Drive Verified</text>
      <text x="0" y="30">✓ Encryption Handshake OK</text>
      <text x="0" y="60">✓ Database Mapping Ready</text>
      <text x="0" y="90">✓ Auto-Restore Enabled</text>
      <text x="0" y="120">✓ No Factory Reset Needed</text>
    </g>
  </g>

  <!-- Bottom Transfer Button -->
  <rect x="350" y="510" width="300" height="50" rx="25" fill="#10b981" />
  <text x="500" y="542" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="16" text-anchor="middle">Start WhatsApp Transfer Now</text>
</svg>
