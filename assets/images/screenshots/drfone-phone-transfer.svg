<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect width="1000" height="50" fill="#1e293b" />
  <circle cx="25" cy="25" r="6" fill="#ef4444"/><circle cx="45" cy="25" r="6" fill="#f59e0b"/><circle cx="65" cy="25" r="6" fill="#22c55e"/>
  <text x="500" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Wondershare Dr.Fone - 1-Click Phone-to-Phone Data Transfer</text>

  <g transform="translate(60, 80)">
    <rect width="880" height="480" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="440" y="40" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22" text-anchor="middle">Phone to Phone Switch &amp; Migration Engine</text>

    <!-- Column 1: Source -->
    <rect x="40" y="80" width="220" height="320" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="150" y="115" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">iPhone 15 Pro</text>
    <text x="150" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">(Source - iOS 17.5)</text>
    <line x1="60" y1="150" x2="240" y2="150" stroke="#334155" />

    <!-- Column 2: Data Checklist -->
    <g transform="translate(300, 80)">
      <rect width="280" height="320" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="140" y="30" fill="#f472b6" font-family="sans-serif" font-weight="700" font-size="15" text-anchor="middle">Select Data Types to Copy</text>
      <g transform="translate(30, 60)" font-family="sans-serif" font-size="13" fill="#cbd5e1">
        <text x="0" y="0">☑ Photos (12,450 items)</text>
        <text x="0" y="30">☑ Videos (820 items)</text>
        <text x="0" y="60">☑ Contacts (1,240 cards)</text>
        <text x="0" y="90">☑ Text Messages &amp; iMessage</text>
        <text x="0" y="120">☑ Call Logs &amp; Voicemail</text>
        <text x="0" y="150">☑ Music &amp; Playlists</text>
        <text x="0" y="180">☑ Calendar Events &amp; Reminders</text>
        <text x="0" y="210">☑ App Data &amp; Documents</text>
      </g>
    </g>

    <!-- Column 3: Destination -->
    <rect x="620" y="80" width="220" height="320" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="1" />
    <text x="730" y="115" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Pixel 9 Pro XL</text>
    <text x="730" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">(Target - Android 15)</text>
    <line x1="640" y1="150" x2="820" y2="150" stroke="#334155" />

    <!-- Action Button -->
    <rect x="300" y="420" width="280" height="42" rx="21" fill="#ec4899" />
    <text x="440" y="446" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="15" text-anchor="middle">Start Migration Transfer</text>
  </g>
</svg>
