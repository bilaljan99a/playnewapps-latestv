<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" /><circle cx="38" cy="20" r="6" fill="#F59E0B" /><circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare PDFelement 2026 - Multi-Format Export &amp; Document Conversion Studio</text>

  <!-- Export Modal Box -->
  <rect x="200" y="70" width="800" height="570" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <text x="240" y="115" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="22">📤 Convert &amp; Export PDF</text>
  <text x="240" y="140" fill="#94A3B8" font-family="sans-serif" font-size="14">Choose target output format with full layout, font, and table preservation.</text>

  <!-- Format Selection Grid -->
  <g transform="translate(240, 160)">
    <!-- Format 1: Word (Selected) -->
    <rect width="220" height="90" rx="8" fill="#0F172A" stroke="#0066FF" stroke-width="2" />
    <rect x="15" y="15" width="36" height="36" rx="6" fill="#2563EB" />
    <text x="33" y="39" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">W</text>
    <text x="65" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Word (.docx)</text>
    <text x="65" y="52" fill="#10B981" font-family="sans-serif" font-size="11">Layout Preserved</text>

    <!-- Format 2: Excel -->
    <rect x="250" width="220" height="90" rx="8" fill="#0F172A" stroke="#334155" />
    <rect x="265" y="15" width="36" height="36" rx="6" fill="#059669" />
    <text x="283" y="39" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">X</text>
    <text x="315" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Excel (.xlsx)</text>
    <text x="315" y="52" fill="#94A3B8" font-family="sans-serif" font-size="11">Table Data Extract</text>

    <!-- Format 3: PowerPoint -->
    <rect x="500" width="220" height="90" rx="8" fill="#0F172A" stroke="#334155" />
    <rect x="515" y="15" width="36" height="36" rx="6" fill="#D97706" />
    <text x="533" y="39" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">P</text>
    <text x="565" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">PowerPoint (.pptx)</text>
    <text x="565" y="52" fill="#94A3B8" font-family="sans-serif" font-size="11">Slide Deck Format</text>

    <!-- Format 4: Image -->
    <rect y="105" width="220" height="90" rx="8" fill="#0F172A" stroke="#334155" />
    <rect x="15" y="120" width="36" height="36" rx="6" fill="#7C3AED" />
    <text x="33" y="144" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">🖼️</text>
    <text x="65" y="137" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Image (PNG / JPG)</text>
    <text x="65" y="157" fill="#94A3B8" font-family="sans-serif" font-size="11">300 DPI High-Res</text>

    <!-- Format 5: EPUB -->
    <rect x="250" y="105" width="220" height="90" rx="8" fill="#0F172A" stroke="#334155" />
    <rect x="265" y="120" width="36" height="36" rx="6" fill="#0284C7" />
    <text x="283" y="144" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">📖</text>
    <text x="315" y="137" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">EPUB eBook</text>
    <text x="315" y="157" fill="#94A3B8" font-family="sans-serif" font-size="11">Reflowable eBook</text>

    <!-- Format 6: PDF/A Archive -->
    <rect x="500" y="105" width="220" height="90" rx="8" fill="#0F172A" stroke="#334155" />
    <rect x="515" y="120" width="36" height="36" rx="6" fill="#4B5563" />
    <text x="533" y="144" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">🏛️</text>
    <text x="565" y="137" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">PDF/A Archive</text>
    <text x="565" y="157" fill="#94A3B8" font-family="sans-serif" font-size="11">ISO Archival Standard</text>
  </g>

  <!-- Detailed Export Options -->
  <rect x="240" y="380" width="720" height="150" rx="8" fill="#0F172A" stroke="#334155" />
  <text x="260" y="410" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">Export Settings for Word (.docx)</text>
  
  <rect x="260" y="430" width="20" height="20" rx="4" fill="#0066FF" />
  <text x="265" y="445" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">✓</text>
  <text x="290" y="445" fill="#E2E8F0" font-family="sans-serif" font-size="13">Retain Original Typography, Line Spacing, and Margins</text>

  <rect x="260" y="470" width="20" height="20" rx="4" fill="#0066FF" />
  <text x="265" y="485" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">✓</text>
  <text x="290" y="485" fill="#E2E8F0" font-family="sans-serif" font-size="13">Automatically Trigger OCR for Embedded Scanned Pages</text>

  <!-- Trigger Export Button -->
  <rect x="500" y="560" width="200" height="42" rx="8" fill="#0066FF" />
  <text x="600" y="586" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Export Document</text>
</svg>
