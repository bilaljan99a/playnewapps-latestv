<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <rect width="800" height="450" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Title -->
    <rect x="0" y="0" width="800" height="55" fill="#1E1B4B"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">💳 Jetpac In-App Checkout &amp; Promo Code Redemption</text>

    <!-- Checkout Modal Container -->
    <g transform="translate(150, 80)">
        <rect x="0" y="0" width="500" height="330" rx="12" fill="#1E293B" stroke="#7B3FF2" stroke-width="2"/>
        
        <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Order Summary: Europe 10GB 30-Day eSIM</text>
        
        <!-- Price breakdown -->
        <text x="30" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Plan Price:</text>
        <text x="470" y="75" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="end">$20.00</text>

        <!-- Promo code row -->
        <rect x="30" y="95" width="440" height="45" rx="8" fill="#0F172A" stroke="#10B981"/>
        <text x="45" y="122" font-family="monospace" font-weight="800" font-size="15" fill="#10B981">JETPACGO</text>
        <text x="160" y="122" font-family="system-ui, sans-serif" font-size="12" fill="#10B981">✓ 10% Coupon Applied!</text>
        <text x="450" y="122" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#10B981" text-anchor="end">-$2.00</text>

        <!-- SmartDelay Included Row -->
        <rect x="30" y="150" width="440" height="35" rx="6" fill="#311B92"/>
        <text x="45" y="172" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFD700">🛋️ Free SmartDelay Lounge Access Included ($35 Value)</text>

        <!-- Total Row -->
        <line x1="30" y1="200" x2="470" y2="200" stroke="#334155"/>
        <text x="30" y="225" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">Final Total:</text>
        <text x="470" y="225" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#00F2FE" text-anchor="end">$18.00</text>

        <!-- Payment CTA Button -->
        <rect x="30" y="255" width="440" height="48" rx="8" fill="#551BF2"/>
        <text x="250" y="285" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">PAY $18.00 &amp; INSTANT ACTIVATION</text>
    </g>
</svg>
