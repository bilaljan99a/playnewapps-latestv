<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <!-- Title Bar -->
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" />
  <circle cx="38" cy="20" r="6" fill="#F59E0B" />
  <circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare Recoverit 13 Pro - Deep HD File Preview Engine</text>

  <!-- Main Preview Modal Frame -->
  <g transform="translate(100, 60)">
    <rect width="1000" height="580" rx="16" fill="#1E293B" stroke="#00C8FF" stroke-width="2" />
    <!-- Header -->
    <rect width="1000" height="50" rx="16" fill="#0F172A" />
    <text x="30" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16">📷 Previewing File: DSC_0942_Portrait_RAW.NEF (Nikon Z8 RAW Image)</text>
    <text x="960" y="32" fill="#94A3B8" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">✕</text>

    <!-- Center Image Display -->
    <rect x="40" y="70" width="600" height="420" rx="10" fill="#090D16" stroke="#334155" />
    <!-- High Res Photo rendering simulation -->
    <rect x="60" y="90" width="560" height="380" rx="6" fill="#1E3A8A" />
    <circle cx="200" cy="180" r="60" fill="#38BDF8" opacity="0.8" />
    <path d="M60 420 L200 280 L340 380 L480 240 L620 470 Z" fill="#0284C7" />
    <circle cx="480" cy="160" r="40" fill="#FDE047" />

    <!-- Zoom & Rotate controls floating -->
    <g transform="translate(240, 440)">
      <rect width="200" height="36" rx="18" fill="#0F172A" opacity="0.9" stroke="#334155" />
      <text x="30" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="16">🔍+</text>
      <text x="70" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="16">🔍-</text>
      <text x="110" y="23" fill="#FFFFFF" font-family="sans-serif" font-size="16">🔄</text>
      <text x="150" y="23" fill="#00FFC8" font-family="sans-serif" font-weight="bold" font-size="13">100%</text>
    </g>

    <!-- Right File Metadata & EXIF Info Panel -->
    <g transform="translate(660, 70)">
      <rect width="300" height="420" rx="10" fill="#0F172A" stroke="#334155" />
      <text x="20" y="35" fill="#00FFC8" font-family="sans-serif" font-weight="bold" font-size="15">EXIF Metadata &amp; Health</text>

      <g font-family="sans-serif" font-size="12" transform="translate(20, 60)">
        <text x="0" y="0" fill="#94A3B8">File Size:</text>
        <text x="100" y="0" fill="#FFFFFF" font-weight="bold">54.8 MB</text>

        <text x="0" y="30" fill="#94A3B8">Dimensions:</text>
        <text x="100" y="30" fill="#FFFFFF" font-weight="bold">8256 × 5504 px</text>

        <text x="0" y="60" fill="#94A3B8">Camera Model:</text>
        <text x="100" y="60" fill="#FFFFFF" font-weight="bold">Nikon Z8 FX</text>

        <text x="0" y="90" fill="#94A3B8">Lens Info:</text>
        <text x="100" y="90" fill="#FFFFFF" font-weight="bold">85mm f/1.2 S</text>

        <text x="0" y="120" fill="#94A3B8">ISO / Aperture:</text>
        <text x="100" y="120" fill="#FFFFFF" font-weight="bold">ISO 100 • f/1.4</text>

        <text x="0" y="150" fill="#94A3B8">Original Date:</text>
        <text x="100" y="150" fill="#FFFFFF" font-weight="bold">2026-07-18</text>

        <text x="0" y="180" fill="#94A3B8">Recovery Integrity:</text>
        <text x="100" y="180" fill="#10B981" font-weight="bold">100% (No Loss)</text>
      </g>

      <rect x="20" y="280" width="260" height="110" rx="8" fill="#1E293B" stroke="#10B981" />
      <text x="35" y="305" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="13">✓ Zero File Corruption</text>
      <text x="35" y="328" fill="#94A3B8" font-family="sans-serif" font-size="11">File structure is completely intact and ready for instant, lossless extraction.</text>
    </g>

    <!-- Bottom Modal Actions -->
    <g transform="translate(40, 505)">
      <rect width="920" height="55" rx="10" fill="#0F172A" />
      <text x="30" y="33" fill="#94A3B8" font-family="sans-serif" font-size="13">File 1 of 1,240 selected photos in RAW directory</text>

      <g transform="translate(680, 10)">
        <rect width="210" height="36" rx="8" fill="linear-gradient(90deg, #00C8FF, #0052CC)" />
        <text x="105" y="23" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">⚡ Recover This File</text>
      </g>
    </g>
