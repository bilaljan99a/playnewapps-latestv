<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" style="background:#0F172A; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#091E42"/>
  
  <g transform="translate(30, 30)" filter="url(#shadow)">
    <rect width="740" height="440" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    
    <rect width="740" height="42" rx="12" fill="#1E293B"/>
    <rect y="30" width="740" height="12" fill="#1E293B"/>
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="5" fill="#10B981"/>
    
    <text x="370" y="25" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Box Platform — Box Cloud Storage</text>
    
    <g transform="translate(30, 65)">
      <text x="0" y="25" font-size="22" font-weight="800" fill="#FFFFFF">☁️ Box Cloud Storage</text>
      <text x="0" y="48" font-size="13" fill="#94A3B8">Secure cloud repository with up to 500GB file uploads and unlimited storage</text>
    </g>
    
    <g transform="translate(30, 135)">
      
        <g transform="translate(0, 0)">
          <rect width="680" height="60" rx="8" fill="#1E293B" stroke="#0061D5" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="14" fill="#0061D5" opacity="0.2"/>
          <text x="30" y="34" font-size="12" font-weight="700" fill="#0061D5" text-anchor="middle">01</text>
          <text x="60" y="26" font-size="14" font-weight="700" fill="#F8FAFC">Zero-Trust Encrypted Storage</text>
          <text x="60" y="44" font-size="12" fill="#94A3B8">Persistent AES-256 encryption at rest and TLS 1.3 in transit.</text>
          <rect x="580" y="18" width="80" height="24" rx="12" fill="#0061D5" opacity="0.15"/>
          <text x="620" y="34" font-size="10" font-weight="700" fill="#0061D5" text-anchor="middle">Verified</text>
        </g>
      
        <g transform="translate(0, 72)">
          <rect width="680" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="14" fill="#0061D5" opacity="0.2"/>
          <text x="30" y="34" font-size="12" font-weight="700" fill="#0061D5" text-anchor="middle">02</text>
          <text x="60" y="26" font-size="14" font-weight="700" fill="#F8FAFC">Unlimited Enterprise Capacity</text>
          <text x="60" y="44" font-size="12" fill="#94A3B8">No cap on storage capacity across Business and Enterprise tiers.</text>
          <rect x="580" y="18" width="80" height="24" rx="12" fill="#0061D5" opacity="0.15"/>
          <text x="620" y="34" font-size="10" font-weight="700" fill="#0061D5" text-anchor="middle">Unlimited</text>
        </g>
      
        <g transform="translate(0, 144)">
          <rect width="680" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="14" fill="#0061D5" opacity="0.2"/>
          <text x="30" y="34" font-size="12" font-weight="700" fill="#0061D5" text-anchor="middle">03</text>
          <text x="60" y="26" font-size="14" font-weight="700" fill="#F8FAFC">500 GB Single File Upload Support</text>
          <text x="60" y="44" font-size="12" fill="#94A3B8">Upload massive 8K video, CAD design models, and large databases.</text>
          <rect x="580" y="18" width="80" height="24" rx="12" fill="#0061D5" opacity="0.15"/>
          <text x="620" y="34" font-size="10" font-weight="700" fill="#0061D5" text-anchor="middle">500GB Max</text>
        </g>
      
        <g transform="translate(0, 216)">
          <rect width="680" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
          <circle cx="30" cy="30" r="14" fill="#0061D5" opacity="0.2"/>
          <text x="30" y="34" font-size="12" font-weight="700" fill="#0061D5" text-anchor="middle">04</text>
          <text x="60" y="26" font-size="14" font-weight="700" fill="#F8FAFC">Unlimited Version History</text>
          <text x="60" y="44" font-size="12" fill="#94A3B8">Restore past revisions instantly with granular rollback tracking.</text>
          <rect x="580" y="18" width="80" height="24" rx="12" fill="#0061D5" opacity="0.15"/>
          <text x="620" y="34" font-size="10" font-weight="700" fill="#0061D5" text-anchor="middle">Auto-Save</text>
        </g>
      
    </g>
  </g>
</svg>