<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#121824" />
  <rect x="50" y="30" width="1100" height="80" rx="10" fill="#1B2234" stroke="#2A344A" stroke-width="1" />
  <text x="80" y="75" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="24">📈 Adheart Performance Marketing &amp; Media Buying Analytics</text>
  <text x="720" y="75" fill="#A0AEC0" font-family="sans-serif" font-size="14">AI Insights, Audience Demographics &amp; Scale Potential</text>

  <!-- Content Boxes -->
  <g transform="translate(50, 130)">
    <!-- Chart 1: Demographics -->
    <rect width="530" height="250" rx="12" fill="#1B2234" stroke="#2A344A" stroke-width="1" />
    <text x="25" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16">Target Audience Gender Breakdown</text>
    <circle cx="120" cy="140" r="70" fill="#2A344A" />
    <path d="M120,140 L120,70 A70,70 0 1,1 60,175 Z" fill="#FB8500" />
    <text x="230" y="110" fill="#FB8500" font-family="sans-serif" font-weight="bold" font-size="16">■ Female: 68%</text>
    <text x="230" y="140" fill="#2A344A" font-family="sans-serif" font-weight="bold" font-size="16">■ Male: 32%</text>
    <text x="230" y="180" fill="#A0AEC0" font-family="sans-serif" font-size="13">Primary Age Group: 25 - 44 years old</text>

    <!-- Chart 2: Top Countries -->
    <g transform="translate(570, 0)">
      <rect width="530" height="250" rx="12" fill="#1B2234" stroke="#2A344A" stroke-width="1" />
      <text x="25" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16">Top Ad Distribution GEOs</text>
      <rect x="25" y="65" width="280" height="24" rx="4" fill="#FB8500" />
      <text x="320" y="82" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">🇺🇸 United States (58%)</text>
      <rect x="25" y="105" width="180" height="24" rx="4" fill="#3B82F6" />
      <text x="220" y="122" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">🇬🇧 United Kingdom (22%)</text>
      <rect x="25" y="145" width="120" height="24" rx="4" fill="#10B981" />
      <text x="160" y="162" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">🇨🇦 Canada (12%)</text>
      <rect x="25" y="185" width="80" height="24" rx="4" fill="#8B5CF6" />
      <text x="120" y="202" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">🇦🇺 Australia (8%)</text>
    </g>
  </g>

  <!-- Bottom Analytics AI Insights -->
  <g transform="translate(50, 400)">
    <rect width="1100" height="260" rx="12" fill="#1B2234" stroke="#2A344A" stroke-width="1" />
    <text x="25" y="40" fill="#FB8500" font-family="sans-serif" font-weight="bold" font-size="18">🤖 Adheart AI Creative Score &amp; Scale Verdict</text>
    <rect x="25" y="65" width="1050" height="170" rx="8" fill="#2A344A" />
    <text x="45" y="100" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">Hook Strength: 9.4/10</text>
    <text x="240" y="100" fill="#A0AEC0" font-family="sans-serif" font-size="14">First 3 seconds feature high-contrast UGC video with text overlay captions.</text>
    <text x="45" y="135" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">Offer Angle: Limited Time Discount</text>
    <text x="280" y="135" fill="#A0AEC0" font-family="sans-serif" font-size="14">Direct response landing page with countdown timer and bundle discount offer.</text>
    <text x="45" y="170" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">Scale Potential: HIGHLY SCALABLE</text>
    <text x="280" y="170" fill="#A0AEC0" font-family="sans-serif" font-size="14">Ad creative has been scaled across 14 ad accounts with consistent active status.</text>
  </g>
</svg>
