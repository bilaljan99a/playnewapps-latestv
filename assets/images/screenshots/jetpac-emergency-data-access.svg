<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
    <rect width="800" height="450" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Title -->
    <rect x="0" y="0" width="800" height="55" fill="#1E1B4B"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#00F2FE">🛡️ Jetpac Emergency Data Safety Net (Never Get Stranded)</text>

    <!-- Main Container -->
    <g transform="translate(40, 80)">
        <rect x="0" y="0" width="720" height="330" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
        
        <!-- Status Alert Banner -->
        <rect x="0" y="0" width="720" height="45" rx="12" fill="#10B981"/>
        <text x="20" y="28" font-family="system-ui, sans-serif" font-weight="900" font-size="15" fill="#000000">HIGH-SPEED DATA EXHAUSTED • EMERGENCY APP ACCESS STILL ACTIVE</text>

        <text x="30" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#E2E8F0">
            Even if your high-speed data allowance runs out, Jetpac keeps essential travel applications operational for emergency connectivity:
        </text>

        <!-- App Icons Grid -->
        <!-- App 1: WhatsApp -->
        <rect x="30" y="105" width="150" height="130" rx="10" fill="#0F172A" stroke="#25D366"/>
        <text x="105" y="145" font-size="32" text-anchor="middle">💬</text>
        <text x="105" y="175" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">WhatsApp</text>
        <text x="105" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#10B981" text-anchor="middle">Text &amp; Voice Active</text>

        <!-- App 2: Google Maps -->
        <rect x="200" y="105" width="150" height="130" rx="10" fill="#0F172A" stroke="#EA4335"/>
        <text x="275" y="145" font-size="32" text-anchor="middle">🗺️</text>
        <text x="275" y="175" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">Google Maps</text>
        <text x="275" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#10B981" text-anchor="middle">GPS &amp; Directions</text>

        <!-- App 3: Uber -->
        <rect x="370" y="105" width="150" height="130" rx="10" fill="#0F172A" stroke="#FFFFFF"/>
        <text x="445" y="145" font-size="32" text-anchor="middle">🚗</text>
        <text x="445" y="175" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">Uber</text>
        <text x="445" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#10B981" text-anchor="middle">Ride Booking Active</text>

        <!-- App 4: Grab -->
        <rect x="540" y="105" width="150" height="130" rx="10" fill="#0F172A" stroke="#00B14F"/>
        <text x="615" y="145" font-size="32" text-anchor="middle">🚕</text>
        <text x="615" y="175" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">Grab</text>
        <text x="615" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#10B981" text-anchor="middle">Southeast Asia Rides</text>

        <!-- Footer Callout -->
        <rect x="30" y="255" width="660" height="50" rx="8" fill="#311B92"/>
        <text x="50" y="285" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">💡 Top-Up High Speed Data Anytime in 1-Click via the Jetpac Mobile App without changing SIMs.</text>
    </g>
</svg>
