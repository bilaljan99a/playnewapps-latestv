<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <!-- Title Bar -->
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" />
  <circle cx="38" cy="20" r="6" fill="#F59E0B" />
  <circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare Recoverit 13 Pro - Remote NAS &amp; Linux Storage Server Recovery</text>

  <!-- SSH Connection Config Panel -->
  <g transform="translate(60, 70)">
    <rect width="420" height="580" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="30" y="40" fill="#A855F7" font-family="sans-serif" font-weight="bold" font-size="18">🌐 Remote Connection Setup</text>
    <text x="30" y="65" fill="#94A3B8" font-family="sans-serif" font-size="13">No need to unmount hard drives or rebuild RAID arrays!</text>

    <!-- Form Inputs -->
    <g transform="translate(30, 95)">
      <!-- IP Input -->
      <text x="0" y="15" fill="#CBD5E1" font-family="sans-serif" font-size="12">IP Address / Hostname:</text>
      <rect y="25" width="360" height="38" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="15" y="49" fill="#00FFC8" font-family="sans-serif" font-size="13">192.168.1.150 (Synology DS920+)</text>

      <!-- Port Input -->
      <text x="0" y="85" fill="#CBD5E1" font-family="sans-serif" font-size="12">SSH Port:</text>
      <rect y="95" width="360" height="38" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="15" y="119" fill="#FFFFFF" font-family="sans-serif" font-size="13">22</text>

      <!-- User Input -->
      <text x="0" y="155" fill="#CBD5E1" font-family="sans-serif" font-size="12">NAS Administrator Account:</text>
      <rect y="165" width="360" height="38" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="15" y="189" fill="#FFFFFF" font-family="sans-serif" font-size="13">admin_nas</text>

      <!-- Password Input -->
      <text x="0" y="225" fill="#CBD5E1" font-family="sans-serif" font-size="12">Password:</text>
      <rect y="235" width="360" height="38" rx="6" fill="#0F172A" stroke="#334155" />
      <text x="15" y="259" fill="#CBD5E1" font-family="sans-serif" font-size="13">••••••••••••••••</text>

      <!-- Supported File Systems -->
      <text x="0" y="305" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="13">Supported Storage Formats:</text>
      <text x="0" y="330" fill="#94A3B8" font-family="sans-serif" font-size="12">✓ BTRFS • EXT4 • EXT3 • XFS • ZFS • RAID 0/1/5/6/10</text>

      <rect y="360" width="360" height="48" rx="8" fill="linear-gradient(90deg, #A855F7, #6366F1)" />
      <text x="180" y="390" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">⚡ Connect &amp; Scan NAS Server</text>
    </g>
  </g>

  <!-- Right Side: Detected Volumes & Scanning Progress -->
  <g transform="translate(510, 70)">
    <rect width="630" height="580" rx="12" fill="#1E293B" stroke="#334155" />
    <text x="30" y="40" fill="#00FFC8" font-family="sans-serif" font-weight="bold" font-size="18">🖥️ Connected Server: Synology DiskStation (BTRFS Storage Pool 1)</text>
    
    <!-- Storage Volume Cards -->
    <g transform="translate(30, 65)">
      <!-- Volume 1 -->
      <rect width="570" height="120" rx="10" fill="#0F172A" stroke="#00C8FF" stroke-width="1.5" />
      <text x="20" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">Volume 1 (BTRFS RAID 5 - 4 Drives Active)</text>
      <text x="20" y="58" fill="#94A3B8" font-family="sans-serif" font-size="12">Total Capacity: 16.00 TB • Status: Degraded (1 Disk Replaced)</text>
      
      <rect x="20" y="70" width="530" height="10" rx="5" fill="#334155" />
      <rect x="20" y="70" width="410" height="10" rx="5" fill="#00C8FF" />
      <text x="20" y="100" fill="#00FFC8" font-family="sans-serif" font-weight="bold" font-size="12">Status: 82,400 Lost Files Identified • Deep Scan Running (94%)</text>

      <!-- Volume 2 -->
      <g transform="translate(0, 140)">
        <rect width="570" height="90" rx="10" fill="#0F172A" stroke="#334155" />
        <text x="20" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="15">Volume 2 (EXT4 Snapshot Backup Target)</text>
        <text x="20" y="58" fill="#94A3B8" font-family="sans-serif" font-size="12">Total Capacity: 8.00 TB • Ready for instant file retrieval</text>
      </g>
    </g>

    <!-- Real-Time Recovery Stream -->
    <g transform="translate(30, 320)">
      <text x="0" y="20" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="14">LIVE FILE SCANNING LOG (OVER SSH):</text>
      <rect y="30" width="570" height="200" rx="8" fill="#090D16" stroke="#334155" />
      <g font-family="monospace" font-size="12">
        <text x="15" y="55" fill="#10B981">[SUCCESS] SSH Session Established to 192.168.1.150:22</text>
        <text x="15" y="80" fill="#00C8FF">[INFO] BTRFS Superblock parsed at /dev/md0</text>
        <text x="15" y="105" fill="#00FFC8">[FOUND] 1,420 Raw RAW Photos restored from /volume1/shared_media/</text>
        <text x="15" y="130" fill="#00FFC8">[FOUND] 320 MP4 4K Video Clips indexed with original timestamps</text>
        <text x="15" y="155" fill="#F59E0B">[INFO] BTRFS Tree Reconstruction: 99.2% inode match</text>
        <text x="15" y="180" fill="#10B981">[READY] Selected files can be recovered directly to local storage.</text>
      </g>
    </g>
  </g>
</svg>
