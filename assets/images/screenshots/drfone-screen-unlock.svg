<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect width="1000" height="50" fill="#1e293b" />
  <circle cx="25" cy="25" r="6" fill="#ef4444"/><circle cx="45" cy="25" r="6" fill="#f59e0b"/><circle cx="65" cy="25" r="6" fill="#22c55e"/>
  <text x="500" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Wondershare Dr.Fone - Screen Unlock &amp; Lock Screen Bypass Tool</text>

  <g transform="translate(100, 80)">
    <text x="400" y="30" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22" text-anchor="middle">Unlock Any Mobile Screen Lock in Minutes</text>

    <!-- Grid of Lock Types -->
    <!-- Lock Type 1: Passcode -->
    <rect x="0" y="70" width="240" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="28" fill="#f59e0b" fill-opacity="0.2" />
    <text x="120" y="128" fill="#fbbf24" font-size="28" text-anchor="middle">🔑</text>
    <text x="120" y="180" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">4/6-Digit Passcode</text>
    <text x="120" y="205" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Remove custom numeric PIN</text>

    <!-- Lock Type 2: Face ID &amp; Touch ID -->
    <rect x="280" y="70" width="240" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="400" cy="120" r="28" fill="#38bdf8" fill-opacity="0.2" />
    <text x="400" y="128" fill="#38bdf8" font-size="28" text-anchor="middle">👤</text>
    <text x="400" y="180" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Face ID &amp; Touch ID</text>
    <text x="400" y="205" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Bypass biometric locks</text>

    <!-- Lock Type 3: Apple ID &amp; iCloud -->
    <rect x="560" y="70" width="240" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="680" cy="120" r="28" fill="#10b981" fill-opacity="0.2" />
    <text x="680" y="128" fill="#34d399" font-size="28" text-anchor="middle">☁️</text>
    <text x="680" y="180" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">iCloud &amp; Apple ID</text>
    <text x="680" y="205" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Remove linked account</text>

    <!-- Lock Type 4: Samsung / Google FRP -->
    <rect x="140" y="280" width="240" height="180" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="260" cy="330" r="28" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="260" y="338" fill="#a78bfa" font-size="28" text-anchor="middle">🛡️</text>
    <text x="260" y="390" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Google FRP Lock</text>
    <text x="260" y="415" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Bypass Android factory reset</text>

    <!-- Lock Type 5: Screen Time &amp; MDM -->
    <rect x="420" y="280" width="240" height="180" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="540" cy="330" r="28" fill="#ec4899" fill-opacity="0.2" />
    <text x="540" y="338" fill="#f472b6" font-size="28" text-anchor="middle">🏢</text>
    <text x="540" y="390" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">MDM &amp; Screen Time</text>
    <text x="540" y="415" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Bypass enterprise profile</text>
  </g>
</svg>
