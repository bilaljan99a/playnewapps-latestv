<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0F172A" />
  <rect width="1200" height="40" fill="#1E293B" />
  <circle cx="20" cy="20" r="6" fill="#EF4444" /><circle cx="38" cy="20" r="6" fill="#F59E0B" /><circle cx="56" cy="20" r="6" fill="#10B981" />
  <text x="600" y="25" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle">Wondershare PDFelement 2026 - Lumi Generative AI Assistant &amp; Chat Suite</text>

  <!-- Left: Main Document Viewer -->
  <rect x="30" y="60" width="720" height="610" rx="6" fill="#FFFFFF" />
  <text x="60" y="100" fill="#0F172A" font-family="sans-serif" font-weight="bold" font-size="22">Global Cybersecurity Risk Assessment 2026</text>
  <rect x="60" y="120" width="660" height="2" fill="#E2E8F0" />
  <text x="60" y="150" fill="#334155" font-family="sans-serif" font-size="13">Abstract: As cloud architectures scale across distributed networks, AI-driven threat vectors have expanded</text>
  <text x="60" y="170" fill="#334155" font-family="sans-serif" font-size="13">exponentially. This report details defensive mitigation frameworks, automated patch pipelines, and zero-trust</text>
  <text x="60" y="190" fill="#334155" font-family="sans-serif" font-size="13">access controls required for Fortune 500 infrastructure.</text>

  <rect x="60" y="220" width="660" height="180" fill="#F8FAFC" rx="6" stroke="#CBD5E1" />
  <text x="80" y="250" fill="#0066FF" font-family="sans-serif" font-weight="bold" font-size="15">Section 2: Zero-Trust Protocol Implementation</text>
  <text x="80" y="280" fill="#475569" font-family="sans-serif" font-size="13">Implementation of micro-segmentation across database clusters reduced lateral attack surface by 84%.</text>
  <text x="80" y="305" fill="#475569" font-family="sans-serif" font-size="13">Key findings indicate multi-factor authentication (MFA) enforcing FIDO2 keys eliminates 99.2% of credential leaks.</text>

  <!-- Right: Lumi AI Interactive Sidebar -->
  <rect x="770" y="60" width="400" height="610" rx="8" fill="#1E293B" stroke="#00C8FF" stroke-width="1.5" />
  <rect x="770" y="60" width="400" height="50" rx="8" fill="#0F172A" />
  <text x="790" y="92" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="16">✨ Lumi AI Assistant (GPT-4o Engine)</text>

  <!-- Action Tabs -->
  <rect x="785" y="120" width="85" height="28" rx="6" fill="#0066FF" />
  <text x="827" y="138" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Summarize</text>

  <rect x="880" y="120" width="85" height="28" rx="6" fill="#334155" />
  <text x="922" y="138" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">Translate</text>

  <rect x="975" y="120" width="85" height="28" rx="6" fill="#334155" />
  <text x="1017" y="138" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">Rewrite</text>

  <rect x="1070" y="120" width="85" height="28" rx="6" fill="#334155" />
  <text x="1112" y="138" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">Explain</text>

  <!-- Conversation History -->
  <!-- User Message -->
  <rect x="880" y="170" width="270" height="40" rx="8" fill="#0066FF" />
  <text x="895" y="195" fill="#FFFFFF" font-family="sans-serif" font-size="12">Summarize key risks &amp; takeaways.</text>

  <!-- Lumi AI Response -->
  <rect x="785" y="225" width="365" height="220" rx="8" fill="#0F172A" stroke="#334155" />
  <text x="800" y="250" fill="#00C8FF" font-family="sans-serif" font-weight="bold" font-size="13">🤖 Lumi Executive Summary:</text>
  <text x="800" y="275" fill="#E2E8F0" font-family="sans-serif" font-size="12">1. Lateral Risk Reduced: Micro-segmentation</text>
  <text x="815" y="295" fill="#94A3B8" font-family="sans-serif" font-size="11">slashes attack vectors by 84%.</text>
  <text x="800" y="320" fill="#E2E8F0" font-family="sans-serif" font-size="12">2. Credential Security: FIDO2 MFA prevents</text>
  <text x="815" y="340" fill="#94A3B8" font-family="sans-serif" font-size="11">99.2% of automated phishing breaches.</text>
  <text x="800" y="365" fill="#E2E8F0" font-family="sans-serif" font-size="12">3. Action Item: Mandate patch automation</text>
  <text x="815" y="385" fill="#94A3B8" font-family="sans-serif" font-size="11">across legacy database clusters immediately.</text>
  <rect x="800" y="405" width="100" height="24" rx="4" fill="#10B981" opacity="0.2" />
  <text x="850" y="421" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Copy Summary</text>

  <!-- Input Field -->
  <rect x="785" y="615" width="365" height="40" rx="20" fill="#0F172A" stroke="#00C8FF" stroke-width="1" />
  <text x="805" y="640" fill="#64748B" font-family="sans-serif" font-size="12">Ask Lumi AI to explain, translate or extract...</text>
