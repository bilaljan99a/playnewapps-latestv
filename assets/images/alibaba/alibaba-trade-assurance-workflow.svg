<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="taBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Frame -->
  <rect width="900" height="480" rx="16" fill="url(#taBg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Header Title -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="90" y="17" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">5-STAGE ESCROW PROTECTION</text>

    <text x="0" y="60" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Alibaba Trade Assurance Order Lifecycle</text>
    <text x="0" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14">How funds stay protected in Citibank escrow from contract creation to final delivery</text>
  </g>

  <!-- Flow Steps -->
  <!-- Step 1: Contract Creation -->
  <g transform="translate(45, 130)" filter="url(#shadow)">
    <rect width="150" height="260" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="url(#orangeGrad)"/>
    <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16">1</text>
    
    <text x="15" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Trade Contract</text>
    <text x="15" y="92" fill="#FF6A00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Order Specs Defined</text>
    
    <text x="15" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">Buyer &amp; supplier agree on product specs, unit price, quantity, dispatch date &amp; inspection criteria.</text>
    
    <rect x="12" y="215" width="126" height="30" rx="6" fill="#334155" fill-opacity="0.5"/>
    <text x="75" y="234" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11">Binding Terms</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 200 260 L 215 260" stroke="#FF6A00" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4"/>

  <!-- Step 2: Escrow Payment -->
  <g transform="translate(220, 130)" filter="url(#shadow)">
    <rect width="150" height="260" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="url(#orangeGrad)"/>
    <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16">2</text>
    
    <text x="15" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Deposit Escrow</text>
    <text x="15" y="92" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Citibank Secure Account</text>
    
    <text x="15" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">Buyer pays via Credit Card, Wire (T/T), or PayPal into Alibaba's escrow. Supplier receives 0% until authorized.</text>
    
    <rect x="12" y="215" width="126" height="30" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1"/>
    <text x="75" y="234" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Funds Locked</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 375 260 L 390 260" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4"/>

  <!-- Step 3: Production &amp; Inspection -->
  <g transform="translate(395, 130)" filter="url(#shadow)">
    <rect width="150" height="260" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="url(#orangeGrad)"/>
    <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16">3</text>
    
    <text x="15" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">QC Inspection</text>
    <text x="15" y="92" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">AQL 2.5 Audit Check</text>
    
    <text x="15" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">Factory manufactures goods. Pre-shipment inspection verifies quality, quantity, and packaging compliance.</text>
    
    <rect x="12" y="215" width="126" height="30" rx="6" fill="#D97706" fill-opacity="0.2" stroke="#D97706" stroke-width="1"/>
    <text x="75" y="234" text-anchor="middle" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Quality Verified</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 550 260 L 565 260" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4"/>

  <!-- Step 4: Dispatch &amp; Tracking -->
  <g transform="translate(570, 130)" filter="url(#shadow)">
    <rect width="150" height="260" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="url(#orangeGrad)"/>
    <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16">4</text>
    
    <text x="15" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Freight Transit</text>
    <text x="15" y="92" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">On-Time Guarantee</text>
    
    <text x="15" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">Order ships via Air/Sea freight. Bill of Lading &amp; tracking uploaded. Delivery deadline strictly enforced.</text>
    
    <rect x="12" y="215" width="126" height="30" rx="6" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED" stroke-width="1"/>
    <text x="75" y="234" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">In Transit</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 725 260 L 740 260" stroke="#C084FC" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4"/>

  <!-- Step 5: Order Confirmation &amp; Fund Release -->
  <g transform="translate(745, 130)" filter="url(#shadow)">
    <rect width="110" height="260" rx="12" fill="url(#cardBg)" stroke="#10B981" stroke-width="2"/>
    <rect x="15" y="15" width="32" height="32" rx="8" fill="url(#greenGrad)"/>
    <text x="31" y="36" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16">5</text>
    
    <text x="15" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13">Release</text>
    <text x="15" y="92" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10">Escrow Payout</text>
    
    <text x="15" y="120" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11">Buyer confirms shipment arrival &amp; quality. Escrow releases payout to supplier.</text>
    
    <rect x="10" y="215" width="90" height="30" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="55" y="234" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11">100% Safe</text>
  </g>

  <!-- Bottom Guarantee Banner -->
  <g transform="translate(45, 415)">
    <rect width="810" height="40" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="25" cy="20" r="8" fill="#10B981"/>
    <path d="M 21 20 L 24 23 L 29 17" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="25" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12">Dispute Resolution Guarantee:</text>
    <text x="215" y="25" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">If supplier fails dispatch date or product quality specifications, Alibaba issues 100% money-back refund within 14 business days.</text>
  </g>
</svg>
