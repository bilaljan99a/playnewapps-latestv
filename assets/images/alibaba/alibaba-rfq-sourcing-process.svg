<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="rfqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" rx="16" fill="url(#rfqBg)" stroke="#374151" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(45, 30)">
    <rect x="0" y="0" width="210" height="26" rx="13" fill="#FF6A00" fill-opacity="0.2" stroke="#FF6A00" stroke-width="1"/>
    <text x="105" y="17" text-anchor="middle" fill="#FF8C00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">SOURCING &amp; OEM MANUFACTURING PIPELINE</text>

    <text x="0" y="60" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24">Alibaba Request for Quotation (RFQ) Pipeline</text>
    <text x="0" y="82" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14">From product specification sheet to factory quotes, custom sample approval, and mass production</text>
  </g>

  <!-- 4 Step Flow Grid -->
  <!-- Step 1 -->
  <g transform="translate(45, 125)">
    <rect width="180" height="240" rx="12" fill="url(#cardBg)" stroke="#4B5563" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="url(#orangeGrad)"/>
    <text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14">1</text>
    
    <text x="15" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Post RFQ</text>
    <text x="15" y="88" fill="#FF6A00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Spec Sheet &amp; Quantities</text>
    
    <text x="15" y="115" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">Submit technical requirements, CAD files, target unit price, MOQ, and custom packaging specs.</text>

    <rect x="12" y="195" width="156" height="28" rx="6" fill="#374151"/>
    <text x="90" y="213" text-anchor="middle" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11">Free RFQ Portal</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(255, 125)">
    <rect width="180" height="240" rx="12" fill="url(#cardBg)" stroke="#4B5563" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="url(#orangeGrad)"/>
    <text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14">2</text>
    
    <text x="15" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Receive Quotes</text>
    <text x="15" y="88" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Compare Factory Bids</text>
    
    <text x="15" y="115" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">Get 10+ quotes from verified manufacturers in 24 hours. Compare unit pricing, lead time, and payment terms.</text>

    <rect x="12" y="195" width="156" height="28" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-width="1"/>
    <text x="90" y="213" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">10+ Verified Bids</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(465, 125)">
    <rect width="180" height="240" rx="12" fill="url(#cardBg)" stroke="#4B5563" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="16" fill="url(#orangeGrad)"/>
    <text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14">3</text>
    
    <text x="15" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Sample Order</text>
    <text x="15" y="88" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Product Testing &amp; Approval</text>
    
    <text x="15" y="115" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">Order 1-5 sample units to inspect build quality, materials, logo printing, and retail packaging before mass order.</text>

    <rect x="12" y="195" width="156" height="28" rx="6" fill="#D97706" fill-opacity="0.2" stroke="#D97706" stroke-width="1"/>
    <text x="90" y="213" text-anchor="middle" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Sample Approved</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(675, 125)">
    <rect width="180" height="240" rx="12" fill="url(#cardBg)" stroke="#10B981" stroke-width="2"/>
    <circle cx="30" cy="30" r="16" fill="#10B981"/>
    <text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14">4</text>
    
    <text x="15" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14">Mass Order</text>
    <text x="15" y="88" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11">Trade Assurance Escrow</text>
    
    <text x="15" y="115" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12">Initiate bulk manufacturing order with Trade Assurance escrow. QC inspection &amp; container loading.</text>

    <rect x="12" y="195" width="156" height="28" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="90" y="213" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11">Container Shipped</text>
  </g>
</svg>
