<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <!-- Title Bar -->
  <rect x="0" y="0" width="1280" height="50" fill="#1e293b"/>
  <rect x="16" y="10" width="30" height="30" rx="6" fill="#2563eb"/>
  <text x="31" y="31" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">W</text>
  <text x="56" y="30" font-size="15" font-weight="800" fill="#ffffff">WPS Writer</text>
  <text x="145" y="30" font-size="13" fill="#94a3b8">-[2026_Enterprise_Growth_Strategy.docx] - Auto-Saved to WPS Cloud</text>
  
  <!-- Ribbon Toolbar -->
  <rect x="0" y="50" width="1280" height="70" fill="#1e293b"/>
  <line x1="0" y1="50" x2="1280" y2="50" stroke="#334155" stroke-width="1"/>
  <line x1="0" y1="120" x2="1280" y2="120" stroke="#334155" stroke-width="1"/>

  <!-- Ribbon Tabs -->
  <g transform="translate(20, 60)">
    <rect width="60" height="24" rx="4" fill="#2563eb"/>
    <text x="30" y="16" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Home</text>
    <text x="90" y="16" font-size="12" fill="#cbd5e1">Insert</text>
    <text x="145" y="16" font-size="12" fill="#cbd5e1">Page Layout</text>
    <text x="225" y="16" font-size="12" fill="#cbd5e1">References</text>
    <text x="305" y="16" font-size="12" fill="#cbd5e1">Review</text>
    <text x="365" y="16" font-size="12" fill="#cbd5e1">View</text>
    <rect x="410" y="-2" width="80" height="26" rx="4" fill="#8b5cf6"/>
    <text x="450" y="16" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">✨ WPS AI</text>
  </g>

  <!-- Formatting Controls -->
  <g transform="translate(20, 90)">
    <text x="0" y="16" font-size="13" font-weight="700" fill="#ffffff">Calibri</text>
    <text x="70" y="16" font-size="13" font-weight="700" fill="#ffffff">12pt</text>
    <text x="110" y="16" font-size="14" font-weight="900" fill="#ffffff">B</text>
    <text x="130" y="16" font-size="14" font-style="italic" fill="#ffffff">I</text>
    <text x="145" y="16" font-size="14" font-weight="700" fill="#ffffff" text-decoration="underline">U</text>
    <text x="180" y="16" font-size="13" fill="#cbd5e1">Align Left | Center | Right | Justify</text>
    <text x="420" y="16" font-size="13" fill="#cbd5e1">Styles: Heading 1, Heading 2, Normal</text>
  </g>

  <!-- Editor Main Area -->
  <rect x="0" y="120" width="1280" height="570" fill="#0f172a"/>

  <!-- Page Sheet View -->
  <g transform="translate(240, 140)">
    <rect width="800" height="530" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Document Content -->
    <g transform="translate(60, 50)" font-family="Calibri, Arial, sans-serif">
      <text x="0" y="0" font-size="24" font-weight="800" fill="#0f172a">2026 Enterprise Productivity &amp; Digital Transformation</text>
      <text x="0" y="25" font-size="13" font-weight="600" fill="#64748b">Prepared by Executive Strategy Team | Status: Final Draft</text>
      <line x1="0" y1="40" x2="680" y2="40" stroke="#cbd5e1" stroke-width="1"/>

      <text x="0" y="70" font-size="16" font-weight="800" fill="#1e293b">1. Executive Summary</text>
      <text x="0" y="95" font-size="13" fill="#334155" line-height="1.6">
        Modern organizational efficiency depends upon unified cross-platform productivity suites capable
      </text>
      <text x="0" y="115" font-size="13" fill="#334155">
        of seamlessly bridging desktop, web, and mobile environments. Deploying WPS Office across 12,000
      </text>
      <text x="0" y="135" font-size="13" fill="#334155">
        enterprise workstations resulted in a 38% drop in licensing expenditures and 99.8% file compatibility.
      </text>

      <text x="0" y="175" font-size="16" font-weight="800" fill="#1e293b">2. File Compatibility &amp; Native AI Integration</text>
      <text x="0" y="200" font-size="13" fill="#334155">
        WPS Writer provides native 100% reading and editing fidelity for Microsoft Word (.docx) formats,
      </text>
      <text x="0" y="220" font-size="13" fill="#334155">
        eliminating font distortion, table displacement, and macro execution errors across legacy documents.
      </text>

      <!-- Formatted Table in Doc -->
      <g transform="translate(0, 245)">
        <rect width="680" height="110" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <rect width="680" height="30" rx="4" fill="#1e3a8a"/>
        <text x="16" y="20" font-size="12" font-weight="700" fill="#ffffff">Metric / Feature</text>
        <text x="250" y="20" font-size="12" font-weight="700" fill="#ffffff">Legacy Office Suite</text>
        <text x="480" y="20" font-size="12" font-weight="700" fill="#ffffff">WPS Office Pro 2026</text>

        <line x1="0" y1="65" x2="680" y2="65" stroke="#cbd5e1"/>
        <text x="16" y="52" font-size="12" font-weight="600" fill="#1e293b">Installation Memory Footprint</text>
        <text x="250" y="52" font-size="12" fill="#64748b">4.2 GB Heavy Install</text>
        <text x="480" y="52" font-size="12" font-weight="700" fill="#16a34a">220 MB Ultra-Lightweight</text>

        <text x="16" y="88" font-size="12" font-weight="600" fill="#1e293b">Built-in AI Writing Assistant</text>
        <text x="250" y="88" font-size="12" fill="#64748b">Paid Add-on ($30/user/mo)</text>
        <text x="480" y="88" font-size="12" font-weight="700" fill="#16a34a">Included Native WPS AI</text>
      </g>
    </g>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="0" y="690" width="1280" height="30" fill="#1e293b"/>
  <text x="20" y="710" font-size="12" fill="#94a3b8">Page 1 of 4 | 2,840 Words | English (US) | Spellcheck: Passed | WPS AI: Ready</text>
</svg>
