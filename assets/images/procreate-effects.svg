<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0a0c10;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <rect width="1280" height="720" fill="#0b0e15"/>
  <g transform="translate(100, 40)">
    <rect width="1080" height="640" rx="16" fill="#131822" stroke="#222b3a" stroke-width="2"/>

    <!-- Left Toolbar (Valkyrie FX Menu) -->
    <g transform="translate(30, 30)">
      <rect width="280" height="580" rx="12" fill="#0f131a" stroke="#1e293b"/>
      <text x="24" y="36" fill="#ffffff" font-size="18" font-weight="bold">Adjustments (FX)</text>

      <g transform="translate(16, 60)">
        <rect x="0" y="0" width="248" height="38" rx="8" fill="#ff007f"/>
        <text x="16" y="24" fill="#ffffff" font-size="13" font-weight="bold">Bloom &amp; Glitch</text>

        <text x="16" y="65" fill="#94a3b8" font-size="13">Gaussian Blur</text>
        <text x="16" y="105" fill="#94a3b8" font-size="13">Motion Blur</text>
        <text x="16" y="145" fill="#94a3b8" font-size="13">Perspective Blur</text>
        <text x="16" y="185" fill="#94a3b8" font-size="13">Noise &amp; Grain</text>
        <text x="16" y="225" fill="#94a3b8" font-size="13">Sharpen</text>
        <text x="16" y="265" fill="#94a3b8" font-size="13">Liquify (Push / Twirl)</text>
        <text x="16" y="305" fill="#94a3b8" font-size="13">Chromatic Aberration</text>
        <text x="16" y="345" fill="#94a3b8" font-size="13">Half-tone &amp; Screen</text>
        <text x="16" y="385" fill="#94a3b8" font-size="13">Gradient Map Studio</text>
      </g>
    </g>

    <!-- Center Canvas Preview with Bloom FX -->
    <g transform="translate(330, 30)">
      <rect width="720" height="460" rx="12" fill="#1a202c"/>
      <!-- Glowing Artwork with Bloom -->
      <path d="M 120 300 Q 250 80 400 250 T 600 150" fill="none" stroke="#ff007f" stroke-width="36" opacity="0.4"/>
      <path d="M 120 300 Q 250 80 400 250 T 600 150" fill="none" stroke="#ff007f" stroke-width="20" stroke-linecap="round"/>
      <path d="M 120 300 Q 250 80 400 250 T 600 150" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="400" cy="250" r="30" fill="#00dfd8" opacity="0.6"/>
      <circle cx="400" cy="250" r="10" fill="#ffffff"/>
    </g>

    <!-- Slider Bar Bottom -->
    <g transform="translate(330, 510)">
      <rect width="720" height="100" rx="12" fill="#0f131a" stroke="#1e293b"/>
      <text x="24" y="30" fill="#ffffff" font-size="14" font-weight="bold">Bloom Intensity Slider: 42%</text>
      <rect x="24" y="48" width="672" height="12" rx="6" fill="#1e293b"/>
      <rect x="24" y="48" width="280" height="12" rx="6" fill="#ff007f"/>
      <circle cx="304" cy="54" r="12" fill="#ffffff" stroke="#ff007f" stroke-width="3"/>
    </g>
  </g>
</svg>