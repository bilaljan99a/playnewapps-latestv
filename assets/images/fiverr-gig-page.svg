    <text x="0" y="262" font-family="Arial, sans-serif" font-size="11" fill="#98A2B3">✓ Custom REST / GraphQL API design with secure authentication &amp; DB</text>
  </g>

  <!-- Right Order Box Sidebar -->
  <g transform="translate(520, 70)">
