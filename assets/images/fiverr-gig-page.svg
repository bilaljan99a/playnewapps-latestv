<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" rx="12" fill="#0A1118"/>
  <!-- Top Nav -->
  <rect width="800" height="50" fill="#101828"/>
  <rect x="25" y="14" width="80" height="22" rx="4" fill="#1DBF73"/>
