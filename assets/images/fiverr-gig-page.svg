    <text x="127" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#98A2B3" text-anchor="middle">Standard</text>
    <rect x="170" y="0" width="85" height="40" fill="#1D2939"/>
    <text x="212" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#98A2B3" text-anchor="middle">Premium</text>

    <!-- Package Info -->
