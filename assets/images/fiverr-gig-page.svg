    <text x="235" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#1DBF73" text-anchor="end">$150</text>

    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="#98A2B3">1-Page custom web app with frontend, basic API integration, and responsive layout.</text>

    <text x="20" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">⏱ 3-Day Delivery</text>
    <text x="140" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">🔄 2 Revisions</text>

    <text x="20" y="170" font-family="Arial, sans-serif" font-size="11" fill="#EAECF0">✓ Functional Website</text>
    <text x="20" y="188" font-family="Arial, sans-serif" font-size="11" fill="#EAECF0">✓ 1 Page / Screen</text>
    <text x="20" y="206" font-family="Arial, sans-serif" font-size="11" fill="#EAECF0">✓ Responsive Design</text>
    <text x="20" y="224" font-family="Arial, sans-serif" font-size="11" fill="#EAECF0">✓ Source Code Included</text>

    <!-- Continue Button -->
    <rect x="20" y="250" width="215" height="44" rx="6" fill="#1DBF73"/>
    <text x="127" y="277" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Continue ($150)</text>

    <!-- Compare packages link -->
    <text x="127" y="320" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#1DBF73" text-anchor="middle">Compare Packages &gt;</text>
