<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="400" rx="16" fill="url(#secGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22">HideMy.name VPN Security &amp; Privacy Infrastructure</text>
  <text x="500" y="70" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14">Multi-layered data protection, stealth Chameleon obfuscation, and zero-log architecture</text>

  <!-- Feature Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(40, 100)">
    <rect width="280" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="24" fill="#00C9A7" fill-opacity="0.2"/>
    <text x="50" y="56" text-anchor="middle" fill="#00C9A7" font-weight="800" font-size="20">🔒</text>
    <text x="25" y="110" fill="#FFFFFF" font-weight="800" font-size="18">AES-256 Encryption</text>
    <text x="25" y="140" fill="#94A3B8" font-size="13" font-weight="500">
      <tspan x="25" dy="0">Military-grade AES-256-GCM</tspan>
      <tspan x="25" dy="20">cipher protects all incoming</tspan>
      <tspan x="25" dy="20">and outgoing internet traffic</tspan>
      <tspan x="25" dy="20">from ISP snooping and hackers.</tspan>
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(360, 100)">
    <rect width="280" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="24" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="50" y="56" text-anchor="middle" fill="#38BDF8" font-weight="800" font-size="20">🦎</text>
    <text x="25" y="110" fill="#FFFFFF" font-weight="800" font-size="18">Chameleon Obfuscation</text>
    <text x="25" y="140" fill="#94A3B8" font-size="13" font-weight="500">
      <tspan x="25" dy="0">Bypasses strict DPI firewalls</tspan>
      <tspan x="25" dy="20">(Deep Packet Inspection) in</tspan>
      <tspan x="25" dy="20">censored regions by masking</tspan>
      <tspan x="25" dy="20">VPN traffic as regular HTTPS.</tspan>
    </text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(680, 100)">
    <rect width="280" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="24" fill="#10B981" fill-opacity="0.2"/>
    <text x="50" y="56" text-anchor="middle" fill="#10B981" font-weight="800" font-size="20">🛡️</text>
    <text x="25" y="110" fill="#FFFFFF" font-weight="800" font-size="18">Strict No-Logs Policy</text>
    <text x="25" y="140" fill="#94A3B8" font-size="13" font-weight="500">
      <tspan x="25" dy="0">No IP logging, no browsing</tspan>
      <tspan x="25" dy="20">history records, no timestamps,</tspan>
      <tspan x="25" dy="20">and no bandwidth tracking.</tspan>
      <tspan x="25" dy="20">100% anonymous usage.</tspan>
    </text>
  </g>
</svg>
