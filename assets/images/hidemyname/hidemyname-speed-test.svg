<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <linearGradient id="spdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="400" rx="16" fill="url(#spdGrad)" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22">HideMy.name Speed Performance Test Benchmark (2026)</text>
  <text x="500" y="70" text-anchor="middle" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14">Tested on 500 Mbps Fiber Line across Global High-Speed Server Nodes</text>

  <!-- Speed Metric Bars -->
  <g transform="translate(60, 110)">
    <!-- Baseline Direct ISP -->
    <text x="0" y="25" fill="#FFFFFF" font-weight="700" font-size="15">Base ISP Speed (No VPN)</text>
    <rect x="240" y="8" width="620" height="24" rx="6" fill="#334155"/>
    <rect x="240" y="8" width="600" height="24" rx="6" fill="#94A3B8"/>
    <text x="885" y="25" fill="#FFFFFF" font-weight="800" font-size="15">492 Mbps</text>

    <!-- HideMyname Frankfurt (WireGuard) -->
    <text x="0" y="85" fill="#FFFFFF" font-weight="700" font-size="15">Frankfurt, DE (WireGuard)</text>
    <rect x="240" y="68" width="620" height="24" rx="6" fill="#334155"/>
    <rect x="240" y="68" width="560" height="24" rx="6" fill="#00C9A7"/>
    <text x="885" y="85" fill="#00C9A7" font-weight="800" font-size="15">458 Mbps</text>

    <!-- HideMyname Amsterdam (WireGuard) -->
    <text x="0" y="145" fill="#FFFFFF" font-weight="700" font-size="15">Amsterdam, NL (WireGuard)</text>
    <rect x="240" y="128" width="620" height="24" rx="6" fill="#334155"/>
    <rect x="240" y="128" width="540" height="24" rx="6" fill="#00C9A7"/>
    <text x="885" y="145" fill="#00C9A7" font-weight="800" font-size="15">442 Mbps</text>

    <!-- HideMyname New York (OpenVPN) -->
    <text x="0" y="205" fill="#FFFFFF" font-weight="700" font-size="15">New York, US (OpenVPN)</text>
    <rect x="240" y="188" width="620" height="24" rx="6" fill="#334155"/>
    <rect x="240" y="188" width="460" height="24" rx="6" fill="#38BDF8"/>
    <text x="885" y="205" fill="#38BDF8" font-weight="800" font-size="15">380 Mbps</text>

    <!-- HideMyname Tokyo (Chameleon) -->
    <text x="0" y="265" fill="#FFFFFF" font-weight="700" font-size="15">Tokyo, JP (Chameleon Stealth)</text>
    <rect x="240" y="248" width="620" height="24" rx="6" fill="#334155"/>
    <rect x="240" y="248" width="390" height="24" rx="6" fill="#F59E0B"/>
    <text x="885" y="265" fill="#F59E0B" font-weight="800" font-size="15">315 Mbps</text>
  </g>
</svg>
