<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <rect width="800" height="500" fill="#090d16"/>
    <rect x="80" y="40" width="640" height="420" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="120" y="90" font-family="Impact, sans-serif" font-size="24" fill="#f59e0b">120 FPS ULTRA HD AUDIO &amp; GRAPHICS SETTINGS</text>
    <g transform="translate(120, 140)">
      <text x="0" y="30" font-family="sans-serif" font-size="16" fill="#cbd5e1">Graphic Quality:</text>
      <text x="400" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">VERY HIGH</text>

      <text x="0" y="80" font-family="sans-serif" font-size="16" fill="#cbd5e1">Frame Rate:</text>
      <text x="400" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#22c55e">ULTRA (120 FPS)</text>

      <text x="0" y="130" font-family="sans-serif" font-size="16" fill="#cbd5e1">Field of View (FOV):</text>
      <text x="400" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">90 FOV</text>

