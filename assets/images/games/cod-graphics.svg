      <text x="400" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#22c55e">ENABLED</text>

      <text x="0" y="230" font-family="sans-serif" font-size="16" fill="#cbd5e1">Spatial Audio 3D:</text>
      <text x="400" y="230" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">DOLBY ATMOS ENHANCED</text>
    </g>
  </svg>