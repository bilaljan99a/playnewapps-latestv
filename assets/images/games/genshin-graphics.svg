<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
    <rect width="800" height="500" fill="#090d16"/>
    <rect x="80" y="40" width="640" height="420" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="120" y="90" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff">GRAPHICS & PERFORMANCE BENCHMARK</text>
    <g transform="translate(120, 130)">
      <text x="0" y="30" font-family="sans-serif" font-size="16" fill="#cbd5e1">Graphics Quality:</text>
      <text x="400" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#facc15">Highest</text>

      <text x="0" y="80" font-family="sans-serif" font-size="16" fill="#cbd5e1">FPS Limit:</text>
      <text x="400" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#22c55e">60 FPS (Smooth)</text>

      <text x="0" y="130" font-family="sans-serif" font-size="16" fill="#cbd5e1">Shadow Quality:</text>
      <text x="400" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">High</text>

      <text x="0" y="180" font-family="sans-serif" font-size="16" fill="#cbd5e1">Visual Effects:</text>
      <text x="400" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">High</text>

      <text x="0" y="240" font-family="sans-serif" font-size="16" fill="#cbd5e1">Device Load Status:</text>
      <rect x="220" y="222" width="260" height="24" rx="12" fill="#0f172a"/>
      <rect x="224" y="226" width="180" height="16" rx="8" fill="#22c55e"/>
      <text x="495" y="240" font-family="sans-serif" font-size="14" font-weight="bold" fill="#22c55e">Smooth</text>
    </g>
  </svg>