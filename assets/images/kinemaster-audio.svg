<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <rect width="1280" height="720" fill="#0a0d16"/>

  <g transform="translate(60, 40)">
    <rect width="1160" height="640" rx="16" fill="#131a28" stroke="#222d42" stroke-width="2"/>

    <!-- Left Master VU Faders &amp; Mixer -->
    <g transform="translate(30, 30)">
      <rect width="500" height="580" rx="12" fill="#0f1522" stroke="#1e293b"/>
      <text x="24" y="40" fill="#ffffff" font-size="18" font-weight="bold">Multi-Channel Audio Mixer</text>

      <!-- Channel 1: Master -->
      <g transform="translate(40, 80)">
        <text x="20" y="0" fill="#94a3b8" font-size="12" text-anchor="middle">MASTER</text>
        <rect x="10" y="15" width="20" height="380" rx="10" fill="#1e293b"/>
        <rect x="10" y="120" width="20" height="275" rx="10" fill="#00e676"/>
        <circle cx="20" cy="120" r="14" fill="#ffffff" stroke="#00e676" stroke-width="3"/>
        <text x="20" y="420" fill="#00e676" font-size="12" font-weight="bold" text-anchor="middle">0 dB</text>
      </g>

      <!-- Channel 2: Dialogue / Mic -->
      <g transform="translate(140, 80)">
        <text x="20" y="0" fill="#94a3b8" font-size="12" text-anchor="middle">VOICE</text>
        <rect x="10" y="15" width="20" height="380" rx="10" fill="#1e293b"/>
        <rect x="10" y="90" width="20" height="305" rx="10" fill="#ff4757"/>
        <circle cx="20" cy="90" r="14" fill="#ffffff" stroke="#ff4757" stroke-width="3"/>
        <text x="20" y="420" fill="#ff4757" font-size="12" font-weight="bold" text-anchor="middle">+3 dB</text>
      </g>

      <!-- Channel 3: Music (Ducked) -->
      <g transform="translate(240, 80)">
        <text x="20" y="0" fill="#94a3b8" font-size="12" text-anchor="middle">MUSIC</text>
        <rect x="10" y="15" width="20" height="380" rx="10" fill="#1e293b"/>
        <rect x="10" y="240" width="20" height="155" rx="10" fill="#1e90ff"/>
        <circle cx="20" cy="240" r="14" fill="#ffffff" stroke="#1e90ff" stroke-width="3"/>
        <text x="20" y="420" fill="#1e90ff" font-size="12" font-weight="bold" text-anchor="middle">-12 dB</text>
      </g>

      <!-- Channel 4: SFX -->
      <g transform="translate(340, 80)">
        <text x="20" y="0" fill="#94a3b8" font-size="12" text-anchor="middle">SFX</text>
        <rect x="10" y="15" width="20" height="380" rx="10" fill="#1e293b"/>
        <rect x="10" y="180" width="20" height="215" rx="10" fill="#f59e0b"/>
        <circle cx="20" cy="180" r="14" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
        <text x="20" y="420" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">-6 dB</text>
      </g>

      <!-- Auto Ducking Indicator -->
      <g transform="translate(24, 490)">
        <rect width="450" height="50" rx="8" fill="#1b2538" stroke="#2c3a54"/>
        <text x="20" y="30" fill="#00e676" font-size="13" font-weight="bold">AUTO-DUCKING ENABLED: -12dB when Voice is active</text>
      </g>
    </g>

    <!-- Right Voice Changer &amp; EQ Suite -->
    <g transform="translate(560, 30)">
      <rect width="570" height="580" rx="12" fill="#0f1522" stroke="#1e293b"/>
      <text x="24" y="40" fill="#ffffff" font-size="18" font-weight="bold">Voice Modulation &amp; EQ Presets</text>

      <!-- Voice Changer Grid -->
      <g transform="translate(24, 70)">
        <text x="0" y="0" fill="#ff4757" font-size="13" font-weight="bold">VOICE CHANGER FX PRESETS</text>
        <g transform="translate(0, 15)">
          <rect x="0" y="0" width="160" height="48" rx="8" fill="#ff4757"/>
          <text x="80" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🤖 Robot / Alien</text>

          <rect x="180" y="0" width="160" height="48" rx="8" fill="#1e293b"/>
          <text x="260" y="28" fill="#cbd5e1" font-size="13" text-anchor="middle">🐿️ Chipmunk High</text>

          <rect x="360" y="0" width="160" height="48" rx="8" fill="#1e293b"/>
          <text x="440" y="28" fill="#cbd5e1" font-size="13" text-anchor="middle">📻 Radio Announcer</text>

          <rect x="0" y="60" width="160" height="48" rx="8" fill="#1e293b"/>
          <text x="80" y="88" fill="#cbd5e1" font-size="13" text-anchor="middle">🏰 Deep Monster</text>

          <rect x="180" y="60" width="160" height="48" rx="8" fill="#1e293b"/>
          <text x="260" y="88" fill="#cbd5e1" font-size="13" text-anchor="middle">🎤 Concert Reverb</text>

          <rect x="360" y="60" width="160" height="48" rx="8" fill="#1e293b"/>
          <text x="440" y="88" fill="#cbd5e1" font-size="13" text-anchor="middle">🚪 Echo Chamber</text>
        </g>
      </g>

      <!-- Equalizer Visualizer -->
      <g transform="translate(24, 250)">
        <text x="0" y="0" fill="#1e90ff" font-size="13" font-weight="bold">PARAMETRIC EQUALIZER (EQ) CURVE</text>
        <rect x="0" y="15" width="520" height="180" rx="10" fill="#161f31" stroke="#253248"/>
        <!-- Frequency Curve -->
        <path d="M 20 140 Q 100 140 180 60 T 340 120 T 500 80" fill="none" stroke="#1e90ff" stroke-width="3"/>
        <path d="M 20 140 Q 100 140 180 60 T 340 120 T 500 80 L 500 180 L 20 180 Z" fill="#1e90ff" opacity="0.15"/>
        <circle cx="180" cy="60" r="6" fill="#ffffff" stroke="#1e90ff" stroke-width="2"/>
        <text x="180" y="45" fill="#1e90ff" font-size="11" font-weight="bold" text-anchor="middle">Bass Boost +6dB</text>
      </g>

      <!-- Pitch Envelope Control -->
      <g transform="translate(24, 480)">
        <text x="0" y="0" fill="#cbd5e1" font-size="13">Pitch Shift Tuning: +2 Semitones</text>
        <rect x="0" y="12" width="520" height="10" rx="5" fill="#1e293b"/>
        <rect x="0" y="12" width="310" height="10" rx="5" fill="#ff4757"/>
        <circle cx="310" cy="17" r="10" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>