<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <defs>
    <linearGradient id="shieldBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1280" height="80" fill="#0f172a"/>
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#1e293b" stroke-width="1"/>
  
  <g transform="translate(32, 22)">
    <rect width="36" height="36" rx="8" fill="url(#shieldBg)"/>
    <path d="M18 10 L27 15 V22 C27 27 18 30 18 30 C18 30 9 27 9 22 V15 Z" fill="#ffffff"/>
    <text x="48" y="24" font-size="20" font-weight="700" fill="#ffffff">Threat Protection Pro™</text>
    <text x="48" y="40" font-size="12" font-weight="500" fill="#10b981">Real-time AI-powered web security, malware scanner, &amp; ad blocker</text>
  </g>

  <!-- Stat Cards -->
  <g transform="translate(40, 110)">
    <rect width="370" height="150" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="28" y="44" font-size="13" font-weight="600" fill="#94a3b8">INTRUSIVE ADS BLOCKED</text>
    <text x="28" y="90" font-size="38" font-weight="800" fill="#ffffff">14,892</text>
    <text x="28" y="120" font-size="12" font-weight="600" fill="#10b981">▲ Save ~3.2 GB Mobile Data</text>

    <rect x="410" y="0" width="370" height="150" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="438" y="44" font-size="13" font-weight="600" fill="#94a3b8">WEB TRACKERS STOPPED</text>
    <text x="438" y="90" font-size="38" font-weight="800" fill="#38bdf8">3,421</text>
    <text x="438" y="120" font-size="12" font-weight="600" fill="#38bdf8">Cross-site tracking prevented</text>

    <rect x="820" y="0" width="380" height="150" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="848" y="44" font-size="13" font-weight="600" fill="#94a3b8">MALICIOUS FILES SCANNED</text>
    <text x="848" y="90" font-size="38" font-weight="800" fill="#f59e0b">847</text>
    <text x="848" y="120" font-size="12" font-weight="600" fill="#10b981">0 Threat Infections Detected</text>
  </g>

  <!-- Protection Controls &amp; Activity Feed -->
  <g transform="translate(40, 290)">
    <!-- Security Controls Box -->
    <rect width="570" height="390" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="32" y="44" font-size="18" font-weight="700" fill="#ffffff">Active Threat Protection Modules</text>

    <!-- Toggle 1: Web Security -->
    <g transform="translate(32, 70)">
      <rect width="506" height="64" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <circle cx="36" cy="32" r="16" fill="#10b981" fill-opacity="0.2"/>
      <path d="M30 32 L34 36 L42 26" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="28" font-size="14" font-weight="700" fill="#ffffff">Malicious Website Blocker</text>
      <text x="68" y="46" font-size="12" fill="#64748b">Prevents visits to known phishing &amp; scam domain URLs</text>
      <!-- Toggle Switch ON -->
      <rect x="440" y="20" width="44" height="24" rx="12" fill="#10b981"/>
      <circle cx="472" cy="32" r="9" fill="#ffffff"/>
    </g>

    <!-- Toggle 2: File Protection -->
    <g transform="translate(32, 148)">
      <rect width="506" height="64" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <circle cx="36" cy="32" r="16" fill="#10b981" fill-opacity="0.2"/>
      <path d="M30 32 L34 36 L42 26" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="28" font-size="14" font-weight="700" fill="#ffffff">Cloud Deep File Scanner</text>
      <text x="68" y="46" font-size="12" fill="#64748b">Scans downloaded files for malware before disk write</text>
      <rect x="440" y="20" width="44" height="24" rx="12" fill="#10b981"/>
      <circle cx="472" cy="32" r="9" fill="#ffffff"/>
    </g>

    <!-- Toggle 3: Ad Blocker -->
    <g transform="translate(32, 226)">
      <rect width="506" height="64" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <circle cx="36" cy="32" r="16" fill="#10b981" fill-opacity="0.2"/>
      <path d="M30 32 L34 36 L42 26" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="28" font-size="14" font-weight="700" fill="#ffffff">Ad &amp; Pop-up Blocker</text>
      <text x="68" y="46" font-size="12" fill="#64748b">Removes video ads, auto-play clips, and invasive banners</text>
      <rect x="440" y="20" width="44" height="24" rx="12" fill="#10b981"/>
      <circle cx="472" cy="32" r="9" fill="#ffffff"/>
    </g>

    <!-- Toggle 4: URL Trimming -->
    <g transform="translate(32, 304)">
      <rect width="506" height="64" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="36" cy="32" r="16" fill="#3b82f6" fill-opacity="0.2"/>
      <path d="M30 32 L34 36 L42 26" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="28" font-size="14" font-weight="700" fill="#ffffff">URL Tracking Parameter Trimmer</text>
      <text x="68" y="46" font-size="12" fill="#64748b">Strips tracking IDs (UTM, gclid) from copied web links</text>
      <rect x="440" y="20" width="44" height="24" rx="12" fill="#10b981"/>
      <circle cx="472" cy="32" r="9" fill="#ffffff"/>
    </g>
  </g>

  <!-- Live Log Container -->
  <g transform="translate(640, 290)">
    <rect width="600" height="390" rx="16" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
    <text x="32" y="44" font-size="18" font-weight="700" fill="#ffffff">Live Security Event Stream</text>

    <g transform="translate(32, 70)">
      <!-- Item 1 -->
      <rect width="536" height="54" rx="8" fill="#0f172a"/>
      <circle cx="28" cy="27" r="6" fill="#ef4444"/>
      <text x="48" y="24" font-size="13" font-weight="600" fill="#f87171">BLOCKED: Phishing attempt from malware-domain-xyz.net</text>
      <text x="48" y="40" font-size="11" fill="#64748b">Action: Connection Refused • 2 mins ago</text>

      <!-- Item 2 -->
      <g transform="translate(0, 64)">
        <rect width="536" height="54" rx="8" fill="#0f172a"/>
        <circle cx="28" cy="27" r="6" fill="#10b981"/>
        <text x="48" y="24" font-size="13" font-weight="600" fill="#ffffff">SCANNED: SetupInstaller.exe (Clean)</text>
        <text x="48" y="40" font-size="11" fill="#64748b">SHA-256 Hash Verified • 14 mins ago</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 128)">
        <rect width="536" height="54" rx="8" fill="#0f172a"/>
        <circle cx="28" cy="27" r="6" fill="#3b82f6"/>
        <text x="48" y="24" font-size="13" font-weight="600" fill="#ffffff">REMOVED: 42 Ad Trackers on news-portal.com</text>
        <text x="48" y="40" font-size="11" fill="#64748b">Google Analytics, DoubleClick &amp; Facebook Pixel • 22 mins ago</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 192)">
        <rect width="536" height="54" rx="8" fill="#0f172a"/>
        <circle cx="28" cy="27" r="6" fill="#3b82f6"/>
        <text x="48" y="24" font-size="13" font-weight="600" fill="#ffffff">TRIMMED: URL Tracking Tokens on shopping-site.com</text>
        <text x="48" y="40" font-size="11" fill="#64748b">Strips ?fbclid=... and ?utm_campaign=... • 1 hour ago</text>
      </g>
    </g>
  </g>
</svg>
