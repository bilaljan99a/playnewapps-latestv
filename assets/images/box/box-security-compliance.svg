<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C38"/>
      <stop offset="100%" stop-color="#052E5C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#secBg)"/>

  <text x="80" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="32" fill="#ffffff">Box Enterprise Security &amp; Compliance Shield</text>
  <text x="80" y="105" font-family="system-ui, sans-serif" font-size="18" fill="#93C5FD">Trusted by 67% of Fortune 500 companies for zero-trust data protection.</text>

  <!-- 3 Big Shields -->
  <g transform="translate(80, 150)">
    <!-- Shield 1 -->
    <rect width="320" height="280" rx="16" fill="#0A3A6B" stroke="#1D4ED8" stroke-width="2"/>
    <text x="32" y="50" font-size="28">🔐</text>
    <text x="76" y="48" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Box KeySafe</text>
    <text x="32" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#DBEAFE">
      Customer-managed encryption keys with AES-256 bit hardware security modules (HSM). Full control over key usage logs.
    </text>
    <rect x="32" y="210" width="256" height="36" rx="8" fill="#1E40AF"/>
    <text x="64" y="233" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">AES 256-Bit Key Control</text>

    <!-- Shield 2 -->
    <g transform="translate(350, 0)">
      <rect width="320" height="280" rx="16" fill="#0A3A6B" stroke="#1D4ED8" stroke-width="2"/>
      <text x="32" y="50" font-size="28">🛡️</text>
      <text x="76" y="48" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Box Shield</text>
      <text x="32" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#DBEAFE">
        Automated classification of sensitive data (PII, PCI, PHI), real-time malware detection, and anomaly alerts.
      </text>
      <rect x="32" y="210" width="256" height="36" rx="8" fill="#1E40AF"/>
      <text x="60" y="233" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">AI Threat Detection</text>
    </g>

    <!-- Shield 3 -->
    <g transform="translate(700, 0)">
      <rect width="320" height="280" rx="16" fill="#0A3A6B" stroke="#1D4ED8" stroke-width="2"/>
      <text x="32" y="50" font-size="28">🏛️</text>
      <text x="76" y="48" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Box Governance</text>
      <text x="32" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#DBEAFE">
        Strict retention schedules, defensible legal holds, and regulatory compliance (HIPAA, FINRA, FedRAMP, GDPR).
      </text>
      <rect x="32" y="210" width="256" height="36" rx="8" fill="#1E40AF"/>
      <text x="50" y="233" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff">HIPAA &amp; FINRA Certified</text>
    </g>
  </g>
</svg>