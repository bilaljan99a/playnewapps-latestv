<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001C40"/>
      <stop offset="50%" stop-color="#003B75"/>
      <stop offset="100%" stop-color="#0061D5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200"/>
    <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630"/>
  </g>

  <!-- Decorative Glow Circles -->
  <circle cx="1000" cy="150" r="280" fill="#0061D5" opacity="0.4" filter="blur(60px)"/>
  <circle cx="200" cy="500" r="220" fill="#00A3FF" opacity="0.25" filter="blur(50px)"/>

  <!-- Left Content Info -->
  <g transform="translate(80, 100)">
    <!-- Box Logo Badge -->
    <rect width="160" height="48" rx="24" fill="#ffffff" fill-opacity="0.15"/>
    <text x="24" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#ffffff">box</text>
    <text x="65" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#00A3FF">OFFICIAL</text>
    
    <text y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff">Box Content Cloud</text>
    <text y="148" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#00A3FF">Secure Storage, Box AI &amp; E-Signatures</text>

    <text y="200" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#E0EBFB" width="480">
      <tspan x="0" dy="0">Intelligent enterprise content management platform with</tspan>
      <tspan x="0" dy="28">bank-grade encryption, HIPAA compliance &amp; workflow automation.</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 280)">
      <rect width="140" height="38" rx="8" fill="#0061D5"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff">✓ Unlimited Storage</text>
      
      <rect x="152" width="130" height="38" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <text x="168" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff">✓ Box AI Included</text>

      <rect x="294" width="130" height="38" rx="8" fill="#ffffff" fill-opacity="0.12"/>
      <text x="310" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ffffff">✓ Box Sign Free</text>
    </g>

    <!-- Rating Score -->
    <g transform="translate(0, 360)">
      <text font-family="system-ui, sans-serif" font-weight="900" font-size="36" fill="#FFC107">4.8 / 5.0</text>
      <text x="160" y="-8" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#B8D4FF">★★★★★ (3,450+ Verified Expert Reviews)</text>
    </g>
  </g>

  <!-- Right Visual Mockup Card -->
  <g transform="translate(620, 90)" filter="url(#shadow)">
    <rect width="500" height="440" rx="20" fill="#ffffff"/>
    <!-- UI Header Bar -->
    <path d="M0 20 Q0 0 20 0 H480 Q500 0 500 20 V60 H0 Z" fill="#F4F7FB"/>
    <circle cx="28" cy="30" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="30" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="30" r="6" fill="#27C93F"/>
    <text x="100" y="35" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#001C40">Box All Files — Enterprise Vault</text>
    
    <!-- UI Content Mockup -->
    <g transform="translate(24, 80)">
      <!-- Search bar -->
      <rect width="452" height="40" rx="8" fill="#F0F4F9" stroke="#D1DCEE"/>
      <text x="16" y="25" font-family="system-ui, sans-serif" font-size="13" fill="#6B7C96">🔍 Search files, contracts, Box AI summaries...</text>

      <!-- Row 1 -->
      <g transform="translate(0, 60)">
        <rect width="452" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <rect x="16" y="12" width="30" height="30" rx="6" fill="#0061D5"/>
        <text x="26" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">📄</text>
        <text x="58" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1E293B">Q3_2026_Financial_Audit.pdf</text>
        <text x="58" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">14.2 MB • Updated 10m ago by Legal Team</text>
        <rect x="350" y="14" width="86" height="26" rx="13" fill="#E0F2FE"/>
        <text x="362" y="31" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#0369A1">🔒 KeySafe</text>
      </g>

      <!-- Row 2 (Box AI Summary) -->
      <g transform="translate(0, 126)">
        <rect width="452" height="74" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text x="16" y="24" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#1D4ED8">✨ Box AI Executive Summary</text>
        <text x="16" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#334155">"Annual revenue grew 28% YoY. All compliance requirements met for HIPAA &amp; SOC2 Type II."</text>
        <text x="16" y="62" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#2563EB">Ask Box AI another question →</text>
      </g>

      <!-- Row 3 (Box Sign) -->
      <g transform="translate(0, 212)">
        <rect width="452" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
        <rect x="16" y="12" width="30" height="30" rx="6" fill="#10B981"/>
        <text x="26" y="32" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">✍️</text>
        <text x="58" y="26" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#1E293B">Enterprise_MSA_Contract_Signed.pdf</text>
        <text x="58" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Box Sign Verified • 3/3 Signatures Collected</text>
        <rect x="350" y="14" width="86" height="26" rx="13" fill="#D1FAE5"/>
        <text x="364" y="31" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#047857">Completed</text>
      </g>
    </g>
  </g>
</svg>