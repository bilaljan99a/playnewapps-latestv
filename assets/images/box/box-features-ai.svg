<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#aiBg)"/>
  
  <text x="80" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="32" fill="#ffffff">Box AI &amp; Collaboration Features</text>
  <text x="80" y="105" font-family="system-ui, sans-serif" font-size="18" fill="#94A3B8">Transform unstructured content into actionable intelligence instantly.</text>

  <!-- 4 Feature Cards -->
  <g transform="translate(80, 140)">
    <!-- Card 1: Box AI -->
    <g transform="translate(0, 0)">
      <rect width="240" height="280" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
      <rect width="240" height="6" rx="3" fill="url(#glow)"/>
      <circle cx="48" cy="50" r="24" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="38" y="58" font-size="22">✨</text>
      <text x="24" y="110" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Box AI</text>
      <text x="24" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">
        <tspan x="24" dy="0">Instant summaries of 100+</tspan>
        <tspan x="24" dy="20">page contracts, natural</tspan>
        <tspan x="24" dy="20">language Q&amp;A, automated</tspan>
        <tspan x="24" dy="20">metadata tagging.</tspan>
      </text>
      <rect x="24" y="220" width="192" height="32" rx="8" fill="#3B82F6" fill-opacity="0.15"/>
      <text x="50" y="241" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#60A5FA">Generative AI Engine</text>
    </g>

    <!-- Card 2: Box Sign -->
    <g transform="translate(260, 0)">
      <rect width="240" height="280" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
      <circle cx="48" cy="50" r="24" fill="#10B981" fill-opacity="0.2"/>
      <text x="38" y="58" font-size="22">✍️</text>
      <text x="24" y="110" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Box Sign</text>
      <text x="24" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">
        <tspan x="24" dy="0">Unlimited native electronic</tspan>
        <tspan x="24" dy="20">signatures built into Box.</tspan>
        <tspan x="24" dy="20">Eliminates extra DocuSign</tspan>
        <tspan x="24" dy="20">subscription costs.</tspan>
      </text>
      <rect x="24" y="220" width="192" height="32" rx="8" fill="#10B981" fill-opacity="0.15"/>
      <text x="52" y="241" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#34D399">Built-In E-Signatures</text>
    </g>

    <!-- Card 3: Box Canvas -->
    <g transform="translate(520, 0)">
      <rect width="240" height="280" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
      <circle cx="48" cy="50" r="24" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="38" y="58" font-size="22">🎨</text>
      <text x="24" y="110" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Box Canvas</text>
      <text x="24" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">
        <tspan x="24" dy="0">Real-time infinite virtual</tspan>
        <tspan x="24" dy="20">whiteboarding for teams.</tspan>
        <tspan x="24" dy="20">Brainstorm, diagram, and</tspan>
        <tspan x="24" dy="20">convert ideas into files.</tspan>
      </text>
      <rect x="24" y="220" width="192" height="32" rx="8" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="54" y="241" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FBBF24">Infinite Whiteboard</text>
    </g>

    <!-- Card 4: Box Relay -->
    <g transform="translate(780, 0)">
      <rect width="240" height="280" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
      <circle cx="48" cy="50" r="24" fill="#EC4899" fill-opacity="0.2"/>
      <text x="38" y="58" font-size="22">⚡</text>
      <text x="24" y="110" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">Box Relay</text>
      <text x="24" y="140" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">
        <tspan x="24" dy="0">No-code automated content</tspan>
        <tspan x="24" dy="20">workflows. Auto-route</tspan>
        <tspan x="24" dy="20">approvals, task routing,</tspan>
        <tspan x="24" dy="20">and metadata updates.</tspan>
      </text>
      <rect x="24" y="220" width="192" height="32" rx="8" fill="#EC4899" fill-opacity="0.15"/>
      <text x="50" y="241" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#F472B6">Workflow Automation</text>
    </g>
  </g>
</svg>