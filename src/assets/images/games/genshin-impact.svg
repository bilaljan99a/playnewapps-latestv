<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Night Sky Gradient -->
    <linearGradient id="gi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    
    <!-- Primogem / Star Gold Gradient -->
    <linearGradient id="gi-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Primogem Inner Cyan/White Glow -->
    <linearGradient id="gi-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Text Gold Gradient -->
    <linearGradient id="gi-text-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="gi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#gi-bg)" />

  <!-- Subtle Constellation Stars -->
  <g opacity="0.4">
    <circle cx="90" cy="110" r="2.5" fill="#fff" />
    <circle cx="420" cy="95" r="3" fill="#fef08a" />
    <circle cx="430" cy="380" r="2" fill="#fff" />
    <circle cx="85" cy="400" r="2.5" fill="#38bdf8" />
    <circle cx="160" cy="70" r="1.5" fill="#fff" />
    <circle cx="340" cy="65" r="2" fill="#fff" />
  </g>

  <!-- Outer Astral Ring / Emblem Halo -->
  <circle cx="256" cy="205" r="115" fill="none" stroke="url(#gi-gold)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.35" />
  <circle cx="256" cy="205" r="95" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />

  <!-- Iconic 4-Pointed Primogem / Crown Star Emblem -->
  <g transform="translate(256, 195)" filter="url(#gi-glow)">
    <!-- Outer 8-Point Star Rays (4 Major Cardinal + 4 Minor Diagonal) -->
    <!-- Top Ray -->
    <polygon points="0,-115 16,-34 0,-48 -16,-34" fill="url(#gi-gold)" />
    <!-- Bottom Ray -->
    <polygon points="0,115 16,34 0,48 -16,34" fill="url(#gi-gold)" />
    <!-- Left Ray -->
    <polygon points="-115,0 -34,16 -48,0 -34,-16" fill="url(#gi-gold)" />
    <!-- Right Ray -->
    <polygon points="115,0 34,16 48,0 34,-16" fill="url(#gi-gold)" />

    <!-- Diagonal Minor Rays -->
    <polygon points="-65,-65 -22,-22 -30,-10 -10,-30" fill="url(#gi-gold)" opacity="0.85" />
    <polygon points="65,-65 22,-22 30,-10 10,-30" fill="url(#gi-gold)" opacity="0.85" />
    <polygon points="-65,65 -22,22 -30,10 -10,30" fill="url(#gi-gold)" opacity="0.85" />
    <polygon points="65,65 22,22 30,10 10,30" fill="url(#gi-gold)" opacity="0.85" />

    <!-- Primogem Core Diamond Frame -->
    <polygon points="0,-48 48,0 0,48 -48,0" fill="#1e293b" stroke="url(#gi-gold)" stroke-width="4" />
    
    <!-- Inner Cyan/White Crystal Facets -->
    <polygon points="0,-36 36,0 0,36 -36,0" fill="url(#gi-cyan)" opacity="0.9" />
    <polygon points="0,-22 22,0 0,22 -22,0" fill="#ffffff" />
  </g>

  <!-- Official Style Typography Banner -->
  <g transform="translate(256, 375)">
    <!-- Subtle Dark Backdrop Pill for Contrast -->
    <rect x="-210" y="-42" width="420" height="92" rx="20" fill="#030712" opacity="0.65" />
    <rect x="-210" y="-42" width="420" height="92" rx="20" fill="none" stroke="url(#gi-gold)" stroke-width="1.5" opacity="0.4" />

    <!-- GENSHIN text -->
    <text x="0" y="3" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="44" font-weight="900" fill="url(#gi-text-gold)" text-anchor="middle" letter-spacing="4" filter="url(#gi-glow)">
      GENSHIN
    </text>
    <!-- IMPACT text -->
    <text x="0" y="36" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="22" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="11" opacity="0.95">
      IMPACT
    </text>

    <!-- Star Accent above the 'I' in GENSHIN -->
    <polygon points="78,-32 82,-24 90,-24 84,-19 86,-11 78,-16 70,-11 72,-19 66,-24 74,-24" fill="#67e8f9" />
  </g>
</svg>
